ed. Cats have hearts, but dogs have alarm systems.”\n\n“That’s exactly how I feel!” Hana said warmly — and then froze. Her own team stared at her. “I mean… that was… strong evidence. Cat team disagrees. Officially.”\n\nSofia covered her face and laughed until her shoulders shook.\n\nThe debate went back and forth. Cats are quieter. Dogs can learn tricks. Cats knock cups off tables. Dogs eat homework — David said his daughter proved this was real.\n\nFinally, the teacher raised her hand. “Time! Now, the vote. You cannot vote for your own team. Vote for the best argument you heard tonight.”\n\nEveryone wrote on small papers. The teacher counted them slowly, enjoying the drama.\n\n“The winner, by one vote… the dog team!”\n\nThe dog team cheered. Omar bowed like an actor. And Hana clapped louder than anyone, which was maybe strange for the cat team’s best speaker.\n\n“One vote,” Sofia said, looking around. “Interesting. Who on the cat side voted for dogs?”\n\nHana suddenly became very busy with her notebook. Sofia leaned closer. Hana turned red.\n\n“Daisy watches me sleep,” Hana confessed quietly. “She waits for me at the door. I couldn’t betray her. I’m sorry, Sofia.”\n\n“I voted for dogs too,” Sofia whispered. “I told you — I’m allergic to cats.”\n\nThe two of them laughed so hard that the teacher looked over with pretend anger.\n\nAt the end of class, the teacher gathered everyone. “Tonight I heard something better than winning,” she said. “I heard people disagree and stay friends. That’s the hardest conversation skill in any language.”\n\n“So nobody lost?” Omar asked.\n\n“The cats lost,” David said.\n\n“Let’s agree to disagree.” Omar used the board phrase grandly, and the whole class applauded him.\n\nThen the teacher gave the homework. “This week, start one conversation with a stranger. A real one, outside this room. Ask a question. Give a compliment. Help someone. Then tell us what happened.”\n\nWalking to the bus stop, Hana thought about the homework. Talking in class was one thing. Strangers were still a little scary — although less scary than before.\n\nHer phone buzzed. It was Emma: “How was the great animal war?”\n\n“Dogs won,” Hana typed. “Democracy is beautiful. Also, I betrayed my own team.”\n\n“You’re a complicated woman,” Emma wrote back. “What do you think about a downtown trip on Saturday? I need paint, and you need fun.”\n\nHana smiled and typed, “I agree with you.”\n\nSomewhere downtown, on Saturday, a stranger was waiting to talk to her — although Hana didn’t know it yet.","glossary":[{"w":"debate","ja":"討論"},{"w":"opinion","ja":"意見"},{"w":"take turns","ja":"順番に話す"},{"w":"disagree","ja":"反対する"},{"w":"politely","ja":"礼儀正しく"},{"w":"drew","ja":"くじを引いた"},{"w":"allergic","ja":"アレルギーの"},{"w":"loyal","ja":"忠実な"},{"w":"independent","ja":"自立した"},{"w":"argument","ja":"主張"},{"w":"evidence","ja":"証拠"},{"w":"vote","ja":"投票（する）"},{"w":"confessed","ja":"白状した"},{"w":"betray","ja":"裏切る"},{"w":"applauded","ja":"拍手した"}],"phrases":[{"en":"I see your point.","ja":"言いたいことは分かるよ。"},{"en":"I agree with you.","ja":"同感だよ。"},{"en":"That’s exactly how I feel!","ja":"まさにそれ、私も同じ気持ち！"},{"en":"Let’s agree to disagree.","ja":"意見の違いは違いのままにしよう。"},{"en":"What do you think about a downtown trip on Saturday?","ja":"土曜、ダウンタウンに行くのはどう？"}],"quiz":[{"q":"What was the debate question?","c":["Coffee or tea?","Summer or winter?","Books or movies?","Cats or dogs?"],"a":3},{"q":"Which team was Hana on?","c":["The dog team","The judges","The cat team","She watched only"],"a":2},{"q":"Why did Hana turn red after the vote?","c":["The classroom was too hot","She had voted for the dog team","She forgot her homework","She lost her notebook"],"a":1}],"words":953},{"id":69,"level":3,"emoji":"🚉","theme":"今度は私が道案内","titleEn":"This Time, I Give the Directions","titleJa":"今度は、私が道案内","teaser":"ダウンタウンで地図を回す観光客を発見。4月に道に迷ったハナが、今度は教える側に――。","story":"On Saturday, downtown Portland sparkled with cold autumn sunshine.\n\nHana and Emma rode the streetcar into the city. Emma needed paint for the portrait, and Hana needed, in Emma’s words, “fresh air and adventure.”\n\n“The art store will take me twenty minutes,” Emma said, jumping off at their stop. “Wait for me by the station corner. Don’t buy any books without me.”\n\n“No promises,” Hana said.\n\nShe stood at the corner near the old station and watched the city move. Shoppers with paper cups. A man playing guitar. Pigeons holding a meeting by a bench.\n\nThen she noticed them.\n\nAn older couple stood near the station wall, wrestling with a paper map. The man turned the map one way. The woman turned it the other way. They both looked up at the street signs, then down at the map again.\n\nHana knew that dance. She had danced it herself.\n\nIn April, in her first week, she had stood on a corner like this one — holding her phone upside down, too afraid to ask anyone for help. A kind stranger with a warm smile had stopped and shown her the way. Turn left at the corner. Hana had never forgotten those words. They were some of the first English words that ever rescued her.\n\nAnd then she remembered Monday’s homework: start one conversation with a stranger.\n\nHer heart tapped a little faster — old habit — but her feet were already walking.\n\n“Excuse me,” she said. “Are you looking for something?”\n\nThe couple turned. Relief washed over their faces like sunrise.\n\n“Oh, thank goodness,” the woman said. “We’re completely lost. I’m Betty, this is Frank. We’re from Ohio. It’s our first time in Portland.”\n\n“We’re looking for the famous bookstore,” Frank said. “The giant one. Powell’s. Our map says it’s here, but the streets disagree.”\n\nHana smiled. “You’re very close. Go straight down this street for two blocks. Turn left at the corner. It’s a ten-minute walk. The building is huge — you can’t miss it.”\n\n“Straight two blocks, then left,” Betty repeated. “See, Frank? I told you we were close.”\n\n“You told me we were lost,” Frank said. “Loudly.”\n\nHana laughed. Betty studied her with friendly eyes.\n\n“Your English is so clear, dear. Are you a local?”\n\nHana stood a little taller. “I’m from Japan. But I’ve lived here since April. So… I’m a little bit local now.”\n\n“Well, you’re OUR local,” Frank said. “One more question. After the books, where can we get good coffee? A real place, please. Not a chain.”\n\nHana’s eyes lit up. “Then I recommend the Bluebird Cafe. It’s small and warm, and the owner laughs like a summer festival. I work there, so I’m not fair — but the cinnamon rolls are the best in the neighborhood.”\n\n“A baker AND a guide,” Betty said, writing it down. “Bluebird Cafe. We’ll try it tomorrow morning.”\n\n“Take the streetcar from this stop,” Hana said, pointing. “Six stops. The cafe is just around the corner from the station.”\n\nFrank folded the map in victory. “Young lady, you saved our whole morning.”\n\n“Enjoy your stay!” Hana said, and she meant every word of it.\n\nThe couple walked off toward Powell’s, arm in arm. At the corner they turned left — the correct corner — and Betty waved back at her like an old friend.\n\nEmma appeared a minute later, carrying a bag of paint tubes, just in time to see the wave.\n\n“Who are your new fans?” she asked.\n\n“Frank and Betty from Ohio,” Hana said. “They were lost. I wasn’t.”\n\nOver lunch, Hana told Emma the whole story — April, the corner, the kind stranger, and today.\n\nEmma put down her sandwich. “Do you understand what happened? In April, someone rescued you. Today, you were the one in the warm coat. You’ve come full circle.”\n\n“Full circle,” Hana repeated slowly. “In April, I couldn’t even say ‘excuse me’ without shaking. Today I gave directions, a restaurant review, and a streetcar schedule.”\n\n“Next month you’ll be driving the streetcar,” Emma said.\n\nThe next morning, Hana was working the Sunday shift when the cafe door opened. She looked up — and nearly dropped a cup.\n\nFrank and Betty stood in the doorway, holding a Powell’s bag so full it looked pregnant with books.\n\n“There she is!” Frank announced to the whole cafe. “The young lady who saved us!”\n\n“You came!” Hana said.\n\n“Six stops, just like you said,” Betty smiled. “And we need two coffees and two of those famous cinnamon rolls, please.”\n\nRosa leaned over the counter, delighted. “Friends of yours, Hana?”\n\n“We met on a corner,” Betty said. “She’s the best thing in Portland, and we’ve seen the whole bookstore.”\n\nWhile they ate, Frank showed Hana their books — a bird guide for him, a mystery for Betty, and a small notebook. “For our next trip,” he said. “Betty writes down every good place. You’re on page one.”\n\nWhen they left, Betty hugged Hana like a grandmother. “Thank you, dear. When you visit Ohio, someone will help you on a corner. That’s how it works. Kindness rides in circles.”\n\nRosa watched them go, then looked at Hana for a long moment.\n\n“Seven months ago, you couldn’t order a latte,” Rosa said. “Now tourists follow you across the city. You’re a real local now, Hana.”\n\n“A little bit local,” Hana said, but her smile filled her whole face.\n\nThat evening, she wrote her class homework report in her notebook. It was only one line, and it was completely true: “I talked to two strangers, and it made three people happy.”\n\nShe didn’t know it yet, but the next day would be one of those rare, shining days when absolutely everything goes right.","glossary":[{"w":"streetcar","ja":"路面電車"},{"w":"wrestling with","ja":"格闘する"},{"w":"upside down","ja":"逆さまに"},{"w":"rescued","ja":"救った"},{"w":"Relief","ja":"安心"},{"w":"Go straight","ja":"まっすぐ進む"},{"w":"blocks","ja":"ブロック・区画"},{"w":"you can’t miss it","ja":"すぐ分かるよ"},{"w":"chain","ja":"チェーン店"},{"w":"recommend","ja":"すすめる"},{"w":"local","ja":"地元の人"},{"w":"come full circle","ja":"一周して戻る"},{"w":"delighted","ja":"大喜びで"},{"w":"Kindness","ja":"親切"}],"phrases":[{"en":"Are you looking for something?","ja":"何かお探しですか？"},{"en":"Turn left at the corner.","ja":"その角を左に曲がって。"},{"en":"It’s a ten-minute walk.","ja":"歩いて10分です。"},{"en":"Enjoy your stay!","ja":"滞在を楽しんでね！"},{"en":"I recommend the Bluebird Cafe.","ja":"ブルーバードカフェがおすすめだよ。"}],"quiz":[{"q":"What were Frank and Betty looking for?","c":["The train station","A famous bookstore","The art museum","A streetcar stop"],"a":1},{"q":"What happened the next morning at the cafe?","c":["Hana got lost again","Emma sold her portrait","Rosa gave Hana a day off","Frank and Betty came to visit"],"a":3},{"q":"Why was this weekend so special for Hana?","c":["She bought many books","She got a new job downtown","In April she was lost; now she was the helper","She rode the streetcar for free"],"a":2}],"words":955},{"id":70,"level":3,"emoji":"🌈","theme":"「通じてる」と思えた日","titleEn":"The Day Everything Worked","titleJa":"ぜんぶ通じた日","teaser":"朝のダジャレから電話注文まで、なぜか今日は全部うまくいく。ハナが夜、日記に書いたこととは。","story":"Monday began before the alarm clock — Hana simply woke up, ready.\n\nShe stretched, looked at the gray autumn light, and felt strangely light herself. She didn’t know yet that this would be one of the best days of her whole year.\n\nAt breakfast, Mike lowered his newspaper. “Question. Why don’t eggs tell jokes?”\n\n“Dad, no,” Ben said.\n\n“Because they’d crack up,” Mike said, delighted with himself.\n\nAnd Hana laughed — instantly, at full speed, no translation needed. Then, before her brain could stop her mouth, she said, “Mike. What does bread do on vacation?”\n\nMike put down his fork. “Tell me.”\n\n“It loafs around.”\n\nSilence. Mike stood up, put his hand on his heart, and pretended to wipe away a tear. “A baking pun. At MY table. I have never been so proud.”\n\n“Oh no,” Carol said. “Now there are two of them.”\n\nAt the cafe, the magic continued. The phone rang while Rosa’s hands were deep in bread dough.\n\n“Hana! Can you get it?”\n\nThe phone. For months, the phone had been her enemy — no faces, no hands, no smiles to help her. She picked it up anyway.\n\n“Good morning, Bluebird Cafe. How can I help you?”\n\nA fast voice asked about a big takeout order. Hana grabbed a pen. “Twelve cinnamon rolls and three lattes, pickup at ten thirty, under the name Jenkins. Let me repeat that back… Perfect. See you soon!”\n\nShe hung up and stared at the phone. That was easy. When did that become easy?\n\nLeo saluted her from the espresso machine. “Phone level: complete. Next level: singing telephone opera.”\n\nMidmorning, a regular came in with a suitcase — Mr. Alvarez, back from three weeks in Mexico visiting his mother.\n\n“Mr. Alvarez! Welcome back! How have you been?” Hana called.\n\n“Better now,” he said, patting his heart. “Three weeks without your matcha latte. My mother makes good coffee, but she doesn’t smile like this cafe.”\n\nHana had his drink started before he reached the counter. The usual, remembered. He raised his cup to her like a toast.\n\nLater, a new customer studied the menu with a worried face. “What exactly is a matcha latte? Is it… grass?”\n\n“Close! It’s a Japanese green tea, ground into a fine powder,” Hana explained, smooth as butter. “It’s a little sweet, a little earthy, and very calming. Would you like to try a small sample first?”\n\nThe woman tried it, blinked, and ordered a large one. Then she ordered a second one, to go, for her sister.\n\n“You explained that better than a TV commercial,” Rosa murmured.\n\nIn the afternoon, Dr. Park stopped in for a coffee between patients. She studied Hana while Hana made her americano.\n\n“You know,” Dr. Park said, “in June you came to my clinic with a cough and a dictionary. You checked every word twice.”\n\n“I remember,” Hana said. “I was more scared of the grammar than the fever.”\n\n“Well, listen to yourself now.” Dr. Park took her cup and smiled. “Your English has really improved. As your doctor, I am officially impressed.”\n\n“Thank you,” Hana said, and her cheeks went warm. “I’ve had a lot of practice. And happily, no more colds.”\n\n“Rest, fluids, and conversation,” Dr. Park said. “The full treatment.”\n\nAs she left, a student with headphones waved goodbye, and Hana called, “Have a good one!” — naturally, easily, without thinking.\n\nLeo froze mid-coffee. He grabbed his chest like a man in a movie. “She said it! Without thinking! Emma, did you hear? My little student has graduated.”\n\n“You taught her that phrase one year too early,” Emma said. “She was ready today.”\n\nAt closing time, Hana swept the floor while Rosa counted the register. Outside, the streetlights were coming on, soft and orange.\n\nRosa set a cup of hot chocolate on the counter, with extra cream.\n\n“For me?” Hana asked.\n\n“It’s on the house.” Rosa pushed it closer. “Today you answered the phone, handled a big order, sold matcha to a stranger, and made an old doctor smile. You ran this cafe like a captain. Captains get hot chocolate.”\n\nHana held the warm cup with both hands. “Rosa, can I tell you something strange? Today, English didn’t feel like a test. It felt like… air. I just breathed it.”\n\nRosa nodded slowly, like she had been waiting for this. “That’s the day every traveler dreams about. Write it down. You’ll want to remember it.”\n\nSo that night, Hana did.\n\nAfter dinner, she sat at her desk and opened a new notebook — a blank page, white as first snow. On other nights, she wrote in Japanese with English pieces mixed in. Tonight, the English came first, and it kept coming.\n\nShe wrote about the pun at breakfast. The phone order. Mr. Alvarez and his suitcase. The matcha customer. Dr. Park’s words. The hot chocolate with extra cream.\n\nShe wrote one full page without opening the dictionary once. Then she read it out loud, quietly, and it sounded like her — the real her, just in different music.\n\nAt the bottom of the page she wrote: “In April, I translated everything in my head first. In October, I just talk. It finally feels natural.”\n\nCarol knocked softly and brought her a cup of tea. She saw the journal, the English lines, the shining eyes.\n\n“Good day?” Carol asked.\n\n“The best kind,” Hana said. “The quiet kind, where everything works. It finally feels natural.”\n\nCarol squeezed her shoulder. “You’ve earned a hundred of those. They’re coming.”\n\nWhen Carol left, Hana looked at Daisy, asleep on the rug, and let the happiness sit in her chest like sunlight in a jar.\n\nThen her phone rang. A video call. Yui’s face filled the screen, bouncing with excitement, hands waving.\n\n“Hana! Don’t say anything! I have BIG news!”\n\nBut Yui’s big news is a story for tomorrow.","glossary":[{"w":"stretched","ja":"伸びをした"},{"w":"crack up","ja":"大笑いする"},{"w":"pun","ja":"だじゃれ"},{"w":"takeout","ja":"持ち帰り"},{"w":"pickup","ja":"受け取り"},{"w":"saluted","ja":"敬礼した"},{"w":"suitcase","ja":"スーツケース"},{"w":"ground into","ja":"挽いて〜にする"},{"w":"powder","ja":"粉末"},{"w":"sample","ja":"試飲"},{"w":"impressed","ja":"感心して"},{"w":"without thinking","ja":"無意識に"},{"w":"closing time","ja":"閉店時間"},{"w":"blank","ja":"白紙の"},{"w":"dictionary","ja":"辞書"}],"phrases":[{"en":"How can I help you?","ja":"ご用件をどうぞ。"},{"en":"How have you been?","ja":"元気にしてた？"},{"en":"Your English has really improved.","ja":"英語、本当に上達したね。"},{"en":"Have a good one!","ja":"よい一日を！"},{"en":"It’s on the house.","ja":"お店のおごりだよ。"}],"quiz":[{"q":"Who said, “Your English has really improved”?","c":["Dr. Park","Rosa","Mike","Leo"],"a":0},{"q":"What did Rosa give Hana at closing time?","c":["A new apron","A day off","A free hot chocolate","A blue notebook"],"a":2},{"q":"Why was this day so special for Hana?","c":["It was her birthday","She got a pay raise","The cafe was quiet all day","English felt natural all day long"],"a":3}],"words":974},{"id":71,"level":3,"emoji":"📞","theme":"妹の訪問計画（ビデオ通話）","titleEn":"Big News from Japan","titleJa":"日本からのビッグニュース","teaser":"日曜の夜、妹ユイから突然のビデオ通話。「来週ポートランドに行く！」ハナの街に、初めて家族がやって来る。","story":"It was a rainy Sunday evening in early November, and Hana was warm in her room.\n\nShe was writing in her journal when her phone rang. It was a video call from her little sister, Yui.\n\n“Yui! Good evening from Portland,” Hana said in English.\n\nThe sisters had a new rule: English first, Japanese later. It was good practice for both of them.\n\n“Good evening! It’s Monday morning here,” Yui said. “Hana, I have big news. Are you ready?”\n\n“I’m ready. Tell me.”\n\n“I have two weeks of vacation from university this month. So yesterday… I bought a plane ticket. I’m coming to Portland!”\n\nHana almost dropped her phone. “What? Really? When?”\n\n“Next Friday!” Yui laughed. “Surprise!”\n\n“Next Friday? That’s so soon!” Hana jumped up from her chair. “This is the best news. I can’t wait!”\n\n“Me too. But I’m a little nervous,” Yui said. “Your English has become so good. Mine is still weak.”\n\n“Don’t worry. You’ve studied English since junior high school. You know more than you think.”\n\n“Maybe. But talking is different from tests,” Yui said.\n\nHana smiled. “That’s true. I learned that on my first day here. But I’ll be with you the whole time.”\n\n“Promise?”\n\n“Promise. I’ll pick you up at the airport. Send me your flight number, okay?”\n\n“Okay. Wait a minute.” Yui looked at her computer. “Flight 28. It lands at three in the afternoon on Friday.”\n\n“Let me look at my work schedule.” Hana opened her phone. “Perfect. I finish work at noon on Friday. If the bus is slow, I’ll take the train.”\n\n“Thank you. What should I bring? Is Portland colder than Matsuyama?”\n\n“Yes, it’s much colder now. Bring a warm coat and a scarf. And bring an umbrella, because it rains almost every day.”\n\n“Rain, rain, rain,” Yui said. “I’ve heard about Portland rain from you many times.”\n\nHana laughed. “It’s true. But I like it now. The rain makes everything green.”\n\nJust then, there was a knock on the door. It was Carol.\n\n“Sorry! Am I too loud?” Hana asked.\n\n“Not at all. I heard happy sounds, so I wanted to see,” Carol said.\n\n“Carol, my sister Yui is coming to Portland! Next Friday, for ten days!”\n\n“Oh, how wonderful!” Carol clapped her hands. “Yui, hello! Can she hear me?”\n\nHana turned the phone. Yui waved on the screen. “Hello, Mrs. Miller! Nice to meet you!”\n\n“Call me Carol, sweetheart. We’re so excited to meet you. You can stay here with us, of course.”\n\n“Really? Is that okay?” Yui asked.\n\n“Of course! We have an air mattress. We’ll put it in Hana’s room. It will be like a ten-day sleepover.”\n\nYui’s eyes became big. “Thank you so much! I can’t believe this.”\n\nAfter the call, Hana went downstairs. Mike and Ben were watching a basketball game with Daisy.\n\n“Family meeting!” Carol said. “Hana has news.”\n\n“My sister is coming on Friday,” Hana said. “Her name is Yui. She’s twenty, and she’s a university student.”\n\n“Excellent!” Mike said. “I’ll finally have a new person for my jokes. Your sister hasn’t heard any of them.”\n\nBen looked up from his phone. “Dad, please. Don’t scare her on day one.”\n\nEveryone laughed. Daisy’s tail went thump, thump on the floor.\n\n“What does Yui like?” Carol asked. “I want to cook something special.”\n\n“She loves pancakes. She has seen my photos of your breakfast many times. She always says, ‘I’m so jealous.’”\n\n“Then pancakes on Saturday morning,” Carol said. “That’s decided.”\n\nThat night, Hana couldn’t sleep. She took out her journal and made a list.\n\nPlaces for Yui: the cafe, the park, the river, the library, the Saturday market. Food for Yui: pancakes, food trucks, hot chocolate.\n\nShe looked at the list and smiled. Seven months ago, this city was strange and new. Now it was her town, and she had so much to share.\n\nThe next morning at the cafe, Hana told everyone.\n\n“My sister is visiting from Japan on Friday!”\n\n“No way!” Emma said. “The famous Yui? I’ve seen her photos. You two look so similar.”\n\n“People say that. But she’s taller than me. It’s not fair,” Hana said.\n\nLeo laughed. “Little sisters grow. It happens. Bring her here, okay? I’ll make her my special caramel latte.”\n\n“And I’ll make a welcome cake,” Rosa said. “Family of my family is my family.”\n\nHana felt warm. “Thank you, everyone. She’s a little nervous about English. Please speak slowly for her.”\n\n“Of course,” Emma said. “Hey, remember your first week? You were nervous too. Now look at you.”\n\n“I remember everything,” Hana said. “The airport, the questions, my shaking hands. It feels like a long time ago.”\n\nDuring her break, Hana sent Yui a message.\n\n“Bring comfortable shoes. We’ll walk a lot. And don’t worry about English. Everyone here is kind.”\n\nYui answered fast. “I’m practicing every day! Today I said, ‘Could I get a small latte?’ to my mirror.”\n\nHana laughed out loud. She remembered her own practice, in her own mirror, in April.\n\nThat evening, Hana and Carol made a plan for the week. Carol wrote it on the kitchen calendar.\n\n“Friday: airport. Saturday: pancakes and the market. Sunday: rest and a movie night,” Carol read.\n\n“If the weather is good, we’ll walk by the river on Monday,” Hana added.\n\nMike looked at the calendar. “Busy week! One more thing. Which day is the joke show?”\n\n“Every day, Dad,” Ben said. “It’s every day. Nobody can stop it.”\n\nOn Thursday night, Hana cleaned her room and made the air mattress bed. She put a small towel on it, like a hotel.\n\nThen she wrote in her journal: “Tomorrow my sister will see my life here. I have lived this life for seven months. Now I can finally share it.”\n\nShe turned off the light and closed her eyes, but her heart was too excited for sleep.\n\nTomorrow at three in the afternoon, Flight 28 lands — and a new adventure begins.","glossary":[{"w":"journal","ja":"日記"},{"w":"vacation","ja":"休暇"},{"w":"plane ticket","ja":"航空券"},{"w":"nervous","ja":"緊張して"},{"w":"promise","ja":"約束（する）"},{"w":"flight number","ja":"便名"},{"w":"land","ja":"着陸する"},{"w":"schedule","ja":"予定"},{"w":"scarf","ja":"マフラー"},{"w":"air mattress","ja":"エアマット"},{"w":"sleepover","ja":"お泊まり会"},{"w":"jealous","ja":"うらやましい"},{"w":"similar","ja":"似ている"},{"w":"comfortable","ja":"楽な"},{"w":"adventure","ja":"冒険"}],"phrases":[{"en":"I can’t wait!","ja":"待ちきれない！"},{"en":"I’ll pick you up at the airport.","ja":"空港まで迎えに行くね。"},{"en":"What should I bring?","ja":"何を持って行けばいい？"},{"en":"Could I get a small latte?","ja":"スモールのラテをください。"},{"en":"Nice to meet you!","ja":"はじめまして！"}],"quiz":[{"q":"Who is coming to Portland?","c":["Hana’s mother","Hana’s sister Yui","Hana’s friend from Tokyo","Rosa’s sister"],"a":1},{"q":"When does Yui’s plane land?","c":["Friday morning","Saturday at noon","Sunday evening","Friday at three in the afternoon"],"a":3},{"q":"Why is Yui a little nervous?","c":["Her English is not strong","She doesn’t like planes","Portland is very hot","She lost her ticket"],"a":0}],"words":991},{"id":72,"level":3,"emoji":"✈️","theme":"空港でお出迎え（第1話の鏡）","titleEn":"On the Other Side of the Gate","titleJa":"今度は、迎える側","teaser":"7か月前、空港で震えていたのはハナだった。今日は妹を迎える番。第1話と立場が入れ替わる、特別な金曜日。","story":"Friday finally came — the day of Yui’s arrival.\n\nHana finished work at noon. Rosa handed her a small white box at the door.\n\n“A welcome cake for your sister,” Rosa said. “Now go! Don’t be late!”\n\n“Thank you, Rosa! See you tomorrow!”\n\nHana ran to the station and took the train to the airport. She knew the way well now. She didn’t need a map, and she didn’t need help.\n\nAt the airport, she stood in the arrivals area and looked around. Seven months ago, she walked out of those doors with shaking hands and a heavy suitcase.\n\nShe remembered everything. The long immigration line. The officer’s questions. Her small, careful answers. Back then, English sounded like fast water.\n\nNow she read every sign easily. Baggage claim. Exit. Ground transportation. They were just words, simple and friendly.\n\n“I’ve really changed,” she thought.\n\nShe took out a homemade sign. Emma had decorated it at the cafe with little birds. It said, “WELCOME YUI!”\n\nHer phone buzzed. It was Yui.\n\n“I landed! Now I’m in the immigration line. There are so many people. I’m so nervous. My heart is very loud.”\n\nHana smiled and typed fast.\n\n“Breathe. The officer will ask simple questions. Answer slowly. If you don’t understand, say, ‘Could you say that again, please?’ You can do it.”\n\nA few minutes later, another message came.\n\n“He asked why I came to America! I said, ‘I’m here to visit my sister.’ He said, ‘Have a great trip!’ and smiled! I did it!”\n\n“Perfect!” Hana wrote back. “Now get your suitcase at baggage claim. I’m waiting by the doors.”\n\nHana watched the doors. Travelers came out one by one. A businessman with a phone. A family with sleepy children. A student with a guitar.\n\nThen the doors opened again, and there she was. Yui, with a big pink suitcase and tired eyes, looking left and right.\n\nHana lifted the sign high. “Yui! Over here!”\n\nYui saw her and started to run. The pink suitcase almost fell over.\n\n“Welcome to Portland!” Hana said, and hugged her sister hard. “You made it!”\n\n“Hana!” Yui’s eyes were wet. “You’re really here. This is really America. I can’t believe it.”\n\n“I know the feeling,” Hana laughed. “Let me carry that. How was your flight?”\n\n“So long. Ten hours! I watched three movies and slept a little. My neck hurts.”\n\n“Are you hungry? There’s a great dinner waiting at home. And this cake is from my boss, Rosa.”\n\n“A cake? For me?” Yui said. “I haven’t even met her yet!”\n\n“That’s Rosa. You’ll understand when you meet her.”\n\nOn the train, Yui pressed her face to the window. Everything was interesting to her — the river, the bridges, the tall trees.\n\n“The trees are bigger than trees in Japan,” Yui said. “And look! That dog is riding the train!”\n\n“Portland loves dogs,” Hana said. “Dogs, coffee, and rain. Those are the three kings of this city. And wait until you meet Daisy.”\n\nYui became quiet for a moment. Then she said, “Hana, at immigration, my hands were shaking. Was it like that for you?”\n\n“Exactly like that,” Hana said. “In April, I stood in that same line. I practiced my answers a hundred times in my head.”\n\n“But now you talk to everyone so easily. You bought the tickets. You found the right train. You did everything.”\n\nHana thought about it. “I’ve made many mistakes here. But every mistake taught me something. You’ll see.”\n\n“I already feel safer with you,” Yui said. “Today, you’re the big sister of America.”\n\nThey laughed together, and the train rolled on through the rain.\n\nAt the house, the front door opened before they knocked. The whole family stood there, and a paper banner hung in the hall: WELCOME YUI!\n\n“Welcome, welcome!” Carol said, opening her arms. “We’re so happy you’re here!”\n\nYui took a small breath. Hana knew that breath. It was the breath before speaking English.\n\nYui spoke slowly and clearly. “Hello. I’m Yui. Thank you for having me.”\n\n“Beautiful English!” Mike said. “Better than Ben’s morning English. He only says, ‘Mmm.’”\n\n“Dad!” Ben said, but he was smiling. “Hi, Yui. Nice to meet you.”\n\nThen Daisy walked over slowly and pushed her nose into Yui’s hand.\n\n“She’s saying welcome too,” Hana said.\n\n“So soft!” Yui said. “Hana sends me photos of Daisy every week. But the real Daisy is one hundred times better!”\n\nAt dinner, Carol served roast chicken and warm bread. Yui tried to say everything in English, and everyone waited kindly for her words.\n\n“The chicken is… delicious,” Yui said carefully. “In Japan, Hana talked about Carol’s cooking many times.”\n\n“And Yui,” Mike said with a big smile, “why don’t chickens use phones?”\n\nYui looked at Hana, worried. Hana laughed. “It’s a joke. Just wait.”\n\n“Because they already have wings!” Mike said. “Get it? Wings? Ring?”\n\nYui blinked. Then she laughed loudly. “I understood! I understood an American joke!”\n\n“It wasn’t a good one,” Ben said. “Don’t feel too proud.”\n\nAfter dinner, the sisters lay on their beds in Hana’s room, full and happy.\n\n“Your life here is warm,” Yui said sleepily. “The family, the funny jokes, the dog. Now I understand your photos.”\n\n“Tomorrow you’ll meet more people,” Hana said. “Pancakes in the morning, then the Saturday market. And Emma can’t wait to see you.”\n\n“Hana… today you helped me all day. Thank you. In April, who helped you at the airport?”\n\nHana turned off the light and smiled in the dark.\n\n“A kind officer, a taxi driver, and a lot of luck. And now I can be the helper. It’s a good feeling.”\n\nSoon Yui was asleep, but Hana stayed awake a little longer, proud and warm.\n\nTomorrow, the whole city was waiting for her little sister.","glossary":[{"w":"arrivals","ja":"到着ロビー"},{"w":"immigration","ja":"入国審査"},{"w":"officer","ja":"審査官"},{"w":"shaking","ja":"震えている"},{"w":"baggage claim","ja":"手荷物受取所"},{"w":"homemade","ja":"手作りの"},{"w":"buzz","ja":"振動する"},{"w":"traveler","ja":"旅行者"},{"w":"hug","ja":"抱きしめる"},{"w":"bridge","ja":"橋"},{"w":"banner","ja":"横断幕"},{"w":"roast chicken","ja":"ローストチキン"},{"w":"wing","ja":"翼"},{"w":"proud","ja":"誇らしい"}],"phrases":[{"en":"Welcome to Portland!","ja":"ポートランドへようこそ！"},{"en":"You made it!","ja":"よく来たね！／やったね！"},{"en":"How was your flight?","ja":"フライトはどうだった？"},{"en":"Let me carry that.","ja":"それ、持つよ。"},{"en":"Thank you for having me.","ja":"お招きありがとうございます。"}],"quiz":[{"q":"What did Hana bring to the airport?","c":["A pizza","Flowers","A welcome sign","An umbrella"],"a":2},{"q":"Who was nervous at immigration today?","c":["Yui","Hana","Ben","Carol"],"a":0},{"q":"Why did Hana feel proud at the airport?","c":["Because she bought a new phone","Because the train was fast","Because the cake was sweet","Because now she could be the helper"],"a":3}],"words":963},{"id":73,"level":3,"emoji":"🗺","theme":"妹を案内・通訳デビュー","titleEn":"Hana the Interpreter","titleJa":"通訳デビューの一日","teaser":"パンケーキ、土曜マーケット、川辺の散歩。妹のために一日中「通訳」するハナ。誇らしくて、へとへとで。","story":"Saturday morning began with the sweet smell of pancakes.\n\nYui came down the stairs slowly, following her nose. “Is that… the famous breakfast?”\n\n“Good morning, sleepyhead!” Carol said. “Sit down. Eat as many as you can.”\n\nYui took one bite and closed her eyes. “For two years, I have seen these pancakes only in photos. Real ones are better.”\n\n“Here, try this,” Hana said. “It’s maple syrup. It comes from trees.”\n\n“From trees?” Yui asked. “Wait. What does that mean in English? Ki no mizu?”\n\n“Tree water!” Mike laughed. “Close enough. We say ‘sap.’ But don’t worry, there’s no test today.”\n\nAfter breakfast, the sisters took the bus to the Saturday market by the river. Emma was waiting at the gate, jumping and waving.\n\n“Yui! Finally!” Emma said. “I’ve heard so much about you! How’s Portland? Do you like it so far? Isn’t this market the best?”\n\nYui’s eyes went wide. Emma’s English was faster than an express train.\n\nYui whispered in Japanese, and Hana smiled. “She says she loves it. But please speak a little slower. Your speed is level one hundred.”\n\n“Oops, sorry!” Emma laughed. “I’ll slow down. Welcome, Yui!”\n\nAnd so Hana’s new job began: interpreter.\n\nAt the honey stall, the seller offered a spoon. “This one’s from wildflowers. Would you like a taste?”\n\nYui looked at Hana. Hana said in Japanese, “Hachimitsu. He’s offering a taste.” Then to the seller: “Yes, please. Can I try one too?”\n\n“Mmm!” Yui said. “Amai! Ah… sweet! Very sweet!”\n\n“She has a good face for honey,” the seller laughed. “Tell her the bees say thank you.”\n\nHana translated, and Yui laughed for a long time.\n\nAt a flower stall, Yui touched a sunflower and asked, “In November? Really?”\n\n“Greenhouse flowers,” the seller explained. Hana opened her mouth to translate, but Yui shook her head. “Wait. Green… house. House of green. I understand!”\n\n“See? You’re learning without me,” Hana said, a little proud and a little useless.\n\nAt the next corner, Emma taught Yui one important word. “Awesome. You can use it for everything. The sky? Awesome. This apple? Awesome. Your sister? Awesome.”\n\n“Awesome!” Yui repeated, and she used it eleven more times before lunch.\n\nIt went on like this, stall after stall. Yui pointed, Hana explained. Sellers joked, Hana translated. Her brain worked in two directions, like a busy little train station.\n\nSometimes it was hard. A cheese seller said, “This one’s sharp.” Yui asked, “Sharp? Like a knife?” Hana had to think. “No, sharp means… a strong taste. Strong cheese.”\n\n“English is strange,” Yui said. “A taste can be sharp?”\n\n“English has been strange to me for seven months,” Hana said. “But strange becomes normal. Little by little.”\n\nFor lunch, they ate at the food carts. Emma ordered tacos for everyone.\n\n“Warning,” Hana said. “If the sauce is red, start with one small drop. I learned that the hard way.”\n\n“The spicy challenge story!” Yui said. “You cried at a food truck. Mom and I read that message five times.”\n\n“You cried?” Emma said. “I was THERE. She drank all my lemonade too.”\n\nAfter lunch, they looked for a present for Mom. At a pottery stall, Yui found a small blue cup, the color of the sea near Matsuyama.\n\n“Perfect for Mom’s tea,” Yui said in Japanese. Then she stopped. “Hana, wait. Don’t help me. I want to try.”\n\nYui took a breath, held up the cup, and said to the seller, “Excuse me. How much is this?”\n\n“Fourteen dollars,” the woman said kindly.\n\n“I’ll take it. Thank you very much.”\n\nThe seller wrapped the cup in soft paper. Emma clapped, and Hana felt her eyes get warm.\n\n“I did it!” Yui said. “My first shopping in English! My heart was so loud!”\n\n“You sounded great,” Hana said. “Braver than me in April. My first order took three tries.”\n\nIn the afternoon, they walked along the river. The clouds opened, and cold November sun fell on the water.\n\nYui took one hundred photos. Bridges, seagulls, Emma making funny faces, Hana laughing.\n\nA street musician played guitar under a bare tree. Yui dropped a dollar into his case, and he sang out, “Thank you kindly!” Yui bowed deeply, and he bowed back, and everybody near them smiled.\n\n“What has been your favorite thing today?” Emma asked slowly.\n\nYui understood by herself. “Everything! But my favorite… is watching my sister. Here, she is a different Hana. A strong Hana.”\n\nEmma put her arm around Hana. “We like this Hana a lot too.”\n\nHana translated nothing. Some things need no translation.\n\nBy evening, when they got home, Hana fell onto the sofa like a tree falling in a forest.\n\n“I’m exhausted. Talking in two languages all day is the hardest sport in the world,” she said.\n\nCarol brought her a cup of tea. “Interpreters have one of the most tiring jobs. Your brain never rests.”\n\n“Now I respect them so much,” Hana said. “Today I was a bridge. A very tired bridge.”\n\nMike looked up. “A tired bridge? Don’t worry. We still support you.”\n\n“Was that a joke?” Yui asked carefully.\n\n“Sadly, yes,” Ben said. “You’re learning fast.”\n\nAt bedtime, Yui showed Hana her notebook. She had written new words from the whole day: sap, sharp, wrap, seagull, exhausted.\n\n“I’ve learned more today than in a month of classes,” Yui said. “Real English is alive.”\n\n“That’s the secret,” Hana said. “The street is the best classroom. And mistakes are the best teachers.”\n\nYui closed the notebook. “Tomorrow, can we go to your cafe? I want to meet Rosa and Leo. I want to see where you work.”\n\nHana smiled at the ceiling. Her cafe. Her people. Her two worlds were finally going to meet.\n\n“Tomorrow,” she said, “you’ll meet the Bluebird family.”","glossary":[{"w":"maple syrup","ja":"メープルシロップ"},{"w":"sap","ja":"樹液"},{"w":"interpreter","ja":"通訳者"},{"w":"stall","ja":"露店"},{"w":"wildflower","ja":"野の花"},{"w":"translate","ja":"訳す"},{"w":"sharp","ja":"（味が）強い"},{"w":"pottery","ja":"陶器"},{"w":"wrap","ja":"包む"},{"w":"brave","ja":"勇敢な"},{"w":"seagull","ja":"カモメ"},{"w":"exhausted","ja":"くたくたの"},{"w":"respect","ja":"尊敬する"},{"w":"bridge","ja":"橋・懸け橋"}],"phrases":[{"en":"What does that mean in English?","ja":"それは英語で何て言うの？"},{"en":"She says she loves it.","ja":"彼女、すごく気に入ってるって。"},{"en":"Can I try one too?","ja":"私も一つ試していい？"},{"en":"How much is this?","ja":"これはいくらですか？"},{"en":"I’m exhausted.","ja":"もうくたくた。"}],"quiz":[{"q":"What did the family eat for breakfast?","c":["Pancakes","Onigiri","Tacos","Toast and eggs"],"a":0},{"q":"What did Yui buy with her own English?","c":["A honey jar","A scarf","A small blue cup","A photo book"],"a":2},{"q":"How did Hana feel after the long day?","c":["Bored and sad","Proud but very tired","Angry at Emma","Scared of the market"],"a":1}],"words":960},{"id":74,"level":3,"emoji":"🍩","theme":"ブルーバードカフェに妹が来た","titleEn":"Yui Meets the Bluebird Family","titleJa":"ユイ、ブルーバードへ","teaser":"ついに妹がハナの職場へ。ロサ、エマ、レオ、そして常連さんたち。ユイが見たのは、輝いて働く姉の姿だった。","story":"On Sunday morning, Hana brought Yui to the Bluebird Cafe.\n\nThe bell above the door rang, and warm coffee air welcomed them. Yui stopped at the door and looked around slowly.\n\n“So this is your cafe,” she said. “It’s exactly like your photos. No — it’s warmer.”\n\nRosa came out from the kitchen with open arms. “There she is! The little sister!”\n\n“Rosa, meet the famous Yui,” Hana said. “This is my little sister. And Yui, this is Rosa, the owner. She’s the reason I survived here.”\n\n“Oh, stop it,” Rosa laughed her big laugh. “You survived because you’re strong. I only gave you an apron. Yui, welcome! Thank you for the nice message about the cake.”\n\n“It was delicious,” Yui said carefully. “Thank you very much.”\n\nEmma waved from a table, where her sketchbook was open. “Yui! Sit with me! I’m drawing the window. You can watch.”\n\nThen a voice came from behind the coffee machine. “So the famous sister has arrived.”\n\nLeo stepped out with a towel over his shoulder. “I’ve waited for this day. I promised you a special caramel latte. Sit, sit!”\n\nYui sat at the counter, and Leo started the machine. Milk sang in the metal cup.\n\n“Watch his hands,” Hana said. “He’s the best barista in the neighborhood.”\n\nLeo poured the milk slowly, moved his wrist, and made a white bird in the foam.\n\n“A bluebird for the guest,” he said. “Don’t drink it. Just kidding. Drink it.”\n\n“It’s too beautiful,” Yui said. She took a photo from three angles, like a food reporter.\n\nWhile Yui drank her latte, Hana put on her apron. Sunday mornings were busy, and she wanted to help for an hour.\n\nYui watched from the counter. And what she saw surprised her — her quiet, shy sister was shining.\n\n“Good morning, Tom! The usual?” Hana called to a man with a newspaper.\n\n“You know it,” the man said. “And who’s this young lady? Your sister? Nice to meet you!”\n\n“Morning, Hana!” said a woman with a yoga mat. “How was your week?”\n\nHana answered everyone. She took orders, wrote names on cups, and laughed at small jokes. Her hands moved fast, and her English moved faster.\n\nThen the door opened, and Mrs. Chen walked in slowly.\n\n“Mrs. Chen!” Hana said. “Perfect timing. My sister is here!”\n\nMrs. Chen took Yui’s hands in her soft hands. “Welcome, dear. Your sister talks about you all the time. Yui, the smart one, she says.”\n\n“No, no,” Yui said, red in the face. “Hana is the brave one.”\n\n“Sisters,” Mrs. Chen smiled. “Both things can be true. Come and meet Mochi before you leave. He’s the boss of our street.”\n\nAt eleven, Hana took off her apron and sat with Yui and Emma.\n\nRosa brought a plate of doughnuts. “Break time. On the house.”\n\n“On the house?” Yui asked quietly. “The house?”\n\n“It means free,” Hana explained. “Cafe English. I learned it from Rosa in May.”\n\n“Free is my favorite English word,” Yui said, and everyone laughed.\n\nThen Yui stood up. “I want to order something. By myself. Is that okay?”\n\nShe walked to the register. Leo stood behind it with a serious face, like a quiz show host.\n\n“Welcome to Bluebird Cafe. What can I get started for you?”\n\nYui took a small breath. “Could I get a small latte?”\n\n“Coming right up. Your name?”\n\n“Yui. Y-U-I.”\n\n“Perfect English, Yui from Japan,” Leo said. “Level: master.”\n\nYui came back to the table with her cup and a smile as big as a doughnut. “I said it! The mirror practice worked!”\n\n“What mirror practice?” Emma asked.\n\n“In Japan, I practiced ordering to my mirror,” Yui said. “Hana did it too, seven months ago. It’s a family tradition.”\n\nEmma drew a quick picture in her sketchbook: two sisters talking to mirrors, with speech bubbles. Everyone laughed until Rosa came to see.\n\nWhile they laughed, Yui looked at Leo. “Your English is perfect. But it has… music in it?”\n\n“Brazil,” Leo smiled. “Portuguese is my first language. English is my second. Coffee is my third.”\n\n“Three languages! How did you learn English?”\n\n“Same as your sister. Slowly, badly, then suddenly well. With many embarrassing mistakes on the way. Ask her about the day she said ‘soap’ instead of ‘soup.’”\n\n“One time!” Hana protested. “I offered a customer the soap of the day ONE time!”\n\nYui laughed so hard she had to hold the counter.\n\nLater, Yui looked at the menu board for a long time. Then she pulled Hana’s arm.\n\n“Hana. Look. What is that?”\n\nOn the board, in white chalk, it said: “Hana’s Matcha Latte — a taste of Japan.”\n\n“Oh. That,” Hana said. “I made it for the menu in August. It sells well. Customers ask about matcha, and I explain.”\n\nYui was quiet for a moment. “Your name is on the menu. In America. Does Mom know?”\n\n“I told her, but maybe she didn’t understand,” Hana said.\n\n“Then I’ll show her.” Yui took out her phone and made a video. The board, the busy cafe, Leo waving, Rosa laughing, and Hana in the middle of it all.\n\n“I’m sending this to Mom,” Yui said. “She’ll cry. Happy crying.”\n\nBefore they left, Rosa hugged Yui like family. “Come back anytime. Bluebird is your cafe too now.”\n\n“Thank you, Rosa. Now I understand my sister’s letters,” Yui said. “This place is not a job. It’s a home.”\n\nThe sisters walked home under a gray November sky, warm inside.\n\n“Six more days,” Yui said softly. “I don’t want to think about it.”\n\n“Then let’s not think today,” Hana said. “Today was too good for sad thoughts.”\n\nBut the days with Yui were running fast — too fast.","glossary":[{"w":"owner","ja":"店主"},{"w":"survive","ja":"生き抜く"},{"w":"apron","ja":"エプロン"},{"w":"sketchbook","ja":"スケッチブック"},{"w":"barista","ja":"バリスタ"},{"w":"pour","ja":"注ぐ"},{"w":"wrist","ja":"手首"},{"w":"foam","ja":"泡"},{"w":"the usual","ja":"いつもの"},{"w":"register","ja":"レジ"},{"w":"on the house","ja":"店のおごり"},{"w":"chalk","ja":"チョーク"},{"w":"tradition","ja":"伝統"},{"w":"speech bubble","ja":"吹き出し"}],"phrases":[{"en":"This is my little sister.","ja":"こちら、私の妹です。"},{"en":"She’s the reason I survived here.","ja":"彼女のおかげでやってこられたの。"},{"en":"On the house.","ja":"お店のおごりだよ。"},{"en":"What can I get started for you?","ja":"ご注文は何にしましょう？"},{"en":"Come back anytime.","ja":"いつでもまた来てね。"}],"quiz":[{"q":"Who made a white bird in the milk foam?","c":["Rosa","Emma","Hana","Leo"],"a":3},{"q":"What did Yui order by herself?","c":["A doughnut","A small latte","A matcha latte","Orange juice"],"a":1},{"q":"Why did Yui make a video at the cafe?","c":["To practice English","To show Emma’s drawings","To show their mother how Hana shines","To win a phone game"],"a":2}],"words":952},{"id":75,"level":3,"emoji":"👋","theme":"妹の帰国・空港での見送り","titleEn":"You’ve Changed","titleJa":"「お姉ちゃん、変わったね」","teaser":"楽しかった10日間は、あっという間。空港で妹が残した一言が、ハナの心に深く届く。涙の見送りの日。","story":"The ten days with Yui passed like ten minutes.\n\nThey were full days. A rainy afternoon in the library. A movie night with popcorn and blankets. One evening, the sisters cooked gyoza for the Millers, and Mike ate fourteen of them.\n\nYui met Mochi at Mrs. Chen’s house and got a small origami crane. She watched Ben’s basketball practice and learned to shout, “Nice shot!”\n\nOn the rainy Thursday, the sisters did nothing at all. They stayed home in warm socks, drank tea, and talked for six hours about everything and nothing. Later, Hana couldn’t remember the topics. She only remembered the feeling: full.\n\nBut Sunday morning came, quiet and gray. The pink suitcase stood by the door, heavier than before. It was full of presents and one welcome banner, folded carefully.\n\nAt breakfast, nobody was hungry.\n\n“Yui, I packed some cookies for the plane,” Carol said. “And this is a little photo book. Pictures from your ten days.”\n\nYui turned the pages slowly. The market. The cafe. Daisy sleeping on her feet. “Thank you, Carol. I will look at it on the plane. Many times.”\n\n“Come back next year. I’ll have at least fifty new jokes by then,” Mike said.\n\n“That’s a warning, not an invitation,” Ben said, and everyone laughed a little too loudly, the way people laugh when they are sad.\n\nDaisy pushed her nose into Yui’s hand one last time.\n\nThe sisters took the train to the airport, just the two of them. Yui watched the river and the bridges go by.\n\n“Ten days ago, I saw these bridges for the first time,” she said. “Now they feel like old friends.”\n\n“That’s how this city works,” Hana said. “It becomes home very quietly. One day you look up, and you belong.”\n\nAt the airport, Hana led the way. Check-in machine, baggage drop, boarding pass. She explained each step, and Yui followed.\n\n“Seat 42A. A window seat,” Hana said. “The gate opens at one thirty. Don’t sleep in the waiting area, okay? You slept in Ueno Station once.”\n\n“That was ONE time,” Yui said. “I was seventeen!”\n\nThey had one hour left, so they drank hot chocolate near the big windows. Planes lifted into the clouds, one after another.\n\n“Hana,” Yui said suddenly. “Can I say something? Don’t laugh.”\n\n“I won’t laugh.”\n\nYui looked at her cup. “Before this trip, I was worried about you. Alone in America. My shy sister, who practiced ordering coffee to a mirror.”\n\n“And now?”\n\n“Now I’m not worried at all.” Yui looked up. “You’ve changed. You talk to strangers. You help people. You have a menu with your name on it. You laugh bigger here.”\n\nHana held her cup with both hands.\n\n“I didn’t notice it myself,” she said. “The change came slowly. Day by day. Like the rain here.”\n\n“Mom will ask me, ‘How is Hana?’” Yui said. “I have my answer ready. ‘Hana is more Hana than before.’”\n\nHana laughed, and her eyes were wet at the same time. “That’s the nicest strange sentence I’ve ever heard.”\n\nToo soon, it was time. They walked to the security line. Around them, other families were hugging goodbye.\n\n“Okay,” Yui said, and took a big breath. “I hate this part.”\n\n“Me too. So let’s make it short and strong,” Hana said. “Like taking off a bandage.”\n\nThey hugged for a long time, in the middle of the moving crowd, and Yui’s voice was small. “Thank you for everything. The best ten days of my life.”\n\n“Take care of yourself. Study hard. Sleep more. Don’t fight with Mom,” Hana said.\n\n“I never fight with… okay, sometimes,” Yui said. “Hana. Come home in December, like you planned. But don’t hurry. Finish your story here first.”\n\n“I will. Text me when you land, okay? Even if it’s midnight here.”\n\n“I promise. Have a safe fl— wait. That’s wrong. You say that to me!” Yui laughed through her tears.\n\n“Then say it,” Hana smiled.\n\n“Have a safe life, big sister,” Yui said. “Until December.”\n\nYui walked into the line. She turned and waved. Then she turned again at the corner, one more time, and then she was gone.\n\nHana stood there for a minute. In April, she was the one who walked away, and her whole family waved from the other side. Now she understood their faces on that day.\n\nShe cried a little on the train home. But these tears were different from her April tears. They were warm, thankful tears. Sad and happy can hold hands — she knew that now.\n\nAt home, her room was too quiet. The air mattress was gone, and the floor looked big.\n\nThen she saw it. On her desk, there was a letter and a small package.\n\n“To my sister,” the letter said in Japanese. “I watched you for ten days. You gave your English to me like a present, every day. So here is a present for your last month. Fill it with everything. — Yui.”\n\nInside the package was a new journal, sky-blue, with a little bird on the cover.\n\nHana held it to her chest and laughed and cried at the same time.\n\nThat night, her phone buzzed at eleven. “I landed! Narita is rainy. I miss you already. Also, I ate all the cookies over the ocean.”\n\n“Take care of yourself,” Hana wrote back. “And send Mom the cafe video!”\n\n“She has watched it nine times,” Yui answered. “She shows it to the neighbors.”\n\nHana turned off the light, smiling in the dark.\n\nOn the first page of the sky-blue journal, she wrote one line: “Day 75. My sister says I’ve changed. I think she’s right.”\n\nAnd next week was Thanksgiving — her very first.","glossary":[{"w":"blanket","ja":"毛布"},{"w":"origami crane","ja":"折り鶴"},{"w":"fold","ja":"折りたたむ"},{"w":"invitation","ja":"招待"},{"w":"check-in","ja":"搭乗手続き"},{"w":"boarding pass","ja":"搭乗券"},{"w":"gate","ja":"搭乗口"},{"w":"stranger","ja":"見知らぬ人"},{"w":"security line","ja":"保安検査の列"},{"w":"bandage","ja":"絆創膏"},{"w":"midnight","ja":"真夜中"},{"w":"wave","ja":"手を振る"},{"w":"thankful","ja":"感謝している"},{"w":"package","ja":"包み"}],"phrases":[{"en":"Take care of yourself.","ja":"体に気をつけてね。"},{"en":"Text me when you land, okay?","ja":"着いたらメッセージしてね。"},{"en":"Thank you for everything.","ja":"本当にいろいろありがとう。"},{"en":"I miss you already.","ja":"もう会いたくなってるよ。"},{"en":"Come back next year.","ja":"来年また来てね。"}],"quiz":[{"q":"How did the sisters go to the airport?","c":["By taxi","By train","By bike","In Mike’s car"],"a":1},{"q":"What did Yui say to Hana at the airport?","c":["“You’ve changed.”","“Come home now.”","“Portland is too rainy.”","“Buy me a present.”"],"a":0},{"q":"Why were Hana’s tears different from April?","c":["Because she was very sick","Because the airport was loud","Because she was angry","Because they were warm, thankful tears"],"a":3}],"words":951},{"id":76,"level":4,"emoji":"🦃","theme":"感謝祭の買い出し","titleEn":"Operation Turkey","titleJa":"ターキー大作戦","teaser":"初めての感謝祭まであと2日。巨大な買い物リスト、大混雑のスーパー、最後のバター争奪戦！キャロルと挑む買い出し作戦。","story":"Two days before Thanksgiving, the Miller kitchen turned into a military headquarters.\n\nCarol stood at the counter with a notebook, a pen behind her ear, and the serious face of a general planning a battle.\n\n“Okay, team meeting,” she said. “Thursday is Thanksgiving. Twelve people are coming, including Mrs. Chen and two of Ben’s friends. That means one big turkey, three pies, and a mountain of potatoes.”\n\n“Twelve people?” Hana asked. “Is that normal?”\n\n“For Thanksgiving? That’s a small crowd,” Mike said. “My aunt used to cook for twenty-five. The turkey was the size of Daisy.”\n\nDaisy lifted her head at the sound of her name, decided nobody had food, and went back to sleep.\n\n“So what exactly is Thanksgiving?” Hana asked. “I know there’s a turkey, and everyone says thank you. But why?”\n\n“It started as a harvest festival, hundreds of years ago,” Carol explained. “These days, it’s really about gathering. Family and friends around one table, once a year, no presents needed. You eat too much, you watch football, you fall asleep on the sofa. It’s wonderful.”\n\n“The falling asleep part is my favorite tradition,” Mike added.\n\nCarol opened the pantry and started checking shelves against her list. “Flour, we have. Sugar, we have. Oh no. We’re out of butter. How are we out of butter? I bought four packs!”\n\n“That might be my fault,” Ben said from the doorway. “I made toast. A lot of toast.”\n\n“Ben. Four packs?”\n\n“It was a long month, Mom.”\n\nCarol wrote BUTTER in big letters and underlined it twice. “Hana, are you free tomorrow morning? I need a shopping partner with young legs and a strong heart. The store before Thanksgiving is… an experience.”\n\n“I’m free, and I’m ready,” Hana said. “How bad can a supermarket be?”\n\nMike and Ben looked at each other and laughed quietly, like sailors who had seen a storm before.\n\nThe next morning, Hana understood.\n\nThe parking lot was completely full. Cars circled slowly, like hungry seagulls. Inside, the store was a river of carts, coats, and determined faces.\n\n“Welcome to the madhouse,” Carol said cheerfully. “Rule one: stay calm. Rule two: protect the list. Could you grab a cart? I see one hiding by the flowers.”\n\nHana caught the last cart, and they pushed into the crowd.\n\nThe turkey section looked like a friendly battlefield. People leaned over the frozen birds, reading labels and calling out weights to each other.\n\n“Sixteen pounds!” a man shouted to his wife, holding up a turkey like a trophy.\n\n“Too big!” she called back. “Our oven is not a stadium, Gary!”\n\nCarol dug through the pile with expert hands. “We need fourteen pounds. Big enough for twelve people, small enough to cook evenly. Ah, here. Perfect.”\n\nThe turkey landed in the cart with a heavy thump. Hana stared at it. “It’s bigger than Mochi. And Mochi is not a small cat. Who can eat all this?”\n\n“Twelve people, one long afternoon, and then a week of turkey sandwiches,” Carol said. “Leftovers are half the holiday.”\n\n“Wait until you taste it,” Carol said. “Now, potatoes. Then the dangerous part. Baking supplies.”\n\n“Why dangerous?”\n\n“Because every person in this store is baking a pie tonight.”\n\nShe was right. The baking aisle was packed shoulder to shoulder. And when they finally reached the butter shelf, it was empty. Completely, shiningly empty.\n\n“No,” Carol whispered. “No, no, no.”\n\n“We’re out of butter,” Hana said to a store worker in a red apron. “I mean — the shelf is out of butter. Is there more in the back, maybe?”\n\nThe worker shook his head sadly. “More is coming this afternoon. Maybe. It’s the same every year, folks. Butter is gold this week.”\n\nCarol closed her eyes for a moment. “Three pies. No butter. Okay. We’ll try the corner store on the way—”\n\n“Excuse me,” said a voice behind them. A tall woman with gray hair held up her basket. Inside were six packs of butter. “I heard you. I grabbed too many, just in case. Take two.”\n\n“Are you sure?” Carol asked. “You’re saving my pies. Honestly, you’re saving Thanksgiving.”\n\n“We’ve all been there,” the woman smiled, putting the butter in their cart. “Last year, a stranger gave me her last can of pumpkin. It comes around. Happy Thanksgiving!”\n\n“Happy Thanksgiving!” Hana said, and she meant it with her whole heart.\n\nAs they walked away, Hana looked at Carol. “In the middle of the madhouse, people share butter with strangers.”\n\n“That’s the funny thing about this holiday,” Carol said. “The shopping is crazy, but it makes people kind. Everyone’s cooking for someone they love.”\n\nThey worked through the rest of the list. Potatoes, sweet potatoes, green beans, cranberries, whipped cream. Rolls, onions, celery for the stuffing. The cart grew heavier, and pushing it felt like driving a small truck.\n\nAt the checkout, they picked the shortest line. It still had nine carts in it.\n\n“The line is so long. And nobody looks angry. Everyone’s just… chatting,” Hana said.\n\nIt was true. Ahead of them, two strangers compared pie recipes. A little boy sat inside a cart, guarding a tower of rolls like a knight. The cashier called out, “Happy Thanksgiving!” to every single customer.\n\nThe man in front of them turned around. “Big dinner?”\n\n“Twelve people,” Carol said proudly.\n\n“Nineteen at ours,” the man said. “My mother-in-law is bringing her famous cornbread. Between us, it’s terrible. But we eat it every year, because she’s eighty-two and she’s ours.”\n\nEveryone in the line laughed. Hana laughed too, and thought: I’m standing in a line in America, laughing with strangers about cornbread. When did this become my life?\n\nTwenty-five minutes later, they loaded the bags into the car. Carol checked the list one last time and froze.\n\n“Cranberry sauce. I forgot the cranberry sauce. It’s the one thing Mike truly cares about.”\n\nHana pulled out her phone. “Ben texted me ten minutes ago. Look.”\n\nThe message said: “Mom always forgets the cranberry sauce. I biked to the corner store. Got the last two cans. You owe me, sister.”\n\nCarol read it twice and put her hand on her heart. “That boy. He acts like his phone is his whole world, and then he does something like this.”\n\n“In this family,” Hana said, “kindness is a group project.”\n\nAt home, they played refrigerator Tetris for half an hour. The turkey took its place on the bottom shelf like a sleeping king.\n\nThat evening, the kitchen filled with the smell of butter and cinnamon. Carol and Hana rolled pie dough while Mike peeled apples and told jokes that nobody had ordered.\n\n“Was the shopping worth all that madness?” Hana asked, pressing dough into a pan.\n\n“Ask me tomorrow,” Carol said, “when you see twelve people around one table. Then you’ll know. It’s worth it. Every crazy minute.”\n\nHana smiled and reached for the sugar.\n\nTomorrow, the house would fill with people, turkey, and one small speech she was secretly practicing — because tomorrow, Hana had some thanks to give.","glossary":[{"w":"headquarters","ja":"司令部"},{"w":"harvest festival","ja":"収穫祭"},{"w":"gathering","ja":"集まり"},{"w":"pantry","ja":"食品棚"},{"w":"out of butter","ja":"〜を切らす"},{"w":"madhouse","ja":"大混乱の場所"},{"w":"frozen","ja":"冷凍の"},{"w":"pound","ja":"ポンド（重さ）"},{"w":"aisle","ja":"通路・売り場"},{"w":"stuffing","ja":"詰め物料理"},{"w":"cranberry sauce","ja":"クランベリーソース"},{"w":"checkout","ja":"レジ"},{"w":"cashier","ja":"レジ係"},{"w":"dough","ja":"生地"},{"w":"cinnamon","ja":"シナモン"}],"phrases":[{"en":"We’re out of butter.","ja":"バターを切らしてる。"},{"en":"The line is so long.","ja":"列がすごく長いね。"},{"en":"Could you grab a cart?","ja":"カートを取ってきてくれる？"},{"en":"Are you sure?","ja":"本当にいいんですか？"},{"en":"It’s worth it.","ja":"その価値はあるよ。"}],"quiz":[{"q":"Why did Carol and Hana go to the supermarket?","c":["To buy a birthday cake","To meet the Millers’ neighbors","To shop for Thanksgiving dinner","To return a broken toaster"],"a":2},{"q":"What was missing from the store shelf?","c":["Turkey","Potatoes","Whipped cream","Butter"],"a":3},{"q":"Why did Carol say the crazy shopping was worth it?","c":["Because the dinner brings everyone to one table","Because the store gave discounts","Because she loves crowded places","Because Mike paid for everything"],"a":0}],"words":1171},{"id":77,"level":4,"emoji":"🥧","theme":"感謝祭ディナー","titleEn":"A Table Full of Thanks","titleJa":"「ありがとう」でいっぱいの食卓","teaser":"七面鳥、12人の食卓、そして一人ずつ語る「感謝していること」。ハナが練習してきた小さなスピーチの出番が来る。","story":"Thanksgiving morning arrived with the smell of onions and the sound of Carol’s radio playing old songs.\n\nThe turkey went into the oven at seven, and from that moment, the kitchen ran on Carol Time.\n\n“Potatoes at ten. Green beans at eleven thirty. Rolls at three forty-five, not a minute later,” she announced, tapping her list like a conductor tapping a music stand.\n\n“What’s my mission?” Hana asked, tying on an apron.\n\n“You have full control of your mystery dish. The counter by the window is yours.”\n\nHana had planned this for days. Sweet potatoes, roasted until golden, with butter, honey, soy sauce, and toasted sesame seeds. It was the taste of autumn in Matsuyama — her grandmother made something like it every November.\n\nMike wandered in, stole a green bean, and looked over her shoulder. “That smells incredible. What is it?”\n\n“A little Japan for the American table,” Hana said. “If the two countries can share a plate, they can share anything.”\n\nBy two o’clock, the house was full of noise. Carol’s sister Susan arrived with her husband Dave and their twin daughters, who immediately fell in love with Daisy. Ben’s two friends from the basketball team came hungry, as sixteen-year-olds do.\n\nAnd at three, the doorbell rang one more time. Mrs. Chen stood on the porch in her best coat, holding a small bunch of flowers.\n\n“Happy Thanksgiving, dear,” she said. “Mochi sends his greetings. He’s guarding my house. Badly, I’m sure. He’s probably asleep on my chair.”\n\n“Come in, come in! Make yourselves at home, everyone!” Carol called from the kitchen. “Dinner in one hour!”\n\nHana took coats, poured apple cider, and introduced people to each other. A year ago, she thought, I couldn’t order a coffee. Today I’m the one saying, “Have you two met?”\n\nAt four o’clock, Mike stood at the head of the table with a big knife and a bigger smile.\n\n“Friends, family, honored guests,” he said seriously. “The bird is ready. As we say every year: let’s give thanks, and then let’s give seconds.”\n\nThe table was a work of art. The golden turkey in the middle, mashed potatoes like a snow mountain, stuffing, green beans, cranberry sauce shining like jewels, warm rolls under a cloth — and Hana’s sweet potatoes, glowing with honey and sesame.\n\n“Before we eat,” Carol said, “we do our family tradition. Everyone says one thing they’re thankful for. Who wants to start?”\n\nOne of the twins raised her hand so fast her chair squeaked. “I’m thankful for Daisy! And mashed potatoes! That’s two things. I don’t care.”\n\nLaughter went around the table, and the circle began.\n\nDave was thankful for a healthy year. Susan, for her noisy, wonderful daughters. Ben’s friends were thankful for “this table, seriously, look at it” and for the basketball season. Ben mumbled that he was thankful for his family, “even Dad’s jokes, I guess,” which made Mike pretend to cry.\n\nMrs. Chen folded her hands. “I’m thankful for good neighbors. When you’re seventy-two, a knock on your door is a gift. This year, my door heard many knocks.” She looked at Hana when she said it.\n\nMike was thankful for Carol. “Thirty years, and she still laughs at my jokes. Out of kindness, but still.”\n\n“I do not,” Carol said, laughing. “I’m thankful for everyone in this room. And for a certain stranger with six packs of butter.”\n\nThen it was Hana’s turn. The table went quiet.\n\nShe had practiced a speech in her room, twice in the mirror. But sitting there, looking at the faces, she let the paper version go and just spoke.\n\n“Eight months ago, I arrived with two suitcases and small English,” she said. “I was afraid of the telephone. I was afraid of the bus. On my first night, I cried very quietly, so nobody could hear.”\n\n“We heard,” Carol said softly. “We just knew you needed time.”\n\n“I know,” Hana smiled. “That’s the thing. You always knew what I needed. A family across the ocean took me in and called me one of them. A cafe gave me work and friends. A neighbor gave me tea and stories. Strangers became my people. So — I’m thankful for all of you. In Japanese we say okagesama de. It means: I am who I am because of you. There’s no perfect English for it. But today, this table is the translation.”\n\nNobody spoke for a moment. Mrs. Chen pressed her napkin to her eyes. One of the twins whispered, “That was like a movie.”\n\n“Okay,” Mike said, his voice a little rough. “If I don’t carve this turkey right now, I’m going to cry in front of teenagers. Dig in, everybody!”\n\nThe next hour was pure, delicious chaos.\n\n“Pass the gravy, please!” Ben called from one end.\n\n“It’s making a world tour,” Dave answered, sending the boat down the line. “Everything comes back eventually, like the moon.”\n\nHana’s sweet potatoes disappeared faster than any other dish. Susan demanded the recipe. Mrs. Chen took a second helping and said the sesame reminded her of her own grandmother’s kitchen. “Food travels better than people,” she said. “It never needs a passport.”\n\nHana tried everything, said yes too many times, and finally sat back with her hands on her stomach.\n\n“I couldn’t eat another bite. This is the fullest I have ever been in my life. My body is sixty percent stuffing now,” she announced.\n\n“You say that,” Mike warned, “but in thirty minutes, Carol brings out three pies. Nobody survives the pie. Don’t fight it.”\n\nHe was right. Nobody survived the pie.\n\nAfter dinner, football murmured on the TV, and the twins fell asleep on Daisy like two small commas. In the kitchen, Ben appeared next to Hana holding the wishbone.\n\n“Family rule. Two people pull, and whoever gets the bigger piece makes a wish. You’re new, so you get the first try.”\n\nThey each took a side, counted to three, and pulled. Snap. Ben held up the bigger piece.\n\n“Ha! Okay, wishing.” He closed his eyes for a second, then looked at Hana in a strange, kind way.\n\n“What did you wish?” she asked.\n\n“Can’t say, or it won’t come true.” He put the little bone in his pocket. “But it’s a good one. Trust me.”\n\nLate that night, after the dishes and the leftovers were packed — a full bag for Mrs. Chen, “enough turkey for a week, dear” — Hana video-called Japan. Her mother and Yui appeared, eating breakfast.\n\n“We just finished a dinner for twelve,” Hana said. “I gave a speech. In English. And nobody laughed except when I wanted them to.”\n\n“Of course they didn’t laugh,” her mother said. “Yui showed me the video from the cafe. My daughter, the Portland star.”\n\nIn bed, Hana opened the sky-blue journal and wrote: “Day 77. Today I learned that ‘thank you’ is a food. You cook it all day and share it at one table.”\n\nShe was almost asleep when her phone buzzed. It was Emma.\n\n“Rest well, turkey champion. Tomorrow, 6 a.m. BLACK FRIDAY. Bring comfortable shoes and your courage.”","glossary":[{"w":"conductor","ja":"指揮者"},{"w":"roast","ja":"オーブンで焼く"},{"w":"sesame seeds","ja":"ごま"},{"w":"twin","ja":"双子"},{"w":"apple cider","ja":"リンゴジュース"},{"w":"carve","ja":"切り分ける"},{"w":"give seconds","ja":"おかわりを出す"},{"w":"squeak","ja":"キーッと鳴る"},{"w":"mumble","ja":"もごもご言う"},{"w":"took me in","ja":"迎え入れてくれた"},{"w":"napkin","ja":"ナプキン"},{"w":"gravy","ja":"グレイビーソース"},{"w":"second helping","ja":"おかわり"},{"w":"wishbone","ja":"願いの骨"},{"w":"leftovers","ja":"残り物"}],"phrases":[{"en":"Make yourselves at home, everyone!","ja":"みんな、くつろいでね！"},{"en":"I’m thankful for all of you.","ja":"みなさんに感謝しています。"},{"en":"Pass the gravy, please!","ja":"グレイビーを回してください！"},{"en":"Dig in, everybody!","ja":"さあ、みんな食べて！"},{"en":"I couldn’t eat another bite.","ja":"もう一口も食べられない。"}],"quiz":[{"q":"What dish did Hana make for the dinner?","c":["Sweet potatoes with honey and sesame","Pumpkin pie","Onigiri","Mashed potatoes"],"a":0},{"q":"Who got the bigger piece of the wishbone?","c":["Hana","Ben","Mike","One of the twins"],"a":1},{"q":"Why did the table become quiet after Hana’s speech?","c":["Because the food was cold","Because the TV was on","Because her words touched everyone’s hearts","Because Mike started carving"],"a":2}],"words":1184},{"id":78,"level":4,"emoji":"🛍","theme":"ブラックフライデー初体験","titleEn":"The Art of Not Buying","titleJa":"「買わない」という買い物術","teaser":"朝6時集合、行列、半額の山！エマ師匠と挑む初のブラックフライデー。最大の戦いは、自分の「欲しい」との戦い？","story":"At six in the morning, the day after Thanksgiving, the city was dark, cold, and strangely awake.\n\nHana found Emma outside the mall, holding two paper cups of coffee and bouncing on her toes like a boxer.\n\n“You came! Welcome to Black Friday,” Emma said, handing her a cup. “The biggest shopping day in America. Also the strangest. Drink this. You’ll need your strength.”\n\nAcross the street, a line of people stretched along the wall of the electronics store. Some sat in folding chairs under blankets. One man had a small tent.\n\n“A tent?” Hana stared. “Did he… sleep here?”\n\n“Since yesterday, probably. There’s a TV inside with three hundred dollars off, and he wants it more than he wants a warm bed.” Emma shrugged. “Every year I say it’s crazy, and every year I’m here at six. Humans are mysterious.”\n\nHana laughed into her coffee. “So what’s the plan, teacher?”\n\nEmma held up three fingers. “The Three Rules of Black Friday. Rule one: make your list before you see the sales, and buy only the list. Rule two: before you pay, ask out loud, ‘Do I really need this?’ Rule three: a thing you would never buy at full price is not a deal. It’s a trap with a red sticker.”\n\n“You sound very wise.”\n\n“I learned by suffering. Last year I bought an exercise bike. It’s now a very expensive coat hanger. Okay — what’s on your list?”\n\nHana took out a note. “Winter boots, because my shoes cry in the rain. Christmas presents for my family in Japan. That’s all.”\n\n“Short list. Strong heart. Let’s go.”\n\nTheir first stop was the electronics store, just to see it. The doors opened, and the line poured inside like water from a broken dam. Within a minute, people were pushing giant TV boxes toward the checkout, faces shining with victory.\n\nBy the blenders, two women reached for the last discounted box at the same moment. The crowd held its breath.\n\n“Rock, paper, scissors?” one offered.\n\nThey played. Paper covered rock. The winner raised her arms, and the loser laughed and bowed, and somebody clapped.\n\n“I expected a war,” Hana said as they escaped to the quiet mall hallway. “That was almost sports.”\n\n“Mostly it’s friendly,” Emma said. “Loud, but friendly. Now — boots. Follow me.”\n\nThe shoe store smelled like leather and new rubber. A whole wall wore a red banner: WINTER BOOTS 40% OFF.\n\nHana picked up a sturdy brown pair with warm lining. “These. But the sizes look strange. In Japan I’m 24.5. Here that means nothing.”\n\nShe waved to a store worker. “Excuse me. Do you have these in a size seven?”\n\n“Size seven, coming up,” the woman said, and disappeared into the back.\n\nThe boots fit perfectly. Hana walked up and down the little mirror aisle, and for a second she saw herself in snow — a person from Matsuyama, standing in an Oregon winter on her own two warm feet.\n\n“Taking them?” Emma asked.\n\n“Taking them. They’re on the list, I need them, and they’re forty percent off. All three rules say yes.”\n\n“Beautiful. Textbook shopping.”\n\nThe department store came next, for the presents. Hana chose soft gray gloves for her father, tea in a pretty tin for her mother, and a Portland hoodie for Yui, because Yui had borrowed Hana’s hoodie for ten days and “forgotten” to return it.\n\nAnd then, in the kitchen section, danger appeared.\n\nIt stood on a shining shelf under a spotlight: an espresso machine, silver and beautiful, like a small spaceship. The sign said: TODAY ONLY.\n\n“Emma. Look at it. It’s fifty percent off.” Hana walked toward it slowly. “Half price. For a real espresso machine. I work in coffee. This is basically my professional equipment.”\n\n“Uh-huh,” Emma said, in the flat voice of a doctor hearing familiar symptoms. “Say the words, Hana.”\n\nHana put her hand on the cold silver handle. “Do I really need this?”\n\nThe question hung in the air. And slowly, the true answer arrived, and it was bigger than the machine.\n\n“I make coffee all day at Bluebird,” she said quietly. “At home, Carol’s old kettle works fine. And in one month…” She paused. “In one month I fly home with two suitcases. A spaceship won’t fit.”\n\nIt was the first time she had said it out loud in a shop, between the shelves, on an ordinary Friday: one month. The sale sticker suddenly looked very small.\n\nEmma touched her shoulder. “Hey. You okay?”\n\n“Yeah.” Hana smiled and stepped back from the machine. “It’s a good machine. But it’s not on my list. My list is people now, not things. Presents I can carry, memories I can’t lose.”\n\n“Okay, that was beautiful,” Emma said, “and I’m putting it on a T-shirt. Come on, walk away. I’ll hold your hand.”\n\nJustice came quickly. In the art store, twenty minutes later, Emma froze in front of a professional easel, marked down from two hundred dollars.\n\n“Hana. HANA. Look at this easel.”\n\n“Emma. Say the words.”\n\n“I don’t want to say the words.”\n\n“Say them.”\n\nEmma took a deep, painful breath. “Do I… really need this? No. I have an easel. It has one short leg, and I love it anyway.” She turned her back on the easel like a hero leaving an explosion in a movie. “I’ll sleep on it. If I still dream about it next week, we can talk.”\n\nShe bought a small sketchbook from the sale basket instead. Three dollars.\n\nBy noon, their feet were finished. They fell into chairs at the food court with hot chocolate and counted the damage.\n\n“Boots, three presents, one tiny sketchbook,” Emma said. “Total saved: about seventy dollars. Total NOT spent on machines and easels: four hundred. We’re basically rich.”\n\n“My teacher taught me well,” Hana said. “The best deal is the thing you don’t buy. I’m going to tell Yui. She buys phone cases like they’re food.”\n\nAround them, shoppers flowed past with mountains of bags. Emma watched them and grinned.\n\n“You know what’s funny? Yesterday everyone said thanks for what they have. Today everyone’s buying more. America is a complicated place.”\n\n“Every place is,” Hana said. “But today was fun. Loud, crazy, six a.m. fun.”\n\n“Same time next year?” Emma asked — and then caught herself, and her grin went soft. “Well. Wherever you are next year, we’ll shop by video call. I’ll carry the phone through the whole mall.”\n\n“Deal,” Hana said, and they shook on it like businesspeople.\n\n“Okay. Let’s call it a day. My bed misses me,” Emma said, gathering the bags.\n\nAt the bus stop, Hana checked her phone. The weather app showed something new for the middle of next week: a tiny white snowflake.\n\nShe held up the screen. “Emma. Is that what I think it is?”\n\n“First snow is coming,” Emma smiled. “I hope your new boots are ready to work.”","glossary":[{"w":"folding chair","ja":"折りたたみ椅子"},{"w":"mysterious","ja":"不思議な"},{"w":"full price","ja":"定価"},{"w":"trap","ja":"わな"},{"w":"dam","ja":"ダム"},{"w":"blender","ja":"ミキサー"},{"w":"sturdy","ja":"丈夫な"},{"w":"lining","ja":"裏地"},{"w":"tin","ja":"缶"},{"w":"hoodie","ja":"パーカー"},{"w":"espresso machine","ja":"エスプレッソマシン"},{"w":"equipment","ja":"道具・設備"},{"w":"easel","ja":"イーゼル・画架"},{"w":"marked down","ja":"値下げする"},{"w":"snowflake","ja":"雪の結晶"}],"phrases":[{"en":"It’s fifty percent off.","ja":"50パーセント引きだよ。"},{"en":"Do I really need this?","ja":"これ、本当に必要？"},{"en":"Do you have these in a size seven?","ja":"これのサイズ7はありますか？"},{"en":"I’ll sleep on it.","ja":"一晩考えてみる。"},{"en":"Let’s call it a day.","ja":"今日はここまでにしよう。"}],"quiz":[{"q":"What time did Hana and Emma meet?","c":["At noon","At nine in the morning","At eight at night","At six in the morning"],"a":3},{"q":"What did Hana buy for herself?","c":["An espresso machine","A big TV","Winter boots","A blender"],"a":2},{"q":"Why didn’t Hana buy the espresso machine?","c":["She didn’t really need it, and she flies home soon","It was too expensive even on sale","Emma bought the last one","The store was closing"],"a":0}],"words":1152},{"id":79,"level":4,"emoji":"❄️","theme":"初雪と冬支度","titleEn":"The First Snow","titleJa":"はじめての雪の夜","teaser":"「雪が降ってるよ！」ベンの叫び声で家中が外へ。古着屋での冬支度、雪合戦、ココア。ポートランドの冬が始まる。","story":"The Monday after Thanksgiving, winter knocked on Portland’s door.\n\nHana felt it on her morning walk to the cafe — a new kind of cold that slipped through her jacket and found her bones. Her breath made little clouds, and the puddles wore thin skins of ice.\n\nAt breakfast the next day, Carol looked at Hana’s autumn jacket and shook her head like a doctor giving bad news.\n\n“That jacket had a good life, but its season is over. A cold snap is coming this week. Maybe even snow. You need a real winter coat, and you need it today.”\n\n“The weather app shows a snowflake,” Hana said. “Emma told me to prepare.”\n\n“Emma is right. After my shift, we’re going shopping. And I know exactly where.”\n\n“The mall?”\n\n“Better.” Carol smiled. “The thrift store.”\n\nThat afternoon, Carol drove them to a big secondhand shop on the corner, with a bell on the door and the friendly smell of old books and wool.\n\n“In Portland, this is treasure hunting,” Carol said, diving into a long rack of coats. “Half the city shops secondhand. It’s cheap, it’s good for the planet, and every coat has a story.”\n\nThey worked through the rack together. Too big. Too orange. Too many holes. Then Carol pulled out a deep green coat with wooden buttons and a soft lining.\n\n“Oh, hello,” she said. “Hana. Try this on.”\n\nHana slipped it on and looked in the mirror. The coat fit like it had been waiting for her since last winter.\n\n“It looks good on you. Warm?” Carol asked.\n\n“Like a sleeping bag with buttons. How much?” Hana checked the tag and her eyes went wide. “Twelve dollars? In Japan, this would be a hundred.”\n\n“Welcome to the thrift life. Now, a hat and gloves, and you’re ready for anything.”\n\nThey added a red wool hat and thick gloves, plus a scarf for Ben, who had lost his third scarf of the year. At the register, the old man behind the counter nodded at the green coat.\n\n“Good choice. That one will laugh at the wind,” he said. “Bundle up this week, folks. My knee says snow is coming, and my knee is never wrong.”\n\n“Is a knee a weather app?” Hana whispered on the way out.\n\n“An old Portland knee?” Carol said. “More accurate than the news.”\n\nThe knee was right.\n\nTwo evenings later, the family was in the living room after dinner. Mike was grading science tests, Carol was reading, and Hana was writing to Yui. Ben stood up to get a snack, glanced out the window, and froze.\n\n“Guys.” His voice went up like an elevator. “GUYS. It’s snowing!”\n\nChairs scraped. Papers flew. In ten seconds, the whole family was pressed against the window like children at an aquarium.\n\nOutside, under the streetlight, fat white flakes floated down, slow and silent, like tiny letters from the sky.\n\n“First snow of the year,” Carol said softly. “And it’s actually sticking.”\n\n“Coats!” Mike commanded. “Boots! Family, deploy!”\n\nHana ran for her new green coat and her Black Friday boots. Bundle up, she thought, smiling at the phrase. Now I understand it with my whole body.\n\nThe street was turning white, and doors were opening all along the block. Neighbors stepped out, faces up, catching snow in their hair. Somewhere someone laughed, and the sound carried far in the soft air.\n\nDaisy walked into the snow carefully, sniffed it — and then something ancient and joyful switched on inside her. The old dog began to run in circles, kicking up white powder, tail spinning like a propeller.\n\n“Daisy!” Hana laughed. “You’re a puppy again!”\n\n“Snow does this to her every year,” Ben said. “It’s her favorite weather. Watch, she’ll try to eat it.”\n\nDaisy ate it.\n\nHana stood still i
