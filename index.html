to talk for the first five minutes after that.\n\nThe city slid past in the dark — the bus stop, the library, the corner where Bluebird Cafe was still asleep behind its cold windows. Ben watched Hana watch it all.\n\n“You’ll see it again,” he said. “Cities don’t go anywhere. That’s their whole job.”\n\nAt the airport, the glass doors opened into light and noise — and there stood Emma, Leo, and Rosa beside the check-in line, holding a paper sign that said TEAM HANA in rainbow marker.\n\n“A sign?” Hana laughed, hugging them. “I’m not a stranger. I know all of you.”\n\n“That’s the joke,” Emma said. “Nine months ago, strangers met you here with a sign. Look how that turned out. We’re not letting some other family grab you at the last minute.”\n\nAt the counter, the agent smiled the professional morning smile.\n\n“May I see your passport?”\n\n“Here you are,” Hana said, sliding it over with both hands.\n\n“Portland to Tokyo. Window or aisle?”\n\n“Window, please. I want to watch this city until the very last second.”\n\nHer big suitcase rolled onto the scale. The number settled: twenty-three point zero.\n\n“Exactly at the limit,” the agent said, raising an eyebrow. “That’s professional packing.”\n\n“I had help. My friend sat on it.”\n\n“It’s true,” Emma said solemnly from behind her. “I regret nothing.”\n\nThe agent tagged the suitcase, and it slid away down the belt — the blue apron, the teacup, the painting, nine months of life, all traveling ahead of her.\n\nAnd then, walking toward security, it happened.\n\nAn announcement rolled through the hall — gate changes, boarding times, a name being paged — and Hana understood every single word without trying, the way you understand rain or music.\n\nShe stopped walking.\n\n“What’s wrong?” Carol asked.\n\n“Nine months ago, in this exact building, announcements were just noise,” Hana said slowly. “Beautiful, terrifying noise. I stood right there by that pillar, listening as hard as I could, and caught nothing. And now — I can’t NOT understand. When did that happen?”\n\n“While you weren’t looking,” Carol said. “That’s how all the best growing works. Nobody gave it to you, sweetheart. You earned it one day at a time.”\n\nAt the entrance to security, the goodbyes could not be delayed anymore.\n\nLeo went first. He opened his mouth for a joke, and nothing came out. He hugged her instead, hard, then stepped back and pointed at her bag.\n\n“Dictionary of Leo. Study chapter one on the plane. ‘No worries.’ You’ll need it — the group chat gets loud.”\n\n“No worries,” Hana said. “See? Fluent.”\n\nEmma held both her hands. “Text me when you land. Promise. Even if it’s three in the morning here. ESPECIALLY if it’s three in the morning.”\n\n“I promise. Cherry blossom season — my couch is yours.”\n\n“Already saving. Already planning the shop sign.”\n\nRosa took Hana’s face in her warm baker’s hands, the way she had on the night of the charity event.\n\n“Listen to me, sister cafe,” she said. “This isn’t an ending. This is Bluebird growing a second wing.” She pressed a small envelope into Hana’s coat pocket. “Open it on the plane. Not before. I’ll know.”\n\nThen the Millers. Carol hugged her so long that two separate announcements went by.\n\n“You came as a guest,” she said into Hana’s hair. “You leave as our kid. That’s just how it is now. Forever.”\n\nBen offered a fist bump, reconsidered halfway, and turned it into a real hug. “Growth choice,” he said, voice rough. “Told you.”\n\nMike was last. His eyes were shining dangerously. “I’m not crying,” he announced. “I’m just… hydrating in reverse.”\n\n“That’s your worst one ever,” Ben said.\n\n“It’s his best one,” Hana said, and hugged him, and for once Mike had absolutely nothing to add.\n\nShe stepped back and looked at them all standing together — her whole Portland, in one small crowd, under the departure board.\n\n“I’ll be back. That’s not a maybe,” she said. “There’s a key in my pocket and an apron in my suitcase that say so.”\n\n“Safe travels,” they called — all of them, raggedly, at the same time, like a family that had never once rehearsed anything.\n\nShe walked through security, collected her bag, and turned around one last time at the corner. They were still there, of course, waving like it was a competition. Emma had climbed onto a bench. The TEAM HANA sign bounced above the crowd.\n\nHana raised her hand, held it there for one long moment, and walked to her gate.\n\nAt boarding, the gate agent scanned her pass and glanced at her passport.\n\n“Portland to Tokyo. Heading home, or leaving home?”\n\nHana smiled at the question, because there it was again — the airport asking, nine months later, the mirror of the first question America had ever asked her.\n\n“Nine months ago, an officer asked me why I came. I was shaking. I said, ‘I’m here to study English.’”\n\n“And?” the agent asked, handing back her documents. “Mission complete?”\n\n“Mission complete,” Hana said. “And a new one beginning. So the honest answer is: both. Heading home, and leaving home. I have two now.”\n\n“That’s the best answer I’ll hear all week,” the agent said. “Your English is beautiful, by the way. Safe travels.”\n\nHana found her window seat and pressed her forehead to the cold glass. The sky over the airfield was turning pink. Somewhere behind the terminal glass, her people were driving home to a house where her name was on a key.\n\nThe engines rose. The runway slipped faster and faster beneath the wing, and then the wheels let go of America, gently, like a hand opening.\n\nAs Portland grew small and bright below her window, Hana took out her notebook, turned past nine months of crowded pages, and opened it to a clean white one.","glossary":[{"w":"departure","ja":"出発"},{"w":"jet-lagged","ja":"時差ぼけの"},{"w":"syrup","ja":"シロップ"},{"w":"paged","ja":"呼び出された"},{"w":"pillar","ja":"柱"},{"w":"terrifying","ja":"恐ろしい"},{"w":"scale","ja":"はかり"},{"w":"limit","ja":"重量制限"},{"w":"solemnly","ja":"真顔で"},{"w":"security","ja":"保安検査"},{"w":"envelope","ja":"封筒"},{"w":"reconsidered","ja":"考え直した"},{"w":"departure board","ja":"出発案内板"},{"w":"rehearsed","ja":"練習した"},{"w":"runway","ja":"滑走路"}],"phrases":[{"en":"May I see your passport?","ja":"パスポートを拝見できますか？"},{"en":"Window or aisle?","ja":"窓側と通路側どちらに？"},{"en":"Text me when you land.","ja":"着いたら連絡してね。"},{"en":"I’ll be back.","ja":"また戻ってくるからね。"},{"en":"Safe travels.","ja":"気をつけて行ってらっしゃい。"}],"quiz":[{"q":"Who could not come inside the airport?","c":["Mrs. Chen","Daisy","Ben","Leo"],"a":1},{"q":"What was different about the airport this time?","c":["Hana understood every announcement","The airport was brand new","Nobody came to see her off","Her flight was delayed"],"a":0},{"q":"Why did Hana say ‘I’ll be back’ with such confidence?","c":["Her ticket was round trip","She left her wallet in Portland","A key and an apron connected her to this place forever","Rosa ordered her to return"],"a":2}],"words":1174},{"id":100,"level":4,"emoji":"🌅","theme":"機内から、あなたへ","titleEn":"This Is Just the Beginning","titleJa":"これは、はじまりの物語","teaser":"帰りの機内で、ハナは九か月をふり返る。隣の席には緊張気味のおばあさん。そして最後のページは、あなたへ。","story":"The flight to Tokyo climbed through the morning clouds, and Portland slipped away beneath the wing.\n\nFor one long minute, Mt. Hood floated above the cloud sea, white and calm, like it had come to see her off. Hana watched it until it was gone.\n\n“Thank you,” she told it quietly. “For the quiet. And the answer.”\n\nIn the seat beside her sat a small, elderly Japanese woman, holding the meal card with both hands and studying it like a difficult exam. When the flight attendants began moving down the aisle, the woman leaned toward Hana and asked for help in soft, worried Japanese.\n\nHana smiled, because nine months ago, this had been her — same airline, same card, same racing heart.\n\n“You can do it yourself,” she answered gently. “I’ll teach you. It’s only two words. When she asks, just say: ‘Chicken, please.’”\n\nThe woman practiced under her breath, three times, holding the words like eggs.\n\nThe cart arrived. The attendant leaned in with a smile. “Would you like chicken or pasta?”\n\nA pause. A breath.\n\n“Chicken, please,” the woman said, loud and clear.\n\n“Great choice,” said the attendant, and set down the tray, and moved on, never knowing what she had just witnessed.\n\nThe woman turned to Hana with shining eyes, and Hana clapped silently, and just like that they were friends. Her name was Mrs. Ito. She had been visiting her son — thirty years in America, married, two children.\n\n“My grandchildren speak English first,” Mrs. Ito said. “Their Japanese is small, and my English is small. We meet in the middle with gestures and cookies. I want more than cookies. I want conversations.”\n\n“Then learn a little every day,” Hana said. “That’s the whole secret. One day at a time.”\n\n“Is that how you did it? Your English is wonderful. How long did it take?”\n\n“Nine months. But not big months. Small days.” Hana counted on her fingers. “One day I only learned how to ask for syrup. Another day, just the word ‘drizzle.’ Some days I cried and learned nothing except how to try again tomorrow. The days add up. Nobody notices growth while it’s happening — you only see it later, all at once, in an airport.”\n\nMrs. Ito nodded slowly, then asked the exact right question. “What should I learn first?”\n\n“The sentence that started everything for me.” Hana turned to face her. “Nice to meet you.”\n\n“Nice to meet you,” Mrs. Ito repeated, in careful English.\n\n“Again. With a smile this time.”\n\n“Nice to meet you.”\n\n“Perfect,” Hana said. “That was my first sentence in America. An immigration officer heard it nine months ago. It opens every door — because every friendship starts there.”\n\n“And my second sentence?” Mrs. Ito asked, pencil ready.\n\n“‘Could I get a small coffee?’ That one changed my life.”\n\nMrs. Ito wrote everything in her tiny notebook, and Hana had to look out the window, because some circles close so gently that your eyes fill before you notice.\n\nSomewhere over the ocean, she remembered the envelope.\n\nInside was a photograph and a card. The photo: April, Bluebird Cafe, a terrified girl in a too-big apron standing behind the register, smiling like a person on a rope bridge. Emma had clearly taken it in secret.\n\nThe card was in Rosa’s round, generous handwriting. Bluebird cinnamon rolls. The real recipe. For the sister oven. Add one secret of your own — that’s what makes it yours. — R.\n\n“Good news?” Mrs. Ito asked, offering a tissue.\n\n“The best kind,” Hana said, laughing and crying at once. “A recipe.”\n\nWhen the attendant passed again, she stopped. “Coming home, or leaving home? I always wonder, on this route.”\n\n“Both,” Hana said. “It’s a long story.”\n\n“It’s an eleven-hour flight. Those are the best kind.” But her cart was full, so she just smiled and left an extra cookie on Hana’s tray. “For the story, then.”\n\nMrs. Ito fell asleep over her tiny notebook. Hana tucked the thin airline blanket around her shoulders, turned on the small light, and opened her own notebook to the clean white page.\n\nShe wrote for a long time, while the plane chased the night. April: I landed with four sentences and a suitcase. An officer said welcome. A dog met me at a door and loved me immediately. May: A cafe took a chance on me. I dropped things. Kind people picked them up.\n\nJune: I got sick, got well, got braver. I lost a wallet and found out a whole street knew my name. July: The ocean. Fireworks. A power outage that turned into a family game night.\n\nAugust: I learned to run a register and to say my opinion out loud. My idea became a drink on a real menu. September: I hurt a friend by accident and learned the words to fix it. That might be the most important English I own.\n\nOctober: I wore a witch hat. I gave directions to strangers in a city that was once a maze to me. November: My sister saw my new life. My two worlds shook hands. I said thank you at a crowded table and meant it in two languages.\n\nDecember: A bake sale fed some neighbors. A newspaper learned my name. A question waited for me on a mountain, and the answer was home — home with everything I learned sewn into my pockets.\n\nShe looked at the page, then wrote one more line and circled it: The cafe will be small. The welcome will be huge. There will be a bluebird on the sign.\n\nMrs. Ito peeked over at the crowded page. “You write so much.”\n\n“I lived so much,” Hana said. “It needed somewhere to go.”\n\nHours later, the cabin lights warmed, and Japan rose out of the sea — winter fields, sharp mountains, a coastline she knew like a face.\n\nMrs. Ito woke and gasped softly at the window. “Home. Look at it. Will you forget your English now, over here?”\n\n“No,” Hana said. “I’m opening a cafe where both my languages live. English lessons with every latte, maybe. Slow speech is welcome. Mistakes are free.”\n\n“Then your story isn’t finished?”\n\n“No.” Hana smiled all the way. “This is just the beginning.”\n\nThe attendant collected the last cups, saw Hana’s face pressed to the window, and understood.\n\n“Nine months away, you said?” She bent lower and said it warmly, in English, like a gift: “Welcome home.”\n\nThe wheels touched down so softly that the whole cabin exhaled at once.\n\nWhile the plane rolled toward the terminal, Hana turned to the last page of her notebook — saved all year — and wrote a letter.\n\nTo you. Yes — you, the person who has walked all one hundred of these days with me.\n\nWe have never met, but we did this together. One hundred days ago, English was a wall for both of us. Then, story by story, day by day, the wall quietly became a door.\n\nLook at yourself now. You just read my whole letter — in English — and it felt natural. Please stop and notice that. Growth is shy. It hides until somebody points at it. I am pointing at it now.\n\nSo take your hundred days and build on them. Order the coffee. Ask the question. Make the mistake and laugh at it. Somewhere out there is your Bluebird — a warm room where strangers become family. Find it, or build it.\n\nMy little cafe is waiting to be born. Your next conversation is waiting too.\n\nNeither of us is finished. We are exactly where Hana was on her first morning: at a door, with a key.\n\nThank you for reading with me. Now — go and begin.","glossary":[{"w":"elderly","ja":"年配の"},{"w":"flight attendants","ja":"客室乗務員"},{"w":"witnessed","ja":"目撃した"},{"w":"gestures","ja":"身ぶり"},{"w":"immigration officer","ja":"入国審査官"},{"w":"envelope","ja":"封筒"},{"w":"generous","ja":"おおらかな"},{"w":"route","ja":"路線"},{"w":"tucked","ja":"かけ直した"},{"w":"power outage","ja":"停電"},{"w":"maze","ja":"迷路"},{"w":"sewn","ja":"縫い込まれた"},{"w":"coastline","ja":"海岸線"},{"w":"exhaled","ja":"息を吐いた"},{"w":"terminal","ja":"ターミナル"}],"phrases":[{"en":"Would you like chicken or pasta?","ja":"チキンとパスタ、どちらになさいますか？"},{"en":"One day at a time.","ja":"一日ずつ、少しずつ。"},{"en":"It’s a long story.","ja":"話せば長いんです。"},{"en":"Welcome home.","ja":"おかえりなさい。"},{"en":"This is just the beginning.","ja":"これはまだ、ほんの始まりだよ。"}],"quiz":[{"q":"Who sat next to Hana on the plane?","c":["Yui","A businessman","An elderly Japanese woman","Rosa"],"a":2},{"q":"How did Hana help Mrs. Ito?","c":["She gave her money","She carried her suitcase","She translated a movie","She taught her to order her meal in English"],"a":3},{"q":"What does the story tell the reader at the end?","c":["English is too difficult for most people","Your English grew too — this is just the beginning","The story continues tomorrow","Never make mistakes in English"],"a":1}],"words":1292}];/*__INJECT__*/

:"She received an award for exceptional customer service.","l":2},{"en":"numerous","ja":"多数の","pos":"形","ex":"We received numerous inquiries about the job opening.","l":2},{"en":"gradually","ja":"徐々に","pos":"副","ex":"The factory will gradually phase out the old models.","l":2},{"en":"temporarily","ja":"一時的に","pos":"副","ex":"The museum is temporarily closed for renovations.","l":2},{"en":"furthermore","ja":"さらに","pos":"副","ex":"The rent is low; furthermore, utilities are included.","l":2},{"en":"nevertheless","ja":"それでもなお","pos":"副","ex":"Sales fell; nevertheless, the company remained profitable.","l":2},{"en":"otherwise","ja":"さもなければ","pos":"副","ex":"Pay by Friday; otherwise, a late fee applies.","l":2},{"en":"on short notice","ja":"急な連絡で","pos":"熟","ex":"Thank you for covering my shift on short notice.","l":2},{"en":"in bulk","ja":"大量に","pos":"熟","ex":"Restaurants save money by ordering supplies in bulk.","l":2},{"en":"disposal","ja":"廃棄","pos":"名","ex":"Proper disposal of chemicals is required by law.","l":2},{"en":"hazard","ja":"危険要因","pos":"名","ex":"Loose cables are a safety hazard in the office.","l":2},{"en":"ordinance","ja":"条例","pos":"名","ex":"A city ordinance bans parking on this street.","l":2},{"en":"legislation","ja":"法律、立法","pos":"名","ex":"New legislation requires firms to report emissions annually.","l":2},{"en":"threshold","ja":"基準値","pos":"名","ex":"Noise levels must stay below the legal threshold.","l":2},{"en":"conservation","ja":"保全","pos":"名","ex":"The park promotes water conservation among visitors.","l":2},{"en":"enterprise","ja":"企業","pos":"名","ex":"The award honors one small enterprise each year.","l":2},{"en":"subsidiary","ja":"子会社","pos":"名","ex":"The bank opened a subsidiary in Singapore last year.","l":2},{"en":"stakeholder","ja":"利害関係者","pos":"名","ex":"Every stakeholder received a copy of the proposal.","l":2},{"en":"initiative","ja":"新構想","pos":"名","ex":"The recycling initiative was launched by the city.","l":2},{"en":"objective","ja":"目 ease proofread the brochure before it goes to print.","l":2},{"en":"compile","ja":"まとめる","pos":"動","ex":"The intern will compile the survey results into a report.","l":2},{"en":"solicit","ja":"求める","pos":"動","ex":"The city will solicit feedback from local residents.","l":2},{"en":"divert","ja":"迂回させる","pos":"動","ex":"Police will divert traffic during the marathon on Sunday.","l":2},{"en":"optimal","ja":"最適な","pos":"形","ex":"Store the medicine at the optimal temperature listed.","l":2},{"en":"residential","ja":"住宅の","pos":"形","ex":"The factory cannot operate in a residential area.","l":2},{"en":"municipal","ja":"市の、自治体の","pos":"形","ex":"The municipal government approved the new bus routes.","l":2},{"en":"accessible","ja":"利用しやすい","pos":"形","ex":"The archives are accessible to all registered members.","l":2},{"en":"competitive","ja":"競争力のある","pos":"形","ex":"The position offers a competitive salary and benefits.","l":2},{"en":"perishable","ja":"傷みやすい","pos":"形","ex":"All perishable items must be refrigerated during transport.","l":2},{"en":"obsolete","ja":"時代遅れの","pos":"形","ex":"The plant replaced its obsolete machinery last year.","l":2},{"en":"inclement","ja":"荒天の","pos":"形","ex":"The picnic was postponed due to inclement weather.","l":2},{"en":"attentive","ja":"気配りのある","pos":"形","ex":"The attentive waiter refilled our glasses without being asked.","l":2},{"en":"thorough","ja":"徹底的な","pos":"形","ex":"The mechanic performed a thorough inspection of the van.","l":2},{"en":"meanwhile","ja":"その間に","pos":"副","ex":"The chef prepared dessert; meanwhile, guests toured the kitchen.","l":2},{"en":"readily","ja":"容易に","pos":"副","ex":"Spare parts are readily available at authorized dealers.","l":2},{"en":"inadvertently","ja":"うっかり","pos":"副","ex":"The clerk inadvertently shipped the order to the wrong address.","l":2},{"en":"cordially","ja":"心を込めて","pos":"副","ex":"You are cordially invited to the retirement banquet.","l":2},{"en":"unanimously","ja":"全会一致で","pos":"副","ex":"The boa const TIPS=[
 {tag:"P5",t:"品詞問題は「空所の前後」だけで解く",b:"選択肢が同じ単語の品詞違い（-tion/-al/-ly等）なら文全体を読まない。冠詞と名詞の間なら形容詞、動詞の後ろなら副詞。10秒で解く練習を。",ex:"The team made a careful decision.（冠詞と名詞の間→形容詞）"},
 {tag:"P5",t:"前置詞 vs 接続詞は「後ろ」を見る",b:"後ろが名詞だけなら前置詞（during / despite / because of）、主語＋動詞の文が続くなら接続詞（while / although / because）。",ex:"During the meeting … / While we were meeting …"},
 {tag:"P5",t:"時制は「時を表す語句」が答えを教える",b:"yesterday→過去、since→現在完了、by the time→完了形。空所を見る前に文中の時のキーワードを探すと速い。"},
 {tag:"P5",t:"主語と動詞の「数の一致」を最初に確認",b:"主語と動詞の間の修飾句（of〜, who〜）に惑わされない。The list of items is … のように核になる名詞で判断する。"},
 {tag:"P5",t:"代名詞問題は「何を指すか」を前文から",b:"単数か複数か、人か物か、所有格か目的格か。指す相手を前の文から特定すれば機械的に解ける。its と it's の混同にも注意。"},
 {tag:"P5",t:"関係代名詞は「後ろの文の欠け」で選ぶ",b:"主語が欠けていれば who/which、目的語が欠けていれば whom/which、欠けがなければ whose＋名詞や where を疑う。"},
 {tag:"P5",t:"-ing と -ed の分詞は「する側／される側」",b:"修飾される名詞が動作をする側なら -ing、受ける側なら -ed。",ex:"an interesting book（本が興味を起こす側）/ an interested reader（読者は興味を持たされる側）"},
 {tag:"P5",t:"raise/rise・lay/lie は目的語の有無で選ぶ",b:"他動詞 raise/lay は目的語が必要、自動詞 rise/lie は不要。",ex:"raise prices（値上げする）/ prices rise（価格が上がる）"},
 {tag:"P5",t:"another / other / the other の使い分け",b:"another＋単数、other＋複数、the other＝残りの一つ。others は代名詞として単独で使う。"},
 {tag:"P5",t:"few / little は可算・不可算で選ぶ",b:"few＋数えられる複数名詞、little＋数えられない名詞。a few / a little は「少しある」、無冠詞の few / little は「ほとんどない」。"},
 {tag:"P5",t:"however は文と文をつなげない",b:"2つの文をつなぐのは接続詞。However / Therefore / Moreover は接続副詞なので、ピリオドやセミコロンの後で使う。この区別はPart5の定番。"},
 {tag:"P5",t:"語彙問題はコロケーション（相性）で覚える",b:"meet a deadline, place an order, address an issue のように「セット」で暗記するのが最短ルート。出会うたび📒ノートへ。"},
 {tag:"P2",t:"冒頭の疑問詞だけは絶対に聞き取る",b:"Who/What/When/Where/Why/How が聞ければ半分解けたも同然。When の質問に場所で答える選択肢は即除外できる。"},
 {tag:"P2",t:"「わかりません」系の応答はよく正解になる",b:"I'm not sure. / He hasn't decided yet. / Let me check. のような間接的な答えが正答になりやすい。素直すぎる応答はむしろワナ。"},
 {tag:"P2",t:"似た音の単語はワナ",b:"問題文の copy に対して coffee のように、音が似ているだけの選択肢はほぼ不正解。意味のつながりで選ぶ。"},
 {tag:"P2",t:"Yes/No で始まらない正解に慣れる",b:"Do you 〜? への「Actually, I'm off tomorrow.」のように、Yes/No を飛ばした自然な応答が正解になることが多い。"},
 {tag:"P2",t:"選択疑問文（A or B?）に Yes/No は不正解",b:"or が聞こえたら、どちらかを選ぶ・両方・どちらでもない、が正解候補。Yes で始まる選択肢は切ってよい。"},
 {tag:"P2",t:"否定疑問文・付加疑問文は「事実」で答える",b:"Don't you 〜? と聞かれても、行くなら Yes。日本語の「はい／いいえ」と逆になる感覚に注意する。"},
 {tag:"P2",t:"提案・依頼の定番セットをストックする",b:"Why don't we 〜? / Could you 〜? / How about 〜? への定番応答（Sounds good. / Sure, no problem.）をセットで暗記しておく。"},
 {tag:"P2",t:"迷ったら3秒で切り替える",b:"迷って次の問題の冒頭疑問詞を聞き逃すほうが損。マークしたら忘れて次へ。Part2はリズムがすべて。"},
 {tag:"P3·4",t:"設問の先読みがリスニングの9割",b:"音声が始まる前に設問3つに目を通し、「誰が・何を・次に何を」の聞きどころを決めておく。設問を読むのは音声中ではなく音声前。"},
 {tag:"P3·4",t:"正解は本文の「言い換え」でできている",b:"音声の buy が選択肢では purchase になるように、同じ単語ではなく言い換えが正解。同義語のストックがそのままスコアになる。"},
 {tag:"P3·4",t:"話者の意図問題は「直後の展開」がヒント",b:"Why does the man say …? は文字通りの意味ではなく、その発言の役割（提案・心配・冗談）を選ぶ。直後の相手の反応を聞く。"},
 {tag:"P3·4",t:"場所・職業は冒頭2文で判明する",b:"会話のセッティングは最初に示される。冒頭を聞き逃したらその設問は潔く捨てて、次の聞きどころに集中する。"},
 {tag:"P3·4",t:"図表問題は「図にない情報」を聞く",b:"選択肢が図に載っている語なら、音声では別の手がかり（価格・時間など）で指定される。図と設問を先に見ておくこと。"},
 {tag:"P3·4",t:"数字・曜日・時刻は途中で変更される",b:"「最初10時→やっぱり11時に」のような訂正パターンが頻出。あとに言われたほうが正解になりやすい。"},
 {tag:"P3·4",t:"Part4は「アナウンスの型」を知る",b:"留守電・機内放送・店内放送・スピーチには決まった流れがある。目的→詳細→次の行動、の順で聞くと迷子にならない。"},
 {tag:"P3·4",t:"シャドーイングが最強のリスニング対策",b:"音の連結（get up→ゲラップ）は知らないと聞こえない。本アプリの🗣まねるモードで毎日10分、口から作るのが近道。"},
 {tag:"P7",t:"設問を先に読み、本文は「探し読み」する",b:"全文を読んでから解くのは時間切れのもと。設問のキーワード（日付・人名・数字）を本文からスキャンする。"},
 {tag:"P7",t:"NOT問題は消去法で解く",b:"「本文に書かれていないものはどれ？」は、書かれている3つに印をつけて残った1つを選ぶのが確実。"},
 {tag:"P7",t:"複数文書問題には「またぎ問題」が必ずある",b:"2つの文書の情報を組み合わせて解く設問が1〜2問混ざる。片方だけで即答できないときは、もう片方の文書を見る合図。"},
 {tag:"P7",t:"同義語問題は「その文脈での意味」を選ぶ",b:"address の言い換えは文脈次第で deal with にも speak to にもなる。該当する行の前後だけ読み直せば十分。"},
 {tag:"P7",t:"1問1分ペースを体で覚える",b:"Part7は54問で約55分。速読力＝WPMがそのままスコアに直結する。本アプリの🚀速読チャレンジでWPM150を目指そう。"},
 {tag:"P7",t:"チラシ・請求書は「読む」より「見る」",b:"日付・金額・連絡先など、設問に聞かれた項目だけをピンポイントで探す。隅々まで読む文書ではない。"},
 {tag:"P7",t:"文挿入問題は代名詞と接続語が鍵",b:"挿入する文の this / they / however が何を受けるかを考えると、入る位置がひとつに決まる。"},
 {tag:"P7",t:"メール問題は「目的」と「依頼」を押さえる",b:"第1段落に書く目的、最終段落に依頼や次の行動が来るのが定石。設問もほぼこの2点を聞いてくる。"},
 {tag:"P1",t:"Part1は「進行形の受動態」に注意",b:"is being displayed（陳列されている最中）は人が動かしていないと不正解。状態を表す is displayed との区別が頻出。"},
 {tag:"P1",t:"写真にない物の単語が聞こえたら不正解",b:"1語でも写真に存在しない名詞が出たら、その選択肢は切ってよい。消去法がPart1の基本。"},
 {tag:"P1",t:"位置関係の前置詞をまとめて覚える",b:"next to / in front of / behind / lean against / stack / in a row は毎回出る。写真を見たら位置関係を英語でつぶやく癖を。"},
 {tag:"P1",t:"人物写真は「動作」、風景写真は「状態」",b:"人がいれば wearing / holding などの進行形、物だけなら has been placed などの状態表現が正解になりやすい。"},
 {tag:"P6",t:"Part6の文挿入は前後のつながりで",b:"空所前後の文の代名詞・時制・話の流れに合うものを選ぶ。接続副詞（However / In addition）が大ヒントになる。"},
 {tag:"P6",t:"Part6の時制は文書全体から判断する",b:"1文だけでは決められない。文書の日付や前後の文の時制に合わせて選ぶ。Part5の感覚で解くと落とし穴。"},
 {tag:"語彙",t:"「無料」は free 以外の形で出る",b:"complimentary（無料の）、at no charge、free of charge。ホテル・機内・イベントの文脈で頻出する。",ex:"Breakfast is complimentary for all guests."},
 {tag:"語彙",t:"お金を「返す」動詞を区別する",b:"refund（返金する）、reimburse（立替分を精算する）、compensate（補償する）。経費精算は reimbursement が定番。"},
 {tag:"語彙",t:"「〜までに」は by、「〜まで」は until",b:"期限の by（提出物）と継続の until（営業時間）。no later than（遅くとも〜までに）もPart5/7で頻出。",ex:"Submit the form by Friday. / The store is open until 9 p.m."},
 {tag:"語彙",t:"available は万能語",b:"人なら「手が空いている」、物なら「入手できる」、部屋なら「空いている」。TOEIC最頻出級の単語なので文脈で訳し分ける。"},
 {tag:"語彙",t:"動詞＋前置詞のセットで覚える",b:"comply with（従う）、result in（〜につながる）、account for（占める・説明する）、apply for（申し込む）。前置詞ごと📒ノートへ。"},
 {tag:"語彙",t:"求人広告の定番5語",b:"applicant（応募者）、qualification（資格）、requirement（要件）、preferred（あれば尚可）、proficiency（熟達）。この5語で求人文書は読める。"},

const KEY="hana100_v1";
let S=null;
function defState(){ return {v:1,start:null,onboarded:false,xp:0,words:0,quizPerfect:0,quizC:0,quizT:0,listens:0,rereads:0,bestWpm:0,maxStreak:0,revTotal:0,seq:1,wpmLog:[],notes:[],eps:{},days:{},badges:{},set:{theme:"light",fs:19,serif:true,rate:0.9,voice:"",teaser:true,hl:true,revDir:"en"}}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.v){ const d=defState(); const set=Object.assign(d.set,s.set||{}); const m=Object.assign(d,s); m.set=set; return m; } }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast("⚠️ 保存に失敗しました"); } }
S=load()||defState();

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const PRM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const fmt=n=>Number(n).toLocaleString("ja-JP");
function pad2(n){ return (n<10?"0":"")+n; }
function dstr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function addDays(ds,n){ const p=ds.split("-"); const d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return dstr(d); }
function diffDays(a,b){ const pa=a.split("-"),pb=b.split("-"); return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2])-new Date(+pa[0],+pa[1]-1,+pa[2]))/864e5); }
function epById(id){ return EPISODES.find(e=>e.id===id); }
function doneCount(){ return Object.values(S.eps).filter(r=>r.done).length; }
function doneThrough(n){ for(let i=1;i<=n;i++){ if(!(S.eps[i]&&S.eps[i].done)) return false; } return true; }
function dayNumber(){ if(!S.start) return 1; return diffDays(S.start,todayStr())+1; }
function streak(){ let d=todayStr(); if(!S.days[d]) d=addDays(d,-1); let c=0; while(S.days[d]){ c++; d=addDays(d,-1); } return c; }
function level(){ return Math.max(1,Math.floor(Math.sqrt(S.xp/80))+1); }
function lvTitle(){ return LV_TITLES[Math.min(LV_TITLES.length-1,level()-1)]; }
function lvNextXp(){ const l=level(); return 80*l*l; }
function lvPrevXp(){ const l=level(); return 80*(l-1)*(l-1); }
function nextEpId(){ for(let i=1;i<=EPISODES.length;i++){ if(!(S.eps[i]&&S.eps[i].done)) return i; } return null; }
function todayHasActivity(){ return !!S.days[todayStr()]; }
function sentences(p){ return (p.match(/[^.!?…]+[.!?…]+[”’"']*\s*|[^.!?…]+$/g)||[p]).map(s=>s.trim()).filter(Boolean); }
function allSentences(ep){ const out=[]; ep.story.split(/\n+/).forEach(p=>{ sentences(p).forEach(s=>out.push(s)); }); return out; }

function addNote(o){ if(noteExists(o.ty,o.en)) return false;

/* ================= activity / rewards ================= */
let pendingMilestone=null;
function addActivity(words,xp){
  const t=todayStr();
  if(!S.days[t]) S.days[t]={w:0,xp:0};
  S.days[t].w+=words; S.days[t].xp+=xp;
  const before=S.words;
  S.words+=words; S.xp+=xp;
  const st=streak(); if(st>S.maxStreak) S.maxStreak=st;
  for(const m of MILESTONES){ if(before<m&&S.words>=m){ pendingMilestone=m; } }
  checkBadges(); save(); updateDayChip();
}
let toastQ=[];
function checkBadges(){
  for(const b of BADGES){ if(!S.badges[b.id]&&b.f()){ S.badges[b.id]=todayStr(); toastQ.push("🏅 バッジ獲得！ "+b.e+" "+b.n); } }
}
function flushToasts(){ let i=0; for(const m of toastQ){ setTimeout(()=>toast(m),600+i*1200); i++; } toastQ=[]; if(pendingMilestone){ const m=pendingMilestone; pendingMilestone=null; setTimeout(()=>{ confetti(); toast("🎉 総語数 "+fmt(m)+"語 達成！",4000); },900); } }
function toast(msg,ms){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; $("toasts").appendChild(d); setTimeout(()=>{ d.style.transition="opacity var(--dur-2) var(--ease-out)"; d.style.opacity="0"; setTimeout(()=>d.remove(),300); },ms||2600); }
function toastAction(msg,label,fn){ const d=document.createElement("div"); d.className="toast act"; d.textContent=msg;
  const b=document.createElement("button"); b.className="ta"; b.textContent=label;
  b.onclick=()=>{ fn(); d.remove(); }; d.appendChild(b); $("toasts").appendChild(d);
  setTimeout(()=>{ d.style.transition="opacity var(--dur-2) var(--ease-out)"; d.style.opacity="0"; setTimeout(()=>d.remove(),300); },6000); }

/* ================= TTS ================= */
const TTS={
  all:[],en:[],
  init(){ const f=()=>{ TTS.all=speechSynthesis.getVoices(); TTS.en=TTS.all.filter(v=>/^en/i.test(v.lang)); }; f(); if(typeof speechSynthesis!=="undefined") speechSynthesis.onvoiceschanged=f; },
  pick(){ if(S.set.voice){ const v=TTS.all.find(v=>v.name===S.set.voice); if(v) return v; }
    const pref=["Samantha","Ava","Allison","Zoe","Karen","Daniel","Google US English","Aaron"];
    for(const p of pref){ const v=TTS.en.find(v=>v.name.indexOf(p)>=0); if(v) return v; }
    return TTS.en[0]||null; },
  speak(text,rate,onend){ if(typeof speechSynthesis==="undefined"){ if(onend)onend(); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); const v=TTS.pick();
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
    u.rate=rate||S.set.rate; u.pitch=1;
    if(onend){ u.onend=onend; u.onerror=onend; }
    speechSynthesis.speak(u); },
  stop(){ if(typeof speechSynthesis!=="undefined") speechSynthesis.cancel(); }
};
TTS.init();
function speakBtn(text){ TTS.speak(text,S.set.rate,null); }

function heatmapHTML(weeks){
  const t=todayStr();
  const dow=(new Date().getDay()+6)%7; // Mon=0
  const cells=[], startMon=addDays(t,-dow-(weeks-1)*7);
  for(let w=0;w<weeks;w++){ for(let r=0;r<7;r++){ const d=addDays(startMon,w*7+r); if(diffDays(d,t)<0){ cells.push('<i style="opacity:.25"></i>'); continue; }
    const rec=S.days[d]; let c=""; if(rec){ const wd=rec.w; c=wd>=1500?"h4":wd>=900?"h3":wd>=400?"h2":"h1"; }
    cells.push('<i class="'+c+'" title="'+d+(rec?(" "+fmt(rec.w)+"語"):"")+'"></i>'); } }
  return '<div class="heat">'+cells.join("")+'</div><div style="font-size:10.5px;color:var(--tx2);font-weight:700;margin-top:8px">うすい→こい = その日に読んだ語数</div>';
}

function weekbarsHTML(){
  const t=todayStr(); const dow=(new Date().getDay()+6)%7;
  const mon=addDays(t,-dow); const weeks=[];
  for(let i=7;i>=0;i--){ const ws=addDays(mon,-7*i); let sum=0; for(let d=0;d<7;d++){ const r=S.days[addDays(ws,d)]; if(r) sum+=r.w; } weeks.push({ws,sum}); }
  const max=Math.max(1,...weeks.map(w=>w.sum));
  return '<div class="weekbars">'+weeks.map(w=>'<div class="wb"><i style="height:'+Math.max(2,Math.round(w.sum/max*100))+'%"></i><b>'+w.ws.slice(5).replace("-","/")+'</b></div>').join("")+'</div>'
   +'<div style="font-size:10.5px;color:var(--tx2);font-weight:700;margin-top:8px;text-align:right">今週: '+fmt(weeks[weeks.length-1].sum)+'語</div>';
}
function drawWpm(){
  const cv=$("wpmchart"); if(!cv) return; const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext("2d"); x.scale(dpr,dpr);
  const data=S.wpmLog.slice(-40).map(d=>d.wpm);
  const min=Math.min(...data)-10, max=Math.max(...data)+10;
  const px=i=>28+(W-40)*(data.length===1?0:i/(data.length-1));
  const py=v=>H-18-(H-34)*((v-min)/(max-min||1));
  const cs=getComputedStyle(document.body);
  x.strokeStyle=cs.getPropertyValue("--line"); x.lineWidth=1;
  x.beginPath(); x.moveTo(28,py(min+10)); x.lineTo(W-8,py(min+10)); x.stroke();
  x.strokeStyle=cs.getPropertyValue("--ac").trim()||"#e8890c"; x.lineWidth=2.5; x.lineJoin="round"; x.beginPath();
  data.forEach((v,i)=>{ i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)); }); x.stroke();
  x.fillStyle=x.strokeStyle; data.forEach((v,i)=>{ x.beginPath(); x.arc(px(i),py(v),3,0,7); x.fill(); });
  x.fillStyle=cs.getPropertyValue("--tx2"); x.font="700 10px sans-serif";
  x.fillText(Math.round(max-10)+"",2,py(max-10)+4); x.fillText(Math.round(min+10)+"",2,py(min+10)+4);
  x.fillText("最初",28,H-4); x.fillText("最近",W-34,H-4);
}

function switchListen(on){ TTS.stop(); R.playing=false; playToken++; R.mode=on?"listen":"read"; updatePlayBtn(); renderReadFoot(); if(!on) clearCur(); }
function toggleShadow(btn){ R.shadow=!R.shadow; btn.classList.toggle("on",R.shadow); toast(R.shadow?"🗣 シャドーイングモード: 各文のあとに「まねして言う」時間ができます":"シャドーイングOFF"); }
function clearCur(){ document.querySelectorAll(".sent.cur").forEach(s=>s.classList.remove("cur")); }
function flashSent(i){ clearCur(); const el=document.querySelector('.sent[data-i="'+i+'"]'); if(el){ el.classList.add("cur"); setTimeout(()=>el.classList.remove("cur"),1800); } }
function markCur(i){ clearCur(); const el=document.querySelector('.sent[data-i="'+i+'"]'); if(el){ el.classList.add("cur"); el.scrollIntoView({block:"center",behavior:PRM()?"auto":"smooth"}); } const p=$("pprog"); if(p) p.textContent=(i+1)+"/"+R.sents.length; }
function updatePlayBtn(){ const b=$("playbtn"); if(b) b.textContent=R.playing?"⏸":"▶"; }
function togglePlay(){ if(R.playing){ R.playing=false; playToken++; TTS.stop(); } else { R.playing=true; playFrom(R.sentIdx); } updatePlayBtn(); }
function playStep(d){ R.sentIdx=Math.min(R.sents.length-1,Math.max(0,R.sentIdx+d)); if(R.playing) playFrom(R.sentIdx); else markCur(R.sentIdx); }
function playFrom(i){
  R.sentIdx=i; R.playing=true; updatePlayBtn(); markCur(i);
  const tk=++playToken; const text=R.sents[i];
  TTS.speak(text,S.set.rate,()=>{
    if(tk!==playToken||!R||!R.playing) return;
    const go=()=>{ if(tk!==playToken||!R||!R.playing) return;
      if(i+1<R.sents.length){ playFrom(i+1); } else { R.playing=false; updatePlayBtn(); listenComplete(); } };
    if(R.shadow){ const w=text.split(/\s+/).length; setTimeout(go,500+w*440/S.set.rate); } else setTimeout(go,280);
  });
}
function listenComplete(){
  if(R.listenCredited) return; R.listenCredited=true;
  S.listens++; const rec=S.eps[R.ep.id]||(S.eps[R.ep.id]={reads:0,listens:0}); rec.listens=(rec.listens||0)+1;
  addActivity(R.ep.words,30);
  confetti(); toast("🎧 リスニング完走！ +"+fmt(R.ep.words)+"語 · +30XP",3200); flushToasts();
  if(!rec.done){ switchListen(false); setTimeout(()=>toast("仕上げに「✓ 読み終わった」を押すと、クイズとフレーズに進めます",4600),3400); }

/* --- finish reading → quiz → phrases → done --- */
function finishReading(){
  TTS.stop(); R.playing=false; playToken++;
  const dur=(Date.now()-R.t0)/1000;
  let wpm=null;
  if(dur>=90&&dur<=2700){ const w=Math.round(R.ep.words/(dur/60)); if(w<=400) wpm=w; }
  R.dur=dur; R.wpm=wpm;
  if(!R.readCommitted){
    R.readCommitted=true;
    const rec=S.eps[R.ep.id]||(S.eps[R.ep.id]={reads:0,listens:0});
    const first=!rec.done;
    rec.done=true; rec.reads=(rec.reads||0)+1;
    if(first) rec.first=todayStr(); else S.rereads++;
    if(wpm){ if(!rec.bestWpm||wpm>rec.bestWpm) rec.bestWpm=wpm; if(wpm>S.bestWpm) S.bestWpm=wpm; S.wpmLog.push({d:todayStr(),ep:R.ep.id,wpm}); if(S.wpmLog.length>200) S.wpmLog=S.wpmLog.slice(-200); }
    R.xpRead=first?50:25;
    R.fastWin=!!(R.fastTarget&&wpm&&wpm>R.fastTarget);
    if(R.fastWin) R.xpRead+=15;
    addActivity(R.ep.words,R.xpRead);
  }
  R.step="quiz"; R.quizIdx=0; R.quizScore=0; renderQuiz();
}

   +'<div id="qnext" style="margin-top:14px"></div>';

function answer(btn,i){
  if(R.answered) return; R.answered=true;

  document.querySelectorAll(".qc").forEach(b=>{ const bi=+b.dataset.i; if(bi===q.a) b.classList.add("ok"); else if(bi===i) b.classList.add("ng"); b.style.pointerEvents="none"; });
  $("qnext").innerHTML='<div style="font-size:14px;font-weight:800;margin-bottom:10px">'+(ok?"⭕ せいかい！ +10XP":"❌ ざんねん… 正解は「"+["A","B","C","D"][q.a]+"」")+'</div>'

function nextQuiz(){
  if(R.quizIdx+1<R.ep.quiz.length){ R.quizIdx++; renderQuiz(); return; }
  if(!R.quizCommitted){
    R.quizCommitted=true;
    const rec=S.eps[R.ep.id]; if(!rec.quizBest||R.quizScore>rec.quizBest) rec.quizBest=R.quizScore;
    let xp=R.quizScore*10; const perfect=R.quizScore===R.ep.quiz.length;
    if(perfect){ xp+=20; S.quizPerfect++; }

/* ================= confetti ================= */
function confetti(){
  if(PRM()) return;
  const cv=$("confetti"); const dpr=window.devicePixelRatio||1;
  cv.style.display="block"; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const x=cv.getContext("2d"); x.scale(dpr,dpr);
  const colors=["#e8890c","#f6c04b","#2f8f83","#3d8fd4","#9163cf","#d64545","#5f9e3a"];
  const ps=[]; for(let i=0;i<110;i++){ ps.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*0.5,vx:(Math.random()-0.5)*2.4,vy:2.2+Math.random()*3.4,s:5+Math.random()*6,c:colors[i%colors.length],r:Math.random()*6.28,vr:(Math.random()-0.5)*0.3}); }
  const t0=Date.now();
  (function loop(){ const t=Date.now()-t0;
    x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); x.restore(); }
    if(t<1900){ requestAnimationFrame(loop); } else { cv.style.display="none"; } })();
}

/* ================= boot ================= */
document.body.dataset.theme=S.set.theme;
render();
if(!S.onboarded&&EPISODES.length){ onboarding(0); }
</script>
