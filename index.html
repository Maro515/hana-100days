<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E">
<title>ハナの100日 — 英語多読ドラマ</title>
<style>
/* Hallmark · audit-fix 2026-07-25 · tokens: contrast-pass (19/19 ≥4.5:1) · states: focus-visible + hover · motion: named easings + prefers-reduced-motion */
:root{ --max:640px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
  --font-display:Georgia,"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-1:120ms; --dur-2:240ms; --dur-3:600ms; }
body[data-theme="light"]{ --bg:#f7f2e9; --bg2:#fffdf8; --bg3:#f1ead9; --tx:#33302a; --tx2:#6b6353; --line:#e6ddc9; --ac:#b45f00; --ac-bright:#e8890c; --ac-hover:#9c5200; --on-ac:#fff; --ac-tx:#8f4d00; --teal:#21756a; --teal-hover:#1b635a; --on-teal:#fff; --red:#c22f2f; --bg3-hover:#e9e0c9; --shadow:0 2px 10px rgba(90,70,30,.08); }
body[data-theme="sepia"]{ --bg:#efe5cd; --bg2:#f9f1dd; --bg3:#e8dcbe; --tx:#3d3426; --tx2:#6a5f45; --line:#ddd0b0; --ac:#a35300; --ac-bright:#c97a08; --ac-hover:#8d4800; --on-ac:#fff; --ac-tx:#7c4300; --teal:#1f6f64; --teal-hover:#195c53; --on-teal:#fff; --red:#c22f2f; --bg3-hover:#dfd2ae; --shadow:0 2px 10px rgba(80,60,20,.10); }
body[data-theme="dark"]{ --bg:#15171b; --bg2:#1e2126; --bg3:#262a30; --tx:#e7e4de; --tx2:#8f9299; --line:#32363d; --ac:#f0a43c; --ac-bright:#f0a43c; --ac-hover:#f6b45c; --on-ac:#241703; --ac-tx:#f0a43c; --teal:#4fb3a5; --teal-hover:#5fc2b4; --on-teal:#0d2320; --red:#c22f2f; --bg3-hover:#2d323a; --shadow:0 2px 10px rgba(0,0,0,.35); }
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ height:100%; }
body{ background:var(--bg); color:var(--tx); font-family:var(--font-ui); min-height:100%; transition:background-color var(--dur-2) var(--ease-out); }
body.lock{ overflow:hidden; }
button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
h1,h2,h3{ font-weight:700; }
.wrap{ max-width:var(--max); margin:0 auto; padding:0 16px; }
/* header */
#hdr{ position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
#hdr .wrap{ display:flex; align-items:center; gap:10px; height:54px; }
#hdr .logo{ font-size:19px; font-weight:700; letter-spacing:.02em; font-family:var(--font-display); }
#hdr .logo small{ display:block; font-size:10px; font-weight:600; color:var(--tx2); letter-spacing:.08em; }
#hdr .day{ margin-left:auto; font-size:12px; font-weight:700; color:var(--ac-tx); background:var(--bg3); border:1px solid var(--line); padding:5px 10px; border-radius:99px; }
#hdr .gear{ font-size:20px; padding:6px; }
/* main + tabbar */
#main{ padding:18px 0 96px; }
#tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
#tabbar .wrap{ display:flex; }
#tabbar button{ flex:1; padding:9px 0 7px; font-size:11px; font-weight:700; color:var(--tx2); display:flex; flex-direction:column; align-items:center; gap:2px; }
#tabbar button span{ font-size:21px; }
#tabbar .icn{ width:22px; height:22px; }
.icn{ display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icn.s{ display:inline-block; width:17px; height:17px; vertical-align:-3px; margin-right:5px; }
#tabbar button.on{ color:var(--ac-tx); }
/* cards */
.card{ background:var(--bg2); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
.sec-title{ font-size:13px; font-weight:800; color:var(--tx2); letter-spacing:.06em; margin:20px 0 10px; }
/* hero */
.hero{ position:relative; overflow:hidden; padding:26px 20px 24px; }
.hero .lvchip{ display:inline-block; font-size:11px; font-weight:800; padding:3px 10px; border-radius:99px; margin-bottom:8px; border:1px solid transparent; }
.hero .epno{ font-size:12px; font-weight:800; color:var(--tx2); margin-left:8px; }
.hero .bigemoji{ position:absolute; right:6px; top:2px; font-size:74px; opacity:.16; transform:rotate(8deg); }
.hero h2{ font-size:23px; line-height:1.45; margin:2px 0 1px; font-family:var(--font-display); font-weight:700; }
.hero .en{ font-size:13px; color:var(--tx2); font-weight:600; margin-bottom:8px; }
.hero .theme{ display:inline-block; font-size:12px; font-weight:700; background:var(--bg3); border:1px solid var(--line); border-radius:99px; padding:4px 10px; margin-bottom:8px; }
.hero .teaser{ font-size:13.5px; line-height:1.75; color:var(--tx); opacity:.9; margin-bottom:12px; }
.hero .meta{ font-size:12px; color:var(--tx2); font-weight:600; margin-bottom:12px; }
.btn{ display:inline-block; background:var(--ac); color:var(--on-ac); font-size:15px; font-weight:800; padding:12px 22px; border-radius:99px; box-shadow:0 3px 10px color-mix(in srgb, var(--ac) 40%, transparent); transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out); }
.btn:active{ transform:scale(.96); }
.btn2{ display:inline-block; background:var(--bg3); color:var(--tx); font-size:13px; font-weight:700; padding:10px 16px; border-radius:99px; border:1px solid var(--line); transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out); }
.btn2:active{ transform:scale(.96); }
.btn.full,.btn2.full{ display:block; width:100%; text-align:center; }
.donebanner{ display:flex; align-items:center; gap:10px; background:color-mix(in srgb, var(--teal) 12%, var(--bg2)); border:1px solid color-mix(in srgb, var(--teal) 35%, var(--line)); border-radius:14px; padding:10px 14px; font-size:13.5px; font-weight:700; margin-bottom:14px; }
/* stat chips */
.statrow{ display:flex; gap:10px; margin:16px 0 22px; }
.stat{ flex:1; background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:12px 8px; text-align:center; box-shadow:var(--shadow); }
.stat:first-child{ flex:1.25; border-color:color-mix(in srgb, var(--ac-bright) 45%, var(--line)); }
.stat:first-child .v{ font-size:23px; }
.stat .v{ font-size:19px; font-weight:800; word-break:keep-all; }
.stat .k{ font-size:10.5px; font-weight:700; color:var(--tx2); margin-top:2px; word-break:keep-all; }
/* milestone bar */
.bar{ height:12px; background:var(--bg3); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
.bar i{ display:block; height:100%; background:linear-gradient(90deg, var(--ac-bright), #f6c04b); border-radius:99px; transition:width var(--dur-3) var(--ease-out); }
.bar.teal i{ background:linear-gradient(90deg, var(--teal), #6fd0c2); }
.barlabel{ display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; color:var(--tx2); margin-top:6px; }
/* phrase of day */
.pod .en{ font-size:17px; font-weight:800; line-height:1.5; }
.pod .ja{ font-size:13px; color:var(--tx2); font-weight:600; margin-top:4px; }
.spk{ font-size:18px; background:var(--bg3); border:1px solid var(--line); border-radius:99px; width:38px; height:38px; flex:none; }
/* heatmap */
.heat{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px; justify-content:start; }
.heat i{ width:13px; height:13px; border-radius:3.5px; background:var(--bg3); border:1px solid var(--line); }
.heat i.h1{ background:#f7d9a8; border-color:#eec27f;} .heat i.h2{ background:#f3b45d; border-color:#e69d3b;}
.heat i.h3{ background:#e8890c; border-color:#c9760a;} .heat i.h4{ background:#b25f02; border-color:#8f4c02;}
body[data-theme="dark"] .heat i.h1{ background:#4a3a1e; border-color:#5c4826;}
/* library */
.lvhead{ display:flex; align-items:baseline; gap:8px; margin:22px 0 10px; }
.lvhead .dot{ width:12px; height:12px; border-radius:99px; flex:none; align-self:center; }
.lvhead h3{ font-size:15px; }
.lvhead small{ font-size:11.5px; color:var(--tx2); font-weight:700; margin-left:auto; }
.epcard{ display:flex; align-items:center; gap:12px; background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px; box-shadow:var(--shadow); cursor:pointer; }
.epcard:active{ transform:scale(.985); }
.epcard .em{ font-size:26px; flex:none; width:36px; text-align:center; }
.epcard .tt{ flex:1; min-width:0; }
.epcard .tt .ja{ font-size:14.5px; font-weight:700; line-height:1.35; }
.epcard .tt .sub{ font-size:11px; color:var(--tx2); font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.epcard .st{ flex:none; text-align:right; font-size:11px; color:var(--tx2); font-weight:700; line-height:1.5; }
.epcard.next{ border-color:var(--ac); box-shadow:0 0 0 2px color-mix(in srgb, var(--ac) 30%, transparent), var(--shadow); }
.epcard.next .st{ color:var(--ac-tx); }
.stars{ color:var(--ac-tx); letter-spacing:1px; }
/* stats view */
.badges{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
.badge{ background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:10px 6px; text-align:center; box-shadow:var(--shadow); }
.badge .e{ font-size:26px; } .badge .n{ font-size:11px; font-weight:800; margin-top:4px; } .badge .d{ font-size:9.5px; color:var(--tx2); font-weight:600; margin-top:2px; line-height:1.4; }
.badge.lock{ opacity:.42; filter:grayscale(1); }
canvas.chart{ width:100%; height:150px; }
.weekbars{ display:flex; gap:8px; align-items:flex-end; height:110px; }
.weekbars .wb{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.weekbars .wb i{ display:block; width:70%; background:linear-gradient(180deg,#f6c04b,var(--ac)); border-radius:6px 6px 2px 2px; min-height:2px; }
.weekbars .wb b{ font-size:9px; color:var(--tx2); font-weight:700; }
.kv{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px dashed var(--line); }
.kv:last-child{ border-bottom:none; }
.kv b{ font-weight:800; }
.kv span{ color:var(--tx2); font-weight:600; }
/* reader overlay */
#reader{ position:fixed; inset:0; z-index:40; background:var(--bg); display:none; flex-direction:column; }
#reader.show{ display:flex; animation:up .28s ease; }
@keyframes up{ from{ transform:translateY(30px); opacity:0;} to{ transform:none; opacity:1;} }
#rhdr{ flex:none; display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--bg2); }
#rhdr .back{ font-size:22px; padding:4px 8px; }
#rhdr .info{ flex:1; min-width:0; font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#rhdr .info small{ display:block; color:var(--tx2); font-size:10px; }
#rhdr .timer{ font-size:12px; font-weight:800; color:var(--tx2); font-variant-numeric:tabular-nums; }
#rhdr .fbtn{ font-size:13px; font-weight:800; background:var(--bg3); border:1px solid var(--line); border-radius:8px; padding:5px 9px; }
#rbody{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
#rbody .inner{ max-width:var(--max); margin:0 auto; padding:22px 20px 40px; }
.rtitle{ font-size:26px; line-height:1.4; font-family:var(--font-display); font-weight:700; }
.rtitleja{ font-size:14px; color:var(--tx2); font-weight:700; margin:6px 0 14px; }
.teaserbox{ background:var(--bg3); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:13px; line-height:1.7; margin-bottom:18px; color:var(--tx); }
.teaserbox b{ color:var(--ac-tx); font-size:11px; display:block; margin-bottom:2px; }
#story{ line-height:2.0; }
#story p{ margin:0 0 1.15em; }
#story.serif{ font-family:Georgia,"Times New Roman","Hiragino Mincho ProN",serif; }
.sent{ border-radius:4px; }
.sent.cur{ background:color-mix(in srgb, var(--ac) 26%, transparent); }
.gw{ font-weight:inherit; border-bottom:2px dotted var(--ac); cursor:pointer; }
#rfoot{ flex:none; border-top:1px solid var(--line); background:var(--bg2); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
#rfoot .row{ max-width:var(--max); margin:0 auto; display:flex; gap:10px; align-items:center; }
.pctl{ font-size:20px; background:var(--bg3); border:1px solid var(--line); border-radius:12px; padding:8px 14px; }
.pctl.main{ background:var(--ac); color:var(--on-ac); border-color:var(--ac); }
#pprog{ font-size:11px; font-weight:800; color:var(--tx2); min-width:52px; text-align:center; }
select.mini{ font-family:inherit; font-size:12px; font-weight:700; background:var(--bg3); color:var(--tx); border:1px solid var(--line); border-radius:10px; padding:7px 6px; }
.shadowtg{ font-size:11px; font-weight:800; padding:7px 9px; border-radius:10px; border:1px solid var(--line); background:var(--bg3); color:var(--tx2); }
.shadowtg.on{ background:var(--teal); color:var(--on-teal); border-color:var(--teal); }
/* quiz / phrases / done */
.qq{ font-size:17px; font-weight:800; line-height:1.6; margin:10px 0 16px; }
.qc{ display:block; width:100%; text-align:left; background:var(--bg2); border:1.5px solid var(--line); border-radius:14px; padding:13px 16px; font-size:15px; font-weight:600; margin-bottom:9px; }
.qc.ok{ background:color-mix(in srgb,#2e9e5b 16%, var(--bg2)); border-color:#2e9e5b; }
.qc.ng{ background:color-mix(in srgb,#d64545 14%, var(--bg2)); border-color:#d64545; }
.qprog{ font-size:11.5px; font-weight:800; color:var(--tx2); letter-spacing:.05em; }
.phr{ display:flex; align-items:center; gap:12px; background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:9px; box-shadow:var(--shadow); }
.phr .t{ flex:1; } .phr .t .en{ font-size:16px; font-weight:800; line-height:1.5;} .phr .t .ja{ font-size:12px; color:var(--tx2); font-weight:600; margin-top:2px;}
.donebig{ text-align:center; padding:26px 0 8px; }
.donebig .e{ font-size:56px; } .donebig h2{ font-size:24px; margin-top:6px; font-family:var(--font-display); font-weight:700; }
.xprow{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; padding:7px 2px; border-bottom:1px dashed var(--line); }
.xprow:last-child{ border-bottom:none; }
.xprow b{ color:var(--ac-tx); }
.nextcard{ background:var(--bg3); border:1px dashed var(--ac); border-radius:14px; padding:13px 15px; margin:14px 0; }
.nextcard .l{ font-size:10.5px; font-weight:800; color:var(--ac-tx); letter-spacing:.08em; }
.nextcard .t{ font-size:15px; font-weight:800; margin:3px 0; }
.nextcard .z{ font-size:12.5px; color:var(--tx2); line-height:1.65; }
/* sheet / modal / toast */
#sheetwrap{ position:fixed; inset:0; z-index:60; display:none; }
#sheetwrap.show{ display:block; }
#sheetwrap .bgc{ position:absolute; inset:0; background:rgba(0,0,0,.28); }
#sheet{ position:absolute; left:0; right:0; bottom:0; background:var(--bg2); border-radius:20px 20px 0 0; padding:20px 22px calc(24px + env(safe-area-inset-bottom)); max-width:var(--max); margin:0 auto; animation:up .22s ease; }
#sheet .w{ font-size:24px; font-weight:800; }
#sheet .ja{ font-size:15px; color:var(--tx2); font-weight:700; margin-top:4px; }
#modalwrap{ position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; padding:20px; }
#modalwrap.show{ display:flex; }
#modalwrap .bgc{ position:absolute; inset:0; background:rgba(0,0,0,.4); }
#modal{ position:relative; background:var(--bg2); border-radius:20px; padding:24px 22px; width:100%; max-width:460px; max-height:82vh; overflow-y:auto; box-shadow:0 18px 50px rgba(0,0,0,.3); animation:up .22s ease; }
#toasts{ position:fixed; left:0; right:0; bottom:86px; z-index:80; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.toast{ background:var(--tx); color:var(--bg); font-size:13px; font-weight:800; padding:11px 18px; border-radius:99px; box-shadow:0 6px 18px rgba(0,0,0,.25); animation:tpop .3s ease; max-width:88%; text-align:center; }
@keyframes tpop{ from{ transform:translateY(14px); opacity:0;} to{ transform:none; opacity:1;} }
#confetti{ position:fixed; inset:0; z-index:90; pointer-events:none; display:none; }
/* settings */
.setrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px dashed var(--line); font-size:14px; font-weight:700; }
.setrow small{ display:block; font-weight:600; color:var(--tx2); font-size:11px; margin-top:2px; }
.seg{ display:flex; background:var(--bg3); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.seg button{ font-size:12px; font-weight:800; padding:7px 12px; color:var(--tx2); }
.seg button.on{ background:var(--ac); color:var(--on-ac); }
input[type="range"]{ accent-color:var(--ac); width:130px; }
input[type="date"]{ font-family:inherit; background:var(--bg3); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:6px; font-size:13px; }
.roadmap{ position:relative; height:34px; margin-top:6px; }
.roadmap .track{ position:absolute; top:14px; left:0; right:0; height:8px; border-radius:99px; background:var(--bg3); border:1px solid var(--line); overflow:hidden; }
.roadmap .track i{ display:block; height:100%; background:linear-gradient(90deg,var(--teal),var(--ac)); }
.roadmap .mk{ position:absolute; top:0; font-size:9.5px; font-weight:800; color:var(--tx2); transform:translateX(-50%); }
.roadmap .mk::after{ content:""; position:absolute; top:13px; left:50%; width:2px; height:10px; background:var(--tx2); opacity:.5; }
/* ==== notebook / flashcards / plan ==== */
#tabbar button{ position:relative; }
.tbadge{ position:absolute; top:2px; right:calc(50% - 30px); background:var(--red); color:#fff; font-size:9.5px; font-weight:800; border-radius:99px; padding:1px 6px; }
.notecard{ display:flex; align-items:center; gap:10px; background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px; box-shadow:var(--shadow); }
.notecard .t{ flex:1; min-width:0; } .notecard .en{ font-size:15px; font-weight:800; line-height:1.45; } .notecard .ja{ font-size:12px; color:var(--tx2); font-weight:600; margin-top:2px; }
.notecard .lvpip{ font-size:9.5px; font-weight:800; color:var(--teal); flex:none; }
.tychip{ font-size:10px; font-weight:800; border-radius:99px; padding:2px 8px; background:var(--bg3); border:1px solid var(--line); color:var(--tx2); flex:none; }
.xbtn{ font-size:15px; color:var(--tx2); padding:6px; flex:none; }
#rev,#plan{ position:fixed; inset:0; z-index:45; background:var(--bg); display:none; flex-direction:column; }
#rev.show,#plan.show{ display:flex; animation:up .28s ease; }
.ovhead{ flex:none; display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--bg2); }
.ovhead .back{ font-size:22px; padding:4px 8px; }
.ovhead .info{ flex:1; min-width:0; font-size:12px; font-weight:700; }
.ovhead .info small{ display:block; color:var(--tx2); font-size:10px; }
.ovhead .fbtn{ font-size:13px; font-weight:800; background:var(--bg3); border:1px solid var(--line); border-radius:8px; padding:5px 9px; }
.ovbody{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.ovinner{ max-width:560px; margin:0 auto; padding:24px 20px 44px; }
.flash{ background:var(--bg2); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:34px 22px; text-align:center; cursor:pointer; min-height:250px; display:flex; flex-direction:column; justify-content:center; gap:12px; }
.flash .front{ font-size:25px; font-weight:800; line-height:1.55; }
.flash .backja{ font-size:21px; font-weight:800; color:var(--ac-tx); line-height:1.6; }
.flash .ex{ font-size:13.5px; color:var(--tx2); font-weight:600; line-height:1.8; }

.gradebtns{ display:flex; gap:10px; margin-top:14px; }

.gb-ok{ background:var(--teal); color:var(--on-teal); box-shadow:0 3px 10px color-mix(in srgb, var(--teal) 40%, transparent); }
.planrow{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; font-size:12.5px; font-weight:700; }
.planrow.cur{ background:color-mix(in srgb, var(--ac) 14%, var(--bg2)); border:1px solid var(--ac); }
.planrow .wk{ width:36px; flex:none; color:var(--tx2); font-weight:800; }

.planrow .ok{ flex:none; }
.phasecard{ border-left:4px solid var(--ac); }
.pod2{ font-size:13px; line-height:1.9; }
.wordrow{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13.5px; font-weight:700; }
.wordrow:last-child{ border-bottom:none; }
.wordrow .wja{ color:var(--tx2); font-weight:600; font-size:12px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.addbtn{ margin-left:auto; flex:none; font-size:12px; font-weight:800; background:var(--bg3); border:1px solid var(--line); border-radius:99px; padding:5px 12px; color:var(--ac-tx); }
.addbtn.did{ opacity:.5; }
.searchbox{ width:100%; font-family:inherit; font-size:14px; background:var(--bg2); color:var(--tx); border:1px solid var(--line); border-radius:12px; padding:10px 14px; box-sizing:border-box; }
.empty{ text-align:center; color:var(--tx2); font-weight:700; padding:60px 0; font-size:14px; line-height:2; }
/* ==== states: focus / hover ==== */
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--ac-tx); outline-offset:2px; }
@media (hover:hover){
  .btn:hover{ background:var(--ac-hover); }
  .gb-ok:hover{ background:var(--teal-hover); }
  .btn2:hover, .pctl:hover, .spk:hover, .fbtn:hover, .addbtn:hover, .gb-ng:hover, .shadowtg:not(.on):hover, .seg button:not(.on):hover{ background:var(--bg3-hover); }
  .epcard:hover, .notecard:hover, .phr:hover{ border-color:color-mix(in srgb, var(--tx2) 45%, var(--line)); }
  .qc:hover{ border-color:var(--ac); }
  #tabbar button:hover, .gear:hover, .xbtn:hover, #rhdr .back:hover, .ovhead .back:hover{ color:var(--tx); }
}
/* ==== toast with action ==== */
.toast .ta{ background:none; border:none; color:inherit; font-weight:800; text-decoration:underline; text-underline-offset:3px; margin-left:10px; cursor:pointer; font-size:inherit; }
.toast.act{ pointer-events:auto; }
/* ==== reduced motion ==== */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
@media(min-width:900px){ :root{ --max:720px; } }
</style>

<script>
"use strict";
const EPISODES=[{"id":1,"level":1,"emoji":"✈️","theme":"機内・入国審査での会話","titleEn":"A Long Flight to a New Life","titleJa":"新しい生活への長いフライト","teaser":"松山出身のハナ、ついにポートランドへ。最初の英会話の相手は入国審査官!?","story":"Hana sat by the window on the big plane. Her heart went fast.\n\nThis was her first trip to America. Hana was twenty-four. She was from Matsuyama, a small city in Japan.\n\nShe worked at a bakery there. She loved bread, dogs, and quiet mornings. Now she wanted one more thing. She wanted to speak English.\n\nAt the airport in Japan, her family said goodbye.\n\n“Nine months is long,” her mother said.\n\n“Do your best,” her father said.\n\nHer little sister Yui laughed. “Send me photos every day!”\n\nNow Hana was in the sky. A woman sat next to her. The woman smiled.\n\n“Hi! Where are you going?” she asked.\n\nHana’s face got hot. English! A real question!\n\n“Portland,” Hana said. “I go to Portland.”\n\n“Me too! I live there. I’m Susan.”\n\n“I’m Hana. Nice to meet you.”\n\n“Nice to meet you too, Hana.”\n\nHana smiled a small smile. One good sentence! A small win.\n\n“What do you do in Japan?” Susan asked.\n\n“I work at a bakery. I make bread.”\n\n“A baker! Portland loves good bread,” Susan said. “Why Portland?”\n\nHana opened her small notebook. Her English sentences waited inside.\n\n“I’m here to study English,” she read. “Nine months. I live with a host family.”\n\n“That’s wonderful. Are you nervous?”\n\n“Yes. A little,” Hana said. “No… a lot.”\n\nSusan laughed kindly. “Don’t worry. People in Portland are friendly. And your English is good.”\n\n“Thank you,” Hana said. Her heart felt warm.\n\nSusan showed her photos of Portland. Green trees, small shops, many bridges.\n\n“It’s a pretty city,” Susan said. “I love it there.”\n\n“It looks beautiful,” Hana said.\n\nThe flight was long. Ten hours! Hana watched a movie about a dog. She cried a little at the end.\n\nShe ate chicken with rice. She slept a little too.\n\nIn her bag was a photo of her host family, the Millers. Mike, Carol, and their son Ben. And a big yellow dog, Daisy.\n\n“I want to meet Daisy,” Hana thought.\n\nShe practiced a new sentence too: “Hello, I’m Hana. Nice to meet you all.”\n\nThe plane landed. Hana walked and walked. People spoke fast English all around her.\n\nThen she saw a long line and a big sign: IMMIGRATION.\n\nHer hands got cold. An officer asks questions there. She read her notebook one more time.\n\nThen it was her turn. The officer was a tall man. He did not smile.\n\n“Passport, please,” he said.\n\nHana gave him her passport. Her hand shook a little.\n\n“Why are you here?” he asked.\n\nHana took a big breath. “I’m here to study English.”\n\n“How long?”\n\n“Nine months.”\n\n“Where do you stay?”\n\n“With a host family. In Portland.”\n\nThe officer looked at her papers. It was very quiet. Hana’s heart went boom, boom, boom.\n\nThen he smiled a little. “Your English sounds good. Study hard.”\n\nStamp! The sound was loud and happy.\n\n“Welcome to America,” he said.\n\n“Thank you very much!” Hana said. Her voice was big.\n\nShe walked away. Her legs felt light. She did it! Her first big English test!\n\nHana got her blue suitcase. Then she saw the doors. Behind them, many people waited.\n\nSomewhere out there stood the Miller family.\n\nShe stopped for one second. “Okay, Hana,” she said to herself. “You can do this.”\n\nShe pushed her cart to the doors — and to her new life.","glossary":[{"w":"bakery","ja":"パン屋"},{"w":"quiet","ja":"静かな"},{"w":"notebook","ja":"ノート"},{"w":"host family","ja":"ホスト家庭"},{"w":"nervous","ja":"緊張した"},{"w":"bridge","ja":"橋"},{"w":"flight","ja":"フライト"},{"w":"landed","ja":"着陸した"},{"w":"immigration","ja":"入国審査"},{"w":"officer","ja":"審査官"},{"w":"passport","ja":"パスポート"},{"w":"shook","ja":"震えた"},{"w":"breath","ja":"息"},{"w":"stamp","ja":"スタンプ"},{"w":"suitcase","ja":"スーツケース"}],"phrases":[{"en":"Nice to meet you.","ja":"はじめまして。"},{"en":"I’m here to study English.","ja":"英語を勉強しに来ました。"},{"en":"Don’t worry.","ja":"心配しないで。"},{"en":"Thank you very much!","ja":"本当にありがとうございます！"},{"en":"You can do this.","ja":"あなたならできる。"}],"quiz":[{"q":"Where is Hana from?","c":["Portland","Matsuyama","Tokyo","Osaka"],"a":1},{"q":"Why did Hana go to America?","c":["To study English","To work at a bank","To buy a dog","To see movies"],"a":0},{"q":"How did Hana feel after the passport check?","c":["Sad","Tired","Happy","Angry"],"a":2}],"words":558},{"id":2,"level":1,"emoji":"🏠","theme":"ホストファミリーとの対面","titleEn":"Welcome to Portland!","titleJa":"ようこそポートランドへ！","teaser":"空港で出迎えてくれたミラー一家。新しい家、新しい部屋、そして金色の犬デイジーとの出会い。","story":"It was Hana’s first hour in America.\n\nThe airport doors opened. Hana pushed her cart out. Many people stood there. Many faces, many signs.\n\nThen she saw it. A big white sign: HANA SATO. Little flowers were on it, in orange and pink.\n\nA tall man held the sign. A woman waved with both hands. A boy looked up from his phone and smiled.\n\n“Hana! Over here!” the woman called.\n\nHana walked to them. Her heart went fast again.\n\n“Hello. I’m Hana,” she said. “Nice to meet you all.”\n\n“Welcome to Portland!” the woman said. She gave Hana a warm hug. “I’m Carol.”\n\n“I’m Mike,” the tall man said. “Our name is Miller. Like flour! You are a baker. It’s perfect.”\n\nHana did not understand. But Mike laughed, so she laughed too.\n\n“Dad, no,” the boy said. “Sorry, Hana. I’m Ben.”\n\n“Nice to meet you, Ben.”\n\n“Did you have a good flight?” Carol asked.\n\n“Yes. It was long. Ten hours,” Hana said. “But I talked in English!”\n\n“See? You’re a star,” Mike said. He took her big suitcase. “Let’s go home.”\n\nThe car ride was thirty minutes. Hana looked out the window. Green trees. Small houses with gardens. A long bridge over a river.\n\n“Portland has many bridges,” Ben said. “And many coffee shops.”\n\n“I like coffee,” Hana said.\n\n“Then you are in the right city,” Mike said.\n\nThe Millers’ house was blue with a white door. A pretty garden was in front. And behind the door — woof!\n\n“That’s Daisy,” Carol said. “She’s old, but she’s a baby.”\n\nThe door opened. A big golden dog came slowly. Her tail went left and right, left and right.\n\nHana sat down. Daisy put her head in Hana’s hands.\n\n“Hello, Daisy,” Hana said softly. “I’m Hana.”\n\nDaisy licked her nose. Everyone laughed.\n\n“She likes you,” Ben said. “She doesn’t do that with everyone.”\n\nCarol showed Hana the house. The kitchen was big and smelled like cookies. The living room had a soft sofa and family photos.\n\nThen they went upstairs. Carol opened a white door.\n\n“And this is your room,” she said.\n\nThe room had a bed, a desk, and a window. From the window, Hana saw the garden and one big tree. On the desk was a small flower in a cup.\n\n“This is my room?” Hana asked.\n\n“All yours,” Carol said. “Make yourself at home.”\n\nHana’s eyes felt hot. “Thank you. It’s… perfect.”\n\nShe opened her suitcase. She had presents from Japan.\n\n“These are mikan cookies,” she said. “Mikan is a small orange. Matsuyama is famous for it.”\n\n“Cookies from a baker!” Mike said. “Best day ever.”\n\nBen tried one. “Whoa. These are really good.”\n\n“Are you hungry?” Carol asked. “We have pizza tonight. Easy dinner.”\n\n“Yes! I like pizza,” Hana said.\n\nDinner was warm and loud. Mike told funny stories. Ben showed Hana photos of his basketball team. Daisy slept under the table, on Hana’s feet.\n\nHana understood many words. Not all. But many.\n\nAt nine, her eyes wanted to close. Ten hours of flying is heavy.\n\n“Go to bed, Hana,” Carol smiled. “Sleep well.”\n\n“Good night. Thank you for everything.”\n\nIn her new bed, Hana looked at the ceiling. America. Day one. A new family, a warm dog, and her own little room.\n\n“Slowly, slowly. I can learn,” she thought.\n\nTomorrow was her first morning in America — and her first American breakfast.","glossary":[{"w":"cart","ja":"カート"},{"w":"sign","ja":"看板"},{"w":"waved","ja":"手を振った"},{"w":"hug","ja":"ハグ"},{"w":"flour","ja":"小麦粉"},{"w":"suitcase","ja":"スーツケース"},{"w":"garden","ja":"庭"},{"w":"golden","ja":"金色の"},{"w":"tail","ja":"しっぽ"},{"w":"licked","ja":"なめた"},{"w":"upstairs","ja":"二階へ"},{"w":"famous","ja":"有名な"},{"w":"understood","ja":"理解した"},{"w":"ceiling","ja":"天井"}],"phrases":[{"en":"Welcome to Portland!","ja":"ポートランドへようこそ！"},{"en":"Did you have a good flight?","ja":"空の旅はどうだった？"},{"en":"Make yourself at home.","ja":"くつろいでね。"},{"en":"Are you hungry?","ja":"おなかすいてる？"},{"en":"Sleep well.","ja":"ぐっすり休んでね。"}],"quiz":[{"q":"What is the name of the Millers’ dog?","c":["Mochi","Susan","Peanut","Daisy"],"a":3},{"q":"Who is Ben?","c":["A teacher","A doctor","The Millers’ son","A baker"],"a":2},{"q":"How did Hana feel in her new room?","c":["Happy","Angry","Bored","Cold"],"a":0}],"words":565},{"id":3,"level":1,"emoji":"🥞","theme":"時差ぼけの朝ごはん","titleEn":"Pancakes and Jet Lag","titleJa":"時差ぼけとパンケーキ","teaser":"朝4時に目が覚めたハナ。時差ぼけの朝は、キャロルの焼きたてパンケーキと朝ごはん談議！","story":"Hana’s first morning in America started very, very early.\n\nShe opened her eyes in the dark. Her body said, “Good morning!” The clock said 4:02.\n\n“Oh no,” Hana thought. “In Japan, it’s eight at night. My body is still there.”\n\nThis is jet lag. Your body lives in one country. Your clock lives in another.\n\nHana looked out the window. The sky was black. One bird sang one small song.\n\nShe read her notebook. She wrote new words: sign, hug, flour.\n\nThen she heard soft steps in the hall. A nose pushed her door open. Daisy!\n\n“Good morning, Daisy,” Hana said quietly. “You can’t sleep too?”\n\nDaisy put her head on the bed. They watched the sky together. Slowly, it turned pink, then gold.\n\nAt six, Hana heard sounds from the kitchen. She went downstairs with Daisy.\n\nCarol stood at the stove. She wore a red apron.\n\n“Good morning, Hana! You’re up early. Did you sleep well?”\n\n“A little,” Hana said. “I woke up at four. My body is on Japan time.”\n\nCarol laughed softly. “Jet lag. I know it well. I’m a nurse. Night shifts do the same thing.”\n\n“Now sit,” Carol said. “Pancake time.”\n\nThe pan made a happy sound. Sss! Carol turned a pancake high in the air.\n\n“Wow!” Hana said.\n\n“Fifteen years of practice,” Carol laughed.\n\nSoon the table had a little mountain of pancakes. Butter, syrup, and red strawberries.\n\nMike came in. His hair stood up. “Do I smell pancakes? Best house in America.”\n\nBen came too, with his phone. “Morning,” he said, to the phone.\n\nHana looked at the golden pancakes. “In Japan, breakfast is different,” she said.\n\n“Tell us,” Carol said.\n\n“Rice, miso soup, egg… and, how do you say… fish on fire?”\n\n“Fish on fire?” Ben looked up.\n\n“Grilled fish!” Carol said. “Fish cooked over heat.”\n\n“Yes! Grilled fish,” Hana said. “Fish for breakfast is normal in Japan.”\n\n“Fish at seven in the morning?” Ben said. “No way.”\n\n“And natto,” Hana smiled. “Sticky beans. Very sticky.”\n\n“Sticky beans?” Mike said. “I want to try them. I’m not scared.”\n\nEveryone laughed. The kitchen was warm and bright.\n\nCarol put three pancakes on Hana’s plate. Hana took one bite.\n\nWarm, soft, sweet.\n\n“This is delicious!” she said.\n\n“Try the syrup,” Mike said. “It’s from maple trees. Real Oregon breakfast.”\n\n“Could you pass the syrup?” Hana asked.\n\n“Great English!” Carol said, and passed the little bottle.\n\nThe syrup was gold and slow. Hana ate one pancake, two, three.\n\n“I’m full. So good,” she said. “Thank you, Carol.”\n\n“You’re welcome. Eat pancakes, learn English. That’s the plan.”\n\nMike stood up. “Time for school. I teach science to teenagers. Wish me luck.”\n\n“Good luck,” Hana said.\n\nBen looked at the clock. “What time is it? Seven forty?! Oh no!”\n\nHe ran out the door with toast in his mouth. “Bye, Hana!”\n\nThen the kitchen was quiet. Carol drank her coffee. Hana drank green tea from Japan.\n\n“What do you want to do today?” Carol asked.\n\n“I want to walk,” Hana said. “I want to see the town.”\n\n“Rest today,” Carol said. “Tomorrow, a nice walk. I can draw a map for you.”\n\n“A map of the neighborhood. Small streets, one park, and one good cafe.”\n\n“I like maps,” Hana said. “And I really like cafes.”\n\nHana washed the dishes with Carol. The water was warm. Outside, the sun was high now.\n\nTomorrow, new streets waited for her — and one little cafe too.","glossary":[{"w":"jet lag","ja":"時差ぼけ"},{"w":"downstairs","ja":"一階へ"},{"w":"stove","ja":"コンロ"},{"w":"apron","ja":"エプロン"},{"w":"nurse","ja":"看護師"},{"w":"night shift","ja":"夜勤"},{"w":"syrup","ja":"シロップ"},{"w":"grilled","ja":"焼いた"},{"w":"sticky","ja":"ねばねばの"},{"w":"bite","ja":"ひと口"},{"w":"delicious","ja":"とてもおいしい"},{"w":"maple","ja":"カエデ"},{"w":"full","ja":"満腹の"},{"w":"science","ja":"理科"},{"w":"neighborhood","ja":"ご近所"}],"phrases":[{"en":"Did you sleep well?","ja":"よく眠れた？"},{"en":"Could you pass the syrup?","ja":"シロップ取ってくれる？"},{"en":"This is delicious!","ja":"これ、すごくおいしい！"},{"en":"I’m full.","ja":"おなかいっぱい。"},{"en":"What time is it?","ja":"いま何時？"}],"quiz":[{"q":"What did Carol make for breakfast?","c":["Pancakes","Rice and fish","Pizza","Soup"],"a":0},{"q":"Why did Hana wake up at four?","c":["She heard Daisy","Her body was on Japan time","The TV was loud","She was hungry"],"a":1},{"q":"How did Hana feel at breakfast?","c":["Cold","Angry","Lonely","Warm and happy"],"a":3}],"words":576},{"id":4,"level":1,"emoji":"🚶","theme":"はじめての散歩・道に迷う","titleEn":"Lost on a Street of Pink Trees","titleJa":"桜の街で迷子","teaser":"手描きの地図を持ってご近所探検へ。桜みたいな並木道で、帰り道がわからなくなって…！","story":"The spring sun was bright on Hana’s third morning in Portland.\n\nAfter breakfast, Carol gave her a paper. It was a map. Carol drew it by hand.\n\n“Here is our house,” Carol said. “Here is the park. And here is my favorite cafe.”\n\n“The Bluebird Cafe,” Hana read. “Cute name.”\n\n“Walk slowly. Enjoy the flowers,” Carol said. “Call me any time.”\n\n“I can do it,” Hana said. “I have my map and my phone.”\n\nOutside, the air smelled like flowers. Pink trees stood on every street. Little petals fell like snow.\n\n“Cherry blossoms,” Hana thought. “Just like Japan in April.”\n\nShe walked past small houses. A man washed his car. He waved. Hana waved back.\n\n“Beautiful day!” he called.\n\n“Yes! Beautiful!” Hana said. Small talk — she did it!\n\nShe found the park. Children played on swings. Dogs ran after balls. She sat on a bench and watched.\n\nA gray squirrel ran up a tree. Hana laughed. Squirrels are not common in Matsuyama.\n\nThen she walked more. She found a cafe with a blue bird on the sign. It looked warm inside. People laughed at little tables.\n\nIn the window, a woman with gray hair laughed a big laugh. The sound was warm too.\n\nShe smelled coffee and sweet bread. “I want to come back soon,” she said to herself.\n\nShe walked and walked. Blue house, red door, tall tree. Then she turned right. Then left. Then right again.\n\nSuddenly, Hana stopped. Blue house? Red door? Every street looked the same.\n\nShe looked for the pink trees. But now every street had pink trees.\n\nShe looked at the map. She turned it one way, then another. Where was the park now?\n\n“Okay. My phone,” she said.\n\nThe phone showed the map for one second. Then the screen went black. The battery was dead.\n\n“Oh no,” Hana said quietly.\n\nHer heart went fast. Lost. In America. On day three.\n\n“Calm down, Hana,” she said. “Think.”\n\nThen she remembered the airport. The officer. Her small win.\n\n“I can ask,” she thought. “I know the words.”\n\nAn older woman worked in her garden. She had kind eyes and dirty gloves.\n\nHana took a breath. “Excuse me. Can you help me?”\n\n“Of course, dear,” the woman said.\n\n“I’m lost. I want to go to Maple Street.”\n\n“Maple Street? You are close,” the woman smiled. She pointed. “Go straight two blocks. Turn left at the corner. You can see a blue house. That’s Maple Street.”\n\n“Go straight… turn left at the corner,” Hana repeated. “Thank you for your help!”\n\n“You’re welcome. Your English is very clear.”\n\n“I practice every day,” Hana said, and her face got warm.\n\n“Wonderful. Have a nice day!”\n\n“You too!” Hana said.\n\nTwo blocks. Left at the corner. And there — the blue house with the white door!\n\nDaisy barked one happy bark from the window. Her tail said, “Welcome home!”\n\n“I’m home!” Hana called.\n\nCarol opened the door. “There you are! I called your phone.”\n\n“Sorry. My battery died,” Hana said. “And I got lost. But I asked a person, in English!”\n\n“You got lost, and you got home,” Mike said from the sofa. “You are a real Portland person now.”\n\nThat evening, Hana wrote in her notebook: “Turn left at the corner. Go straight. I’m lost.”\n\nNew words, new streets, new small wins. Day three was a big day.\n\n“Tomorrow, the big supermarket with Carol,” she wrote. “I’m ready.”","glossary":[{"w":"map","ja":"地図"},{"w":"petal","ja":"花びら"},{"w":"cherry blossom","ja":"桜"},{"w":"swing","ja":"ブランコ"},{"w":"bench","ja":"ベンチ"},{"w":"squirrel","ja":"リス"},{"w":"screen","ja":"画面"},{"w":"battery","ja":"電池"},{"w":"remembered","ja":"思い出した"},{"w":"glove","ja":"手袋"},{"w":"pointed","ja":"指さした"},{"w":"block","ja":"区画"},{"w":"corner","ja":"角"},{"w":"repeated","ja":"くり返した"},{"w":"barked","ja":"ほえた"}],"phrases":[{"en":"Excuse me. Can you help me?","ja":"すみません、ちょっといいですか？"},{"en":"I’m lost.","ja":"道に迷いました。"},{"en":"Turn left at the corner.","ja":"角を左に曲がって。"},{"en":"Thank you for your help!","ja":"助けてくれてありがとう！"},{"en":"Have a nice day!","ja":"よい一日を！"}],"quiz":[{"q":"Who made a map for Hana?","c":["Ben","Mike","Carol","Susan"],"a":2},{"q":"Why did Hana stop using her phone?","c":["It was at home","It was wet","She lost it","The battery was dead"],"a":3},{"q":"How did Hana feel at the blue house?","c":["Sleepy","Happy and safe","Angry","Hungry"],"a":1}],"words":570},{"id":5,"level":1,"emoji":"🛒","theme":"スーパーで買い物","titleEn":"The Biggest Store in the World","titleJa":"世界一大きなスーパー？","teaser":"牛乳は4リットル、リンゴは何種類？巨大スーパーでハナはセルフレジと対決することに。","story":"On day four, Hana saw the biggest store of her life.\n\n“Welcome to the supermarket,” Carol said. “We call this grocery shopping.”\n\nThe doors opened by themselves.\n\nInside, everything was big. The carts were big. The bread was big. The milk came in giant bottles.\n\n“One gallon,” Carol said. “About four liters.”\n\n“Four liters!” Hana said. “In Japan, milk is one liter. Small and cute.”\n\nCarol laughed. “In America, big is normal.”\n\nThey walked down the first aisle. Hana read the signs: BAKERY. DAIRY. PRODUCE.\n\nOne aisle had only cereal. A hundred boxes! A tiger smiled from one box.\n\n“Produce?” she asked. “What is produce?”\n\n“Fruits and vegetables,” Carol said. “Strange word. Nobody knows why.”\n\nHana wrote it in her notebook.\n\nThe apples had many names: Fuji, Gala, Pink Lady.\n\n“Fuji!” Hana said. “Like the mountain in Japan!”\n\n“Fuji apples are famous here,” Carol said.\n\nThey got eggs, butter, and cheese. Then Hana stopped. She wanted rice. But where?\n\nA worker in a green shirt stood near the milk.\n\n“Excuse me,” Hana said. “Where can I find the rice?”\n\n“Aisle seven,” the worker said. “Next to the pasta.”\n\n“Aisle seven. Thank you!”\n\nAisle seven had rice from many countries. Big bags, small bags. Hana found Japanese rice.\n\n“Not the same as home,” she said. “But close.”\n\nThen Hana saw the baking corner. Flour, sugar, chocolate. Her baker heart went ding!\n\nShe smelled the flour bags. Home smell. Bakery smell.\n\n“Carol, I want to bake for you,” she said. “Bread or cookies. A thank-you present.”\n\n“Really? Yes, please!” Carol said. “Mike dreams about fresh bread.”\n\nHana held a white bag. “How do you say this word?”\n\n“Flour,” Carol said. “It sounds like flower. Same sound, different thing.”\n\n“Flour, flower,” Hana said. “English is funny.”\n\nNear the cheese, a woman had a little table. “Free samples!”\n\nHana tried cheese on a toothpick. It was good. The woman smiled. “One more?”\n\n“That’s all, thanks. It was delicious,” Hana said.\n\nThen Hana saw chocolate with a red bird on it. “How much is this?”\n\n“Four dollars,” Carol said. “A present for Ben?”\n\n“Yes. He likes sweet things.”\n\nThe cart was full now. Carol pointed at a machine. “Self-checkout. You scan, you pay. Want to try?”\n\n“I can try,” Hana said.\n\nBeep! Eggs. Beep! Cheese. Beep! Rice. Easy!\n\nThen, the flour. No beep. She tried again. And again. No beep.\n\nThe machine talked: “Please wait for help.”\n\n“Oh no,” Hana said. “The machine is angry with me.”\n\nA worker came fast. She used a special card. Beep! “It happens every day. Not just you.”\n\n“Thank you,” Hana said. Her face was a little red.\n\nThe worker opened a bag. “Paper or plastic?”\n\n“Paper, please,” Hana said.\n\n“Can I pay by card?”\n\n“Of course. Tap here.”\n\nHana tapped her card from Japan. Beep. All done.\n\n“I did it,” she said. “The machine and I are friends now.”\n\nCarol laughed all the way to the car.\n\nAt home, Daisy smelled every bag. Ben found his chocolate fast.\n\n“Thanks, Hana! How much was it?”\n\n“Four dollars,” Hana said. “And one small fight with a machine.”\n\nThat night, Hana put the flour on the kitchen table. Bread day was coming soon.\n\nAnd tomorrow was Saturday — cafe day. Hana practiced one sentence again and again: “Could I get a small latte?”","glossary":[{"w":"grocery shopping","ja":"食料品の買い物"},{"w":"gallon","ja":"ガロン"},{"w":"aisle","ja":"通路"},{"w":"dairy","ja":"乳製品"},{"w":"produce","ja":"青果"},{"w":"cereal","ja":"シリアル"},{"w":"worker","ja":"店員"},{"w":"baking","ja":"パン・菓子作り"},{"w":"flour","ja":"小麦粉"},{"w":"sample","ja":"試食"},{"w":"toothpick","ja":"つまようじ"},{"w":"self-checkout","ja":"セルフレジ"},{"w":"scan","ja":"スキャンする"},{"w":"machine","ja":"機械"},{"w":"tapped","ja":"タッチした"}],"phrases":[{"en":"Where can I find the rice?","ja":"お米はどこにありますか？"},{"en":"How much is this?","ja":"これはいくらですか？"},{"en":"Paper or plastic?","ja":"袋は紙？ビニール？"},{"en":"Can I pay by card?","ja":"カードで払えますか？"},{"en":"That’s all, thanks.","ja":"以上で大丈夫です。"}],"quiz":[{"q":"Who went to the store with Hana?","c":["Mike","Carol","Ben","Emma"],"a":1},{"q":"What was hard for Hana?","c":["Finding eggs","Talking to Carol","The self-checkout machine","Walking to the store"],"a":2},{"q":"Why did Hana buy flour?","c":["She wants to bake for the family","She was hungry","It was free","Ben asked for it"],"a":0}],"words":552},{"id":6,"level":1,"emoji":"☕","theme":"カフェで初めての注文","titleEn":"The Cafe with the Blue Bird","titleJa":"青い鳥のカフェ","teaser":"練習した一文を胸に、ひとりでカフェへ。大きな笑い声のロサと、ラテアートの小さな鳥。","story":"Saturday came, and with it, cafe day.\n\nHana stood outside the Bluebird Cafe. The blue bird on the sign looked down at her.\n\nThrough the window, she saw warm lights and little tables. People talked and laughed.\n\n“Okay,” Hana said quietly. “Could I get a small latte? Could I get a small latte?”\n\nOne more breath. She opened the door. Ding! Her heart went tap, tap, tap.\n\nThe cafe smelled like coffee and warm bread. On the wall was a big chalkboard menu.\n\nBehind the counter stood a woman with gray hair and gold glasses.\n\n“Well, hello!” the woman said. Her voice was big and warm. “What can I get you, honey?”\n\nHana’s mind went white. Honey? Why honey?\n\nThen her practice came back. “Could I get a small latte?”\n\n“One small latte!” the woman sang. “For here or to go?”\n\nFor here or to go — Hana knew this one!\n\n“For here, please.”\n\n“Good choice,” the woman said. “I’m Rosa. This is my cafe.”\n\n“I’m Hana. It’s my first time here.”\n\n“First time! Welcome!” Rosa laughed a big laugh.\n\nHana knew that laugh. It was the warm sound from the window, from her first walk.\n\n“Are you new to Portland?” Rosa asked.\n\n“Yes. I came one week ago, from Japan. I live with a host family.”\n\n“Japan! Wonderful. Emma, come here!”\n\nA girl came from the back. She had short hair and paint on her fingers.\n\n“Emma, this is Hana,” Rosa said. “It’s her first time.”\n\n“Hi, Hana!” Emma said. “I love your jacket!”\n\n“Thank you. I like your… paint?”\n\nEmma looked at her hands and laughed. “Art school. The paint never goes away.”\n\nEmma made the latte. The milk went sss. Then she moved the cup slowly, like a dance. “Watch this.”\n\n“Here you go. One small latte.”\n\nOn the milk was a picture. A small white bird!\n\n“A bird!” Hana said. “How?”\n\n“Latte art,” Emma said. “Practice, practice.”\n\n“It’s too pretty. I can’t drink it.”\n\n“Drink it,” Rosa laughed. “Emma can make more birds.”\n\nHana sat by the window with her latte. It was warm and soft. Outside, a little rain started.\n\nRain in Portland is soft. Nobody used an umbrella. Hana wrote that in her notebook.\n\nShe watched the cafe. Rosa knew everyone. “Morning, Tom! The usual?” “Morning, Rosa!”\n\n“This place is warm,” Hana thought. “Like my bakery in Matsuyama.”\n\nShe remembered one question. She walked to Emma.\n\n“Emma. Rosa said honey. Am I… honey?”\n\nEmma laughed. “It’s a kind name. It means she likes you.”\n\n“Honey,” Hana said. “I like it.”\n\nHana drank the last warm drop. Then she took her cup to the counter.\n\n“Thank you. The latte was delicious,” she said. “And the bird was beautiful.”\n\n“Come again, Hana from Japan,” Rosa said.\n\n“Yes. Maybe I can come every day,” Hana smiled.\n\n“See you soon!” Emma called.\n\n“See you soon!” Hana said.\n\nOutside, the rain stopped. The street smelled clean and new.\n\nHana walked home with light steps. One latte, two new people, one small white bird.\n\nAt dinner, she told the family everything.\n\n“The Bluebird!” Mike said. “Best cookies in town.”\n\n“And best people,” Carol said. “Rosa is famous here.”\n\nThat night, Hana wrote new words: chalkboard, latte art, honey.\n\nOn Sunday morning, Daisy sat by the door. Her leash was in her mouth.\n\nPark day was here — and Daisy knew it.","glossary":[{"w":"chalkboard","ja":"黒板"},{"w":"counter","ja":"カウンター"},{"w":"glasses","ja":"めがね"},{"w":"honey","ja":"親しい呼び名"},{"w":"mind","ja":"頭の中"},{"w":"sang","ja":"歌うように言った"},{"w":"paint","ja":"絵の具"},{"w":"jacket","ja":"上着"},{"w":"latte art","ja":"ラテアート"},{"w":"pretty","ja":"きれいな"},{"w":"umbrella","ja":"傘"},{"w":"the usual","ja":"いつもの"},{"w":"drop","ja":"しずく"},{"w":"leash","ja":"リード"}],"phrases":[{"en":"Could I get a small latte?","ja":"スモールラテをもらえますか？"},{"en":"For here or to go?","ja":"店内で？お持ち帰り？"},{"en":"For here, please.","ja":"店内でお願いします。"},{"en":"It’s my first time here.","ja":"ここは初めてです。"},{"en":"See you soon!","ja":"また近いうちに！"}],"quiz":[{"q":"What did Hana order?","c":["A small latte","A big coffee","Green tea","Orange juice"],"a":0},{"q":"Who is Rosa?","c":["A nurse","An art student","Hana’s teacher","The cafe owner"],"a":3},{"q":"Why was Hana happy at the cafe?","c":["The latte was free","Ben came to see her","She ordered in English by herself","She won a game"],"a":2}],"words":561},{"id":7,"level":1,"emoji":"🐕","theme":"公園で犬の散歩と立ち話","titleEn":"Two Dogs, One Bench","titleJa":"デイジーと公園デビュー","teaser":"のんびり屋のデイジーとお散歩へ。ボールを追う小さな犬と、緑の帽子のおじいさん。","story":"Sunday was sunny, a perfect day for the park.\n\n“Can I walk Daisy?” Hana asked at breakfast.\n\n“Of course,” Carol said. “She walks slowly. Old lady legs.”\n\n“Take bags,” Ben said. “You know. For… dog business.”\n\nHana laughed. “I know. Same in Japan.”\n\nDaisy knew the word walk. Her ears went up. Her tail went boom, boom on the floor.\n\nHana put on the leash. “Let’s go, Daisy.”\n\nOutside, the sun was warm. Daisy walked slowly and smelled everything.\n\nOne tree — sniff. One flower — sniff. One mailbox — big sniff.\n\n“You read the news with your nose,” Hana said.\n\nAt the park, dogs ran everywhere. Big dogs, small dogs, fast dogs.\n\nDaisy found a sunny spot on the grass. She sat down slowly. Sunday work.\n\n“You can rest,” Hana said. “I can watch the fast dogs for us.”\n\nThen a ball rolled to Hana’s feet. A small brown dog ran after it.\n\nThe little dog stopped. It looked at Hana. It looked at the ball.\n\n“This?” Hana asked. She threw the ball. The little dog flew after it.\n\nAn old man walked over. He wore a green cap.\n\n“Thank you!” he said. “She loves that ball. Ball first, me second.”\n\n“No problem,” Hana said. Then she remembered her phrases. “What’s your dog’s name?”\n\n“Peanut,” the man said. “Small dog, small name. I’m Sam.”\n\n“I’m Hana. And this sleepy girl is Daisy.”\n\n“Hello, Daisy. I know you! The Millers’ dog. Every dog in this park is my friend.”\n\nPeanut came back with the ball. She dropped it on Hana’s shoe.\n\n“Again?” Hana laughed. She threw it far.\n\n“She’s so friendly!” Hana said.\n\n“Friendly, yes. Tired, never,” Sam said.\n\nThey sat on a bench. Daisy put her head on Sam’s foot. Peanut ran in big circles.\n\n“How old is she?” Hana asked.\n\n“Peanut? Three. A baby,” Sam said. “And Daisy?”\n\n“Twelve, I think. But her heart is young.”\n\n“Dogs don’t count years,” Sam said. “They count walks.”\n\n“I like that,” Hana said. “I want to count walks too.”\n\n“Are you new here?” he asked. “Your face is new to this park.”\n\n“Yes, from Japan. One week here. I live with the Millers.”\n\n“Welcome. Do you like Portland?”\n\n“I like it a lot. People are kind. And there is coffee everywhere.”\n\nSam laughed. “True. Coffee, rain, and dogs. That’s Portland.”\n\nPeanut came back and dropped the ball on Hana’s shoe again.\n\n“Good girl!” Hana said, and threw it one more time.\n\nThe sun got low and gold. Sam stood up.\n\n“Dinner time. Peanut says so,” he smiled. “See you again, Hana.”\n\nHana smiled back. “Nice talking to you.”\n\n“You too. Your English is friendly, like you,” Sam said.\n\nHana and Daisy walked home in the golden light. Daisy stopped one time, for one last sniff.\n\n“Good walk?” Carol asked at the door.\n\n“The best,” Hana said. “I talked with Sam for twenty minutes. In English!”\n\n“Twenty minutes!” Carol said. “Wonderful!”\n\n“Daisy is the best English teacher,” Mike said. “She listens, and she never laughs at you.”\n\nAt dinner, Hana had one more thing to say.\n\n“I need a phone number here. An American number. For maps and calls.”\n\nBen looked up fast. “Phone store. I can help. I know everything about phones.”\n\n“Sadly, that is true,” Carol said. Everyone laughed.\n\nSo Monday’s plan was ready: Hana, Ben, and the phone store.","glossary":[{"w":"perfect","ja":"完ぺきな"},{"w":"dog business","ja":"犬のトイレ"},{"w":"leash","ja":"リード"},{"w":"sniff","ja":"くんくん"},{"w":"mailbox","ja":"郵便受け"},{"w":"grass","ja":"芝生"},{"w":"rolled","ja":"転がった"},{"w":"threw","ja":"投げた"},{"w":"cap","ja":"帽子"},{"w":"dropped","ja":"落とした"},{"w":"circle","ja":"円"},{"w":"listens","ja":"耳をかたむける"},{"w":"plan","ja":"計画"}],"phrases":[{"en":"What’s your dog’s name?","ja":"ワンちゃんの名前は？"},{"en":"How old is she?","ja":"何歳ですか？"},{"en":"She’s so friendly!","ja":"人なつっこいですね！"},{"en":"Good girl!","ja":"いい子だね！"},{"en":"Nice talking to you.","ja":"話せて楽しかったです。"}],"quiz":[{"q":"Where did Hana take Daisy?","c":["To the store","To school","To the cafe","To the park"],"a":3},{"q":"What is the small brown dog’s name?","c":["Mochi","Peanut","Daisy","Coco"],"a":1},{"q":"Why was Hana happy after the walk?","c":["She talked in English for twenty minutes","She found money","She ate ice cream","She got a new dog"],"a":0}],"words":560},{"id":8,"level":1,"emoji":"📱","theme":"携帯ショップでSIM契約","titleEn":"Ten New Numbers","titleJa":"はじめてのアメリカ携帯","teaser":"地図も電話も使えない！ベンと携帯ショップへ。早口の店員さんに効く、魔法のひとこと。","story":"On Monday, Hana had one clear goal: an American phone number.\n\nHer phone worked only with wi-fi at home. No maps on the street. No calls to new friends.\n\n“In Japan, my phone knew everything,” Hana said at breakfast. “Here, it only sleeps.”\n\n“Funny AND sad,” Mike said.\n\n“No number, no life,” Ben said after school. “Let’s fix it.”\n\nThe phone store was bright and white. Phones sat on little tables, like small art.\n\nA young clerk smiled at them. His name tag said MARCUS.\n\n“Welcome! What can I do for you today?”\n\nHana stood tall. “I’d like a SIM card, please.”\n\n“Sure thing!” Marcus said. “Do you want data too? We have Basic, Plus, and Super Max, and Super Max has…”\n\nMarcus talked fast. Very fast. The words ran past Hana like fast dogs.\n\nPlan, data, unlimited… Hana caught one word in ten.\n\nBut she had a magic phrase in her notebook.\n\n“Could you say that again, please?” she asked. “Slowly, please.”\n\n“Oh! Sorry!” Marcus smiled and slowed down. “Okay. Three plans. Basic, Plus, Super Max.”\n\n“Basic,” Hana said. “What does it have?”\n\n“Five gigabytes of data. Calls and texts. Easy and cheap.”\n\n“How much is it per month?”\n\n“Thirty dollars,” Marcus said.\n\nHana did the math in her head. “About the same as Japan,” she said.\n\n“Smart shopper,” Marcus said.\n\n“Basic is enough,” Ben said. “You have wi-fi at home.”\n\nHana pointed. “Okay. This one, please.”\n\n“Can I see your passport?” Marcus asked.\n\n“Here you go.”\n\nMarcus put a tiny card in her phone. He typed fast. Then — ta-da!\n\nMarcus smiled big. “You’re all set. Your new number is on this paper.”\n\n“All set,” Hana repeated. “I like this phrase.”\n\nHana looked at the paper. Ten numbers, all hers.\n\n“Test it,” Ben said. “Call me.”\n\nHana called. Ben’s phone sang a basketball song.\n\nPeople in the store looked. Ben answered with a very serious face.\n\n“Hello, this is Ben,” he said. “Who is this?”\n\n“This is Hana. Your new sister from Japan.”\n\nBen laughed. “Nice. First call: done.”\n\n“Thank you for your help, Marcus!” Hana said.\n\n“Any time! Enjoy Portland!”\n\nOutside, Hana sent her first text to Carol: “Hello! This is Hana. My new American number!”\n\nCarol answered in ten seconds: “Yay! Welcome to my phone, Hana!”\n\nThen a text from Mike: “Great news! Now I can send you my jokes every day.”\n\nHana looked at Ben. “Every day?”\n\n“Every day,” Ben said. “I’m sorry.”\n\nThey laughed all the way to the bus stop.\n\nOn the bus, Ben showed her his screen. “Look. Our family group chat. I added you.”\n\nThe chat name was new: MILLER FAMILY + HANA.\n\n“Plus Hana,” she read softly. “I like this name a lot.”\n\n“Welcome to the team,” Ben said.\n\nAt home, Hana put her number on the fridge, next to the family photos.\n\n“Now everyone can find me,” she said. “And I can find everyone.”\n\n“Tomorrow is spaghetti night,” Carol said. “Big pot, much chopping. Kitchen team, get ready!”\n\n“Kitchen team,” Hana said. “That’s me.”\n\nThat night, her new phone made a soft ding. A joke from Mike, of course.\n\nIt said: “Why did the phone wear glasses? It lost its contacts!”\n\nHana did not understand. Ben sent one word: “Dad.”\n\nHana smiled in the dark. Tomorrow: onions, tomatoes, and her first American kitchen job.","glossary":[{"w":"goal","ja":"目標"},{"w":"clerk","ja":"店員"},{"w":"name tag","ja":"名札"},{"w":"SIM card","ja":"SIMカード"},{"w":"data","ja":"データ"},{"w":"magic","ja":"魔法の"},{"w":"gigabyte","ja":"ギガバイト"},{"w":"cheap","ja":"安い"},{"w":"per month","ja":"ひと月あたり"},{"w":"math","ja":"計算"},{"w":"typed","ja":"打ちこんだ"},{"w":"serious","ja":"まじめな"},{"w":"group chat","ja":"グループチャット"},{"w":"fridge","ja":"冷蔵庫"},{"w":"contacts","ja":"連絡先"}],"phrases":[{"en":"I’d like a SIM card, please.","ja":"SIMカードをお願いします。"},{"en":"Could you say that again, please?","ja":"もう一度言ってもらえますか？"},{"en":"How much is it per month?","ja":"月いくらですか？"},{"en":"This one, please.","ja":"これでお願いします。"},{"en":"You’re all set.","ja":"これで完了です。"}],"quiz":[{"q":"Who went to the phone store with Hana?","c":["Carol","Mike","Ben","Emma"],"a":2},{"q":"How much is the Basic plan?","c":["Thirty dollars a month","Thirteen dollars a month","Three dollars a month","A hundred dollars a month"],"a":0},{"q":"Why did Hana say “Could you say that again, please?”","c":["The store was loud","She was sleepy","Ben talked too much","Marcus talked very fast"],"a":3}],"words":555},{"id":9,"level":1,"emoji":"🍝","theme":"夕食の手伝い","titleEn":"Spaghetti Night","titleJa":"スパゲッティの夜","teaser":"今夜はハナもキッチンチーム！玉ねぎの涙、秘密のかくし味、そしてマイクの禁断のダジャレ。","story":"Tuesday evening was spaghetti night at the Miller house.\n\nAt five, good sounds came from the kitchen. Knife sounds. Water sounds. Radio music.\n\nHana came downstairs. Carol stood by a mountain of vegetables.\n\n“Can I help?” Hana asked.\n\n“Yes, please!” Carol said. “Wash your hands first, kitchen friend.”\n\nHana washed her hands. Carol gave her a knife and a cutting board.\n\n“Could you chop the onions?” Carol asked. “Small pieces, please.”\n\n“Chop means cut?” Hana asked.\n\n“Yes. Cut, cut, cut,” Carol said. “Chop, chop, chop. Same dance.”\n\nHana started. Chop, chop, chop. Then her eyes burned.\n\n“Carol… I’m not sad,” Hana said. Tears ran down her face. “But I’m crying.”\n\n“Onions,” Carol laughed. “They make everyone cry. Every country, same tears.”\n\nMike walked in. He saw Hana’s face.\n\n“Carol! Hana is sad!”\n\n“I’m not sad,” Hana laughed. “I’m chopping onions.”\n\n“Ah. Onion tears,” Mike said. “The happiest sad tears.”\n\nCarol cooked the meat. The pan went sss, like at the cafe.\n\n“Now the sauce,” Carol said. “Stir, please. Slow circles.”\n\n“Stir,” Hana repeated. She moved the big spoon. “New word. I like it.”\n\nTomatoes and onions went blub, blub in the pot. Carol added one small spoon of sugar.\n\nThe kitchen window got warm and cloudy.\n\n“Secret,” Carol said. “Don’t tell anyone.”\n\nHana looked into the pot. “It smells good.”\n\n“Wait thirty minutes,” Carol smiled. “Then it smells amazing.”\n\nBen came home with his basketball. “Is it spaghetti night? YES!”\n\nHe put plates on the table. “Forks go on the left,” he told Hana. “I learned that in first grade.”\n\nMike tasted the sauce with a small spoon. “Ten out of ten. Chef Carol and Chef Hana.”\n\nGarlic bread went into the oven. Soon the whole house smelled like a warm restaurant.\n\n“Dinner is ready!” Carol called.\n\nEveryone came fast. Even Daisy.\n\nDaisy sat under the table. Her spot. Her dream job.\n\nThe spaghetti was red, hot, and beautiful. Hana took one big bite.\n\n“Wow,” she said. “This is wonderful.”\n\nThen Mike put down his fork. “Okay, family. Big question.”\n\n“Dad. No,” Ben said.\n\n“What do you call a fake noodle?”\n\nQuiet. Carol looked at her plate. Ben looked at the ceiling.\n\n“An im-PASTA!” Mike said.\n\nHana thought for one second. Fake pasta. Im-pasta. Then she laughed. She laughed a lot.\n\n“No!” Ben said. “Never laugh! He gets stronger!”\n\n“I’m sorry,” Hana said. “But it’s funny. Fake pasta!”\n\n“Impostor means a fake person,” Ben said. “Dad breaks the word. Every week.”\n\n“Hana, you are my favorite child now,” Mike said.\n\n“HEY,” Ben said. Everyone laughed, even Ben.\n\nThe plates got empty fast. Hana looked at the big pot.\n\n“Can I have seconds?” she asked.\n\n“Of course!” Carol said. “Seconds and thirds. Cooks eat a lot.”\n\n“Seconds,” Hana said. “Today’s word number three.”\n\nAfter dinner, Hana and Ben washed the dishes. Mike dried. Carol drank tea. Boss time.\n\nThen — tap, tap. Rain came to the window.\n\n“Big rain tomorrow,” Carol said. “Real Portland rain.”\n\n“Tomorrow I want to go to the library,” Hana said. “I want easy English books.”\n\n“Take the 14 bus,” Mike said. “And ask the driver. Bus drivers know everything.”\n\n“My first American bus,” Hana said. “Okay. I can do it.”\n\nThat night, the rain sang on the roof.\n\nHana wrote three words in her notebook: chop, stir, seconds.\n\nSomewhere in the wet city, the 14 bus waited for her.","glossary":[{"w":"vegetables","ja":"野菜"},{"w":"cutting board","ja":"まな板"},{"w":"chop","ja":"刻む"},{"w":"pieces","ja":"小さな切れ"},{"w":"tears","ja":"涙"},{"w":"stir","ja":"かき混ぜる"},{"w":"sauce","ja":"ソース"},{"w":"secret","ja":"秘密"},{"w":"garlic","ja":"にんにく"},{"w":"oven","ja":"オーブン"},{"w":"fake","ja":"にせの"},{"w":"noodle","ja":"めん"},{"w":"impostor","ja":"なりすまし"},{"w":"seconds","ja":"おかわり"},{"w":"roof","ja":"屋根"}],"phrases":[{"en":"Can I help?","ja":"手伝おうか？"},{"en":"Could you chop the onions?","ja":"玉ねぎを刻んでくれる？"},{"en":"It smells good.","ja":"いいにおい。"},{"en":"Dinner is ready!","ja":"ごはんできたよ！"},{"en":"Can I have seconds?","ja":"おかわりしてもいい？"}],"quiz":[{"q":"What did the family eat?","c":["Pizza","Spaghetti","Pancakes","Curry"],"a":1},{"q":"What did Hana chop?","c":["Bread","Cheese","Tomatoes","Onions"],"a":3},{"q":"Why did everyone laugh at dinner?","c":["Daisy danced","The TV was funny","Mike made a pasta joke","Ben dropped a plate"],"a":2}],"words":563},{"id":10,"level":1,"emoji":"🌧","theme":"雨の日のバス初挑戦","titleEn":"The Rainy Day Bus","titleJa":"雨の日のバス大作戦","teaser":"本物のポートランドの雨、そして初めてのバス。親切な運転手さんと、本のお城への旅。","story":"Wednesday brought real Portland rain.\n\nNot soft rain. Big rain. The garden drank and drank.\n\n“Bus day,” Hana said to the mirror. “Library day. I can do it.”\n\nAt breakfast, Carol gave her a green bus card. “Tap it by the driver. Money is on it.”\n\n“Tap. Like the phone store,” Hana said.\n\n“Portland rule,” Ben said. “No umbrella. Just a good hood.”\n\nHana put up her hood and walked to the bus stop. Rain tapped on it. Tap, tap, tap.\n\nThree people waited. An old man read a wet newspaper. A girl danced a little to her music.\n\nThe bus came with a shhhh of water. Big and blue. The doors opened.\n\n“Big moment,” Hana thought. She stepped up.\n\n“Hello,” she said to the driver. “Does this bus go to the library?”\n\nThe driver was a big woman with kind eyes. “Central Library? Yes, honey. Six stops.”\n\nHoney again! Hana smiled. “How much is it?”\n\n“Two fifty. Tap your card there.”\n\nHana tapped. Beep. “Thank you.”\n\n“Sit close,” the driver said. “First time?”\n\n“Yes. Where should I get off?”\n\n“Tenth Street. Don’t worry. I can tell you.”\n\nHana sat by the window and watched the wet city. Cafes, bookstores, flower shops.\n\nThen — a dog in a red raincoat! Hana took a photo for Yui.\n\nPeople got on with wet coats and happy faces. Rain is normal here. Nobody runs.\n\n“In Matsuyama, everyone has an umbrella,” Hana thought. “Here, everyone has a hood.”\n\nHana counted the stops. One. Two. Three. Four. Five.\n\n“Tenth Street!” the driver called. “Library stop!”\n\nHana stood up. “This is my stop. Thank you very much!”\n\n“No problem.” The driver smiled. “The library is across the street. Go read something good.”\n\nHana crossed the street. Then she stopped and looked up.\n\nThe library was huge. Stone, glass, and many steps. A castle for books.\n\nInside was warm and quiet. Books stood in long lines, floor after floor.\n\nHana walked slowly. Then she saw a happy sign: EASY ENGLISH READERS.\n\nSmall books, big letters, friendly pictures. Perfect.\n\nShe sat and read a whole book about a small bear. She understood every page. Every page!\n\n“My first American book,” she thought. “Finished!”\n\nShe took three more books to the desk. A man with round glasses smiled.\n\n“Can I take these home?” Hana asked.\n\n“Do you have a library card?” he asked.\n\n“No. Not yet.”\n\n“You need one paper with your home address. Then the card is free.”\n\n“Free?” Hana asked. “All these books?”\n\n“All free, with a card. Library magic.”\n\n“Then I can come back,” Hana said. “Soon. With my paper.”\n\nShe read one more hour in a soft chair. Outside, the rain washed the city.\n\nThe bus home was easy. Tap, sit, count the stops. Like a Portland person.\n\nAt home, Carol had hot tea ready.\n\n“I took the bus two times!” Hana said. “And I read a whole book in English!”\n\n“A whole book!” Carol said. “Hana, that’s big.”\n\n“A small book,” Hana laughed. “But a whole book.”\n\n“Small books first,” Mike said. “Then big books. Then MY science books.”\n\n“One day,” Hana said. “Maybe.”\n\nThat night, Hana looked at the rain and smiled. Buses: easy now. Books: friends now.\n\nTomorrow, she wanted a latte and a talk with Emma at the Bluebird.\n\nBut this time, a small white paper on the cafe door waited for her — with two new words on it.","glossary":[{"w":"mirror","ja":"鏡"},{"w":"hood","ja":"フード"},{"w":"newspaper","ja":"新聞"},{"w":"driver","ja":"運転手"},{"w":"stops","ja":"停留所"},{"w":"raincoat","ja":"レインコート"},{"w":"counted","ja":"数えた"},{"w":"across the street","ja":"通りの向かい"},{"w":"crossed","ja":"渡った"},{"w":"huge","ja":"巨大な"},{"w":"castle","ja":"城"},{"w":"whole","ja":"丸ごと"},{"w":"address","ja":"住所"},{"w":"free","ja":"無料"}],"phrases":[{"en":"Does this bus go to the library?","ja":"このバスは図書館に行きますか？"},{"en":"How much is it?","ja":"いくらですか？"},{"en":"Where should I get off?","ja":"どこで降りればいいですか？"},{"en":"This is my stop.","ja":"ここで降ります。"},{"en":"No problem.","ja":"大丈夫ですよ。"}],"quiz":[{"q":"Why did Hana take the bus?","c":["It was raining hard","It was snowing","Her legs hurt","Ben took her bike"],"a":0},{"q":"Where did Hana go?","c":["To the beach","To school","To the library","To the cafe"],"a":2},{"q":"Why did Hana not take books home?","c":["The books were old","She had no library card","The library was closed","The books cost a lot"],"a":1}],"words":569},{"id":11,"level":1,"emoji":"📋","theme":"求人の貼り紙を見つける","titleEn":"Help Wanted","titleJa":"「スタッフ募集中」の貼り紙","teaser":"カフェのドアに求人の貼り紙が！パン屋で働いたハナ、勇気を出してロサに聞いてみる。","story":"Hana’s fourth week in Portland began on a sunny Tuesday.\n\nHana walked to Bluebird Cafe in the afternoon. She wanted a small latte. She also wanted to practice her English.\n\nThen she saw a paper on the door. It said, “Help Wanted.”\n\nHana stopped. Her heart beat fast.\n\n“Help wanted,” she read again. “They need a worker.”\n\nShe thought about her old job. She worked at a small bakery in Matsuyama. She loved that job.\n\nShe loved bread and cakes. She loved the warm smell of the ovens.\n\n“Can I work here?” she thought. “My English is not perfect. But I can try.”\n\nShe opened the door. The cafe was warm and busy.\n\nEmma was behind the counter. She smiled at Hana.\n\n“Hi, Hana! The usual small latte?” Emma asked.\n\n“Yes, please,” Hana said. Then she took a deep breath.\n\n“Emma, I saw the paper on the door. Are you still hiring?”\n\nEmma’s eyes got big. “Yes! Wait here.”\n\nThen she called, “Rosa! Come here, please!”\n\nRosa came from the kitchen. She had flour on her hands. She laughed her big laugh.\n\n“What is it, Emma? I’m making muffins,” Rosa said.\n\n“Hana has a question,” Emma said. “Ask her, Hana!”\n\nHana’s face was hot. But she spoke slowly and clearly.\n\n“Hello, Rosa. I saw the paper on the door. Are you still hiring?” she asked.\n\n“Yes, we are,” Rosa said. “We need help in the morning. Do you want the job?”\n\n“Yes, I do,” Hana said. “I worked at a bakery. It was in Japan.”\n\n“A bakery!” Rosa said. “What did you do there?”\n\n“I made bread and small cakes,” Hana said. “I helped customers. I like this work very much.”\n\nRosa smiled. “Do you like people?”\n\n“Yes. I’m a little shy. But I like people,” Hana said.\n\nEmma laughed. “She’s very nice, Rosa. She comes here every week. She always says thank you two times.”\n\nRosa laughed too. “That’s good. This cafe is like a family. We work hard. We laugh a lot.”\n\n“I can work hard,” Hana said. “But my English is simple. Is that okay?”\n\n“Your English is fine,” Rosa said. “You can learn here. You can practice with customers.”\n\nHana’s heart felt light. “Really?”\n\n“Really,” Rosa said. “Come back on Thursday at two o’clock. We can talk more. It’s a small interview. Don’t be nervous.”\n\n“An interview,” Hana said slowly. “Thursday at two. I can come.”\n\n“Great!” Rosa said. “Bring your smile. That’s all.”\n\nEmma gave Hana her latte. “This one is on the house.”\n\n“On the house?” Hana asked. “What does that mean?”\n\n“It means it’s free,” Emma said. “Good luck, Hana!”\n\n“Thank you so much. Thank you!” Hana said.\n\n“See? Two times,” Emma said, and everyone laughed.\n\nHana walked home fast. The sky was blue. The little pink flowers danced in the wind.\n\nAt home, Carol was in the kitchen with Daisy.\n\n“You look happy, Hana,” Carol said. “Good news?”\n\n“Yes! Bluebird Cafe needs a worker. I have an interview on Thursday,” Hana said.\n\n“That’s wonderful!” Carol said. “You worked at a bakery, right?”\n\n“Yes. I want this job very much,” Hana said.\n\nDaisy’s tail went thump, thump on the floor.\n\n“Look,” Carol laughed. “Daisy is happy for you too.”\n\nThat night, Hana wrote new words in her notebook.\n\nBut one small question stayed in her head. What do people ask at an interview in America?","glossary":[{"w":"Help Wanted","ja":"求人募集中"},{"w":"worker","ja":"働く人"},{"w":"bakery","ja":"パン屋"},{"w":"ovens","ja":"オーブン"},{"w":"counter","ja":"カウンター"},{"w":"took a deep breath","ja":"深呼吸した"},{"w":"hiring","ja":"募集中"},{"w":"flour","ja":"小麦粉"},{"w":"muffins","ja":"マフィン"},{"w":"customers","ja":"お客さん"},{"w":"shy","ja":"内気な"},{"w":"interview","ja":"面接"},{"w":"nervous","ja":"緊張して"},{"w":"on the house","ja":"お店のおごり"},{"w":"wonderful","ja":"すばらしい"}],"phrases":[{"en":"Are you still hiring?","ja":"まだ募集していますか？"},{"en":"I worked at a bakery.","ja":"パン屋で働いていました。"},{"en":"What does that mean?","ja":"それはどういう意味ですか？"},{"en":"Thank you so much.","ja":"本当にありがとうございます。"},{"en":"This one is on the house.","ja":"これはお店のおごりです。"}],"quiz":[{"q":"What did Hana see on the cafe door?","c":["A menu","A photo of a cat","A “Help Wanted” paper","A map of Portland"],"a":2},{"q":"Why does Hana want the job?","c":["She needs a new phone","She loved her bakery work in Japan","Ben asked her to work","She does not like her host family"],"a":1},{"q":"How does Hana feel at the end of the day?","c":["Happy, but a little worried","Angry at Emma","Bored with Portland","Sad about the cafe"],"a":0}],"words":562},{"id":12,"level":1,"emoji":"🤝","theme":"カフェの面接","titleEn":"The Interview","titleJa":"ドキドキの面接","teaser":"面接の日がやってきた。緊張で手が冷たいハナ。ロサの質問に、ゆっくり正直に答えていく。","story":"On Thursday, Hana walked to Bluebird Cafe for her interview.\n\nHer hands were cold. Her heart was loud.\n\n“You can do it,” she said to herself. “Speak slowly. Smile.”\n\nAt the door, Emma waved. “Hana! You came! Rosa is waiting.”\n\n“I’m very nervous,” Hana said.\n\n“Don’t worry. Rosa is kind. Just be you,” Emma said.\n\nRosa sat at a small table with two cups of tea.\n\n“Hi, Hana. Sit down, please,” Rosa said. “This is not a test. It’s just a talk.”\n\n“Thank you,” Hana said. She sat down. Her back was very straight.\n\nRosa smiled. “First question. Tell me about you.”\n\n“My name is Hana Sato. I’m twenty-four. I’m from Matsuyama, Japan,” Hana said.\n\n“I came here in April. I live with the Miller family.”\n\n“Good,” Rosa said. “Why do you want this job?”\n\nHana thought for a moment. She wanted the right words.\n\n“I love cafes. I love bread and cakes,” she said.\n\n“And I want to talk with people. I want to learn English with my hands and my heart.”\n\nRosa’s eyes were warm. “That’s a good answer. Tell me about your old job.”\n\n“I worked at a bakery in Japan. For three years,” Hana said.\n\n“I made bread every morning. I was never late. I’m a hard worker.”\n\n“Were the mornings early?” Rosa asked.\n\n“Yes. Four thirty,” Hana said.\n\n“Four thirty!” Rosa laughed her big laugh. “Here, we start at seven. Easy!”\n\nHana laughed too. Her hands were not cold now.\n\nThe tea was warm and sweet. It helped a little.\n\n“Now, a hard question,” Rosa said. “A customer is angry. His coffee is wrong. What do you do?”\n\nHana was quiet for a moment. Emma watched from the counter.\n\n“First, I say sorry,” Hana said. “Then I make a new coffee. Fast. And I smile.”\n\n“Perfect,” Rosa said. “That’s the whole job.”\n\nEmma brought two cookies. “Sorry! These are for the interview,” she said. “They help.”\n\n“Emma!” Rosa said, but she laughed.\n\nRosa looked at Hana. “Okay, last question. Do you have questions for me?”\n\nHana nodded. “Yes, two. What time is work? And… is my English okay for this job?”\n\n“Morning shift, seven to one,” Rosa said.\n\n“And your English? You listen well. You speak clearly. You say sorry and thank you. That’s cafe English.”\n\n“Really?” Hana asked.\n\n“Really. The rest comes with time,” Rosa said.\n\nHana took a deep breath. “When can I start?”\n\nRosa laughed again, very big. “I like that question! Give me a day or two. I can call you soon.”\n\n“Okay. Thank you very much for your time.”\n\nHana stood up and gave a small bow. Then she stopped. “Oh. In America, no bow?”\n\n“Bow, handshake, high five — all fine here,” Rosa said.\n\nShe put out her hand. Hana shook it. Her hand was warm and strong.\n\nEmma gave her a high five too. “You did great!”\n\nOutside, the sun was soft. Hana called Carol.\n\nThe air smelled like rain and flowers.\n\n“How was it?” Carol asked.\n\n“I said everything. Slowly, but I said it,” Hana said. “Rosa can call me soon.”\n\n“That’s great, Hana. We’re proud of you,” Carol said.\n\nThat night, Hana looked at her phone many times. No call yet.\n\nDaisy sat by her feet. Her tail was slow and kind.\n\n“Tomorrow,” Hana said to Daisy. “Maybe tomorrow the phone rings.”","glossary":[{"w":"interview","ja":"面接"},{"w":"nervous","ja":"緊張して"},{"w":"straight","ja":"まっすぐ"},{"w":"for a moment","ja":"少しの間"},{"w":"hard worker","ja":"働き者"},{"w":"customer","ja":"お客さん"},{"w":"angry","ja":"怒って"},{"w":"wrong","ja":"まちがった"},{"w":"whole","ja":"全部の"},{"w":"shift","ja":"勤務・シフト"},{"w":"clearly","ja":"はっきりと"},{"w":"The rest","ja":"残り"},{"w":"bow","ja":"おじぎ"},{"w":"handshake","ja":"握手"},{"w":"proud","ja":"誇りに思う"}],"phrases":[{"en":"Don’t worry.","ja":"心配しないで。"},{"en":"I’m a hard worker.","ja":"私は働き者です。"},{"en":"When can I start?","ja":"いつから始められますか？"},{"en":"Thank you very much for your time.","ja":"お時間ありがとうございました。"},{"en":"How was it?","ja":"どうだった？"}],"quiz":[{"q":"Who did the interview with Hana?","c":["Emma","Mike","Carol","Rosa"],"a":3},{"q":"A customer is angry. What does Hana say she does first?","c":["She says sorry","She calls Rosa","She goes home","She laughs"],"a":0},{"q":"Why does Hana look at her phone at night?","c":["She plays a game","She texts Emma","She waits for Rosa’s call","She takes photos"],"a":2}],"words":556},{"id":13,"level":1,"emoji":"🎉","theme":"採用の電話と前夜","titleEn":"The Phone Call","titleJa":"うれしい電話と眠れない夜","teaser":"電話が鳴った！ロサからの知らせにハナは大よろこび。でもその夜、なかなか眠れなくて…","story":"The next morning, Hana helped Carol in the garden.\n\nHer phone was in her pocket. She checked it many times.\n\n“A watched pot never boils,” Carol said with a smile.\n\n“A pot?” Hana asked. “I don’t understand.”\n\n“It means: don’t wait and watch. Time goes slowly then,” Carol said.\n\n“Ah! In Japan, we have words like that too,” Hana said.\n\nThey planted small tomato plants. The dirt was soft and cool. Daisy slept in the sun.\n\nThen, at eleven o’clock, the phone rang.\n\nHana froze. “Carol! It’s the cafe!”\n\n“Answer it!” Carol said. “Breathe first.”\n\nHana took a deep breath. “Hello? This is Hana.”\n\n“Hana! It’s Rosa from Bluebird Cafe. Good news. The job is yours!”\n\n“Really?” Hana’s voice was very high. “Thank you! Thank you so much!”\n\n“Can you start on Monday at seven?” Rosa asked.\n\n“Yes! Monday at seven. I can do that,” Hana said.\n\n“Great. Wear comfortable shoes. See you Monday!” Rosa said, and laughed her big laugh.\n\nHana put down the phone. Her hands shook a little.\n\n“Carol… I got the job!” she shouted.\n\n“You got the job!” Carol shouted too.\n\nThey danced in the garden. Daisy woke up and barked. It was a happy noise.\n\n“I want to tell everyone,” Hana said. “Mike, Ben, my family in Japan!”\n\nAt dinner, there was a small party. Carol made roast chicken. There was apple pie too.\n\n“To Hana!” Mike said. He held up his glass of juice. “Bluebird Cafe is lucky.”\n\n“To Hana!” everyone said.\n\nBen looked up from his phone. “Nice job, Hana. Free muffins for me, right?”\n\n“Ben!” Carol said, but everyone laughed.\n\n“Maybe one small muffin,” Hana said, and laughed too.\n\nMike smiled. “I have a joke. Why did the coffee call the police?”\n\n“Why?” Hana asked.\n\n“Because it got mugged!” Mike said.\n\nBen said, “Dad, no.” But Hana laughed.\n\nThen Mike explained: a mug is a coffee cup. Hana learned a new word.\n\nAfter dinner, Hana called her mother in Japan. She spoke in Japanese, fast and happy.\n\nThen she practiced in English with Carol.\n\n“I got the job! I start on Monday,” she said.\n\n“Perfect,” Carol said. “Say it just like that.”\n\nBut that night, Hana could not sleep.\n\nShe looked at the dark ceiling. Her head was full of questions.\n\n“What do I say to customers? What do I do first? My English is so small.”\n\nShe got up for water. The kitchen light was on.\n\nCarol was there with warm milk. “Can’t sleep?” she asked.\n\n“No,” Hana said. “I’m happy. But I’m scared t
