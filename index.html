hook a little — the good shake.\n\n“Ms. Alvarez.” She held out the envelope with both hands and bowed, because some things stay Japanese forever.\n\n“On behalf of Bluebird Cafe, I would like to give you this. Two thousand, three hundred and forty-one dollars — from your neighbors, one cookie at a time.”\n\nThe warehouse went quiet. Ms. Alvarez took the envelope, and for a moment the fast, warm eyes were only warm.\n\n“This means a lot. I say thank you many times in this job,” she said slowly. “This time I need a bigger word, and I don’t have one.”\n\n“In January, this becomes milk. Bread. Apples. Warm dinners on cold nights. You didn’t raise money, friends. You raised seventy families for two weeks.”\n\n“Seventy families,” Hana repeated. The number moved into her chest and made itself a home there.\n\nA volunteer started clapping, and then all of them did, over the towers of boxes.\n\n“You should have seen Hana on Saturday,” Rosa said. “Speeches from a chair. Sold out by two thirty.”\n\n“I read the paper,” Ms. Alvarez smiled. “The whole city read the paper. You’re the baker from Matsuyama.”\n\nHana’s cheeks went warm. “It was a team effort. Truly. The whole neighborhood baked this envelope.”\n\n“And there’s more,” Rosa said. She set a big white box on the table and opened it: sixty fresh rolls, baked that morning, still breathing warmth.\n\n“For today’s boxes. And here’s the standing offer: Bluebird will bake for you once a month, every month. Bake Day is over, but bread keeps happening.”\n\nMs. Alvarez pressed both hands to her chest. “Once a month? Do you know what fresh bread does to a food box? It turns groceries into a gift.”\n\nThey stayed an hour, helping pack. Hana stood between Mrs. Chen and a college student, sliding bread into boxes, learning the rhythm.\n\nThe student taught her the box-packer’s rule: heavy things dream at the bottom, bread rides on top. Hana repeated it like a poem.\n\nNear the end, her eyes found the sign-up sheet by the door. VOLUNTEERS NEEDED — SATURDAYS IN JANUARY.\n\nShe picked up the pen. Then she stopped.\n\nJanuary. Where would she even be in January? Portland? Matsuyama? The question stood behind her lately, quiet as snow, waiting.\n\nShe put the pen down without writing and told herself it was because her hands were full of bread.\n\nRosa saw the whole thing from across the table and said nothing at all.\n\nAs they were leaving, a small girl came in with her mother, carrying a new drawing for the wall.\n\nMs. Alvarez taped it up, then laughed out loud. “Team Bluebird. Come look at this.”\n\nThe drawing showed a round blue bird in a chef’s hat, holding a cookie the size of the sun. Under it, in careful crayon: THANK YOU BAKER BLOO.\n\nUnder the bird, the girl had drawn a line of people holding cookies, all smiling with too many teeth.\n\n“That’s my bird,” Emma whispered. “That’s my bird on the wall.” She turned away and pretended to study the rice shelf, and everyone kindly let her.\n\nAt the green door, Ms. Alvarez shook every hand twice.\n\n“You’re welcome anytime. Tuesdays, Fridays, Saturdays — the boxes never stop. Bring bread, bring hands, bring nothing. Just come.”\n\n“We will,” Rosa said.\n\n“Keep up the good work. All of it — the bread AND the kindness,” Ms. Alvarez called after them. “The neighborhood is watching, and it likes what it sees.”\n\nRosa saluted. Emma saluted. Mrs. Chen just nodded, like a general watching good soldiers.\n\nThey walked home through the cold in a glowing quiet.\n\nMrs. Chen took Hana’s arm. “Eleven years of Tuesdays,” she said, “and today was my favorite one.”\n\n“Why today?” Hana asked.\n\n“Because I brought friends,” Mrs. Chen said, as if the answer were obvious.\n\nAt the cafe door, Emma and Mrs. Chen went in for hot tea. Rosa touched Hana’s shoulder and held her back a moment.\n\n“Come in early tomorrow,” she said. “Before opening. Just us two.”\n\n“Is something wrong?” Hana asked.\n\n“Nothing’s wrong.” Rosa smiled a strange, soft smile — nervous, which was new. “I want to talk to you about something. It can’t wait much longer.”\n\nThat night, Hana lay awake listening to her own heartbeat, wondering what question tomorrow was bringing.","glossary":[{"w":"frost","ja":"霜"},{"w":"envelope","ja":"封筒"},{"w":"cardboard","ja":"段ボール"},{"w":"retirement","ja":"引退"},{"w":"willpower","ja":"意志の力"},{"w":"rhythm","ja":"リズム"},{"w":"nudged","ja":"そっと押した"},{"w":"on behalf of","ja":"〜を代表して"},{"w":"raise money","ja":"お金を集める"},{"w":"standing offer","ja":"続く約束"},{"w":"groceries","ja":"食料品"},{"w":"sign-up sheet","ja":"申込用紙"},{"w":"crayon","ja":"クレヨン"},{"w":"saluted","ja":"敬礼した"},{"w":"heartbeat","ja":"鼓動"}],"phrases":[{"en":"On behalf of Bluebird Cafe, I would like to give you this.","ja":"ブルーバードカフェを代表して、これをお渡しします。"},{"en":"This means a lot.","ja":"本当にありがたいです。"},{"en":"It was a team effort.","ja":"みんなの力ですよ。"},{"en":"You’re welcome anytime.","ja":"いつでも歓迎しますよ。"},{"en":"Keep up the good work.","ja":"その調子で頑張ってね。"}],"quiz":[{"q":"Who is Ms. Alvarez?","c":["The director of the food bank","A radio show host","A newspaper writer","The owner of a bakery"],"a":0},{"q":"What will Bluebird Cafe do every month from now on?","c":["Hold a big bake day","Bake fresh bread for the food bank","Give money to Grace","Close for a holiday"],"a":1},{"q":"Why did Hana stop at the volunteer sign-up sheet?","c":["She hated writing her name","She was too tired to write","She could not find a pen","She did not know where she would be in January"],"a":3}],"words":1178},{"id":90,"level":4,"emoji":"🌟","theme":"「ここに残らない？」","titleEn":"We’d Love for You to Stay","titleJa":"ここに残らない？","teaser":"開店前のカフェにお茶をいれて待つロサ。いつになく緊張した様子で、ハナに大切な話があるらしい。","story":"Wednesday morning, an hour before opening, the Bluebird Cafe was empty, warm, and very quiet.\n\nSnow drifted past the windows, small and unhurried. Hana let herself in with her key and found Rosa at the corner table — with a teapot.\n\nThe chairs were still upside down on the tables, sleeping. The pastry case stood empty and clean, waiting for the day.\n\nNot coffee. Tea. Two cups, set out carefully, like guests were coming.\n\n“You made tea?” Hana asked, hanging up her coat.\n\n“I tried,” Rosa said. “It’s matcha. I’ve watched you do it a hundred times. Mine came out… angry.”\n\nHana tasted it and coughed politely. “It’s very strong.”\n\n“It’s terrible,” Rosa said. “Sit down anyway. If I wait any longer, I’ll lose my nerve.”\n\nHana sat. Outside, the snow kept falling. Inside, Rosa turned her cup in slow circles, which Hana had never seen her do.\n\n“Twenty years I’ve had this cafe,” Rosa began. “I’ve hired a lot of people. Good people, mostly. They come, they learn, they move on. That’s how cafes work.”\n\n“Some of them still send postcards,” she added. “A cafe collects people. That’s the real business.”\n\n“In April, a girl walked in pointing at a help-wanted sign, holding her dictionary like a shield. She could barely finish her sentences.”\n\n“I remember her,” Hana said softly.\n\n“I hired her because she looked at the pastry case the way painters look at the sea.” Rosa smiled. “I thought: this one bakes with her whole heart. The English will come.”\n\n“And it came. But that’s not the point this morning.” Rosa took a breath, and Hana realized, with wonder, that her boss was nervous.\n\n“Hana. I’m not good at slow speeches, so here it is. I want you to work here for real. Full time. A real position, a real wage — head baker of the Bluebird Cafe.”\n\nThe words seemed to keep making sound after Rosa stopped saying them.\n\nThe cafe was so quiet Hana could hear the snow touch the window.\n\n“Head… baker?”\n\n“There’s more.” Rosa slid a folded paper across the table. On it, in Rosa’s handwriting, was a little drawing of the pastry case, with a sign above one shelf: HANA’S CORNER.\n\n“Your own corner. Matcha rolls, Best Friend Brownies, dorayaki in spring — whatever your hands dream up. Your recipes, your name on the little cards.”\n\n“I talked to a lawyer last week about the paperwork,” Rosa went on. “It’s a mountain, but it’s a mountain people climb. The cafe would sponsor you. I’d climb it with you.”\n\n“A lawyer?” Hana said. “You already talked to a lawyer?”\n\n“Last week,” Rosa said. “I plan ahead when I’m scared. It’s a gift.”\n\nHana looked at the paper. Her eyes were doing something complicated, so she held the paper very still.\n\n“Rosa… why? The winter is slow. You don’t need a full-time baker.”\n\n“Don’t tell me what I need,” Rosa said, but gently. “Bake Day filled this room with five hundred neighbors. The matcha latte pays for its own shelf. That’s business.”\n\n“And the rest isn’t business at all. Emma laughs more when you’re here. Leo behaves — a little. Mrs. Chen has a second home at that window table. You didn’t just learn this neighborhood, Hana. You became part of the recipe.”\n\n“So yes.” Rosa folded her hands. “We’d love for you to stay. Me, and everyone who doesn’t know I’m asking you yet.”\n\n“They don’t know?”\n\n“I wanted to ask you first,” Rosa said, “before Emma fills the room with confetti and opinions.”\n\nHana laughed, and the laugh came out wet at the edges. She looked around the cafe — the window table, the register she had once feared, the chair she had stood on.\n\nThe old fear of English felt like a story about a different person.\n\nJoy was in her chest, loud as the Bake Day cheer. And right beside it, quiet as snow, stood everything else.\n\n“Rosa, I have to be honest. My heart is doing two things at once.”\n\n“Tell me both.”\n\n“One half is dancing. This cafe is… it’s my Portland home. You’re asking me to keep my whole life here, and that half of me wants to sign anything you put on this table.”\n\n“And the other half?”\n\n“The other half lives in Matsuyama.” Hana turned her cup slowly. “My family. My old bakery. And a small dream I’ve had since I was little — someday, a place of my own. I told Carol about it on the porch last month. What do I do with that half?”\n\nRosa didn’t answer right away. Outside, a bus hissed past through the slush.\n\nThen she nodded slowly, the way people nod when they already knew the answer would be hard.\n\n“I’m not asking you to cut yourself in half,” she said. “I’m asking you to think. That’s all. It’s a big decision. Nobody should make it at seven in the morning over terrible matcha.”\n\nHana smiled at that. Then she asked the question that needed asking.\n\n“Can I think about it?”\n\n“Take your time. Really,” Rosa said. “Sleep on it. Sleep on it many nights, if you need to. Talk to your people. Just tell me before Christmas — so I can order a bigger pastry case, or start learning to bake matcha rolls myself.”\n\n“Please don’t bake matcha rolls yourself,” Hana said.\n\n“Then you understand the stakes,” Rosa said, and her big laugh finally came back, filling the empty cafe like morning light.\n\nThey opened the cafe together, and the day pretended to be normal.\n\nIt failed completely.\n\nEverything Hana looked at asked the question. The register: stay? The corner table: go? The snow on the window: what does your heart say, Hana Sato?\n\nA regular asked her, “How’s it going?” — the little question she had once practiced for a week — and she almost answered with the whole truth.\n\nEmma studied her twice across the counter. “You’re quiet today. Chair-speech quiet. Something’s cooking.”\n\n“Just tired,” Hana said, and hated the small lie immediately.\n\nAt closing, Rosa caught her eye and mouthed: no hurry. It helped, and it didn’t.\n\nHana walked home the long way, through the falling snow, past the food bank’s green door, past the bookstore with Baker Blue still in the window.\n\nThe neighborhood glowed in the early dark, wearing its December lights. It looked exactly like a place a person could stay. And exactly like a place a person could carry home in her heart, all the way across the sea.\n\nHer phone buzzed: a photo from Yui — the newspaper article, still on the bakery wall in Matsuyama, now wearing a gold star sticker, courtesy of her old boss.\n\nAt the Millers’ gate, Daisy met her with a joyful, snowy nose. Through the kitchen window, Carol was cooking, Mike was talking, Ben was laughing at his phone.\n\nHana stood in the snow a moment, practicing a question against the cold air.\n\n“What would you do?” she whispered — because tomorrow, she was going to need everyone’s answer.","glossary":[{"w":"unhurried","ja":"ゆったりした"},{"w":"pastry case","ja":"菓子の陳列棚"},{"w":"lose my nerve","ja":"勇気を失う"},{"w":"shield","ja":"盾"},{"w":"wage","ja":"賃金"},{"w":"lawyer","ja":"弁護士"},{"w":"paperwork","ja":"書類手続き"},{"w":"sponsor","ja":"身元保証する"},{"w":"confetti","ja":"紙吹雪"},{"w":"wet at the edges","ja":"涙まじりの"},{"w":"slush","ja":"とけかけの雪"},{"w":"stakes","ja":"事の重大さ"},{"w":"mouthed","ja":"口だけで言う"},{"w":"courtesy of","ja":"〜の計らいで"}],"phrases":[{"en":"We’d love for you to stay.","ja":"ぜひここに残ってほしいの。"},{"en":"Can I think about it?","ja":"考えてもいいですか？"},{"en":"Take your time.","ja":"ゆっくりでいいよ。"},{"en":"It’s a big decision.","ja":"大きな決断だからね。"},{"en":"Sleep on it.","ja":"一晩寝て考えてみて。"}],"quiz":[{"q":"What did Rosa offer Hana?","c":["A ticket to Japan","Her own cafe as a gift","A full-time job as head baker","A bigger apartment"],"a":2},{"q":"What was HANA’S CORNER in Rosa’s drawing?","c":["A new table by the window","A chair for giving speeches","A room above the cafe","A shelf in the pastry case for Hana’s own recipes"],"a":3},{"q":"Why couldn’t Hana answer right away?","c":["She did not like the cafe anymore","Half of her heart was still in Matsuyama","Rosa’s matcha was too strong","She wanted a bigger wage"],"a":1}],"words":1176},{"id":91,"level":4,"emoji":"🤔","theme":"みんなに相談する","titleEn":"Everyone Has an Opinion","titleJa":"みんなの答え、わたしの答え","teaser":"残る？帰る？ハナは大切な人たちに相談してまわる。でも返ってくる答えはみんなバラバラで…","story":"It was the middle of December, and Hana carried a big question everywhere she went.\n\nFive days had passed since Rosa had offered her a real job at Bluebird Cafe. Five days of lists, long showers, and staring at the ceiling at two in the morning.\n\n“You look tired,” Emma said on Monday, before the morning rush. “Still thinking about the offer?”\n\n“I think about it while I brush my teeth,” Hana said. “I think about it while I steam milk. Last night I even dreamed about it.”\n\n“What happened in the dream?”\n\n“I opened a door. But the dream ended before I saw what was inside.”\n\n“Wow,” Emma said. “Even your dreams won’t give you a straight answer.”\n\n“So I’m asking real people instead. Emma, honestly — what should I do?”\n\n“Stay. Obviously. Forever. The end.” Emma counted on her fingers. “We’ll get an apartment, you’ll run the kitchen at Bluebird, and we’ll grow old complaining about the rain.”\n\nHana laughed. “Very helpful. Thank you.”\n\n“Okay, my real answer.” Emma’s voice went soft. “I want you to stay so badly that my opinion is useless. Ask someone whose heart isn’t in the way.”\n\nAt noon, Hana found Rosa in the tiny office, fighting with a pile of receipts.\n\n“Rosa, when do you need my answer?”\n\n“When it’s ready,” Rosa said, without looking up. “A rushed yes is worse than a slow no. It’s up to you. The job, the timing, all of it.”\n\n“You’re not going to tell me what to choose?”\n\nRosa finally looked up, and her big laugh filled the little room. “I’m the last person to ask! Of course I want you here. But this is your life, not my menu.”\n\n“Although,” she added, pointing a pen at Hana, “if you stay, I’m painting your name on the window. The offer includes fame.”\n\nThat evening, Hana and Leo closed the cafe together. She watched him stack chairs and gathered her courage.\n\n“Leo, can I ask you something serious?”\n\n“I’m always serious,” he said, balancing a chair on one finger.\n\n“What would you do?”\n\nLeo put the chair down and thought for a real minute, which was rare for him.\n\n“When I left Brazil, everyone said, ‘Stay home, it’s safer.’ I came anyway. Best choice of my life.”\n\n“So you think I should stay in Portland?”\n\n“No, no. Listen. The best part wasn’t the country. It was choosing for myself. That feeling — nobody can hand it to you, and nobody can take it away.”\n\n“That’s deep, Leo.”\n\n“I know,” he said. “I’m going to write it on a cup.”\n\nAt dinner, Hana asked the Millers. Mike put down his fork, which meant he was serious.\n\n“A good job in a city you love, or a new dream in the town you’re from,” he said. “That’s a tough call.”\n\n“When I was twenty-five, I almost took a teaching job in Alaska,” he went on. “I stayed here instead. Sometimes I wonder about that other life. But wondering isn’t regret.”\n\n“So you’re saying both answers can be right?” Hana asked.\n\n“I’m saying both roads can be good roads. That’s the annoying truth about big choices.”\n\nCarol passed the potatoes. “Don’t decide at night,” she said. “Problems grow bigger in the dark. Sleep, eat, walk. Take your time.”\n\nThen Ben looked up from his phone, which surprised everyone.\n\n“Can I say something? When you came in April, you were scared of the toaster.”\n\n“I was not scared of the toaster.”\n\n“You bowed to it once.”\n\n“It made a sudden loud noise!”\n\n“My point is,” Ben said, “you’re not that person anymore. So don’t pick the thing that keeps you safe. Pick the thing that keeps you growing.”\n\nThe table went quiet. Carol stared at her son with her mouth open.\n\n“What?” Ben said, turning red. “I listen in class sometimes.”\n\nAfter dinner, Hana video-called Yui, who answered with toothpaste still on her chin.\n\n“Finally!” Yui said. “Mom and Dad talk about your decision every single dinner. It’s better than television.”\n\n“And what do you think I should do?”\n\n“My selfish answer? Come home. I miss you, and Mom cries at bread commercials now.”\n\n“She does not.”\n\n“She absolutely does. But my honest answer…” Yui paused. “In Portland, I saw you shine. You had a light I’d never seen in Matsuyama. So maybe the real question is — can you carry that light home with you?”\n\nHana was quiet for a long moment. “When did you get so wise?”\n\n“I’ve always been wise. You just never listened,” Yui said, and stuck out her tongue.\n\nThe next afternoon, Hana knocked on Mrs. Chen’s door with a small box of cookies. Mochi sniffed the box carefully and approved.\n\n“I heard about Rosa’s offer,” Mrs. Chen said, pouring jasmine tea. “News travels fast on this street.”\n\n“Everyone has an opinion,” Hana said. “Emma says stay. Leo says choose for myself. Ben says grow. Yui asks if I can carry my light home. My head is so full of voices that I can’t hear anything.”\n\nMrs. Chen laughed softly. “May I tell you what I told my students for forty years?”\n\n“Please.”\n\n“Advice is a map of someone else’s city. Interesting to study — but you can’t use it to find your own streets.”\n\nHana turned her teacup slowly. “Then how do I find my map?”\n\n“Stop collecting voices,” Mrs. Chen said. “Go somewhere quiet, far from all of us who love you. Then listen for the smallest voice inside. It’s usually the true one.”\n\nThat evening, Hana sat at the kitchen table and wrote two lists in her notebook: Stay in Portland and Go home to Matsuyama.\n\nBoth lists were long. Both lists were honest. At the top of the first she had written friends. At the top of the second, family. Some choices, she thought, are between two kinds of love.\n\nCarol set down two cups of tea and read the lists over her shoulder.\n\n“I have to stop asking people,” Hana said. “Mrs. Chen told me to find a quiet place and listen to my own voice.”\n\n“Smart woman,” Carol said.\n\nMike looked up from his crossword. “Mt. Hood is quiet this time of year. There’s a day bus on Saturdays — snow, trees, hot chocolate, and nobody asking questions.”\n\n“A whole day alone on a mountain?” Hana said slowly. “I’ve never done that here.”\n\n“First time for everything,” Carol said. “And Hana, listen. Whatever you choose, we’ve got your back. Stay, go, open a cafe on the moon — we’re with you.”\n\n“A moon cafe would struggle,” Mike said. “No atmosphere.”\n\nBen groaned. Carol threw a napkin at him. Hana laughed until her eyes were wet, and not only from laughing.\n\nThat night she packed a small bag: her notebook, two pens, warm socks, and one cookie for the road. Outside her window, the neighborhood slept under a thin blanket of snow.\n\nThe mountain was waiting — and somewhere up there, in all that quiet snow, so was her answer.","glossary":[{"w":"offer","ja":"申し出"},{"w":"steam","ja":"蒸気で温める"},{"w":"straight answer","ja":"明確な答え"},{"w":"receipts","ja":"レシート"},{"w":"rushed","ja":"急ぎすぎた"},{"w":"courage","ja":"勇気"},{"w":"rare","ja":"珍しい"},{"w":"tough call","ja":"難しい判断"},{"w":"regret","ja":"後悔"},{"w":"selfish","ja":"自分勝手な"},{"w":"wise","ja":"賢い"},{"w":"approved","ja":"認めた"},{"w":"advice","ja":"助言"},{"w":"crossword","ja":"クロスワード"},{"w":"atmosphere","ja":"大気・雰囲気"}],"phrases":[{"en":"What would you do?","ja":"あなたならどうする？"},{"en":"It’s up to you.","ja":"あなた次第だよ。"},{"en":"That’s a tough call.","ja":"それは悩ましいね。"},{"en":"Take your time.","ja":"ゆっくりでいいよ。"},{"en":"Whatever you choose, we’ve got your back.","ja":"何を選んでも味方だよ。"}],"quiz":[{"q":"Who told Hana about the day bus to Mt. Hood?","c":["Ben","Rosa","Mike","Leo"],"a":2},{"q":"What did Mrs. Chen mean when she said advice is a map of someone else’s city?","c":["Hana must find her own answer","Hana should buy a city map","Portland is easy to get lost in","Hana should ask even more people"],"a":0},{"q":"Why were Hana’s eyes wet at the end of dinner?","c":["She was angry at Ben","The onions were too strong","She was afraid of the mountain","She felt loved and a little sad"],"a":3}],"words":1170},{"id":92,"level":4,"emoji":"🏔","theme":"ひとり旅で考える","titleEn":"Snow, Silence, and a Notebook","titleJa":"雪と静けさと、一冊のノート","teaser":"答えを探して、ハナは雪のマウントフッドへひとり旅。バスで隣に座った女性の言葉が心に響く。","story":"On Saturday, Hana woke before the sun and caught the early bus toward Mt. Hood, alone.\n\nWell — almost alone at first. Carol was already in the kitchen, filling a paper bag with sandwiches and a thermos of hot tea.\n\n“You didn’t have to get up,” Hana said.\n\n“Nurses and mothers don’t know how to sleep in,” Carol said. “Here. Mountain air makes people hungry.”\n\n“Carol, thank you for understanding. I need some time to think. Just me, my notebook, and a lot of snow.”\n\n“That’s the healthiest sentence I’ve heard all week,” Carol said. “Go. Listen for that small voice.”\n\nAt the station downtown, the ticket window glowed warm in the cold morning.\n\n“Round trip, please. To Mt. Hood,” Hana said.\n\n“Good day for it,” the clerk said. “Clear skies. You’ll see forever from up there.”\n\nThe bus was half empty. Hana took a window seat and watched Portland slide away — the bridges, the river, the street that led to Bluebird Cafe.\n\nAn older woman in a red wool coat stopped in the aisle beside her.\n\n“Is this seat taken?”\n\n“No, please,” Hana said, moving her bag.\n\nThe woman sat down with a happy sigh. “I’m Ruth. I talk too much on buses. You’ve been warned.”\n\nHana laughed. “I’m Hana. I might be bad company today — I came to think, not to talk.”\n\n“Perfect,” Ruth said. “Thinking people are my favorite people to interrupt.”\n\nFor a while they watched the trees grow taller and the snow grow deeper outside the window.\n\n“So,” Ruth said. “What brings you here?”\n\n“A question,” Hana said. “A big one. And you?”\n\n“A promise. My husband loved the first deep snow. He passed three years ago, so every December I ride up and look at it for both of us.”\n\n“I’m sorry,” Hana said softly.\n\n“Don’t be. It’s a good trip. Sad and sweet at the same time — like most good things.” Ruth unwrapped a peppermint. “Now, your big question. Let me guess. Stay or go?”\n\nHana turned from the window, surprised. “How did you know?”\n\n“Young person, alone, notebook, mountain. It’s always love or geography,” Ruth said. “Sometimes both.”\n\n“Mine is geography. I think.” And then the whole story came out — the bakery in Matsuyama, the Millers, Bluebird Cafe, Rosa’s offer, and everyone’s different advice.\n\nRuth listened all the way up the mountain, nodding slowly at the right places.\n\n“Fifty years ago I moved here from Ohio,” she said at last. “I cried for a month. Then one day this place was home, and I couldn’t tell you when it happened.”\n\n“That’s what scares me,” Hana said. “Portland became home. If I leave, do I lose it?”\n\n“Oh, honey, no.” Ruth shook her head. “Home isn’t a suitcase with one lock. You can carry more than one. You’ll see.”\n\nThe bus climbed the last long hill, and everyone on board said “Ohh” at the same time.\n\nThe mountain stood above the trees, white and enormous against a hard blue sky.\n\nAt the lodge stop, Hana helped Ruth down the icy steps, and they stood together in the bright cold, breathing clouds.\n\n“The view took my breath away. I’ve seen photos, but this is completely different,” Hana said.\n\n“Photos are just the menu,” Ruth said. “This is the meal. Now go think. I have snow to watch.”\n\nThey agreed to meet for the four o’clock bus, and Hana walked toward the viewpoint alone.\n\nSnow squeaked under her boots. The air smelled like pine trees and cold metal. Somewhere a bird called once, and then there was nothing.\n\nShe found a wooden bench, brushed off the snow, and sat with her notebook on her knees.\n\nFor a long time she wrote nothing. She just breathed, and let the silence get comfortable beside her.\n\nThen she opened the notebook and read her two lists again. Stay. Go home. Friends. Family.\n\nOn a new page she wrote a different question: Where do I want to be standing in ten years?\n\nShe closed her eyes. She saw a small cafe on a quiet street. Warm light in the window. The smell of fresh bread and matcha. A blue apron hanging on a hook by the oven.\n\nThen she looked closer at the picture in her mind — and through that imagined window she saw hills she had known all her life, and heard the soft sound of her own language, and smelled the sea.\n\nHer eyes flew open. Her heart was beating fast.\n\n“Oh,” she said out loud, to nobody. “Oh.”\n\nShe wrote quickly, before the feeling could escape: The cafe of my dream is in Matsuyama. But everything inside it — the recipes, the warm hellos, the blue apron — comes from here.\n\nShe kept writing until her fingers hurt from the cold. She wrote about Rosa’s laugh, Carol’s tea, Leo’s jokes, Emma’s paintings, and how a person can be homesick for two places at once.\n\nAfterward she warmed up in the lodge with a hot chocolate, and her mind felt like a room after cleaning — the same room, but lighter.\n\nAt four o’clock, Ruth was waiting at the bus stop with pink cheeks.\n\n“Well?” she asked. “Did the mountain answer?”\n\n“It didn’t say a word,” Hana said. “And somehow that helped me hear everything.”\n\n“That’s the trick,” Ruth said, climbing aboard. “Mountains are excellent listeners.”\n\nOn the ride down, the sunset turned the snow orange, then pink, then blue.\n\n“Ruth, can I ask you something? You said home isn’t a suitcase with one lock. Do you really believe a person can belong to two places?”\n\n“Belong?” Ruth said. “Child, I belong to Ohio, to Portland, to my husband’s garden, and to this bus every December. A heart isn’t a small apartment. It has many rooms, and you never stop building.”\n\nHana wrote that down, word for word.\n\n“You’re writing me down?” Ruth laughed. “Now I’m famous.”\n\n“You’re going in my book of important sentences,” Hana said. “My host mother is page one. You’re page twelve.”\n\nWhen the bus rolled back into Portland, the city lights felt different — not like something she might lose, but like something she could keep.\n\nAt the station, Ruth squeezed her hand. “Good luck with your answer. Though I think you already have it.”\n\n“I think so too,” Hana said. “It became clear somewhere around the snow line.”\n\nAt home, the kitchen smelled like soup. Carol looked up and asked nothing with her mouth and everything with her eyebrows.\n\n“I’m okay,” Hana said, smiling. “Better than okay. I heard the small voice.”\n\n“And?” Mike asked, appearing from the garage with sawdust in his hair.\n\n“And I want to say it out loud when it’s fully ready. One more night. Is that strange?”\n\n“That’s not strange,” Carol said. “That’s respect for a big thing.”\n\nThat night, Hana set the notebook by her bed. She could feel the answer sleeping inside it, warm as bread dough rising.\n\nTomorrow morning she would walk to Bluebird Cafe — because now, at last, she knew exactly what she wanted to say out loud.","glossary":[{"w":"thermos","ja":"魔法瓶"},{"w":"sleep in","ja":"朝寝坊する"},{"w":"clerk","ja":"係の人"},{"w":"aisle","ja":"通路"},{"w":"interrupt","ja":"邪魔をする"},{"w":"passed","ja":"亡くなった"},{"w":"peppermint","ja":"ハッカあめ"},{"w":"geography","ja":"地理"},{"w":"enormous","ja":"巨大な"},{"w":"lodge","ja":"山のロッジ"},{"w":"viewpoint","ja":"展望台"},{"w":"squeaked","ja":"キュッと鳴った"},{"w":"silence","ja":"静けさ"},{"w":"homesick","ja":"故郷が恋しい"},{"w":"dough","ja":"パン生地"}],"phrases":[{"en":"I need some time to think.","ja":"考える時間がほしいの。"},{"en":"Round trip, please.","ja":"往復でお願いします。"},{"en":"Is this seat taken?","ja":"この席、空いてますか？"},{"en":"What brings you here?","ja":"どうしてここに来たの？"},{"en":"The view took my breath away.","ja":"息をのむ景色だった。"}],"quiz":[{"q":"How did Hana travel toward Mt. Hood?","c":["By train","By bus","Mike drove her","By rental car"],"a":1},{"q":"What did Ruth believe about home?","c":["Home is only where you were born","A person can have only one home","Home never changes","A heart can hold many homes"],"a":3},{"q":"How did Hana feel on the ride back to Portland?","c":["Calm and clear","More confused than before","Angry at Ruth","Bored and tired"],"a":0}],"words":1182},{"id":93,"level":4,"emoji":"✍️","theme":"決断","titleEn":"Hana Makes Up Her Mind","titleJa":"ハナの決断","teaser":"山から戻った朝、心はもう静かだった。焼きたての匂いのするカフェで、ハナはローザに答えを告げる。","story":"Sunday morning arrived quiet and white, and for the first time in a week, Hana’s mind was quiet too.\n\nShe lay in bed for a moment, testing her answer the way you test a sore tooth. It didn’t hurt. It felt like hers.\n\nDownstairs, Daisy was asleep by the heater. Hana knelt and scratched her golden ears.\n\n“Daisy, I have news,” she whispered. “You’re my practice audience.”\n\nDaisy opened one eye.\n\n“I’m going home to Matsuyama. I’m going to open my own little cafe. And I’m going to miss you every single day.”\n\nDaisy sighed, rolled over, and rested her head on Hana’s knee. Practice complete.\n\nSaying it out loud didn’t break it. The answer just sat there, calm and true, like the mountain.\n\nHana put on her coat. On Sunday mornings, Rosa baked alone at the cafe, getting ready for the week.\n\nSure enough, warm light glowed in the Bluebird window, and the smell of cinnamon rolls filled the empty street.\n\nRosa opened the door with flour on her hands and surprise on her face. “We’re closed, but you know that. Come in, come in.”\n\n“Rosa,” Hana said, still in the doorway. “I’ve made up my mind.”\n\nRosa went still. Then she wiped her hands slowly on her apron. “Then come sit. Big sentences need chairs.”\n\nThey sat at the corner table — Hana’s favorite, the one where she had ordered her very first latte in April.\n\n“I’m going home,” Hana said. “Back to Matsuyama. I’m going to open a small cafe of my own — with everything you taught me inside it.”\n\nThe words hung in the warm air, smelling faintly of cinnamon.\n\n“Are you sure about this?” Rosa asked quietly. “Not because you’re scared to stay? Not because you think you should go?”\n\n“I’m sure. On the mountain, I closed my eyes and saw my future cafe. It had your recipes and your kind of warm light. But outside the window, it was my hometown.”\n\nRosa looked at her for a long moment. Then her eyes filled, and her big laugh and her tears arrived at the same time, which was very Rosa.\n\n“Come here,” she said, and hugged Hana hard enough to press flour into her coat.\n\n“You’re not disappointed?” Hana asked into her shoulder.\n\n“Disappointed?” Rosa pulled back. “Nine months ago, a shy girl whispered ‘Are you still hiring?’ at that counter. Today she tells me she’s opening her own place. I couldn’t be prouder of you.”\n\n“I was going to say all this calmly,” Hana said, wiping her eyes. “I practiced on the dog and everything.”\n\n“Calm is overrated,” Rosa said. “Now. Business talk. What kind of cafe?”\n\n“Small. Eight tables, maybe. Good coffee, Japanese sweets, American pastries. Dorayaki sitting next to cinnamon rolls. A place where nobody feels alone.”\n\n“Matcha latte on the menu?”\n\n“On page one.”\n\nRosa slapped the table. “Then I have a condition. Bluebird has never had a sister.”\n\n“A sister?”\n\n“A sister cafe. Across the ocean. We share recipes. We hang each other’s photos on the wall. When my customers visit Japan, I send them to you. When yours come to Portland, they sit at this table.”\n\nHana’s throat went tight. “You would really do that?”\n\n“Honey, I’m already planning the wall,” Rosa said. “Your photo goes next to the register, right where you spilled a whole tray of lattes in May.”\n\n“You promised to forget that.”\n\n“I promised to forgive it. Forgetting was never on the menu.”\n\n“Then I have a condition too,” Hana said. “When my doors open, you fly over and drink the first matcha latte.”\n\n“Deal. I’ll bring Leo to carry my bags.”\n\nThey shook hands across the table like serious businesswomen, and then laughed, because both of their hands were shaking a little.\n\n“Rosa,” Hana said. “This isn’t goodbye. You know that, right? It’s more like a very long delivery route between two kitchens.”\n\n“That’s the nicest thing anyone has ever said about international shipping,” Rosa said. “Now help me roll this dough. Big feelings make me bake faster.”\n\nAt ten, Emma arrived to help with Monday prep — and stopped in the doorway, looking from Hana’s red eyes to Rosa’s.\n\n“Okay, what happened?” she asked slowly. “Somebody talk.”\n\n“I made my decision,” Hana said. “Do you want to sit down?”\n\n“Tell me standing. I’m brave.”\n\n“I’m flying home in two weeks. I’m going to open my own cafe in Matsuyama. A sister cafe to this one.”\n\nEmma stood very still. Then she nodded about ten times, fast, the way she did when she was trying not to cry, and cried anyway.\n\n“Stupid, brave, wonderful decision,” she said, hugging Hana. “I hate it. I’m so proud of you. Both at once.”\n\n“I know,” Hana said. “Me too.”\n\n“I’m visiting in spring,” Emma announced, wiping her face. “Cherry blossom season. I’ll paint your shop sign. Just promise me a couch and a corner to draw in.”\n\n“You can count on me. A couch, free coffee for life, and the best light in the house,” Hana said.\n\n“Then I approve of this terrible, perfect plan,” Emma said, and stole a cinnamon roll to make it official.\n\nThat evening, Hana asked the Millers to sit down before dessert, which made everyone suspicious.\n\n“The last time you looked this serious, you had lost your wallet,” Mike said.\n\n“It’s bigger than the wallet.” She took a breath. “I’ve decided. I’m going home to Matsuyama, and I’m opening my own cafe.”\n\nFor one heartbeat, the kitchen was silent. Then Carol was out of her chair and around the table, holding her tight.\n\n“Oh, sweetheart. Your own cafe. Of course. Of course you are.”\n\n“Called it,” Ben said, pointing his fork at the ceiling. “Growth choice. I told you all.”\n\nMike said nothing for a moment, and his eyes were shining. “Alaska me is very proud of you,” he finally said. “And Portland me wants to build your shelves.”\n\n“You would come to Japan?”\n\n“Are you kidding? I’ve always wanted to visit a country where my puns need subtitles,” Mike said.\n\n“Your puns need subtitles here,” said Ben.\n\nLater, Hana video-called Yui, who screamed so loudly that Daisy barked in the living room.\n\n“You’re coming home! And a cafe! Wait until Mom hears — no, tell her yourself, she’s going to cry so hard!”\n\nIn the end, the whole family crowded onto the little screen — her mother laughing and crying at once, her father quiet and smiling, asking only one question: “What will you need?”\n\n“Time,” Hana said. “And maybe your melon bread recipe, Dad.”\n\nHer father nodded slowly, the way he did when he was very pleased and pretending not to be.\n\nThat night, Hana opened her notebook and wrote at the top of a clean page: Things to do before I fly.\n\nThe list was long, and the first item made her smile and ache at the same time: Finish English class. Graduate properly.\n\nHer last Tuesday class — certificates, speeches, and goodbyes — was only two days away.","glossary":[{"w":"sore","ja":"痛む"},{"w":"audience","ja":"観客"},{"w":"cinnamon","ja":"シナモン"},{"w":"faintly","ja":"かすかに"},{"w":"disappointed","ja":"がっかりした"},{"w":"overrated","ja":"過大評価の"},{"w":"condition","ja":"条件"},{"w":"register","ja":"レジ"},{"w":"forgive","ja":"許す"},{"w":"suspicious","ja":"あやしむ"},{"w":"heartbeat","ja":"一瞬・鼓動"},{"w":"shelves","ja":"棚"},{"w":"subtitles","ja":"字幕"},{"w":"ache","ja":"うずく"}],"phrases":[{"en":"I’ve made up my mind.","ja":"心を決めたよ。"},{"en":"Are you sure about this?","ja":"本当にいいの？"},{"en":"I couldn’t be prouder of you.","ja":"心から誇りに思うよ。"},{"en":"This isn’t goodbye.","ja":"これはさよならじゃない。"},{"en":"You can count on me.","ja":"任せておいて。"}],"quiz":[{"q":"What did Hana decide to do?","c":["Go home and open her own cafe","Stay in Portland forever","Move to Brazil with Leo","Work at the clinic"],"a":0},{"q":"What plan did Rosa and Hana make together?","c":["To close Bluebird Cafe","To open a cafe in Alaska","To be sister cafes and share recipes","To sell the cafe to Emma"],"a":2},{"q":"Why did Hana say ‘This isn’t goodbye’ to Rosa?","c":["Because she changed her mind","Because their kitchens would stay connected","Because Rosa was moving to Japan too","Because she was staying in Portland"],"a":1}],"words":1171},{"id":94,"level":4,"emoji":"🎓","theme":"英会話クラスの修了式","titleEn":"The Same Boat, Graduating","titleJa":"同じ船の卒業式","teaser":"英会話クラス最後の夜。六つの国のごちそう、修了証、そしてスピーチ。ハナはみんなに報告がある。","story":"Tuesday was the last night of Hana’s English conversation class, and the classroom didn’t look like a classroom at all.\n\nPaper stars hung from the ceiling, and two desks had become a snack table crowded with food from six different countries.\n\nMs. Rivera, their teacher, wore a winter sweater with tiny lights on it, and she kept touching the stack of certificates on her desk as if the paper itself made her proud.\n\n“Before anyone eats,” she said, “look around this room. In late summer, half of you were afraid to say your own names. Tonight, you’re giving speeches. Think about how far you’ve come.”\n\n“Can we think and eat at the same time?” asked Carlos, standing guard beside the tamales his wife had made.\n\n“That’s called multitasking, Carlos. Very advanced English,” said Ms. Rivera, and the room laughed.\n\nThey ate first, because nobody can be nervous and full of dumplings at the same time. Minji had brought Korean pancakes, Fatima carried in a tray of sweet mint tea, and Hana’s dorayaki disappeared in four minutes.\n\nThen Ms. Rivera held up a small handmade book. “Before the speeches, a gift from me. I wrote down my favorite beautiful mistakes from this year. Don’t worry — no names.”\n\nShe cleared her throat. “Someone once told me, ‘My hobby is cooking my husband.’”\n\nThe class exploded. Fatima covered her face with both hands. “It was me! I meant cooking FOR my husband! He is alive! He is fine!”\n\n“Mistakes mean you were talking,” Ms. Rivera said, smiling. “Silent students never make funny mistakes, and they never learn. Be proud of every one.”\n\nThe speeches began when the paper plates were empty.\n\nFatima went first. She talked about the day she called her daughter’s school by herself, without fear, for the first time.\n\n“Before this class, my husband made every phone call,” she said. “Last month, I argued about a parking ticket. And I won.”\n\nThe applause was enormous.\n\nMinji talked about job interviews, and about the customer who told her, “Your English sounds so natural,” and how she had floated home like a balloon that day.\n\nCarlos told the story of his first joke in English. “Nobody laughed,” he said sadly. “So I explained it. Then they laughed. Wrong order, but I’ll take it.”\n\nThen it was Hana’s turn.\n\nShe stood and held a small card that she never looked at.\n\n“Nine months ago, I bowed to a toaster,” she began.\n\nShe waited for the laughter to pass. “It made a loud noise, and I was scared of everything then. Toasters. Phones. The question ‘How’s it going?’ — especially that one.”\n\n“In this class, I learned that English is not a test. It’s a door. Some days the door opens slowly. Some days it gets stuck. But it opens.”\n\nShe took a breath. “I have news. In two weeks, I’m flying home to Japan, and I’m going to open my own cafe. So tonight is my last class — and my first graduation in another language.”\n\n“To my classmates: thank you. When I forgot a word, you waited for me. When I was brave, you cheered. My English grew up here, between your accents and your laughter, and I will carry all of you inside it.”\n\nCarlos raised his cup of lemonade. “Hana, on your first night you said a sentence I never forgot. We asked why you joined, and you said, ‘We’re in the same boat.’ Look at us now. The boat made it.”\n\n“To the boat!” said Minji, and everyone raised paper cups.\n\nThen Ms. Rivera called each name, and each student walked up while the whole class clapped like a stadium.\n\nHana held her certificate with two hands, the way you hold something warm. Her name looked back at her in official letters: Hana Sato.\n\n“I’ve never framed anything in my life,” she said. “This will be my first.”\n\nWhen the last certificate found its owner, Ms. Rivera clapped her hands once for attention. “Congratulations, everyone. Class is officially finished. Now comes the real homework: don’t stop talking. English lives in your mouth, not in your notebook.”\n\n“Best homework ever,” said Carlos.\n\nPhones appeared, and contact information flew around the room. Minji created a group chat and named it The Same Boat.\n\n“Rule number one: English only,” she announced while typing. “Rule number two: Hana must send photos of her cafe. Monthly. Forever.”\n\n“Even photos of the spoons,” said Fatima.\n\n“Especially the spoons,” said Carlos. “One more question. Is the boat allowed to correct my grammar?”\n\n“Only with love,” said Ms. Rivera. “That’s the class rule, and it never expires.”\n\n“Keep in touch. I really mean that,” Fatima said, hugging Hana tight. “When your cafe opens, I want to see everything.”\n\n“You’ll be tired of my photos,” Hana promised.\n\n“Let’s take a picture together. Everyone to the whiteboard!” said Ms. Rivera, arranging chairs beneath the spot where someone had written CONGRATULATIONS in rainbow marker.\n\nThey squeezed into one row — six countries, one bench — holding their certificates high like tickets to somewhere wonderful.\n\n“Say ‘fluent’!” said Ms. Rivera.\n\n“FLUENT!”\n\nThe camera flashed three times. In the best photo, half the class was mid-laugh, Carlos’s certificate was upside down, and Ms. Rivera was smiling and wiping her eyes at the same time — which summed up the entire year rather well.\n\nWhile the others folded chairs, Ms. Rivera touched Hana’s arm gently.\n\n“A cafe in Matsuyama,” she said. “Students like you are the reason teachers can’t quit. In August you whispered from the back row. Tonight you made Fatima cry.”\n\n“Fatima made me cry first,” Hana said. “It was a fair trade.”\n\nMs. Rivera laughed, then grew serious. “Do one thing for me. In your cafe, when you meet someone who is learning anything new and slow — English, baking, life — be patient with them, the way this room was patient with you.”\n\n“I promise,” Hana said. “My cafe will be a good classroom.”\n\n“Then it will be a good cafe.”\n\nOutside, a light snow was falling, and the class said goodbye three times each in the doorway, because one goodbye per person felt too small.\n\n“Good luck with everything. Message the boat when you land in Japan!” Minji called, walking backward into the snow.\n\n“I will!” Hana called back. “Send the boat your interview news!”\n\nOn the walk home, Hana carried the certificate inside her coat, safe and flat against her heart, away from the snow.\n\nShe thought about the late-summer Hana who had whispered in the back row on the first night. If she could talk to that Hana now, she would say: keep going — by winter, this classroom becomes a family.\n\nAt home, Carol was waiting with cocoa. “How was graduation?”\n\n“I have homework forever,” Hana said, showing the certificate. “I’m never allowed to stop talking.”\n\n“At last,” said Mike, “homework I can help with. I never stop talking either.”\n\n“We know,” said Ben and Carol together.\n\nThat night, Hana propped the certificate on her desk, right beside her packing list, where the first line said: Finish English class. She drew a slow, careful line through it.\n\nOne line done — and on Friday, the hardest line of all was waiting: her last shift at Bluebird Cafe.","glossary":[{"w":"certificates","ja":"修了証"},{"w":"multitasking","ja":"同時作業"},{"w":"dumplings","ja":"ギョーザ類"},{"w":"tray","ja":"お盆"},{"w":"cleared her throat","ja":"せき払いした"},{"w":"argued","ja":"言い合った"},{"w":"parking ticket","ja":"駐車違反の紙"},{"w":"applause","ja":"拍手"},{"w":"floated","ja":"ふわふわ歩いた"},{"w":"accents","ja":"なまり"},{"w":"official","ja":"正式な"},{"w":"framed","ja":"額に入れた"},{"w":"whiteboard","ja":"ホワイトボード"},{"w":"patient","ja":"気長な"},{"w":"propped","ja":"立てかけた"}],"phrases":[{"en":"Congratulations, everyone.","ja":"みんな、おめでとう。"},{"en":"Keep in touch.","ja":"連絡を取り合おうね。"},{"en":"Let’s take a picture together.","ja":"一緒に写真を撮ろう。"},{"en":"Good luck with everything.","ja":"何もかもうまくいきますように。"},{"en":"We’re in the same boat.","ja":"私たちは同じ立場だよ。"}],"quiz":[{"q":"What did each student receive at the ceremony?","c":["A cake","A textbook","A group photo","A certificate"],"a":3},{"q":"Why did Ms. Rivera read the ‘beautiful mistakes’ book?","c":["To embarrass the students","To show that mistakes are part of learning","To choose the best student","To teach new grammar"],"a":1},{"q":"How did Hana feel during her speech?","c":["Angry about leaving","Bored with the class","Thankful and a little emotional","Jealous of her classmates"],"a":2}],"words":1213},{"id":95,"level":4,"emoji":"☕","theme":"最後のシフト","titleEn":"The Last Shift","titleJa":"青いエプロンの約束","teaser":"雪の朝、ブルーバードカフェで最後のシフトが始まる。常連さんたちの列と、ローザが最後に手渡したもの。","story":"Snow was falling softly when Hana unlocked the door of Bluebird Cafe for her last shift.\n\nShe had turned this key hundreds of times, but today she turned it slowly, memorizing the small click it made, like a word in a language she never wanted to forget.\n\nInside, Rosa was pulling the first trays from the oven, and Leo was writing on the chalkboard in his huge, crooked letters: TODAY IS HANA’S LAST DAY. FREE SMILES WITH EVERY ORDER.\n\n“Free smiles?” Hana said, tying her apron.\n\n“Don’t worry,” Leo said. “I checked with the boss. Smiles cost us nothing. It’s good business.”\n\nEmma arrived with a paper garland she had painted — little bluebirds holding letters that spelled THANK YOU, HANA. She taped it above the register and hid a large card under the counter.\n\n“What’s the card for?” Hana asked.\n\n“Nothing,” Emma said, too quickly. “Focus on your milk steaming.”\n\nAt seven, the first regular pushed through the door with his newspaper under his arm. Mr. Alvarez, retired, crossword expert, the same order for eight months.\n\n“The usual, please.” The same four words, exactly as always.\n\nHana slid his black coffee and blueberry muffin across the counter before he finished the sentence.\n\n“Already?” he said. “How?”\n\n“You’ve ordered it every morning since April, Mr. Alvarez. My hands know it by heart.”\n\nHe looked at the chalkboard, then at her, and stood up straighter. “So it’s true. Young lady, you made my mornings better. That’s not a small thing at my age.”\n\n“Would you sign our card — ” Emma began, then slapped her own mouth. “I mean. There is no card.”\n\nAll morning they came, one by one, like chapters walking in from her nine months.\n\nThe mother of the twins ordered two hot chocolates with extra marshmallows and told the boys, “Say thank you to Miss Hana. She remembered your birthday cups all year.”\n\nDr. Park came in on her break and ordered green tea. “My favorite patient,” she said. “Do you remember your first visit? You wrote your symptoms on a paper because you were afraid to say them.”\n\n“I remember,” Hana laughed. “A sore throat and a cough since Monday.”\n\n“And what did I tell you?”\n\n“It’s a virus. Antibiotics won’t help. Rest and fluids.”\n\n“Perfect,” Dr. Park said. “If the cafe business ever gets slow, you can work for me.”\n\nAt eleven, Mrs. Chen arrived, moving carefully on the snowy sidewalk, holding a small package wrapped in soft cloth.\n\nHana came around the counter to meet her. “Your table is free. Jasmine tea?”\n\n“In a moment. First, hold out your hands.”\n\nInside the cloth was a small blue teacup, old and beautiful, with a tiny bird painted near the handle.\n\n“It’s one of a pair,” Mrs. Chen said. “I have had them for fifty years. I keep the white one. You take the blue one.”\n\n“Mrs. Chen, I can’t — ”\n\n“You can. When you drink tea in Matsuyama, I will drink tea here, at this table. Two cups, one pot of time. That way, we are still having tea together.”\n\nHana held the cup like a baby bird and did not trust her voice for a while.\n\nAround noon, a young man studied the menu and asked, “What’s a matcha latte? Is it good?”\n\n“It’s Japanese green tea with steamed milk,” Hana said. “Sweet, a little bitter, very warm. I put it on this menu myself.”\n\n“You invented it here? Then I have to try it. Do you work every day?”\n\n“Today’s my last day.” Hana smiled. “But the matcha latte is staying. It lives here now.”\n\nHe raised the green cup to her like a toast. “Then thanks for leaving something good behind.”\n\nThe afternoon rush never really ended. Word had traveled down the street, and half the neighborhood found a reason to need coffee. By three, the pastry case was empty except for one lonely scone, which Leo declared a museum piece.\n\nIn a quiet moment, Leo handed Hana a small notebook, its cover stained with coffee rings.\n\n“The Dictionary of Leo,” he said. “Every slang word I ever taught you, in order. ‘What’s up.’ ‘No worries.’ ‘Hang out.’ There’s a final exam on the last page.”\n\nHana opened the last page. It said: Question 1. Will you forget us? Correct answer: No way.\n\n“No way,” she read aloud, and Leo nodded like a proud professor, and then he had to go wash his face in the back.\n\nAt five, Rosa flipped the sign to CLOSED, locked the door, and clapped her flour-white hands.\n\n“Staff meeting,” she said. “Agenda: one goodbye.”\n\nEmma finally pulled out the card. It was covered in signatures — regulars, neighbors, the mail carrier, the twins in crayon. Someone had written: To the baker from Matsuyama. Our street tastes better because of you.\n\n“We took orders and signatures at the same time,” Emma said. “I almost died keeping the secret.”\n\nThen Rosa made four matcha lattes, one for each of them, and set them on the corner table.\n\n“It’s on the house. Don’t tell the owner,” she said.\n\nThey drank slowly. Nobody wanted to reach the bottom of the cup.\n\n“So,” Rosa said. “Does the sister cafe have a name yet?”\n\n“Not yet. I’ve filled two pages with ideas. All I know is that it needs a bird in it somewhere.”\n\n“Of course it does,” Emma said. “Birds return. Everyone knows that.”\n\n“Write that on the chalkboard,” Leo said. “It’s better than my free smiles.”\n\nFinally Rosa stood, untied her blue apron — the one she had worn since the day the cafe opened — folded it, and placed it in Hana’s hands.\n\n“Rosa. This is yours.”\n\n“It was,” Rosa said. “Listen to me. You’ll always have a place here. This door, this kitchen, this table — they know your name now. And when you hang this apron by your own oven in Matsuyama, I’ll have a place there. That’s the deal. That’s how Bluebird flies.”\n\nHana pressed her face into the apron. It smelled like cinnamon and eight months of mornings.\n\n“I don’t have the right words,” she said. “In any language.”\n\n“You just said them,” Rosa answered.\n\nLeo walked her to the door, holding it open with a bow. “Don’t be a stranger. That’s advanced English,” he said. “It means: come back, or I will be very annoying on the group chat.”\n\n“You’ll be annoying on the group chat anyway,” Emma said.\n\n“That’s true. It’s one of my gifts.”\n\nOutside, the snow had stopped, and the streetlights turned the sidewalk gold. Hana looked back once. Through the window, she could see Rosa, Emma, and Leo waving like a small, warm storm — her chalkboard name glowing behind them.\n\nShe walked home with the blue apron folded against her chest, the blue teacup safe in her bag, and the Dictionary of Leo in her pocket.\n\nTomorrow, Emma would arrive with packing tape and strong opinions — because nine months of memories had to fit into two suitcases.","glossary":[{"w":"memorizing","ja":"覚え込む"},{"w":"chalkboard","ja":"黒板"},{"w":"crooked","ja":"ゆがんだ"},{"w":"garland","ja":"飾りひも"},{"w":"regular","ja":"常連客"},{"w":"marshmallows","ja":"マシュマロ"},{"w":"symptoms","ja":"症状"},{"w":"antibiotics","ja":"抗生物質"},{"w":"fluids","ja":"水分"},{"w":"wrapped","ja":"包まれた"},{"w":"pair","ja":"一対"},{"w":"pastry case","ja":"ケーキ棚"},{"w":"signatures","ja":"署名"},{"w":"mail carrier","ja":"郵便屋さん"},{"w":"annoying","ja":"うっとうしい"}],"phrases":[{"en":"The usual, please.","ja":"いつものをください。"},{"en":"Today’s my last day.","ja":"今日で最後なんです。"},{"en":"It’s on the house.","ja":"お店のおごりだよ。"},{"en":"You’ll always have a place here.","ja":"ここはずっとあなたの居場所だよ。"},{"en":"Don’t be a stranger.","ja":"また顔を見せてね。"}],"quiz":[{"q":"What did Rosa give Hana at the end of the shift?","c":["A cookbook","A gold watch","Her blue apron","A coffee machine"],"a":2},{"q":"What was Mrs. Chen’s gift, and why was it special?","c":["One teacup from a pair, so they could still have tea together","A new teapot from a store","A photo of Mochi in the snow","A map of Portland"],"a":0},{"q":"Why did the young customer thank Hana?","c":["She gave him free coffee","She left something good behind — the matcha latte","She carried his bag","She fixed his phone"],"a":1}],"words":1170},{"id":96,"level":4,"emoji":"📦","theme":"荷造りと思い出","titleEn":"A Suitcase Full of Memories","titleJa":"スーツケースいっぱいの思い出","teaser":"エマと荷造りの午後。「覚えてる？」ゲームが始まると、九か月分の思い出が部屋中にあふれ出す。","story":"On Saturday afternoon, Hana’s room looked like a small, friendly storm had passed through it.\n\nTwo open suitcases sat on the floor like hungry mouths. Around them rose hills of sweaters, books, gifts, and nine months of life.\n\nEmma arrived carrying packing tape, chocolate, and great confidence. “I’m here in two roles,” she announced. “Professional packer and professional crier. Both services are free.”\n\n“Start with packing,” Hana said. “Please.”\n\n“First, the rules of the game.” Emma sat on the bed and held up a rain-wrinkled piece of paper. “They’re simple. I hold up a thing and say, ‘Remember when…?’ You finish the story. Then we decide: suitcase, or stays in Portland.”\n\n“What game is this?”\n\n“I invented it this morning. It’s already famous. First item!” She waved the wrinkled paper. “Remember when this bus map saved your life?”\n\nHana laughed. “April. The rainy day. I got off at the wrong stop and stood under a tree like a wet cat, studying that map upside down.”\n\n“And then?”\n\n“And then a bus driver leaned out and taught me the most useful sentence in America: ‘Where should I get off?’ I said it wrong three times. He waited like I was his own daughter.”\n\n“Suitcase or stays?”\n\n“Suitcase. I want to frame it next to my class certificate. My two diplomas.”\n\nEmma dug into the pile and held up a movie ticket stub. “Remember when you whispered through your first American movie?”\n\n“I understood thirty percent,” Hana said proudly. “But I laughed when you laughed. Friendship is also listening practice.”\n\nNext came a small brown wallet, old and soft.\n\n“Remember when the whole neighborhood hunted for this?” Emma said, holding it up like treasure.\n\n“Two days of panic in June. We retraced every step. I described it to every shop: ‘It’s small and brown, with a cat sticker inside.’ And the whole time it was sleeping behind the milk fridge at Bluebird.”\n\n“The neighborhood found it together. That was the day I realized this street had adopted you.”\n\nThe pile kept giving. A paper with tongue twisters in Leo’s handwriting — red lorry, yellow lorry — which they both tried again, and failed again, and fell over laughing.\n\n“That was hilarious. Your face on ‘lorry’ has not changed since summer,” Emma said, wiping her eyes.\n\nA white shell from Cannon Beach. A photo of Hana in her Halloween witch hat, mid-scream because Ben had jumped out of the closet. A folded newspaper page with the headline THE BAKER FROM MATSUYAMA and a photo of Hana holding a tray of matcha rolls.\n\nThen a small card covered in tiny pencil writing: her notes from the one-minute speech in class. My favorite place in Matsuyama.\n\n“Remember when you practiced this in the storeroom?” Emma said. “Between orders. For a week. I could hear you through the door.”\n\n“I was so nervous I memorized every comma,” Hana said. “Now I give speeches at parties without notes. Who is this person?”\n\n“The same one,” Emma said. “Just louder.”\n\n“Front page of the neighborhood section,” Emma said. “I bought five copies.”\n\n“My mother bought ten,” Hana said. “She doesn’t read English. She framed it anyway.”\n\nThen, at the bottom of a drawer, Emma found a thin notebook with a plain gray cover. She opened it, and her teasing voice went quiet.\n\n“Hana. Look at this.”\n\nIt was Hana’s first English notebook, from April. On page one, in careful, nervous letters, it said: My name is Hana. I am from Matsuyama. I like bread. I want many friends.\n\nHana sat down slowly on the bed.\n\n“Four sentences,” she said. “That was everything I could say. That was my whole English.”\n\n“Where did the time go?” Emma said softly, turning the pages. “Look — by June you’re writing about the wallet. By October there are jokes in here. Actual jokes.”\n\n“It feels like yesterday.” Hana touched the first page. “And also like a hundred years ago. Both at once. How can that be?”\n\n“That’s how growing works,” Emma said. “You never see it happen. You only see the footprints.”\n\nThey packed quietly for a while after that, folding sweaters like they were wrapping glass.\n\n“Packing rule number one,” Emma said softly. “Soft things protect the breakable things. Same as people.”\n\nThe blue apron went in first, wrapped in soft paper, in the safest corner of the big suitcase. The blue teacup traveled inside three socks. The Dictionary of Leo went into the backpack, for reading on the plane.\n\nThen Emma cleared her throat, suddenly shy, and pulled a flat package from behind the door.\n\n“I was going to give you this at the party tomorrow. But this feels like the right room for it.”\n\nHana peeled back the brown paper. It was a painting — the counter at Bluebird Cafe in morning light. Rosa laughing with her whole body. Leo mid-joke. Emma with her sketchbook. And at the center, a girl with dark hair steaming milk, her face calm and sure.\n\n“I started it in October,” Emma said. “Back then it was just a painting of work. I didn’t know it would become a goodbye gift. So it isn’t one. It’s a ‘see you later’ gift.”\n\n“Emma.” Hana’s voice wobbled. “I’ll treasure this. It goes on the first wall of my cafe. Before the clock. Before the menu. First.”\n\n“Good placement,” Emma whispered, and the professional crier finally began her shift, and Hana joined her, and the chocolate became medically necessary.\n\nWhen they recovered, Hana held out a folded bundle of fabric. It was her old apron from the bakery in Matsuyama — dark navy, worn soft, mended twice.\n\n“I wore this on my first shift at Bluebird,” she said. “Now we trade. Rosa’s apron goes to Japan with me. Mine stays in Portland with you.”\n\n“You’re giving me your armor,” Emma said.\n\n“So a piece of me stays on this street. Wear it when you paint, and think of me. Get paint on it. It likes being useful.”\n\nEmma put it on immediately and refused to take it off, even while sitting on the big suitcase so the zipper could close. It shut on the third try, with a sound like a small victory.\n\nThe room looked strange now — neat, echoing slightly, only the painting and the travel clothes left out. Nine months, sealed and labeled.\n\n“I hate how clean it looks,” Emma said.\n\n“Me too,” Hana said. “Rooms shouldn’t be this quiet.”\n\nCarol appeared in the doorway with two mugs of tea, looked around the bare room, and hugged them both without a word, which was exactly the correct sentence.\n\nThat night, Emma texted from the bus: Game over. Final score: two suitcases, one painting, zero dry eyes. See you tomorrow at the party.\n\nHana lay in bed and looked at the painting leaning against the wall, glowing faintly in the streetlight.\n\nTomorrow evening, the Millers’ house would fill with everyone she loved in Portland — for one last, loud, wonderful night together.","glossary":[{"w":"confidence","ja":"自信"},{"w":"wrinkled","ja":"しわしわの"},{"w":"ticket stub","ja":"半券"},{"w":"retraced","ja":"たどり直した"},{"w":"adopted","ja":"迎え入れた"},{"w":"tongue twisters","ja":"早口言葉"},{"w":"headline","ja":"見出し"},{"w":"drawer","ja":"引き出し"},{"w":"footprints","ja":"足あと"},{"w":"wobbled","ja":"震えた"},{"w":"mended","ja":"繕った"},{"w":"armor","ja":"よろい"},{"w":"zipper","ja":"ファスナー"},{"w":"sealed","ja":"封をした"},{"w":"bare","ja":"がらんとした"}],"phrases":[{"en":"Remember when…?","ja":"～のとき、覚えてる？"},{"en":"That was hilarious.","ja":"あれは最高に笑えたね。"},{"en":"Where did the time go?","ja":"時間はどこに行ったんだろう。"},{"en":"It feels like yesterday.","ja":"昨日のことみたいだね。"},{"en":"I’ll treasure this.","ja":"これ、大切にするね。"}],"quiz":[{"q":"Who helped Hana pack her suitcases?","c":["Ben","Emma","Carol","Leo"],"a":1},{"q":"What gift did Emma give Hana?","c":["A new suitcase","A movie ticket","A box of chocolate","A painting of the cafe"],"a":3},{"q":"Why did Hana give Emma her old navy apron?","c":["It didn’t fit in the suitcase","It was torn and useless","So a piece of her would stay in Portland","Emma paid for it"],"a":2}],"words":1167},{"id":97,"level":4,"emoji":"🎉","theme":"お別れパーティー","titleEn":"Speeches, Tears, and Laughter","titleJa":"涙と笑いのお別れ会","teaser":"ミラー家に集まる大切な人たち。マイクのスライドショー、ベンの意外なスピーチ、そして小さな箱の中身とは。","story":"On Sunday evening, the Millers’ living room glowed with candles, string lights, and the smell of Carol’s famous lasagna.\n\nThe Christmas tree blinked in the corner, and under it sat a suspicious number of packages with Hana’s name on them.\n\n“Rule one,” Carol said, tying balloons to a chair. “Tonight, nobody says the word ‘last.’ We say ‘next.’ As in, see you NEXT time.”\n\n“Rule two,” Mike added, carrying in folding chairs. “All my jokes get laughs tonight. It’s my house.”\n\n“That rule has never worked,” said Ben.\n\nThe doorbell started ringing at six and didn’t stop. Rosa arrived first, holding a chocolate cake the size of a car tire. Emma and Leo came together, arguing about whether Leo’s guitar counted as an invited guest. Mrs. Chen arrived in her best red scarf, and Dr. Park brought clementines, “for vitamin C, because everyone will cry and get dehydrated.”\n\nDaisy greeted each guest like they had been lost at sea for years.\n\nThey ate until the lasagna pan shone. Then Mike stood, tapped his glass of sparkling cider, and cleared his throat in a way that meant technology was coming.\n\n“Ladies and gentlemen: HANA, THE MOVIE.”\n\nThe lights went off. A projector hummed, and the wall filled with a photo from April — Hana at the airport, gripping her suitcase, smiling the world’s most nervous smile.\n\n“Oh no,” Hana said, covering her face. “Look at me. I was so scared of everything.”\n\n“Wait for it,” said Ben.\n\nThe next photo: Hana bowing politely to the toaster.\n\nThe room exploded. Hana grabbed a cushion. “BEN! You PHOTOGRAPHED it?”\n\n“Historians keep records,” Ben said. “You’re welcome.”\n\nThe photos rolled on, and the room rode along — laughing, pointing, going quiet in the soft parts. Hana in her new apron on her first day at Bluebird, standing very straight. Hana holding a sparkler on the Fourth of July. Hana in her witch hat beside a mountain of Halloween candy. Hana and Yui waving from the top of a sightseeing bus. Hana behind a table of matcha rolls at the charity bake day, mid-laugh, flour on her cheek.\n\nThe last slide was from that very morning: the whole family at breakfast, Daisy’s nose resting on Hana’s knee. Underneath, Mike had written one word: Family.\n\nNobody said anything for a moment. Even Leo’s guitar stayed respectful.\n\n“Okay,” Rosa said finally, wiping her eyes. “Who scheduled the crying this early? Toasts first! Let’s make a toast.”\n\nGlasses of cider rose all around the room.\n\n“To Hana,” Mike said. “The best thing that ever happened to this kitchen. I prepared a bread pun, but she’s heard them all — so I’ll just say: you deserve a fresh start.”\n\n“That was still a pun,” said Ben.\n\n“It absolutely was,” Mike said proudly.\n\nMrs. Chen lifted her teacup instead of a glass. “May your cafe be warm, your bread be soft, and your door never stick in the rain.”\n\n“And may your Wi-Fi be strong,” added Leo, “because the group chat never sleeps.”\n\nThen Ben stood up, and the room went curious. He took his phone out of his pocket — and put it face-down on the table.\n\n“I wrote a speech in my notes app,” he said. “But I’m not going to read it. Because Hana never got to read from notes. She had to be brave live, every day, in a language she was still building.”\n\nHe took a breath. “When my parents said a stranger was coming to live with us, I thought it would be weird. And it was weird — for about one week. Then it was like I’d had a big sister my whole life and somebody finally returned her.”\n\n“Ben,” Hana whispered.\n\n“You taught me that brave isn’t loud,” he went on. “Brave is quiet and keeps trying. Also, your pancakes are better than Mom’s. I’m sorry, Mom. The truth matters tonight.”\n\n“He’s right,” Carol said, laughing and crying at the same time. “They are.”\n\nThe gifts came out after that. A photo album from the whole table — nine months, in order, with captions in everyone’s handwriting. From Leo, a playlist called Songs for a Cafe in Matsuyama. From Dr. Park, a tiny first-aid kit, “for a baker’s burns and a traveler’s blisters.”\n\nThen Carol brought out a small box and went down on one knee beside Hana’s chair, which made everyone laugh and then immediately stop laughing.\n\nInside the box was a house key on a ring with a small silver bird.\n\n“You’re part of the family. That’s not a feeling, it’s a fact, and facts get keys,” Carol said. “This door will never be locked to you. Family doesn’t knock.”\n\nHana held the key so tightly it left a bird-shaped mark in her palm.\n\nThey called her name for a speech, and she stood, and for a long moment nothing came out at all.\n\n“I practiced this on Daisy,” she finally said. “She fell asleep. So I’ll keep it short.”\n\nLaughter, sniffles, Daisy’s tail thumping at her name.\n\n“Nine months ago, I could order coffee, but I couldn’t joke, argue, comfort, or thank anyone properly. You gave me all of those. You left the light on when I came home late. You made tea when I cried about missing my mother. You laughed at my mistakes in the kindest possible way.”\n\nShe looked around the room, face by face. “I don’t know how to thank you. In April I didn’t have the words. Tonight I have all the words, and they’re still not enough. So I’ll say the truest thing I know: you gave me a family on the other side of the world.”\n\n“Group hug,” Rosa commanded. “That’s an order from a business owner.”\n\nSomewhere in the middle of the hug, Emma grabbed Hana’s hands. “Promise you’ll visit. This house. This street. Us. Promise.”\n\n“I promise. And all of you — come to Matsuyama. My couch is small, but my welcome is huge. I mean it.”\n\n“I’m already saving,” Emma said. “Cherry blossom season. It’s happening.”\n\nThen Leo finally got his guitar’s big moment. He had written a song called The Ballad of the Matcha Latte, with a chorus that was just the word “matcha” eleven times.\n\n“Everyone sing!” he ordered. Everyone sang. Everyone sang it differently. Daisy howled the final note, on key, which Leo declared the best review of his career.\n\nThey took a group photo with the camera timer. It took three tries — Leo blinked, then Daisy left, then Mike’s pun made everyone laugh too hard — and the third photo, the imperfect loud one, was perfect.\n\nThe party ended slowly, the way good parties do, with guests hugging in the doorway and taking forever to actually leave.\n\nLater, Hana dried dishes while Carol washed, the house quiet around them.\n\n“Two more days,” Carol said softly.\n\n“Two more days,” Hana echoed, looking at the little silver bird shining on her new key.\n\nTomorrow would be her last full day — a quiet one, saved for walking the neighborhood and saying goodbye to the streets themselves.","glossary":[{"w":"string lights","ja":"飾り電球"},{"w":"suspicious","ja":"あやしい"},{"w":"clementines","ja":"小さいみかん"},{"w":"dehydrated","ja":"脱水状態の"},{"w":"sparkling cider","ja":"リンゴソーダ"},{"w":"projector","ja":"映写機"},{"w":"hummed","ja":"ブーンと鳴った"},{"w":"sparkler","ja":"手持ち花火"},{"w":"respectful","ja":"礼儀正しい"},{"w":"captions","ja":"説明書き"},{"w":"first-aid kit","ja":"救急セット"},{"w":"blisters","ja":"まめ・水ぶくれ"},{"w":"palm","ja":"手のひら"},{"w":"sniffles","ja":"すすり泣き"},{"w":"imperfect","ja":"不完全な"}],"phrases":[{"en":"Let’s make a toast.","ja":"乾杯しよう。"},{"en":"You’re part of the family.","ja":"あなたは家族の一員だよ。"},{"en":"I don’t know how to thank you.","ja":"感謝してもしきれません。"},{"en":"Promise you’ll visit.","ja":"絶対また来るって約束して。"},{"en":"I mean it.","ja":"本気で言ってるんだよ。"}],"quiz":[{"q":"What did Mike show at the party?","c":["A slideshow of photos","A magic trick","A new birdhouse","A science experiment"],"a":0},{"q":"What was surprising about Ben’s speech?","c":["He spoke in Japanese","He put his phone away and spoke from the heart","He sang it with Leo’s guitar","He read it from a long paper"],"a":1},{"q":"Why did Hana say ‘I don’t know how to thank you’?","c":["She forgot her English","She was too sleepy to speak","The party was too loud","Even all her words felt too small for her feelings"],"a":3}],"words":1180},{"id":98,"level":4,"emoji":"🚪","theme":"ご近所へ挨拶まわり","titleEn":"Goodbye, Neighborhood","titleJa":"さよなら、わたしの街","teaser":"最後の一日は、静かな挨拶まわり。チェンさんの教え、図書館のカード、そして公園のベンチで。","story":"Monday was Hana’s last full day in Portland, and the neighborhood lay quiet and white under fresh snow.\n\nAfter breakfast, she clipped on Daisy’s leash. “You’re my partner today,” she said. “We have important goodbyes to make. Professional ones.”\n\nDaisy wagged her tail like a slow metronome, which meant: understood.\n\nTheir first stop was next door. Mrs. Chen opened before Hana could knock, as if she had been waiting by the window, which she probably had.\n\n“I came to say goodbye. Properly. With time. Not in a doorway,” Hana said.\n\n“Then come in. Goodbyes need tea.” Mrs. Chen looked down. “Daisy may supervise from the porch. Mochi has strong opinions about dogs in the house.”\n\nMochi sat in the window like a small white king, and Daisy lay down on the mat outside, and the two of them watched each other through the glass — old neighbors with an old agreement.\n\nThe jasmine tea was ready, of course. Two cups. As always.\n\n“Seventy-two years old,” Mrs. Chen said, pouring, “and I still don’t like this word. Goodbye. In my classroom, I never allowed it on the last day of school.”\n\n“What did you allow?”\n\n“Teachers never say goodbye to students. We say: go, and teach someone else. That keeps the lesson alive. It travels, like a seed.”\n\nHana warmed her hands on the cup. “Then what will I teach?”\n\n“What you learned on this street. That slow speech is not weak speech. That a question is a door. That tea fixes half of everything.” Mrs. Chen smiled. “Teach kindness, with coffee. You’re already good at it.”\n\n“You were my first teacher here,” Hana said. “You spoke slowly for me at the cafe, every time, from the first week. I noticed. I never told you.”\n\n“You just told me. Timing is also a language.” The old woman looked at Mochi. “We will miss you. Both of us. He won’t admit it.”\n\nAt the door, Hana held both of Mrs. Chen’s hands, thin and warm like paper in the sun.\n\n“You made this place home.” Her voice caught. “The tea, the slow words, the window light. Thank you.”\n\n“Come back anytime. The blue cup’s brother will be waiting,” Mrs. Chen said. “And Hana — when a shy young person walks into your cafe someday, you know what to do.”\n\n“Speak slowly. Pour tea. Wait.”\n\n“Full marks. Now go, before an old teacher cries in front of her cat.”\n\nThe library was their next stop. Daisy waited by the bike rack, greeting strangers like a furry mayor, while Hana carried one book inside.\n\nMs. Adams, the librarian, checked it in and raised her eyebrows. “Four hundred pages. No pictures. Do you remember what you borrowed in May?”\n\n“An easy reader about a lost penguin,” Hana said. “Twenty pages. I read it twice and was very proud.”\n\n“You should be. I watched your bookmarks move across this room, shelf by shelf, all year. Librarians notice things.” She slid the returned novel away. “We’re proud of you here. Quietly. It’s a library.”\n\nHana laughed, then turned her library card over in her fingers. “I have a strange question. The card expires, and I’m leaving. But could I keep it?”\n\n“Cards expire,” Ms. Adams said. “Memories don’t. Keep it as a bookmark, and think of us when a story gets good.”\n\n“It means the world to me. This building was my quiet classroom.”\n\n“Then take one more thing.” Ms. Adams handed her a fresh reading list, printed that morning. “English novels, easy to hard. Homework for the plane. We expect a report someday.”\n\nOutside, snow had started again, small and unhurried. Hana and Daisy walked the long way, past the corner where a stranger had once drawn her a map on a napkin in April.\n\n“I stood right here,” she told Daisy, “completely lost, two streets from home.”\n\nAs if the street wanted to answer, a delivery man looked up from his phone. “Excuse me — do you know where Alder Court is? This map app is drawing circles.”\n\nHana didn’t even need to think. “Two blocks down, turn left at the blue mailbox. It hides behind the flower shop.”\n\n“You’re a lifesaver. You must have lived here forever.”\n\n“Nine months,” Hana said, and smiled all the way to the bakery smell on the next street.\n\nThey passed Bluebird Cafe without going in — she had promised herself that. Through the steamed window she saw Rosa laughing with a customer and Leo balancing cups. Emma’s bluebird garland still hung above the register.\n\nRosa saw her, pressed a floury hand to the glass, and mouthed two words: SISTER CAFE.\n\nHana pressed her mitten to the cold side of the same spot, held it there for three heartbeats, and walked on. Some doors you don’t open twice in one goodbye.\n\nThe park was empty except for crows and snow. They walked the loop slowly — past the fountain, sleeping for winter, past the tree where Daisy had once treed an extremely rude squirrel.\n\nAt the old green bench, Hana sat, and Daisy leaned her warm weight against her leg.\n\n“This is where I met my first stranger with a dog,” she said. “April. I said, ‘What’s your dog’s name?’ and my heart was pounding like it was an exam.”\n\nDaisy sighed comfortably.\n\n“So, thank you,” Hana said — to the bench, to the path, to the whole white park. “Thank you, park. Thank you, rain that made me brave enough to take the bus. Thank you, bus number twelve. Thank you, every person who spoke slowly.”\n\nA man with a small gray dog passed and tipped his hat. “Talking to the park?”\n\n“Saying goodbye to it. I’m moving home to Japan tomorrow.”\n\n“Then the park heard you,” he said, completely unbothered. “Parks are good listeners. Safe journey.”\n\nDaisy and the gray dog touched noses, a short official ceremony, and everyone walked on.\n\nOn the way home, Hana delivered cookies to the neighbors on both sides — to the Nguyens, who had cheered at the charity bake day, and to old Mr. Petersen, who had taught her the word ‘drizzle’ across the fence in her first month.\n\n“Thank you for everything. Especially the rain words,” Hana said at his gate.\n\n“Rain words were my gift to you,” he said proudly. “Portland has fifty kinds of rain. You mastered them all.”\n\nBy the time they reached the house, the streetlights were on and the snow had gone blue with evening. Hana stopped at the gate and looked back down the street — at Mrs. Chen’s glowing window, at the far corner, at the whole small world that had taught her to speak.\n\nInside, the last dinner was leftovers night, which felt exactly right — a warm, unfancy family, all their favorite things on one crowded table.\n\nDaisy followed Hana everywhere all evening, up the stairs and down, lying on the packed suitcases like a soft golden guard.\n\n“Dogs always know,” Carol said quietly.\n\nTomorrow, before sunrise, a car would be waiting — and the airport, nine months later, would see a very different Hana walk through its doors.","glossary":[{"w":"metronome","ja":"メトロノーム"},{"w":"supervise","ja":"見守る"},{"w":"agreement","ja":"取り決め"},{"w":"seed","ja":"種"},{"w":"admit","ja":"認める"},{"w":"bike rack","ja":"駐輪ラック"},{"w":"librarian","ja":"図書館員"},{"w":"expires","ja":"期限が切れる"},{"w":"bookmark","ja":"しおり"},{"w":"unhurried","ja":"ゆったりした"},{"w":"lifesaver","ja":"命の恩人"},{"w":"mitten","ja":"ミトン手袋"},{"w":"pounding","ja":"ドキドキする"},{"w":"drizzle","ja":"霧雨"},{"w":"leftovers","ja":"残り物"}],"phrases":[{"en":"I came to say goodbye.","ja":"お別れを言いに来ました。"},{"en":"Come back anytime.","ja":"いつでも戻っておいで。"},{"en":"You made this place home.","ja":"あなたのおかげでここが我が家になりました。"},{"en":"It means the world to me.","ja":"何より嬉しいです。"},{"en":"Thank you for everything.","ja":"本当にいろいろありがとう。"}],"quiz":[{"q":"Who walked around the neighborhood with Hana all day?","c":["Ben","Emma","Mochi","Daisy"],"a":3},{"q":"What did Mrs. Chen say teachers say instead of goodbye?","c":["See you next year","Study harder","Go, and teach someone else","Please write letters"],"a":2},{"q":"How did Hana feel sitting on the park bench?","c":["Quietly thankful","Lonely and lost","Angry at the cold","Worried about her flight"],"a":0}],"words":1188},{"id":99,"level":4,"emoji":"🛫","theme":"出発の朝","titleEn":"The Airport, Nine Months Later","titleJa":"九か月後の空港で","teaser":"出発の朝。九か月前と同じ空港で、ハナはふと気づく——流れるアナウンスの、すべての言葉が聞こえる。","story":"The morning of departure arrived cold and clear, almost nine months after Hana’s first day in America.\n\nThe house woke at five. Lights came on one by one, and the kitchen filled with the smell of Carol’s pancakes — the same breakfast as Hana’s very first morning, when she had been too jet-lagged to hold a fork properly.\n\n“One last stack,” Carol said. “For the road.”\n\n“Could you pass the syrup?” Hana asked.\n\nMike pointed his fork at her like a game-show host. “Did everyone hear that? Nine months ago, that sentence took her ten seconds and all her courage. Now it’s just breakfast.”\n\n“Eat,” Carol said, laughing. “Both of you.”\n\nDaisy could not come to the airport, so the hardest goodbye happened at the front door, in the blue morning dark.\n\nHana knelt and pressed her forehead into the golden fur.\n\n“You were my first friend here who needed no words,” she whispered. “Thank you for every walk. Guard the house. Wait for the spring visitors.”\n\nDaisy did something she rarely did anymore: she lifted her old paw and set it on Hana’s arm, and held it there.\n\nNobody in the car was able
