Miguel sang and started cooking.\n\nThey carried their tacos to a picnic table under a string of little flags. The tacos were beautiful — soft corn shells, bright salsa, green lime pieces.\n\n“Okay. Together,” Leo said. “One, two, three!”\n\nThey bit their tacos at the same time.\n\nFirst, Hana tasted lime and chicken, sweet and rich. Then, one second later, the fire arrived. It was warm. Then it was hot. Then her whole mouth was a summer festival.\n\n“Oh,” she said. “Oh no. Oh wow.”\n\n“Are you okay?” Emma asked, half laughing, half worried.\n\nHana’s eyes were wet. Her nose was running. But she was smiling. “It hurts… but it’s delicious! What is this feeling? I can’t stop!”\n\n“That’s the spicy magic,” Leo said. His face was completely red from level four. “Pain and love together.”\n\nMiguel appeared with three cups. “Horchata! Sweet rice milk. Water makes fire worse — this saves lives.”\n\nHana drank the cold, sweet drink, and the fire got softer. “Miguel, you’re a doctor.”\n\n“I’m a cook. It’s the same job,” Miguel laughed. “We fix people.”\n\nThey ate slowly and talked about food from their homes. Leo told them about his grandmother’s feijoada, a black bean dish that took two days to make. Emma described her father’s terrible famous pancakes — “burned outside, raw inside, but he sings when he makes them, so we eat them.”\n\n“In Matsuyama, my family eats taimeshi,” Hana said. “Sea bream rice. On special days, my grandmother makes it. When I smell it, I’m five years old.”\n\n“Food is a time machine,” Emma said.\n\nAfter the tacos, they shared a chocolate ice cream from another truck, because a hot mouth needs a cold friend. They walked in the sun and laughed about small things.\n\nAt the corner, Miguel waved. “Level three friend! Next time, level four?”\n\n“Maybe in December!” Hana called back. “I need training!”\n\nOn the way home, Hana wrote in her phone: horchata, recipe, spicy levels, time machine. Her notebook was at home, but new words never waited.\n\nThat evening, the wind was cooler than usual. May was ending, and June was coming with gray, wet mornings.\n\nAt bedtime, Hana felt a tiny scratch in her throat. It’s the spicy taco, she thought, and drank warm water.\n\nShe turned off the light. Outside, soft rain began to fall on Portland — and the little scratch in her throat quietly made a plan for tomorrow.","glossary":[{"w":"food trucks","ja":"フードトラック"},{"w":"explorer","ja":"探検家"},{"w":"tossed","ja":"あおった"},{"w":"grilled","ja":"焼いた"},{"w":"lime","ja":"ライム"},{"w":"recipe","ja":"レシピ"},{"w":"levels","ja":"段階"},{"w":"salsa","ja":"サルサ"},{"w":"delicious","ja":"とてもおいしい"},{"w":"worried","ja":"心配して"},{"w":"raw","ja":"生の"},{"w":"sea bream","ja":"鯛"},{"w":"time machine","ja":"タイムマシン"},{"w":"scratch","ja":"イガイガ"},{"w":"throat","ja":"のど"}],"phrases":[{"en":"What do you recommend?","ja":"おすすめは何ですか？"},{"en":"Is it spicy?","ja":"それ、辛いですか？"},{"en":"First time?","ja":"初めて？"},{"en":"I’ll take level four.","ja":"レベル4にします。"},{"en":"Are you okay?","ja":"だいじょうぶ？"}],"quiz":[{"q":"Which truck did Hana's stomach choose?","c":["Thai Smile","The pizza truck","Casa Sol","The ice cream truck"],"a":2},{"q":"What spicy level did Hana choose?","c":["Level three","Level five","Level one","Level four"],"a":0},{"q":"Why did Miguel bring horchata?","c":["It was free that day","Leo asked for it","It goes well with chocolate","Sweet rice milk helps with spicy fire"],"a":3}],"words":757},{"id":31,"level":2,"emoji":"🤧","theme":"風邪のはじまり","titleEn":"A Rainy Day and a Sore Throat","titleJa":"雨の日、のどが痛い","teaser":"6月の雨の日、ハナの様子がなんだか変。看護師キャロルの優しい診察と、ミラー家の温かい看病が始まる。","story":"It was a rainy Tuesday in June, and Hana felt strange all morning.\n\nAt the cafe, the milk steamer sounded too loud. The lights looked too bright. Hana rubbed her eyes and tried to smile.\n\nA customer ordered a hot chocolate. Hana said, “For here or to go?” Her own voice sounded far away.\n\nEmma watched her from the counter. “Hana, are you okay? You look pale.”\n\n“I’m fine,” Hana said. “Just a little tired.”\n\nBut she was not fine. Her throat hurt when she swallowed. Her head felt heavy.\n\nLeo brought her a glass of water. “Drink this,” he said. “You didn’t laugh at my joke today. That’s a bad sign.”\n\nHana smiled a little. “Sorry, Leo. I don’t feel well.”\n\nRosa came out of the kitchen. She put a warm hand on Hana’s forehead. “Oh, honey, you’re hot. Go home right now.”\n\n“But the cafe is busy today,” Hana said. “I want to help.”\n\n“You can help by getting better,” Rosa said. “A sick barista helps nobody. Go home, drink tea, and sleep.”\n\n“Don’t worry about us,” Emma said. “I’ll text you later. Take it easy.”\n\nHana walked home slowly under her umbrella. The rain was soft and gray. Her legs felt like heavy bread dough.\n\nShe passed Mrs. Chen’s house. Mochi, the white cat, watched her from the window. Even the cat looked worried.\n\nAt home, Carol was in the kitchen. She was still in her nurse uniform.\n\n“You’re home early,” Carol said. Then she saw Hana’s face. “Sweetie, what’s wrong?”\n\n“I don’t feel well,” Hana said. “I have a sore throat. My head hurts, too.”\n\nIn one second, Carol became Nurse Carol. She washed her hands and took out a small light.\n\n“Open wide and say ahh,” she said.\n\n“Ahh,” said Hana.\n\n“Yes, your throat is red,” Carol said. “Do you have a fever? Let’s check.”\n\nHana held the thermometer under her tongue. It beeped after a minute.\n\n“A small fever,” Carol read. “Not scary, but real. Your body is fighting something.”\n\n“I’m sorry,” Hana said. “I wanted to help with dinner tonight.”\n\nCarol laughed softly. “You should rest. That’s your only job now. Dinner can wait.”\n\nHana changed into warm pajamas and got into bed. The bed felt wonderful.\n\nCarol brought her a big cup of tea with honey and lemon. She also brought an extra blanket.\n\n“Drink a lot of water and tea,” Carol said. “When you have a cold, your body needs rest and water. Sleep is the best medicine.”\n\n“You’re a good nurse,” Hana said.\n\n“I know,” Carol smiled. “I have thirty years of practice.”\n\nDaisy came into the room quietly. She lay down next to Hana’s bed like a soft, warm guard.\n\nBen knocked on the door. He held a water bottle and her phone charger. “Mom says sick people need two things,” he said. “Water and Wi-Fi.”\n\nHana laughed, and then she coughed. “Thank you, Ben.”\n\nMike stood in the doorway with a serious face. “Hana, I made you my famous soup. Well, Carol made it. I carried it. Teamwork.”\n\nThen he added, “Also, a joke. What did the doctor say to the sick lemon? You need lemon-aid!”\n\nHana laughed again. Laughing hurt her throat, but it helped her heart.\n\nThe chicken soup was warm and gentle. Hana ate it slowly and felt a little better.\n\nLater, her phone buzzed. Emma sent a photo of a paper cup. Leo drew a smiling sun on it and wrote, “Get well soon, Hana!”\n\nHana thought about her mother in Matsuyama. When Hana was sick as a child, her mother always made okayu, a soft rice soup.\n\nShe sent a short message to her family: “I have a small cold. Don’t worry. My host family is very kind.”\n\nPortland was far from Matsuyama. But tonight, this house felt warm like home.\n\nCarol checked on her one more time before bed. “How is your throat?”\n\n“It still hurts a little,” Hana said. “But the tea helps a lot.”\n\n“Good,” Carol said. “Sleep now. If you’re not better tomorrow, we’ll go to the clinic and see Dr. Park.”\n\n“The clinic?” Hana asked. “Is my English ready for a doctor?”\n\n“Your English is ready,” Carol said. “And I’ll be with you. Take it easy tonight.”\n\nHana closed her eyes. Rain tapped on the window like small fingers. Daisy breathed slowly beside the bed.\n\n“Tomorrow I will be fine,” she thought.\n\nBut when she woke up at midnight, her cough was worse — and her small fever did not feel so small.","glossary":[{"w":"pale","ja":"青白い"},{"w":"throat","ja":"のど"},{"w":"swallowed","ja":"飲み込んだ"},{"w":"forehead","ja":"ひたい"},{"w":"umbrella","ja":"かさ"},{"w":"dough","ja":"パン生地"},{"w":"uniform","ja":"制服"},{"w":"sore throat","ja":"のどの痛み"},{"w":"fever","ja":"熱"},{"w":"thermometer","ja":"体温計"},{"w":"blanket","ja":"毛布"},{"w":"medicine","ja":"薬"},{"w":"charger","ja":"充電器"},{"w":"cough","ja":"せき"},{"w":"clinic","ja":"診療所"}],"phrases":[{"en":"I don’t feel well.","ja":"気分がよくないです。"},{"en":"I have a sore throat.","ja":"のどが痛いです。"},{"en":"Do you have a fever?","ja":"熱はある？"},{"en":"You should rest.","ja":"休んだほうがいいよ。"},{"en":"Take it easy.","ja":"無理しないでね。"}],"quiz":[{"q":"Who checked Hana’s throat and fever at home?","c":["Rosa","Emma","Carol","Ben"],"a":2},{"q":"Why did Rosa send Hana home?","c":["Because Hana was sick","Because the cafe was closed","Because Hana was late","Because Hana broke a cup"],"a":0},{"q":"How did the Miller house feel to Hana that night?","c":["Cold and quiet","Boring","Scary","Warm like home"],"a":3}],"words":755},{"id":32,"level":2,"emoji":"🏥","theme":"クリニックで診察","titleEn":"A Visit to Dr. Park","titleJa":"パーク先生の診察室","teaser":"せきが止まらないハナ、はじめてのアメリカの診察室へ。英語で症状をうまく伝えられるかな？","story":"On Wednesday morning, Hana’s cough sounded like a small, angry dog.\n\nCarol listened to it from the hallway. “Okay, sweetie. Today we’re going to the clinic.”\n\n“Is it serious?” Hana asked.\n\n“Probably not,” Carol said. “But a doctor should listen to that cough. Dr. Park is very kind.”\n\nThe clinic was only two blocks away. The rain stopped, but the sky was still gray.\n\nInside, the waiting room was quiet. There was a fish tank and a shelf of children’s books.\n\nA receptionist smiled at them. “Good morning. Is this your first visit?”\n\n“Yes,” Hana said. “My name is Hana Sato.”\n\n“Welcome, Hana. Please fill out this form.”\n\nThe form asked for her name, her birthday, and her address. Carol helped with one hard word.\n\n“This word, insurance,” Carol said quietly. “Your school program has it. Write this number here.”\n\nHana wrote slowly and carefully. Then they waited and watched the orange fish.\n\n“I’m a little nervous,” Hana said. “At home, I talk to doctors in Japanese.”\n\n“You will do great,” Carol said. “Just say what you feel. Simple is perfect.”\n\nA nurse opened the door. “Hana Sato?”\n\nThe nurse checked her temperature and wrote some notes. Then Dr. Park came in with a warm smile.\n\n“Good morning, Hana. I’m Dr. Park. What seems to be the problem?”\n\nHana took a small breath. She practiced this sentence in bed last night.\n\n“I’ve had a cough since Monday. I have a sore throat, too. And a small fever.”\n\n“Thank you. That was very clear,” Dr. Park said. “Does your chest hurt when you cough?”\n\n“No. But my head hurts a little.”\n\n“Are you eating and drinking?”\n\n“Yes. Soup, tea, and a lot of water.”\n\n“Perfect. Take a deep breath, please.”\n\nDr. Park put the stethoscope on Hana’s back. It was cold, and Hana jumped a little.\n\n“Sorry,” Dr. Park laughed. “It’s always cold. Big breath in… and out. One more time.”\n\nHana breathed in and out slowly.\n\n“Your lungs sound clear. Now open wide and say ahh.”\n\n“Ahh,” said Hana. “I practiced this part at home with Carol.”\n\nDr. Park laughed. “You’re my best patient today. Your throat is red, but it’s not bad.”\n\nDr. Park sat down and looked at Hana. “Here’s the good news. You have a common cold. It’s a virus.”\n\n“A virus,” Hana repeated. “Do I need antibiotics?”\n\n“No, you don’t,” Dr. Park said. “Antibiotics won’t help. Antibiotics fight bacteria. A cold is a virus, so antibiotics don’t work on it.”\n\n“Then what should I do?” Hana asked.\n\n“Your body is already doing the work,” Dr. Park said. “Get plenty of rest. Drink lots of water. Warm tea with honey is good for your throat.”\n\nCarol nodded like a proud teacher.\n\n“If your fever gets high, or if you don’t feel better in about ten days, come back and see me,” Dr. Park said. “But I think you’ll feel better soon.”\n\n“When can I go back to work?” Hana asked. “I work at Bluebird Cafe.”\n\n“Ah, I love that place,” Dr. Park said. “Rest today and tomorrow. When your fever is gone for a full day, you can work. And wash your hands often.”\n\n“I understand,” Hana said. “Rest, water, and clean hands.”\n\n“You just repeated my whole job in six words,” Dr. Park laughed. “Well done.”\n\nAt the front desk, Carol took care of the papers. The receptionist gave Hana a small sticker with a smiling star.\n\n“We give them to brave kids,” she said. “And to brave adults, too.”\n\nOutside, the sun finally came out. The wet street was shining.\n\n“You did all of that in English,” Carol said. “The form, the questions, everything. Two months ago, could you do that?”\n\nHana thought about it. “No,” she said slowly. “Two months ago, I was afraid of the phone. Today I talked to a doctor.”\n\n“That’s right,” Carol said. “Sick days can be growing days, too.”\n\nHana texted Rosa and Emma: “The doctor says it’s just a cold. I need rest and water. No antibiotics, because a cold is a virus!”\n\nRosa sent back a photo of a big pot of soup. Emma wrote, “Our little doctor! Get well soon!”\n\nLeo wrote, “Rest well. Your customers miss you. My jokes are wasted on Emma.”\n\nHana laughed, coughed, and laughed again. Then she looked at Carol.\n\n“Dr. Park said tea with honey. We don’t have honey at home. I used the last spoon yesterday.”\n\n“Good thing there’s a pharmacy right next door,” Carol said. “Let’s get your honey, some cough drops, and something for that fever.”\n\nHana looked at the small store with the green cross — one more place to try her English.","glossary":[{"w":"clinic","ja":"診療所"},{"w":"waiting room","ja":"待合室"},{"w":"receptionist","ja":"受付の人"},{"w":"fill out","ja":"記入する"},{"w":"form","ja":"記入用紙"},{"w":"insurance","ja":"保険"},{"w":"temperature","ja":"体温"},{"w":"chest","ja":"胸"},{"w":"stethoscope","ja":"聴診器"},{"w":"lungs","ja":"肺"},{"w":"patient","ja":"患者"},{"w":"virus","ja":"ウイルス"},{"w":"antibiotics","ja":"抗生物質"},{"w":"bacteria","ja":"細菌"},{"w":"pharmacy","ja":"薬局"}],"phrases":[{"en":"What seems to be the problem?","ja":"今日はどうしましたか？"},{"en":"I’ve had a cough since Monday.","ja":"月曜日からせきが出ています。"},{"en":"Take a deep breath, please.","ja":"深呼吸してください。"},{"en":"Get plenty of rest.","ja":"しっかり休んでね。"},{"en":"Drink lots of water.","ja":"水をたくさん飲んでね。"}],"quiz":[{"q":"Why did Hana go to the clinic?","c":["Her leg hurt","She had a cough and a fever","She wanted a new job","Carol was sick"],"a":1},{"q":"Why won’t antibiotics help Hana?","c":["She is too young","They cost too much","Her cold is too strong","A cold is a virus"],"a":3},{"q":"How did Hana feel after the visit?","c":["Proud of her English","Angry at the doctor","Afraid of the medicine","Sad about work"],"a":0}],"words":777},{"id":33,"level":2,"emoji":"💊","theme":"薬局で薬を買う","titleEn":"Small Words on the Medicine Box","titleJa":"薬のラベルは小さな英語テスト","teaser":"診察のあとは薬局へ。棚いっぱいの薬、ラベルの小さな英語。ハナは薬剤師さんに質問できる？","story":"The pharmacy next to the clinic smelled like mint and clean paper.\n\nHana stood in front of a wall of medicine boxes. There were so many colors and words.\n\n“In Japan, I know all the boxes,” she said. “Here, I know nothing.”\n\n“That’s why pharmacists exist,” Carol said. “Ask them anything. It’s their job.”\n\nA tall pharmacist with round glasses stood behind the counter. His name tag said MARCUS.\n\nHana walked over. “Excuse me, can you help me?”\n\n“Of course,” Marcus said. “What do you need today?”\n\n“I have a cold,” Hana said. “Dr. Park says it’s a virus. I need something for my fever and my throat.”\n\n“A virus, huh? Then rest is your real medicine,” Marcus said. “But we can make you comfortable. Follow me.”\n\nHe picked up a small box. “This is for fever and headaches. It will also help your sore throat.”\n\nHana held the box. The letters were very small.\n\n“How often should I take this?” she asked.\n\n“Good question. Look here.” Marcus pointed at the label. “Take one pill every six hours. Do not take more than four pills in one day.”\n\n“One pill, six hours, four in one day,” Hana repeated. “Should I take it with food?”\n\n“With this one, water is enough,” Marcus said. “But some medicines need food, so always read the label. The label is small, but it’s important.”\n\n“The label is like a tiny English test,” Hana said.\n\nMarcus laughed. “I never thought about it that way. You’re right.”\n\nCarol picked up a yellow box. “What about a night medicine? Her cough wakes her up.”\n\n“This one is good,” Marcus said. “But be careful. It makes you sleepy. Take it only at night, and don’t ride a bike after it.”\n\n“No problem,” Hana said. “When I am sick, my bike is on vacation.”\n\nNext, they found the cough drops. There were ten flavors: cherry, mint, lemon, and more.\n\nHana’s phone buzzed. It was Leo: “If you are at the pharmacy, get honey lemon cough drops. Trust me. I’m a professional sick person.”\n\nHana showed Carol the message and they laughed. She took the honey lemon bag.\n\nAt the shelf by the window, Carol added a jar of honey and a box of soft tissues.\n\n“Anything else?” Marcus asked at the register. “Do you have any questions about the medicine?”\n\nHana thought for a moment. “Yes. Can I take the fever medicine and the night medicine together?”\n\n“Very good question,” Marcus said. “Look at this line on the night medicine. It already has fever medicine inside. So don’t take both at the same time. Choose one.”\n\n“Oh! That’s a little dangerous,” Hana said. “Thank you for telling me.”\n\n“That’s exactly why you should ask,” Marcus said. “People who ask questions are my favorite customers.”\n\nCarol paid, and Marcus put everything in a small white bag.\n\n“One pill every six hours, night medicine only at night, and not together,” Hana said. “Water is okay. Read the label.”\n\n“Perfect score,” Marcus said. “Get well soon.”\n\n“Thank you very much,” Hana said. “When I am better, I will come and say hello. In a healthy voice.”\n\nOn the walk home, the clouds finally moved away. June sun warmed the wet street.\n\n“You asked five questions in there,” Carol said. “Five! In April, you were afraid to ask one.”\n\n“Questions are free,” Hana said. “That makes sense. Before, I thought questions showed my bad English. Now I think questions are my best English.”\n\nCarol stopped walking for a second. “Hana, that’s the smartest thing I heard all week. And I work at a hospital.”\n\nAt home, Hana took one pill with a big glass of water. She wrote the time on a sticky note: 1:00.\n\n“Next pill at 7:00,” she said. “I’m the pharmacist of this bedroom now.”\n\nShe slept all afternoon. Daisy guarded the door like a soft yellow nurse.\n\nIn the evening, her fever went down a little. The cough drops tasted like sweet lemon tea.\n\nBen looked into her room. “You look less like a zombie today. That’s a compliment.”\n\n“Thank you,” Hana laughed. “Tomorrow, maybe no zombie at all.”\n\nBefore sleeping, Hana thought about the week. Rosa sent her home. Carol made soup. Dr. Park explained the virus. Marcus taught her the labels. Emma, Leo, Ben, Mike, and even Daisy — everyone took care of her.\n\n“When I am well,” she thought, “I want to say thank you. But not only with words.”\n\nShe remembered her grandmother’s kitchen in Matsuyama, and a sweet, warm smell — and suddenly she knew exactly what to make.","glossary":[{"w":"pharmacy","ja":"薬局"},{"w":"pharmacist","ja":"薬剤師"},{"w":"name tag","ja":"名札"},{"w":"comfortable","ja":"楽な"},{"w":"pill","ja":"錠剤"},{"w":"label","ja":"ラベル"},{"w":"cough drops","ja":"のどあめ"},{"w":"flavor","ja":"味"},{"w":"professional","ja":"プロの"},{"w":"tissues","ja":"ティッシュ"},{"w":"register","ja":"レジ"},{"w":"dangerous","ja":"危険な"},{"w":"healthy","ja":"健康な"},{"w":"sticky note","ja":"ふせん"},{"w":"compliment","ja":"ほめ言葉"}],"phrases":[{"en":"Excuse me, can you help me?","ja":"すみません、手伝ってもらえますか？"},{"en":"How often should I take this?","ja":"これはどのくらいの間隔で飲めばいいですか？"},{"en":"Should I take it with food?","ja":"食事と一緒に飲むべきですか？"},{"en":"Get well soon.","ja":"早くよくなってね。"},{"en":"That makes sense.","ja":"なるほど、納得です。"}],"quiz":[{"q":"Where did Hana buy her medicine?","c":["At the pharmacy next to the clinic","At Bluebird Cafe","At the supermarket","At the library"],"a":0},{"q":"Why can’t Hana take the two medicines together?","c":["They taste bad together","One is too old","The night medicine already has fever medicine inside","Marcus forgot the reason"],"a":2},{"q":"What does Hana think about questions now?","c":["They show bad English","They are her best English","They are rude in America","They are only for children"],"a":1}],"words":764},{"id":34,"level":2,"emoji":"🥞","theme":"回復とお礼のどら焼き","titleEn":"Thank-You Dorayaki","titleJa":"ありがとうのどら焼き","teaser":"元気になったハナ、おばあちゃん直伝のどら焼き作りに挑戦。みんなに「ありがとう」を届ける日。","story":"By Saturday morning, Hana’s cold was gone, and the kitchen was hers.\n\nShe woke up early and stood by the stove with a secret smile. On the table were eggs, flour, sugar, and a can of sweet red beans from the Asian market.\n\nCarol came in with sleepy hair. “Hana? You’re up early. What’s all this?”\n\n“Today I say thank you,” Hana said. “Everyone took care of me this week. So I’m making dorayaki.”\n\n“Dora… yaki?” Carol asked.\n\n“Dorayaki. They are small, soft pancakes. You put anko between two of them. Anko is sweet red bean paste. My grandmother taught me the recipe.”\n\n“Sweet beans?” Ben walked in, looking at his phone. “Beans are not dessert. Beans are for chili.”\n\n“In Japan, beans can be dessert,” Hana laughed. “Wait and see, Ben.”\n\nSoon the first small pancakes were cooking. The kitchen filled with a warm, sweet smell.\n\nMike appeared at the door like a dog that heard the word walk. “It smells amazing. What is it? Can I test it? For safety?”\n\n“Not yet,” Hana said. “The first ones are always a little ugly. My grandmother said, the pan needs practice, too.”\n\nHana flipped the pancakes until they were golden brown. Then she put a spoon of anko on one pancake and pressed another on top. It looked like a little round sandwich.\n\n“Okay,” she said. “Now, please try. Help yourself!”\n\nMike took the first bite. He closed his eyes. He said nothing for three seconds.\n\n“Mike?” Carol asked. “Are you okay?”\n\n“I’m more than okay,” he said. “These beans… they’re bean-utiful.”\n\nBen groaned. “Dad. Please. It’s eight in the morning.”\n\nThen Ben tried one. He looked at it. He looked at Hana. He took a second one without a word.\n\n“So?” Hana asked. “Beans can be dessert?”\n\n“I was wrong about beans,” Ben said. “Would you like some more?” he added, holding the plate — and then he took a third one himself.\n\nEverybody laughed. Daisy waited under the table, but chocolate and sweet beans were not for dogs, so she got her own biscuit.\n\nAfter breakfast, Hana packed two boxes. One was for the cafe. One was for Mrs. Chen.\n\nAt Bluebird Cafe, the morning rush was ending. Rosa saw her and opened her arms wide.\n\n“Look who’s back! How are you feeling?”\n\n“I’m feeling much better. Thank you for the soup photo,” Hana said. “And thank you for sending me home on Tuesday. You were right.”\n\n“Of course I was right,” Rosa laughed her big laugh. “I’m always right. Ask anybody.”\n\nHana opened the box. “I made dorayaki for everyone. Thank you for taking care of me.”\n\nEmma’s eyes went wide. “You made these? They look like little moons!”\n\nLeo took a bite and pointed at the box. “Okay, new rule. Hana gets sick every week.”\n\n“Leo!” Emma hit his arm. “Don’t say that. But Hana… these are really, really good.”\n\nRosa ate hers slowly. Then she was quiet, and her eyes were thinking eyes.\n\n“Hana,” she said. “This anko. This soft pancake. People here don’t know this taste. Maybe one day, we should talk about that.”\n\n“Talk about what?” Hana asked.\n\n“About your Japan and my menu,” Rosa smiled. “Not today. But one day.”\n\nHana didn’t understand everything, but her heart felt warm and light.\n\nOn the way home, she knocked on Mrs. Chen’s door. Mochi watched from the window like a small white cloud.\n\n“Dorayaki!” Mrs. Chen said. “I know these! A student gave me one, thirty years ago. I never forgot it.”\n\n“Please, help yourself,” Hana said. “I made too many.”\n\n“There is no such thing as too many,” Mrs. Chen said. They ate together on the porch, and Mochi smelled everything carefully.\n\n“Being sick in a new country is hard,” Mrs. Chen said softly. “But look at you. You have people. That’s the important thing.”\n\n“Yes,” Hana said. “I have people.” The words felt big and true.\n\nBack at home, Rosa called. Hana answered in the hallway.\n\n“Hana, you left before I could give you something,” Rosa said. “Your first pay is ready. Come get your check on Monday.”\n\n“My first pay,” Hana repeated. “My first American pay!”\n\n“One problem,” Rosa said. “It’s a paper check. Do you have a bank account here?”\n\n“A bank account? No. In America, no.”\n\n“Then Monday you’ll have a new adventure,” Rosa laughed. “The bank!”\n\nHana hung up and looked at Mike. “How do you open a bank account?”\n\nMike rubbed his hands together. “Oh, this is going to be fun. Banks love me. I have so many questions for them.”\n\nCarol shook her head slowly. “Hana, whatever happens on Monday… I am so sorry.”","glossary":[{"w":"stove","ja":"コンロ"},{"w":"flour","ja":"小麦粉"},{"w":"bean paste","ja":"あんこ"},{"w":"recipe","ja":"レシピ"},{"w":"dessert","ja":"デザート"},{"w":"flipped","ja":"ひっくり返した"},{"w":"golden brown","ja":"きつね色"},{"w":"pressed","ja":"押しつけた"},{"w":"groaned","ja":"うめいた"},{"w":"packed","ja":"箱に詰めた"},{"w":"rush","ja":"混雑の時間"},{"w":"biscuit","ja":"ビスケット"},{"w":"porch","ja":"玄関ポーチ"},{"w":"check","ja":"小切手"},{"w":"bank account","ja":"銀行口座"}],"phrases":[{"en":"It smells amazing.","ja":"すごくいいにおい！"},{"en":"Help yourself!","ja":"ご自由にどうぞ！"},{"en":"Would you like some more?","ja":"もう少しいかが？"},{"en":"I’m feeling much better.","ja":"もうだいぶ元気です。"},{"en":"Thank you for taking care of me.","ja":"お世話になりました。"}],"quiz":[{"q":"What did Hana make on Saturday morning?","c":["Chocolate cake","Chili with beans","Melon bread","Dorayaki"],"a":3},{"q":"What did Ben think after he tried one?","c":["Beans are only for chili","He was wrong about beans","It was too sweet","It needed more sugar"],"a":1},{"q":"Why does Hana need a bank account?","c":["She wants to buy a car","Mike asked her to get one","Her first pay is a paper check","Rosa needs her help at the bank"],"a":2}],"words":778},{"id":35,"level":2,"emoji":"🏦","theme":"銀行口座を開く","titleEn":"Hana Opens a Bank Account","titleJa":"はじめての銀行口座","teaser":"初めてのお給料は紙の小切手！マイクと一緒に銀行へ。書類、サイン、そしてマイクの銀行ジョーク…。","story":"On Monday afternoon, Hana held her first American paycheck with two hands.\n\nAt the cafe that morning, Rosa gave her a white envelope. “Your first check,” she said. “You worked hard for this. Now go make it real money.”\n\nAfter her shift, Mike drove her to the bank. He was strangely excited.\n\n“Banks are like quiet libraries,” he said, “but the books are money. I love asking bankers questions.”\n\n“Please be normal today,” Hana said.\n\n“I promise nothing,” said Mike.\n\nThe bank was cool and quiet, with a long counter and soft music. A woman in a blue jacket smiled at them from a desk. Her name plate said MS. RIVERA.\n\n“Good afternoon! How can I help you today?”\n\nHana stepped forward. She practiced this sentence on the drive.\n\n“Hello. I’d like to open an account, please.”\n\n“Wonderful. Please have a seat,” Ms. Rivera said. “Is this your first account in the U.S.?”\n\n“Yes. I’m from Japan. I’m here for nine months, and I work at Bluebird Cafe.”\n\n“Oh, I love their blueberry muffins,” Ms. Rivera said. “Okay, I need some information. May I see your ID?”\n\nHana gave her passport and the letter from her program. Ms. Rivera typed quickly.\n\n“Address? Phone number?” Hana answered each question slowly and clearly. Nobody hurried her.\n\n“Now, you want a checking account,” Ms. Rivera said. “That’s for everyday money. In and out, like a door.”\n\n“A door for money,” Hana repeated. “And… saving account?”\n\n“A savings account is more like a box on a high shelf,” Ms. Rivera said. “Money sleeps there and waits. Do you want both?”\n\n“Yes, please. I want to save a little every month. For presents, and maybe for a dream.”\n\n“A dream?” Ms. Rivera looked up.\n\n“Maybe one day, my own small bakery,” Hana said, and her ears turned pink. “It’s far away. But saving can start now.”\n\n“That’s the best answer I heard all week,” Ms. Rivera said.\n\nThen came the papers. So many papers. Ms. Rivera pointed at a line at the bottom.\n\n“Sign here, please. And here. And one more here.”\n\nHana signed her name three times. Her signature got better each time.\n\n“Your debit card will come by mail in about a week,” Ms. Rivera said. “Keep these papers safe. This one has your account number.”\n\nMike leaned forward. Hana felt danger.\n\n“Quick question,” Mike said. “Why do banks have branches?”\n\nMs. Rivera blinked. “Well, a branch is what we call each bank office, so—”\n\n“Because money doesn’t grow on trees!” Mike said. “So the bank grew branches!”\n\nThere was a silence. Then Ms. Rivera laughed so loudly that two other bankers looked over.\n\n“Sir, that’s terrible,” she said, wiping her eyes. “I’m going to tell everyone at lunch.”\n\n“See?” Mike said to Hana. “Banks love me.”\n\nFinally, Hana gave Ms. Rivera the check from Rosa. “Can I put this in my new account?”\n\n“Of course. This is called a deposit.” Ms. Rivera typed, stamped, and printed a small paper. “Here you go. Your first deposit.”\n\nHana looked at the number on the paper. It was not big. But it was hers, from her own work, in her own account, in English.\n\n“Thank you very much,” she said. “Today was easier than I thought.”\n\n“You were well prepared,” Ms. Rivera said. “Welcome to the neighborhood, Hana. Here’s a free pen.”\n\nMike took a lollipop from the little basket. “For my son,” he said. He ate it in the car.\n\nOn the drive home, Hana held her papers like a small treasure.\n\n“First pay, first account, first deposit,” she said. “Rosa said today will be an adventure. She was right.”\n\n“Adventures with paperwork are the best adventures,” Mike said. “Low danger, free pens.”\n\n“In Japan, banks close at three and everyone is very quiet,” Hana said. “Here I got a pen, a lollipop story, and a joke. America is interesting.”\n\nAt dinner, Hana told everyone about the money door and the box on the high shelf. Carol said Ms. Rivera should be a teacher. Ben asked if the bank had free lollipops, and looked at Mike’s guilty face.\n\nBefore bed, Emma texted: “Farmers market on Saturday? Strawberries are in season! 🍓”\n\nHana wrote back: “Yes! I have my own money now. I’m rich! (A little rich.)”\n\nShe folded the bank papers carefully and put them in her small brown wallet. The wallet was a present from her mother, old and soft.\n\n“Big week for you,” she said to the wallet, and put it in her bag for Saturday.\n\nThe wallet, of course, said nothing — but it was going to have a very interesting weekend.","glossary":[{"w":"paycheck","ja":"給料の小切手"},{"w":"envelope","ja":"封筒"},{"w":"banker","ja":"銀行員"},{"w":"name plate","ja":"名札"},{"w":"have a seat","ja":"おかけください"},{"w":"ID","ja":"身分証明書"},{"w":"checking account","ja":"普通口座"},{"w":"savings account","ja":"貯蓄口座"},{"w":"sign","ja":"署名する"},{"w":"signature","ja":"サイン・署名"},{"w":"debit card","ja":"デビットカード"},{"w":"branch","ja":"支店"},{"w":"deposit","ja":"預け入れ"},{"w":"prepared","ja":"準備ができた"},{"w":"treasure","ja":"宝物"}],"phrases":[{"en":"How can I help you today?","ja":"今日はどのようなご用件ですか？"},{"en":"I’d like to open an account, please.","ja":"口座を開きたいのですが。"},{"en":"May I see your ID?","ja":"身分証を見せていただけますか？"},{"en":"Sign here, please.","ja":"ここにサインをお願いします。"},{"en":"Here you go.","ja":"はい、どうぞ。"}],"quiz":[{"q":"Why did Hana go to the bank?","c":["To meet Ms. Rivera","To get free pens","To open an account for her first check","To help Mike with his money"],"a":2},{"q":"What is a checking account like, in Ms. Rivera’s words?","c":["A door for everyday money","A box on a high shelf","A quiet library","A tree with branches"],"a":0},{"q":"Why did Hana’s ears turn pink at the desk?","c":["The bank was too hot","She shared her dream of a bakery","Mike told a bad joke","She forgot her passport"],"a":1}],"words":771},{"id":36,"level":2,"emoji":"👛","theme":"財布をなくした！","titleEn":"Where Is My Wallet?","titleJa":"お財布がない！","teaser":"ファーマーズマーケットで楽しい買い物のあと、バッグの中にあるはずの財布がない…！ハナ、大ピンチ。","story":"Saturday started with sunshine, strawberries, and no problems at all.\n\nThe farmers market was full of June colors. Hana and Emma walked between the stands, smelling bread and flowers.\n\n“Strawberries first,” Emma said. “In June, strawberries are the law.”\n\nHana bought a big box of strawberries. “These smell like June,” she said, and she felt proud paying with her own money.\n\nAt the flower stand, she bought three sunflowers for Carol. At another stand, they tried little pieces of cheese on toothpicks.\n\n“Free cheese makes everything taste better,” Emma said. “That’s science.”\n\nAfter the market, they stopped at Bluebird Cafe for cold lemonade. It was Emma’s day off, but they still sat at their favorite table by the window.\n\nLeo waved from behind the counter. “You two can’t stay away from this place. I understand. I’m very popular.”\n\nThey laughed, drank their lemonade, and talked about summer plans.\n\nLater, on the walk home, they passed an ice cream cart. The sign said: MARIONBERRY SWIRL.\n\n“Marionberry is Oregon’s special berry,” Emma said. “You have to try it. This is also the law.”\n\n“So many laws today,” Hana laughed. She opened her bag to pay.\n\nHer hand stopped. She looked inside. She moved the sunflowers, the strawberries, her water bottle.\n\n“Emma,” she said slowly. “I can’t find my wallet.”\n\n“It’s probably at the bottom,” Emma said. “Bags eat wallets. It’s normal.”\n\nHana knelt on the sidewalk and took everything out. Strawberries. Flowers. Phone. Keys. A cheese toothpick.\n\nNo wallet.\n\nHer chest went cold. “Emma. My bank papers are in it. My new account number. And the wallet — my mother gave it to me. Before I came to America.”\n\n“Okay. Don’t panic. Breathe,” Emma said, and she held Hana’s shoulders. “We’re going to think. When did you last see it?”\n\nHana closed her eyes. “The flower stand. No — after that. The cheese place? I… I don’t remember. My head is all noise.”\n\n“Then we walk back,” Emma said. “Same streets, same places. Wallets don’t have legs.”\n\nThey walked back fast. At the ice cream cart, the man shook his head. “Sorry. But leave your number. People are mostly good.”\n\nAt the market, some stands were already packing up. Boxes, trucks, empty tables.\n\nThe cheese man checked around his stand. “Sorry, nothing here,” he said. “Let me check again.” He looked in every box twice. Nothing.\n\nThe flower lady remembered Hana’s sunflowers, but not her wallet. “Try the information booth, sweetie. They keep lost things.”\n\nThey looked under the market benches and behind a big flower pot. A man selling honey helped them look, too. Everyone was kind, but nobody saw a small brown wallet.\n\nAt the information booth, a woman with a clipboard listened kindly.\n\n“A small brown wallet,” Hana said. Her voice shook a little. “It’s old. It has flowers inside — no, flowers on the side. Sorry. My English falls down when I’m scared.”\n\n“Your English is fine,” the woman said. “No brown wallet today. Write your name and phone number here. If it comes in, we’ll call you.”\n\nHana wrote her number. Her hand was not steady.\n\nOutside the market, the streets looked different now. Every trash can looked like a bad ending.\n\n“The bank papers,” Hana said quietly. “Ms. Rivera said, keep them safe. One week! I kept them safe for one week.”\n\n“Papers can be fixed. Banks can help,” Emma said. “It’s going to be okay. I promise. Tomorrow we’ll be detectives. We’ll ask at every shop.”\n\nAt home, Hana told the Millers everything. Saying it out loud made her eyes hot.\n\n“First things first,” Carol said. “Call the bank’s lost line tonight. They can watch your account. It’s a normal thing. People lose wallets every day.”\n\nMike was already making a list. “Places, times, streets. We’ll make a wallet map. I love a good mystery.”\n\n“I saw a video about a wallet that came back after two years,” Ben said. “With a letter inside. And ten extra dollars.”\n\n“Ben, that’s not science,” Mike said. “But it’s nice. Say more things like that.”\n\nHana called the bank line with Carol’s help. A calm voice froze her card and said kind, slow words. Nothing was stolen. Nothing was used.\n\nIn bed, Hana looked at the ceiling and walked through the day again. Strawberries. Flowers. Cheese. Lemonade. Ice cream. Where did her little brown friend say goodbye?\n\nHer phone buzzed. Emma: “Detective meeting, 9 a.m. Wear comfortable shoes. We will find it. 🔎”\n\nHana smiled a small, tired smile and closed her eyes.\n\nSomewhere in Portland, under a table or in a kind stranger’s hands, her mother’s wallet was waiting for tomorrow.","glossary":[{"w":"stand","ja":"屋台・売り場"},{"w":"toothpick","ja":"つまようじ"},{"w":"day off","ja":"休みの日"},{"w":"cart","ja":"屋台カート"},{"w":"wallet","ja":"財布"},{"w":"knelt","ja":"ひざをついた"},{"w":"sidewalk","ja":"歩道"},{"w":"packing up","ja":"片付け中"},{"w":"information booth","ja":"案内所"},{"w":"clipboard","ja":"バインダー"},{"w":"steady","ja":"安定した"},{"w":"detective","ja":"探偵"},{"w":"mystery","ja":"なぞ・事件"},{"w":"froze","ja":"凍結した"},{"w":"stolen","ja":"盗まれた"}],"phrases":[{"en":"I can’t find my wallet.","ja":"財布が見つかりません。"},{"en":"Don’t panic.","ja":"あわてないで。"},{"en":"When did you last see it?","ja":"最後に見たのはいつ？"},{"en":"Let me check again.","ja":"もう一度確認しますね。"},{"en":"It’s going to be okay.","ja":"きっと大丈夫だよ。"}],"quiz":[{"q":"When did Hana find out her wallet was missing?","c":["At the flower stand","At the ice cream cart","At the bank","At home"],"a":1},{"q":"Why is this wallet extra special to Hana?","c":["It was very expensive","Rosa gave it to her","It came from the bank","Her mother gave it to her"],"a":3},{"q":"How did Emma help Hana the most?","c":["She bought a new wallet","She called the police","She stayed calm and made a plan","She paid for the ice cream"],"a":2}],"words":774},{"id":37,"level":2,"emoji":"🔎","theme":"財布の行方","titleEn":"The Wallet Comes Home","titleJa":"お財布のゆくえ","teaser":"探偵気分のハナとエマ、町のお店を一軒ずつ聞き込みへ。「小さくて茶色い財布です」——奇跡は起きる？","story":"Sunday morning, two detectives stood in front of the Miller house with serious faces.\n\nEmma wore sunglasses and held Mike’s “wallet map.” It showed every place from Saturday, with times and little notes.\n\n“Mike stayed up late making this,” Hana said. “He drew a magnifying glass in the corner.”\n\n“Your host dad is a special person,” Emma said. “Okay, Detective Sato. Let’s go.”\n\nTheir first stop was the corner where the ice cream cart stood. On Sundays, the cart wasn’t there. Only an empty square of sidewalk.\n\n“Next,” Emma said. “We ask at every shop on the walk home. Somebody saw something.”\n\nAt the little bookshop, a man with a gray beard looked up from a box of books.\n\n“Excuse me,” Hana said. “Did anyone find a wallet? Maybe yesterday afternoon?”\n\n“What does it look like?” he asked.\n\n“It’s small and brown. It’s a little old, with a flower on one corner,” Hana said. “It was a present from my mother.”\n\n“I’m sorry, no,” the man said kindly. “But leave your number. Wallets walk in here sometimes. Books too.”\n\nAt the bagel shop, the answer was the same. At the flower shop, the same. Each time, Hana described it better and faster.\n\n“You know,” Emma said, “your describing English is getting really good. Small, brown, old, flower on the corner. Like a police show.”\n\n“I don’t want this practice,” Hana laughed sadly. “But thank you.”\n\n“Also, free tip,” Emma said. “Detectives need snacks. At the next shop with food, we stop and think.”\n\nThey sat down on a bench to rest. Hana looked at the map.\n\n“Emma. We forgot a place. It’s not on the map.”\n\n“What? Mike checked everything three times.”\n\n“The map shows the market and the walk home,” Hana said slowly. “But between them… we drank lemonade. At Bluebird!”\n\nEmma’s mouth opened. At that exact moment, Hana’s phone rang. It was Rosa.\n\n“Hana!” Rosa’s big voice filled the street. “Why is your face on Mike’s map and not in my cafe? Come here right now. Someone turned it in!”\n\n“Turned it in? My wallet?!”\n\n“Small, brown, flower on the corner? It’s sitting next to my coffee machine, safe like a baby bird.”\n\nHana and Emma ran three blocks. They arrived with red faces and no breath.\n\nRosa held up the little brown wallet. Hana took it with both hands.\n\nThe money was there. The bank papers were there. The little photo of her family in Matsuyama — there.\n\n“What a relief!” Emma said. “Hana, breathe. You look like a fish.”\n\n“Who found it?” Hana asked. “Where was it?”\n\nRosa pointed at the window table. “Mr. Foster. He comes every morning with his newspaper. Today he dropped his pen, looked under the seat, and hello — a wallet. It fell behind the cushion.”\n\n“The lemonade table,” Emma said. “The bag was on the seat. Mystery solved, detective.”\n\nMr. Foster sat in the corner with his newspaper and his usual black coffee. He was a quiet man with white hair and kind eyes.\n\nHana walked to his table. Her heart was full.\n\n“Mr. Foster. Thank you so much. This wallet is very important to me. My mother gave it to me.”\n\n“Then I’m glad it’s back with you,” Mr. Foster said. He spoke slowly, like Mrs. Chen. “I lost my wallet in Rome, forty years ago. A stranger ran two streets to bring it back. Today it was my turn.”\n\n“Your coffee is on me today, Mr. Foster,” Rosa called. “Hero price: free.”\n\n“And next week, I will bring you dorayaki,” Hana said. “It’s a Japanese sweet. I make them myself.”\n\n“Then I lost nothing, and I won a dessert,” Mr. Foster smiled. “A very good Sunday.”\n\nHana held her wallet and looked around the cafe — Rosa laughing, Emma stealing a cookie, Leo arriving for his shift and hearing the whole story too loudly.\n\n“People are mostly good,” Hana said. “The ice cream man said that. He was right.”\n\n“Mostly good, and sometimes great,” Emma said. “Now buy me a lemonade, rich detective.”\n\nJust then, Mrs. Chen came in for her Sunday tea. She heard the story and clapped her small hands.\n\n“Wonderful! Then you can come to the potluck with a happy heart,” she said.\n\n“Potluck?” Hana asked.\n\n“Next Sunday, our street has a summer potluck party,” Mrs. Chen said. “Everyone brings one dish and shares. Hana, will you bring something from Japan?”\n\nSomething from Japan. A hundred ideas jumped into Hana’s head at the same time.\n\nBut which dish could introduce her home to the whole neighborhood?","glossary":[{"w":"magnifying glass","ja":"虫めがね"},{"w":"beard","ja":"あごひげ"},{"w":"describe","ja":"説明する"},{"w":"corner","ja":"角・すみ"},{"w":"exact","ja":"ちょうどの"},{"w":"turned it in","ja":"届けてくれた"},{"w":"cushion","ja":"クッション"},{"w":"solved","ja":"解決した"},{"w":"usual","ja":"いつもの"},{"w":"relief","ja":"安心・ほっ"},{"w":"stranger","ja":"知らない人"},{"w":"hero","ja":"ヒーロー"},{"w":"clapped","ja":"拍手した"},{"w":"potluck","ja":"持ち寄り会"},{"w":"dish","ja":"一品・料理"}],"phrases":[{"en":"Did anyone find a wallet?","ja":"財布の届け物はありませんでしたか？"},{"en":"What does it look like?","ja":"どんな見た目ですか？"},{"en":"It’s small and brown.","ja":"小さくて茶色です。"},{"en":"Someone turned it in!","ja":"届けてくれた人がいたよ！"},{"en":"What a relief!","ja":"ああ、よかった！"}],"quiz":[{"q":"Where was Hana’s wallet?","c":["Behind a seat cushion at the cafe","Under the ice cream cart","At the information booth","In the bookshop"],"a":0},{"q":"Why wasn’t the cafe on Mike’s map?","c":["Mike doesn’t like the cafe","The cafe was closed on Saturday","The lemonade stop was between the market and the walk home","Emma erased it"],"a":2},{"q":"Why did Mr. Foster say “it was my turn”?","c":["It was his turn to order coffee","He wanted free dorayaki","He always finds wallets","A stranger returned his wallet long ago"],"a":3}],"words":761},{"id":38,"level":2,"emoji":"🍙","theme":"ポットラックにおにぎり","titleEn":"Rice Balls for the Neighborhood","titleJa":"ご近所さんへ、おにぎりを","teaser":"町内のポットラックパーティーに、ハナはおにぎりで参加！黒い海苔にご近所さんの反応は…？","story":"One week later, the whole street smelled like a hundred different dinners.\n\nIt was potluck Sunday. Long tables stood in the middle of the closed street, and neighbors carried out bowls and pots.\n\nHana carried a big plate covered with a cloth. Under the cloth: twenty-four onigiri, in neat triangle rows.\n\nShe made them all morning. Carol helped her cook the rice. Ben helped too, in his own way.\n\n“This one is a soccer ball,” he said, holding a very round one. “Triangles are hard.”\n\n“It’s good rice, so it’s a good onigiri,” Hana said. “Shape is only fashion.”\n\nAt the tables, Mike put down his hot dogs and read every dish like a menu. “Potato salad, tacos, noodles, pie… I need a bigger plate. Maybe two plates.”\n\nMrs. Chen arrived with a big pot of jasmine tea and almond cookies. Daisy and two other dogs walked around the tables with hopeful eyes.\n\nA tall neighbor with a friendly voice waved at Hana. “Hi! I’m Tom, from the yellow house. What did you bring?”\n\nHana lifted the cloth. “These are from Japan. It’s a rice ball. In Japanese, we say onigiri.”\n\n“Oni-giri,” Tom repeated slowly. “What’s the black paper?”\n\n“It’s nori — dried seaweed,” Hana said. “It keeps your hands clean, and it tastes like the sea. Would you like to try one?”\n\nTom looked at the nori. He was quiet for two seconds too long.\n\n“Seaweed,” he said. “Like… from the ocean?”\n\n“Like salad from the ocean,” Hana smiled. “Inside this one is salmon. Inside that one is tuna with mayonnaise.”\n\nBefore Tom could answer, a small girl pushed between them. She had a butterfly painted on her cheek.\n\n“I want the triangle!” she said. “Triangles are my favorite shape!”\n\n“Lily, ask nicely,” Tom said. “That’s my daughter.”\n\n“Please and thank you!” Lily said, all in one breath.\n\nHana gave her a salmon onigiri. Everyone watched. Lily took a big bite. Her eyes became two round moons.\n\n“It’s SO good,” she said with a full mouth. “Daddy, it’s like a rice present!”\n\nA rice present. Hana wanted to write that down.\n\nTom tried one next. He nodded slowly, then quickly. “Okay. Wow. This is delicious! The seaweed is… actually great. I was scared of nothing.”\n\n“I’m glad you like it. Really glad,” Hana said, and her cheeks turned warm.\n\nAfter that, the onigiri had a line. A real line, like at Bluebird Cafe on Saturday morning.\n\nHana showed people how to hold them. She explained the fillings. She said “umeboshi” three times for a curious grandmother — it’s a sour pickled plum, and only the brave ones chose it.\n\nThe brave grandmother ate it, closed one eye, and laughed. “Sour! Wonderful! Like my first boyfriend.”\n\nIn twenty minutes, the plate was empty. Even Ben’s soccer ball found a home.\n\nLily came back with two friends. They looked at the empty plate with big, sad eyes.\n\n“All gone?” Lily asked. “But my friends want a rice present, too!”\n\n“At the next potluck, I will make many more,” Hana promised. “And Lily, you can be my helper.”\n\n“Can I make a star shape?” Lily asked.\n\n“Stars, hearts, soccer balls,” Hana said. “Rice is free about shapes.”\n\nHana finally sat down with a paper plate of neighborhood food: tacos, potato salad, a piece of blueberry pie.\n\n“Your plate is empty and my stomach is full,” Mike said. “That’s a successful potluck.”\n\nCarol looked at the happy street. “Two months ago, you knew nobody here. Now the whole neighborhood knows your onigiri.”\n\n“Next time I should make fifty,” Hana said.\n\n“Next time, one hundred,” said Mrs. Chen, pouring tea. “And save two for me. I was too slow today.”\n\nAs the sun went down, a woman with short silver hair came to Hana’s seat. She held an empty onigiri paper like a ticket.\n\n“I ate two of these. They were perfect,” she said. “I’m Nadia. I teach a cooking class at the community center. Thursday nights.”\n\n“A cooking class?” Hana sat up straight.\n\n“This week we’re baking blueberry muffins. Oregon berries, easy English, friendly people,” Nadia said. “You clearly love food. Will you come?”\n\n“I worked at a bakery in Japan,” Hana said. “And I work at Bluebird now. I love baking very much.”\n\n“Then Thursday is your night,” Nadia smiled. “Bring an apron. And maybe your onigiri secrets.”\n\nWalking home under the first stars, Hana carried her empty plate like a trophy.\n\n“Rice balls today, muffins on Thursday,” she said to Daisy. “This neighborhood is always hungry — and I think I like that.”","glossary":[{"w":"cloth","ja":"布"},{"w":"neat","ja":"きれいな"},{"w":"triangle","ja":"三角形"},{"w":"shape","ja":"形"},{"w":"seaweed","ja":"海苔・海藻"},{"w":"salmon","ja":"サケ"},{"w":"mayonnaise","ja":"マヨネーズ"},{"w":"filling","ja":"具"},{"w":"curious","ja":"興味津々の"},{"w":"pickled plum","ja":"梅干し"},{"w":"sour","ja":"すっぱい"},{"w":"successful","ja":"大成功の"},{"w":"community center","ja":"公民館"},{"w":"apron","ja":"エプロン"},{"w":"trophy","ja":"トロフィー"}],"phrases":[{"en":"What did you bring?","ja":"何を持ってきたの？"},{"en":"It’s a rice ball.","ja":"おにぎりです。"},{"en":"Would you like to try one?","ja":"ひとつ食べてみますか？"},{"en":"This is delicious!","ja":"これ、おいしい！"},{"en":"I’m glad you like it.","ja":"気に入ってもらえてうれしいです。"}],"quiz":[{"q":"What did Hana bring to the potluck?","c":["Blueberry muffins","Hot dogs","Almond cookies","Onigiri"],"a":3},{"q":"Who tried the onigiri first?","c":["Tom","Lily","Mrs. Chen","Mike"],"a":1},{"q":"Why was Tom slow to try one at first?","c":["The seaweed looked strange to him","He was full of hot dogs","He doesn’t like rice","Lily ate them all"],"a":0}],"words":762},{"id":39,"level":2,"emoji":"🧑‍🍳","theme":"料理教室に参加","titleEn":"Muffin Night at the Community Center","titleJa":"小麦粉と卵と、新しいチーム","teaser":"木曜の夜は公民館で料理教室！相棒は元消防士のフランク。英語のレシピでマフィンは焼けるかな？","story":"On Thursday evening, Hana walked into the community center with her apron and a nervous smile.\n\nThe kitchen room was bright and loud. Eight small cooking tables stood in two rows, each with two aprons, bowls, and a basket of blueberries.\n\nNadia clapped her hands. “Welcome, everyone! Tonight: Oregon blueberry muffins. Find a partner and a table!”\n\nA big man with white hair and hands like baseball gloves waved at Hana.\n\n“You look like you know kitchens,” he said. “I’m Frank. Thirty years a firefighter. I can carry a refrigerator, but I burn toast.”\n\n“I’m Hana. I worked at a bakery in Japan,” she said. “I can’t carry a refrigerator, but I don’t burn toast.”\n\n“Perfect,” Frank said. “Together we are one complete cook. We make a good team.”\n\nNadia held up a recipe paper. “We follow the steps one by one. Reading a recipe is reading English. Cooking is the fun test after.”\n\nHana read step one out loud: “First, mix the flour. Then add the sugar and the baking powder. All in the big bowl.”\n\n“Flour,” Frank said, lifting the bag with one hand. A white cloud puffed out. Now his blue shirt had snow.\n\n“Gently, Frank,” Hana laughed. “Flour is not a fire. It doesn’t need a hero.”\n\nThey mixed the dry things. Hana showed him the measuring cups.\n\n“In Japan, we use grams,” she said. “A scale, very exact. In America, you use cups. One cup, half cup. Like magic spoons.”\n\n“Cups are easy,” Frank said. “Numbers on a scale are stressful. Okay. What’s next?”\n\nHana checked the paper. “Next, mix the eggs, the milk, and the butter in the small bowl. Could you pass me the eggs?”\n\nFrank passed the eggs. His giant hand closed a little too fast. Crack. One egg smiled at them from between his fingers.\n\n“That egg was weak,” Frank said seriously. “The other eggs are strong. I believe in them.”\n\nHana laughed so hard that the next table looked over. They cracked the rest together — slowly — and nothing else broke.\n\nNadia walked between the tables. “Now the important part! Pour the small bowl into the big bowl. Mix a little. Then STOP. If you mix too much, the muffins become hard.”\n\nHana’s hands already knew this. She folded the mix softly, like turning a page of a book.\n\nNadia stopped and watched. “Everyone, look here for a second! See Hana’s hands? Gentle and slow. That’s the touch. Hana, where did you learn that?”\n\n“At my bakery in Matsuyama,” Hana said, a little shy. “My boss said, mix like you say good night to a baby.”\n\n“Mix like you say good night to a baby!” Nadia repeated to the class. “I’m stealing that. That’s the lesson of the night.”\n\nFrank added the blueberries, one careful spoon at a time. “Little blue guys, get in the boat,” he said quietly.\n\nThey filled the muffin tin and slid it into the oven. Twenty minutes of waiting, wiping tables, and talking.\n\nFrank showed Hana photos of his garden and his old fire truck. Hana showed him the cafe and a photo of Daisy.\n\n“Come to Bluebird one morning,” she said. “I will make your coffee myself.”\n\n“A golden retriever!” Frank said. “Firefighters love those dogs. Okay, muffin question. Who taught you to love baking?”\n\n“My grandmother,” Hana said. “Her kitchen was small, but it made big happiness.”\n\n“Same with my mother,” Frank nodded. “Small kitchen, big happiness. That’s the whole secret, right there.”\n\nThe timer rang. Nadia opened the oven, and warm blueberry clouds filled the room.\n\n“Be careful, it’s hot. Hero hands still burn,” Hana said, and she gave Frank the oven gloves.\n\nTheir muffins came out golden with little purple rivers. Frank held the tin up like a trophy.\n\n“Team Hana-Frank!” he announced. “Best muffins in the room!”\n\n“Every team says that,” laughed Nadia. “But tonight… maybe yes.”\n\nEveryone sat and ate their own muffins with butter. Hana’s muffin was soft, warm, and full of June.\n\n“Next Thursday is soup night,” Nadia said. “Hana, Frank — same team?”\n\n“Same team,” they said at the same time, and shook hands. Hana’s hand disappeared completely.\n\nHana walked home in the warm evening with a paper bag: four muffins for the Millers, one for Mrs. Chen.\n\nHer legs were tired, her hair smelled like butter, and her heart was very full.\n\n“English class, cafe, cooking class,” she thought. “My head worked hard today.”\n\nThat night, Hana fell asleep in one minute — and inside her sleeping head, something quietly wonderful was getting ready.","glossary":[{"w":"firefighter","ja":"消防士"},{"w":"refrigerator","ja":"冷蔵庫"},{"w":"recipe","ja":"レシピ"},{"w":"baking powder","ja":"ベーキング粉"},{"w":"measuring cup","ja":"計量カップ"},{"w":"scale","ja":"はかり"},{"w":"exact","ja":"正確な"},{"w":"cracked","ja":"割った"},{"w":"pour","ja":"注ぐ"},{"w":"folded","ja":"さっくり混ぜた"},{"w":"muffin tin","ja":"マフィン型"},{"w":"oven gloves","ja":"ミトン"},{"w":"timer","ja":"タイマー"},{"w":"announced","ja":"宣言した"},{"w":"completely","ja":"完全に"}],"phrases":[{"en":"We make a good team.","ja":"私たち、いいコンビだね。"},{"en":"First, mix the flour.","ja":"まず、小麦粉を混ぜます。"},{"en":"What’s next?","ja":"次は何？"},{"en":"Could you pass me the eggs?","ja":"卵を取ってもらえますか？"},{"en":"Be careful, it’s hot.","ja":"気をつけて、熱いよ。"}],"quiz":[{"q":"Who was Hana’s cooking partner?","c":["Nadia","Tom","Frank","Leo"],"a":2},{"q":"What happens if you mix the muffin batter too much?","c":["The muffins become hard","The muffins turn blue","The oven gets too hot","The eggs break"],"a":0},{"q":"Why did Nadia stop the class to watch Hana?","c":["Hana dropped an egg","Hana’s gentle mixing was a good example","Hana was too slow","Hana forgot the blueberries"],"a":1}],"words":760},{"id":40,"level":2,"emoji":"🌟","theme":"英語で夢を見た朝","titleEn":"A Dream in English","titleJa":"英語の夢を見た朝","teaser":"目が覚めた瞬間、ハナは気づいた——夢の中がぜんぶ英語だった！ポートランド2か月の小さな奇跡。","story":"Early Friday morning, Hana woke up and sat straight up in bed.\n\nHer heart was beating fast, but not from fear. From surprise. She grabbed her phone and checked the time: 6:12.\n\nShe ran downstairs in her pajamas. Carol was on the porch with her morning coffee, watching the quiet street.\n\n“Carol! You won’t believe it. Listen,” Hana said. “I had a dream — and the whole dream was in English!”\n\nCarol put down her cup. “Tell me everything.”\n\n“I was at the cafe,” Hana said, sitting down. “I took orders. I joked with Leo. Mrs. Chen asked about my weekend. Everyone spoke English — and I understood everything. No Japanese anywhere.”\n\n“Even the customers?”\n\n“Even the customers. Even Daisy!” Hana laughed. “Daisy talked in my dream. She said, more bacon, please. Very clear English.”\n\nCarol laughed her warm laugh. “Well, that’s the most honest sentence Daisy ever said.”\n\n“Is it strange?” Hana asked. “Dreaming in another language?”\n\n“It’s not strange. It’s famous,” Carol said. “Ask anyone who moved to a new country. The first dream in the new language — people remember it forever. It means your brain is working even at night.”\n\n“My brain worked the night shift,” Hana said.\n\n“Exactly. And nobody paid it,” Carol smiled. “How do you feel?”\n\nHana looked at the June morning. Somewhere, a bird was very busy.\n\n“Two months ago, I stood at the airport in Matsuyama,” she said slowly. “My biggest fear was one question: Why are you here? One question, and my hands were cold.”\n\n“I remember your first week,” Carol said. “You said sorry to the dishwasher.”\n\n“I was polite to all machines,” Hana laughed. “In April, I got lost two streets from home. A stranger helped me. I could only say thank you, thank you, thank you.”\n\n“And now?”\n\n“Now I order, I work, I joke. I talked to a doctor. I opened a bank account. I lost a wallet and asked a whole street about it,” Hana counted on her fingers. “Last night I taught a firefighter to mix muffins.”\n\n“So English is comfortable now?” Carol asked, with a small test in her voice.\n\n“Not always,” Hana said honestly. “Fast movies are still hard. Phone calls are still a little scary. But I’m getting used to it. Every week, a little more.”\n\nCarol nodded. “Little by little.”\n\n“Little by little,” Hana repeated. “My grandmother says the same thing about bread. Good things rise slowly.”\n\nCarol looked at her for a long moment. “Hana, I’m proud of you. Really proud. Two months, and look at you.”\n\nHana’s eyes felt suddenly warm. “Thank you. This house helped. The cafe helped. Everyone helped.”\n\n“You did the work,” Carol said. “We just made the coffee. Keep it up.”\n\nJust then, Mike appeared at the door with his own cup.\n\n“Did I hear dream talk?” he said. “Last night, I dreamed I ate a giant marshmallow. When I woke up, my pillow was gone.”\n\n“Mike, that joke is older than the house,” Carol said.\n\n“Classics never die,” said Mike.\n\nBen came down last, half asleep. He heard the story and nodded. “Nice. In my dreams, I speak perfect Spanish. My Spanish teacher says my dreams are lying.”\n\nBefore work, Hana opened her notebook. She wrote at the top: Things I Can Do Now.\n\nOrder food. Ask for help. Describe a lost wallet. Read medicine labels. Talk to a doctor. Make people laugh — in English.\n\nShe read the list twice. In April, the page was almost empty. Today it was full, and it was true.\n\nShe sent a message to Yui: “Good morning! News: I dreamed in English last night. All English! Two months in America. Little by little, I’m becoming bilingual. (A small bilingual.)”\n\nYui answered fast: “WHAT! My sister is amazing! Teach me everything in November!”\n\nAt the cafe that day, Hana told Emma and Leo about the dream. Leo put his hand on his heart.\n\n“Daisy asked for bacon? In English?” he said. “That dog has better English than my first year here.”\n\n“To dream-Daisy!” Emma raised her coffee cup, and they all laughed.\n\nThat evening at dinner, Mike stood up with a mystery face. He spread a big map on the table.\n\n“Family meeting,” he said. “Summer is here. Hana has never seen the Oregon coast. I say we fix that.”\n\nHana leaned over the map. A long blue edge ran down the paper — the Pacific Ocean, the same ocean that touched Matsuyama.\n\n“The sea?” she asked, and her eyes were already shining.\n\n“The sea,” said Mike. “Start thinking about sandwiches.”","glossary":[{"w":"grabbed","ja":"つかんだ"},{"w":"porch","ja":"玄関ポーチ"},{"w":"honest","ja":"正直な"},{"w":"brain","ja":"脳"},{"w":"night shift","ja":"夜勤"},{"w":"dishwasher","ja":"食洗機"},{"w":"polite","ja":"礼儀正しい"},{"w":"comfortable","ja":"楽な・快適な"},{"w":"rise","ja":"ふくらむ"},{"w":"marshmallow","ja":"マシュマロ"},{"w":"pillow","ja":"まくら"},{"w":"bilingual","ja":"二か国語話者"},{"w":"spread","ja":"広げた"},{"w":"coast","ja":"海岸"},{"w":"Pacific Ocean","ja":"太平洋"}],"phrases":[{"en":"You won’t believe it.","ja":"信じられないと思うけど、聞いて。"},{"en":"I’m getting used to it.","ja":"だんだん慣れてきました。"},{"en":"Little by little.","ja":"少しずつ、ね。"},{"en":"I’m proud of you.","ja":"あなたを誇りに思うよ。"},{"en":"Keep it up.","ja":"その調子で続けてね。"}],"quiz":[{"q":"What happened in Hana’s dream?","c":["She flew back to Japan","Everyone spoke English, and she understood","She forgot all her English","She opened her own bakery"],"a":1},{"q":"What does Carol say about dreams like this?","c":["They mean Hana is too tired","They happen only once","They are just luck","The brain is learning even at night"],"a":3},{"q":"How does Hana feel about her two months in Portland?","c":["Proud, because she grew little by little","Sad, because time went too slowly","Angry about her mistakes","Bored with the same days"],"a":0}],"words":764},{"id":41,"level":2,"emoji":"🚗","theme":"海への日帰り旅行の計画","titleEn":"A Map to the Sea","titleJa":"日曜日は海へ","teaser":"金曜の夜、ミラー家で家族会議。日曜は車で2時間の海へ！初めてのアメリカのビーチ、何を持って行く？","story":"It was a warm Friday evening at the end of June.\n\nThe Miller family sat around the dinner table. Mike had a big smile on his face.\n\n“Family meeting!” he said. “I have an idea for Sunday.”\n\n“Uh-oh,” Ben said. “Dad has an idea. That’s dangerous.”\n\nEveryone laughed. Mike opened a big paper map on the table.\n\n“Let’s go to the coast,” he said. “We can drive to Cannon Beach. It’s a famous beach with a huge rock in the sea.”\n\n“A day at the beach?” Hana said. “I’d love that!”\n\n“You will love Haystack Rock,” Carol said. “It’s very tall. Birds live on it.”\n\nHana looked at the map. Portland was on one side. The sea was far away on the other side.\n\n“How long does it take?” she asked.\n\n“About two hours by car,” Mike said. “We should leave early, because the beach gets busy in summer.”\n\n“Two hours?” Hana said. “In Japan, the sea was near my house. I walked there.”\n\n“Well, Oregon is big,” Mike said. “But the drive is beautiful. We’ll go through the mountains and the forest.”\n\nBen looked up from his phone. “I checked the weather. Sunday will be sunny. Twenty-two degrees.”\n\n“Perfect beach weather,” Carol said. “Not too hot, not too cold.”\n\nHana took out her small notebook. She wrote: Sunday, Cannon Beach, two hours.\n\n“What should I bring?” she asked.\n\n“Good question,” Carol said. “Bring a warm jacket. The beach wind is cold, even in summer.”\n\n“A warm jacket? For the beach?” Hana was surprised.\n\n“Trust me,” Carol laughed. “Oregon beaches are not like Hawaii.”\n\nMike counted on his fingers. “Towels, water, snacks, a ball for Daisy…”\n\n“Is Daisy coming too?” Hana asked.\n\n“Of course! Dogs can walk on that beach. She loves the water,” Mike said.\n\nDaisy heard her name. She came to the table and moved her tail.\n\n“See? She says yes,” Ben laughed.\n\nCarol started a list on paper. “I’ll make sandwiches. Ben, you carry the big bag. Mike, you check the car.”\n\n“And me?” Hana asked. “Can I help?”\n\n“Can you make some onigiri?” Ben asked. “Your rice balls are the best.”\n\n“Sure!” Hana said. “Beach onigiri. My family in Japan does the same thing.”\n\n“Then it’s a Japanese-American beach trip,” Mike said. “Sandwiches and onigiri.”\n\nMike looked at the map again. “Here’s the plan. We leave at eight. We get to the beach at ten. Lunch at noon. Then tide pools in the afternoon.”\n\n“And ice cream,” Ben added. “There’s a famous ice cream shop in town.”\n\nHana smiled. “That sounds perfect.”\n\n“When is low tide?” Carol asked. “You can only see the tide pools when the water is low.”\n\nBen checked his phone. “Low tide is at two in the afternoon. Good timing.”\n\n“Team Miller is ready,” Mike said. “Meeting finished!”\n\nAfter dinner, Hana helped Carol wash the dishes.\n\n“I’m excited,” Hana said. “This will be my first American beach.”\n\n“Your first? Then Sunday will be a special day,” Carol smiled.\n\n“You’ll see the tide pools,” she said. “Little pools in the rocks. Sea stars live in them.”\n\n“Sea stars?” Hana asked. “How do you say… ah, a star of the sea?”\n\n“Yes, exactly. A star shape, orange or purple. You can look, but don’t touch,” Carol said.\n\n“I want to take a hundred photos,” Hana said. “I’ll send them all to Yui.”\n\nLater, Hana packed her bag in her room. Jacket, towel, camera, hat.\n\nBefore bed, she sent a message to Yui. “Guess what? I’m going to the sea on Sunday!”\n\nYui answered fast. “Lucky! Send photos! I miss the sea too.”\n\n“I will,” Hana wrote. “A hundred photos, maybe more.”\n\nThen Ben knocked on her door. “Hana, one more thing. Don’t forget sunscreen.”\n\n“Sunscreen? But you said the wind is cold.”\n\n“Cold wind, strong sun,” Ben said. “Last year I forgot it. My nose was red for a week. I looked like a tomato.”\n\nHana laughed. “Okay, okay. Sunscreen is in the bag. Thank you, tomato boy.”\n\n“Hey!” Ben said, but he was laughing too.\n\nFrom the living room, Mike called, “One more thing, everyone! I made a joke for the trip. Are you ready? Sea you Sunday!”\n\n“Dad, no,” Ben said. Carol shook her head slowly. Hana laughed the most.\n\nSo many new places, Hana thought. Three months ago, I only knew the airport and this house. Now the map of my world is bigger.\n\nThat night, she dreamed about a huge rock in a blue sea.\n\nOn Sunday morning, the sun came up bright, and the road to the sea was waiting.","glossary":[{"w":"coast","ja":"海岸"},{"w":"famous","ja":"有名な"},{"w":"huge","ja":"巨大な"},{"w":"rock","ja":"岩"},{"w":"degrees","ja":"度（気温）"},{"w":"jacket","ja":"上着"},{"w":"Trust me","ja":"信じて"},{"w":"snacks","ja":"軽食"},{"w":"tide pools","ja":"潮だまり"},{"w":"low tide","ja":"干潮"},{"w":"sea stars","ja":"ヒトデ"},{"w":"sunscreen","ja":"日焼け止め"},{"w":"dreamed","ja":"夢を見た"}],"phrases":[{"en":"How long does it take?","ja":"どのくらい時間がかかる？"},{"en":"What should I bring?","ja":"何を持って行けばいい？"},{"en":"That sounds perfect.","ja":"それ、完ぺきだね。"},{"en":"Don’t forget sunscreen.","ja":"日焼け止めを忘れないで。"},{"en":"Can I help?","ja":"手伝おうか？"}],"quiz":[{"q":"Where will the Miller family go on Sunday?","c":["To the mountains","To Cannon Beach","To a big museum","To Seattle"],"a":1},{"q":"Why should Hana bring a warm jacket?","c":["The beach wind is cold","It will rain on Sunday","The car is very cold","They will swim at night"],"a":0},{"q":"Why does Ben tell Hana about sunscreen?","c":["He wants to use her sunscreen","He likes red noses","He forgot it last year and his nose got red","Carol told him to say it"],"a":2}],"words":761},{"id":42,"level":2,"emoji":"🌊","theme":"キャノンビーチでの一日","titleEn":"Say Cheese at Haystack Rock","titleJa":"岩と波と家族写真","teaser":"青い海に立つ巨大な岩、潮だまりのヒトデ。カメラを持った女性に、ハナが勇気を出して頼んだことは？","story":"The car left Portland at eight on Sunday morning.\n\nMike drove. Carol sat next to him with the snack bag. Hana, Ben, and Daisy shared the back seat.\n\n“Two hours to the sea!” Mike said. “Who wants car music?”\n\nBen played a song from his phone. Everyone sang, even Daisy. Well, Daisy tried.\n\nThe road went through green mountains. Then, after a long turn, Hana saw it.\n\nThe sea. Big, blue, and shining.\n\n“Look at that!” she said. “It’s so beautiful.”\n\n“Welcome to the Oregon coast,” Carol said with a smile.\n\nThey parked and walked to the beach. The wind was strong and cool. Hana was happy about her jacket.\n\n“There it is,” Ben said. “Haystack Rock.”\n\nThe rock stood in the water like a giant. White birds flew around its head.\n\n“It’s huge,” Hana said. “Photos! I promised Yui a hundred photos.”\n\nShe took photos of the rock, the birds, and the waves. Daisy ran in circles on the sand.\n\n“Daisy, wait!” Ben ran after her. A small wave caught his shoes.\n\n“Cold! Cold, cold, cold!” Ben jumped back, and everyone laughed.\n\nAt noon, they sat on a big blanket. Carol opened the food box.\n\n“Are you hungry?” she asked. “We have sandwiches and Hana’s onigiri.”\n\n“I want both,” Mike said. “It’s an international lunch.”\n\nBen ate three onigiri. “Hana, these are so good. Salty and perfect after the sea wind.”\n\n“Thank you,” Hana said. “Rice balls taste better outside. My grandmother always said that.”\n\nAfter lunch, they walked to the tide pools near the big rock. The water was low. Small pools waited between the rocks.\n\n“Look down slowly,” Carol said. “The pools are full of life.”\n\nHana looked. An orange sea star held the rock. Green sea anemones moved slowly in the water.\n\n“Wow,” she said quietly. “A real sea star. It looks like a big cookie.”\n\n“Please don’t eat it,” Ben said, and Hana laughed.\n\nA little crab walked across the pool. Daisy watched it very carefully.\n\n“Careful, Daisy,” Mike said. “That little guy has scissors.”\n\nThey watched the pools for a long time. Hana forgot her phone. She just looked.\n\n“You remembered the rule,” Carol said. “Look, but don’t touch.”\n\n“My hands want to touch,” Hana laughed. “But my heart says no.”\n\nThen Carol said, “Family photo time! We need all five of us. Daisy too.”\n\nMike looked around. A young woman with a camera stood near the rocks.\n\n“Excuse me,” Hana said to her. “Could you take our picture?”\n\n“Of course!” the woman said. “What a cute dog!”\n\n“Her name is Daisy,” Ben said. “She’s the star of the family.”\n\nThey stood together in front of Haystack Rock. Mike put Daisy in the middle.\n\n“Okay,” the woman said. “One, two, three… Say cheese!”\n\n“Cheese!” everyone said. Daisy said, “Woof!”\n\nThe woman took five photos. “They’re perfect. You have a lovely family,” she said.\n\n“Are you visiting?” she asked.\n\n“I live in Portland now,” Hana said. “But I’m from Japan. This is my host family.”\n\n“Wonderful! Enjoy the coast,” the woman said, and she waved goodbye.\n\n“Thank you so much!” Hana said. Then she thought, my family. She smiled to herself.\n\nIn the afternoon, they walked along the beach. Hana wrote HANA in big letters on the sand. Ben wrote BEN and drew a basketball.\n\nA wave came and washed the letters away.\n\n“The sea erased my art,” Ben said. “The sea has no heart.”\n\n“The sea wants a clean notebook every day,” Hana said. Mike liked that a lot.\n\nBefore they left, they stopped at a small ice cream shop in town.\n\n“One scoop or two?” the shop man asked.\n\n“Two, please,” Hana said. “It’s a special day.”\n\nShe chose blackberry, the taste of Oregon summer.\n\n“Good choice,” Carol said. “Blackberries grow everywhere here in July.”\n\nOn the drive home, the car was quiet. Ben slept. Daisy slept on Ben.\n\nHana looked at her photos one by one. The rock, the sea star, the family picture.\n\nShe sent the best ones to Yui. “My first American beach!” she wrote.\n\nYui answered with ten hearts. “The five of you look so happy,” she wrote.\n\n“We are,” Hana wrote back.\n\nAt home, sand was everywhere — in shoes, in bags, even in Daisy’s ears.\n\n“A good beach day follows you home,” Mike said. “That’s how you know it was real.”\n\nHana washed the sand from her shoes and smiled.\n\n“Next weekend,” Mike said, “Ben and I will show you the forest. Do you like walking?”\n\n“I love walking,” Hana said.\n\n“Good,” Ben smiled. “But mountain walking is a little different. You’ll see.”","glossary":[{"w":"shining","ja":"輝いている"},{"w":"giant","ja":"巨人"},{"w":"waves","ja":"波"},{"w":"blanket","ja":"毛布・敷物"},{"w":"international","ja":"国際的な"},{"w":"salty","ja":"塩からい"},{"w":"sea anemones","ja":"イソギンチャク"},{"w":"crab","ja":"カニ"},{"w":"scissors","ja":"はさみ"},{"w":"waved","ja":"手を振った"},{"w":"erased","ja":"消した"},{"w":"scoop","ja":"ひとすくい"},{"w":"blackberry","ja":"ブラックベリー"}],"phrases":[{"en":"Look at that!","ja":"見て、あれ！"},{"en":"Are you hungry?","ja":"おなかすいた？"},{"en":"Could you take our picture?","ja":"写真を撮っていただけますか？"},{"en":"Say cheese!","ja":"はい、チーズ！"},{"en":"Thank you so much!","ja":"本当にありがとう！"}],"quiz":[{"q":"What is the name of the big rock at the beach?","c":["Big Bird Rock","Portland Rock","Haystack Rock","Miller Rock"],"a":2},{"q":"Who takes the family photo?","c":["Mike","Ben","Mrs. Chen","A woman with a camera"],"a":3},{"q":"Why does Hana smile to herself after the photo?","c":["Her ice cream is sweet","The woman called them a family, and Hana feels part of it","Daisy looks funny in photos","She wants to go home early"],"a":1}],"words":766},{"id":43,"level":2,"emoji":"🥾","theme":"森のハイキング","titleEn":"The Deer in the Green Light","titleJa":"森の中のシカ","teaser":"マイクとベンと3マイルの山道へ。巨木の森、小川、黄色いナメクジ！？そして息をのむ静かな出会い。","story":"Saturday came with perfect weather for a hike.\n\nMike, Ben, and Hana drove to a forest trail near the mountains. Carol stayed home with Daisy.\n\n“Daisy is a beach dog, not a mountain dog,” Ben said. “She’s too old for hills.”\n\nAt the start of the trail, there was a big wooden sign.\n\nHana read it slowly. “Trail — three miles. Stay on the path. Take water.”\n\n“Three miles,” Mike said. “About five kilometers up and down. Ready, team?”\n\n“Ready!” Hana said. She had water, snacks, and her camera.\n\nThe forest was tall and green. The air smelled like rain and trees.\n\n“The trees here are giants,” Hana said. “Like a movie.”\n\n“Some of them are five hundred years old,” Mike said. “Older than America.”\n\nThe path went up and up. There were big roots and small rocks everywhere.\n\n“Watch your step.” Mike pointed down. “The roots love to catch shoes.”\n\nHana walked carefully. Ben jumped from rock to rock like a basketball player.\n\nA small bird sang above them. Mike knew its name. He knew every tree name too.\n\n“My dad is a walking science book,” Ben said. Mike looked very happy.\n\nAfter thirty minutes, Hana’s legs felt heavy. Her face was hot.\n\n“Guys,” she said. “I need a break.”\n\n“Good idea,” Mike said. “Water break! Drink before you feel thirsty. That’s the rule.”\n\nThey sat on a fallen tree and drank water.\n\n“Are you okay?” Ben asked. “We can walk slower.”\n\n“I’m fine,” Hana smiled. “In Matsuyama, I climbed the castle hill many times. But this mountain is bigger.”\n\n“A castle on a hill?” Ben said. “Cool. I want to see it.”\n\n“Come to Japan some day,” Hana said. “I’ll show you.”\n\nThey walked again. The path became quiet. Even Ben put his phone away.\n\nThey crossed a small stream on three big stones. The water talked under their feet.\n\nOn a wet leaf, Hana found a long yellow thing. “Is this… a banana?”\n\n“That’s a banana slug,” Ben laughed. “Famous Oregon animal. Don’t touch it.”\n\n“A banana with eyes,” Hana said. “Oregon is full of surprises.”\n\nAfter that, the forest became quiet again.\n\nSuddenly, Mike stopped. He put up his hand.\n\n“Shhh,” he said very quietly. “Look. Between the trees.”\n\nHana looked. A deer stood in the green light. It had big soft eyes.\n\nNobody moved. The deer looked at them. Hana forgot to breathe.\n\nThen the deer turned and walked away, quiet like a dream.\n\n“Wow,” Hana said softly. “My first deer.”\n\n“You brought us luck,” Mike said. “I don’t see deer every time.”\n\nThe last part of the trail was very hard. Up, up, up.\n\n“Almost there,” Ben called from the front. “We’re almost there!”\n\nThen the trees opened, and Hana saw the sky.\n\nThey stood at the top. Far away, a white mountain floated over the green hills.\n\n“That’s Mount Hood,” Mike said. “Snow on top, even in July.”\n\n“It looks like Mount Fuji,” Hana said softly. “A little piece of Japan in Oregon.”\n\n“Then this is your view too,” Mike said.\n\nThey ate sandwiches on a warm rock. The wind was clean and cool.\n\n“My legs hurt,” Hana laughed. “It was worth it.”\n\n“That’s hiking,” Ben said. “Pain, then pizza.”\n\n“Pizza?” Hana asked.\n\n“Family rule,” Mike said. “After a mountain, we order pizza. It’s a science rule.”\n\nGoing down was fast and fun.\n\nBen taught Hana a trail game: twenty questions. “Is it an animal?” “Yes.” “Is it Daisy?” “…Yes.”\n\n“Ben, you always choose Daisy,” Hana laughed.\n\n“She’s always the answer,” Ben said.\n\nAt the bottom, Hana looked back at the trail.\n\n“Three miles,” she said. “I did it.”\n\n“You did great,” Mike said. “Next time, we’ll bring Carol’s cookies.”\n\nAt home, Daisy met them at the door. Carol had cold lemonade ready.\n\n“How was the mountain?” she asked.\n\n“Beautiful,” Hana said. “We saw a deer! And Mount Hood! And my legs are angry.”\n\nCarol laughed. “A hot bath will fix the legs.”\n\nThat evening, the pizza arrived. Mike was right. Mountain pizza is special.\n\nThen Hana’s phone made a sound. A message from Emma.\n\n“Hana! Are you free tomorrow afternoon? Rain is coming. Perfect museum weather! Portland Art Museum, my favorite place. Want to come?”\n\nHana wrote back fast. “Yes! I’d love to.”\n\n“Great! Meet me at two,” Emma answered. “I’ll show you my favorite painting. It has a secret.”\n\nHana looked at her tired legs. “Tomorrow we walk again,” she told them. “But slowly, in a museum.”\n\nShe fell asleep fast, and this time she dreamed about a deer standing quietly in a museum.","glossary":[{"w":"trail","ja":"登山道"},{"w":"path","ja":"小道"},{"w":"roots","ja":"木の根"},{"w":"thirsty","ja":"のどが渇いた"},{"w":"fallen tree","ja":"倒木"},{"w":"climbed","ja":"登った"},{"w":"stream","ja":"小川"},{"w":"banana slug","ja":"バナナナメクジ"},{"w":"deer","ja":"シカ"},{"w":"breathe","ja":"息をする"},{"w":"view","ja":"眺め"},{"w":"worth it","ja":"価値がある"},{"w":"lemonade","ja":"レモネード"},{"w":"painting","ja":"絵画"}],"phrases":[{"en":"Watch your step.","ja":"足元に気をつけて。"},{"en":"I need a break.","ja":"ちょっと休みたい。"},{"en":"Are you okay?","ja":"大丈夫？"},{"en":"We’re almost there!","ja":"もうすぐ着くよ！"},{"en":"It was worth it.","ja":"その価値はあったよ。"}],"quiz":[{"q":"How long is the trail?","c":["Three miles","Ten miles","One mile","Five miles"],"a":0},{"q":"Why does Carol stay home?","c":["She does not like trees","She has work at the hospital","Daisy is too old for the mountain, so Carol stays with her","She wants to order pizza"],"a":2},{"q":"Why does Mount Hood feel special to Hana?","c":["It is very small","It has no snow","She climbed it before","It looks like Mount Fuji in Japan"],"a":3}],"words":763},{"id":44,"level":2,"emoji":"🏛","theme":"美術館で質問する","titleEn":"The Blue Sea and the Bread","titleJa":"青い絵とパンの絵","teaser":"雨の日はエマと美術館へ。大きな青い絵の意味って？パン職人ハナの心をつかんだ一枚の絵とは。","story":"Rain came back to Portland on Sunday afternoon.\n\nBut Hana didn’t need sun today. She had a museum date with Emma.\n\nEmma waited at the big stone door of the Portland Art Museum. She wore a yellow raincoat and a big smile.\n\n“Hana! Welcome to my favorite building in the city,” she said.\n\n“Honestly, I don’t know much about art,” Hana said.\n\n“Perfect,” Emma laughed. “Nobody does. That’s the fun part.”\n\nThey bought tickets at the desk. Emma showed her student card.\n\n“Two tickets, please,” Emma said. “One student, one adult.”\n\nInside, the rooms were quiet and cool. Paintings waited on every wall.\n\n“Rule number one,” Emma said. “Walk slowly. Rule number two: it’s okay to say I don’t understand.”\n\nEmma walked fast to a big room. “First, my favorite. Come on!”\n\nThey stopped in front of a huge painting. It was all blue — dark blue, light blue, gray-blue. No people, no houses. Just blue.\n\nHana looked at it for a long time. She turned her head left. Then right.\n\n“Emma,” she said finally. “What does this mean?”\n\n“Great question,” Emma said. “What do you see?”\n\n“Me? But I’m not an artist.”\n\n“In this room, everyone is an artist,” Emma said. “Take your time.”\n\nHana looked again. The blue moved like water. Slowly, she started to see something.\n\n“The sea,” she said. “Cold sea in the morning. Like Cannon Beach last Sunday. And here… maybe a bird.”\n\n“See? You ARE an artist,” Emma said. “When I’m sad, this painting looks like night. When I’m happy, it looks like a swimming pool.”\n\n“So the painting changes?” Hana asked.\n\n“No,” Emma smiled. “We change. That’s why I love art.”\n\nIn the next room, Hana stopped by herself.\n\nIt was a small old painting. A wooden table, a knife, and fresh bread.\n\n“Emma, look! Bread!” Hana sai
