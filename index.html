d. “I can almost smell it.”\n\nEmma read the small sign. “It’s from France. About three hundred years old.”\n\n“Three hundred years?” Hana said. “The bread looks fresh today. The painter loved bread. I can feel it.”\n\n“Spoken like a true baker,” Emma laughed.\n\nA museum guide stood near the door. Hana took a small breath and walked to her.\n\n“Excuse me,” Hana said. “Can you tell me about this painting?”\n\n“Of course!” the guide said. “The painter was a woman. Very rare three hundred years ago. She painted food all her life.”\n\n“A woman painter of bread,” Hana said. “I like her already.”\n\nBack by the blue painting, Emma asked, “What do you think? The blue sea or the bread — which one wins?”\n\n“Hmm. The blue one is beautiful,” Hana said. “But I like this one better. Bread is my language.”\n\n“Fair,” Emma said. “I like the blue one better. Colors are MY language.”\n\n“Different answers,” Hana said. “And nobody is wrong?”\n\n“Nobody is wrong,” Emma said. “Art is kind that way.”\n\nThey walked through more rooms. Emma opened her sketchbook and drew fast little pictures.\n\n“Wait,” she said. “Stand there, next to the window. Don’t move.”\n\n“Me? Why?” Hana asked.\n\nEmma’s pencil moved for two minutes. Then she showed the page.\n\nIt was Hana — simple lines, rain window, quiet smile.\n\n“Wow,” Hana said. “Is that really me? I look… at home.”\n\n“You look like my friend,” Emma said. “That’s my favorite picture today.”\n\n“Keep it,” Emma said, and she gave Hana the page.\n\n“What’s your dream, Emma?” Hana asked. “A museum like this?”\n\n“Some day, a small show,” Emma said. “My pictures on a wall. People drinking free juice. You in the first row.”\n\n“I’ll be there,” Hana said. “First row, both hands in the air.”\n\nIn the gift shop, Hana found a postcard of the bread painting.\n\n“For Yui,” she said. “My sister loves bread too. It’s a family thing.”\n\nThen they sat in the museum cafe with hot chocolate. Rain drew lines on the tall windows.\n\n“Thank you for today,” Hana said. “Now museums are not scary. They’re full of questions.”\n\n“And questions are free,” Emma said. “My favorite price.”\n\nThen Emma’s eyes became big. “Wait. Next Friday is the Fourth of July! What’s your plan?”\n\n“Mike wants a big barbecue in the backyard,” Hana said. “And fireworks at night.”\n\n“A Miller barbecue!” Emma said. “Can Leo and I come? I’ll bring lemonade. Leo will bring bad jokes.”\n\n“Please come!” Hana laughed. “I’ll ask Carol tonight. But I know her answer.”\n\nWalking home in the soft rain, Hana held the postcard and the little sketch carefully.\n\nArt, bread, a friend’s dream, and now a party plan. A good rainy day.\n\nAt home, Carol said yes before Hana finished the question — and the Fourth of July countdown began.","glossary":[{"w":"raincoat","ja":"レインコート"},{"w":"honestly","ja":"正直に言うと"},{"w":"student card","ja":"学生証"},{"w":"paintings","ja":"絵画"},{"w":"artist","ja":"芸術家"},{"w":"guide","ja":"案内係"},{"w":"painter","ja":"画家"},{"w":"rare","ja":"珍しい"},{"w":"sketchbook","ja":"スケッチ帳"},{"w":"gift shop","ja":"売店"},{"w":"postcard","ja":"絵はがき"},{"w":"hot chocolate","ja":"ホットココア"},{"w":"barbecue","ja":"バーベキュー"},{"w":"fireworks","ja":"花火"}],"phrases":[{"en":"What does this mean?","ja":"これ、どういう意味？"},{"en":"Take your time.","ja":"ゆっくりでいいよ。"},{"en":"What do you think?","ja":"どう思う？"},{"en":"I like this one better.","ja":"こっちのほうが好き。"},{"en":"Can you tell me about this painting?","ja":"この絵について教えてもらえますか？"}],"quiz":[{"q":"What color is Emma’s favorite painting?","c":["Red","Green","Yellow","Blue"],"a":3},{"q":"Who painted the bread picture?","c":["Emma","A woman from France","Mike","A man from Portland"],"a":1},{"q":"Why does Hana like the bread painting better?","c":["She is a baker, so bread feels like her language","It is bigger than the blue one","It is a new painting","Emma told her to like it"],"a":0}],"words":778},{"id":45,"level":2,"emoji":"🎆","theme":"独立記念日のバーベキュー","titleEn":"Ooh, Aah, Happy Fourth!","titleJa":"はじめての独立記念日","teaser":"星条旗にバーベキュー、夜は丘の上で花火！レオが教える「アメリカの法律」をハナも叫ぶ？","story":"The Fourth of July arrived with a bright blue sky.\n\nThe Miller house was busy from the morning. Today was barbecue day.\n\nMike put small flags along the fence. Ben carried chairs to the backyard.\n\nIn the kitchen, Carol made two pies. Hana made mini dorayaki with a star on each one.\n\n“Star dorayaki for star day,” Hana said.\n\n“Perfect,” Carol laughed. “Japanese sweets for an American party.”\n\nAt noon, the doorbell rang. It was Emma and Leo.\n\n“Happy Fourth!” they said together. Emma held lemonade. Leo held a guitar.\n\n“You play the guitar?” Hana asked.\n\n“Badly,” Leo smiled. “But on holidays, nobody listens carefully.”\n\nThen Mrs. Chen appeared at the fence with a small bag of cherries.\n\n“Hello, neighbors,” she said. “It smells wonderful.”\n\n“Mrs. Chen! Come join us!” Carol called. “We have too much food. That’s the plan.”\n\nSoon the backyard was full of happy noise. Neighbors came with salads and cookies.\n\n“Rosa says Happy Fourth to everyone!” Emma said. “She sent cookies from the cafe.”\n\nMike stood at the grill in a funny apron. It said KING OF THE GRILL.\n\n“Hana!” he called. “Would you like a burger? First one is ready.”\n\n“Yes, please!” Hana said.\n\n“Corn is coming too,” Mike said. “Holiday rule: nobody stays hungry.”\n\nThe burger was big and warm. Hana added tomato and cheese.\n\n“In Japan, I never made a burger like this,” she said. “It’s too tall for my mouth.”\n\n“That’s the American way,” Leo said. “Big burger, big dreams.”\n\nMike raised his cooking fork. “Why did the burger go to the gym?”\n\n“Dad, no,” Ben said.\n\n“To get better buns!” Mike said. Everyone laughed. Ben laughed too, very quietly.\n\nAfter lunch, Ben and Leo played basketball in the driveway.\n\n“Leo, the ball goes IN the basket,” Ben said.\n\n“In Brazil, we use our feet,” Leo answered. “My hands are only for coffee.”\n\nHana sat with Mrs. Chen and Emma under the tree. They talked about summer in their hometowns.\n\n“In Matsuyama, we have a big fireworks festival,” Hana said. “Food stands, shaved ice, and a thousand people by the water.”\n\n“Sounds beautiful,” Mrs. Chen said. “Tonight you’ll see the American kind. Loud and proud.”\n\nIn the evening, Carol took Daisy inside.\n\n“Fireworks are hard for old dog ears,” she said. “She’ll rest in the quiet room with the radio.”\n\nHana gave Daisy a goodnight hug. “We’ll watch for you,” she said.\n\nThen everyone walked to the small hill by the park. Many families sat on blankets in the soft dark.\n\n“Great seats,” Mike said. “The city fireworks start at ten.”\n\nLeo played slow songs on the guitar while they waited. Emma drew the crowd in her sketchbook.\n\nThen — BOOM. The first firework opened in the sky like a huge golden flower.\n\n“Ooh!” said the crowd.\n\n“Aah!” said the crowd.\n\n“Hana, this is important,” Leo said. “You must say it too. It’s the law.”\n\n“Ooh! Aah!” Hana said, and she laughed at herself.\n\nRed, blue, gold. Stars, circles, waterfalls of light. The sky was a garden.\n\nHana watched with her mouth open. Boom after boom, flower after flower.\n\n“The finale is coming,” Ben said. “Watch. They use everything.”\n\nThe sky exploded with a hundred lights at the same time. The hill cheered.\n\nThen it was quiet. Only smoke and stars and happy voices.\n\n“The fireworks were amazing.” Hana’s eyes were still full of light. “My first American summer sky.”\n\n“Better than Matsuyama?” Emma asked.\n\n“Different,” Hana said. “In Japan, fireworks feel a little sad. Beautiful and short, like summer. Here, they feel like a big birthday party.”\n\n“That’s deep,” Leo said. “I just like the boom.”\n\nOn the walk home, Mrs. Chen took Hana’s arm.\n\n“Thank you for today,” she said. “When you are seventy-two, a loud party is a gift.”\n\nAt home, they lit small sparklers in the backyard.\n\n“In Japan, we have senko hanabi,” Hana said. “Tiny quiet sparklers. You watch the little fire until it falls. The last one wins.”\n\n“A quiet sparkler game,” Carol said. “I’d love to try that some day.”\n\n“Then I’ll ask Yui to send some,” Hana said.\n\nDaisy came out for a goodnight walk. The air smelled like smoke and cut grass.\n\n“What a night!” Mike said. “Food, friends, fire in the sky. America’s birthday went well.”\n\nIn bed, Hana wrote in her notebook: My first Fourth of July. I said Ooh and Aah. It’s the law.\n\nBefore sleep, Ben checked his phone. “By the way,” he called. “News says a big storm is coming this week. A loud one.”\n\nSummer had one more big boom waiting for them.","glossary":[{"w":"flags","ja":"旗"},{"w":"pies","ja":"パイ"},{"w":"doorbell","ja":"玄関のベル"},{"w":"cherries","ja":"サクランボ"},{"w":"grill","ja":"焼き網・グリル"},{"w":"apron","ja":"エプロン"},{"w":"driveway","ja":"家の前の私道"},{"w":"hometowns","ja":"故郷"},{"w":"shaved ice","ja":"かき氷"},{"w":"crowd","ja":"人混み"},{"w":"golden","ja":"金色の"},{"w":"finale","ja":"フィナーレ"},{"w":"exploded","ja":"爆発した"},{"w":"sparklers","ja":"手持ち花火"}],"phrases":[{"en":"Happy Fourth!","ja":"独立記念日おめでとう！"},{"en":"Come join us!","ja":"こっちにおいでよ！"},{"en":"Would you like a burger?","ja":"バーガーはいかが？"},{"en":"The fireworks were amazing.","ja":"花火、すごかったね。"},{"en":"What a night!","ja":"なんて夜だ！"}],"quiz":[{"q":"What does Leo bring to the party?","c":["Pies","A guitar","Fireworks","A basketball"],"a":1},{"q":"Why does Daisy stay inside at night?","c":["She is angry","She wants to eat early","Fireworks are hard for her old ears","She does not like parties"],"a":2},{"q":"For Hana, how do Japanese fireworks feel?","c":["Beautiful and a little sad, like short summer","Like a big birthday party","Boring and small","Too loud to watch"],"a":0}],"words":766},{"id":46,"level":2,"emoji":"🕯","theme":"停電の夜","titleEn":"Candles, Ice Cream, and DREAM","titleJa":"ろうそくの夜のことば遊び","teaser":"夏の嵐でポートランドが停電！ろうそくの灯り、溶けそうなアイス、そして英語のことばゲームで奇跡が？","story":"The middle of July brought a hot, sticky evening.\n\nThe sky over Portland turned dark yellow, then gray. Ben looked out the window.\n\n“The storm is really coming,” he said. “The news was right.”\n\nFar away, thunder said hello. Daisy’s ears went down.\n\n“Come here, girl,” Hana said. Daisy lay down on Hana’s feet, heavy and warm.\n\nRain hit the windows. The wind pushed the trees left and right.\n\nThen the lights blinked once, twice — and the house went dark.\n\n“The power is out.” Mike’s voice came from the dark.\n\n“Ow,” Ben said. “And my video game too.”\n\nFor a moment, nobody could see anything. Then phone lights turned on, one by one.\n\n“Is everyone okay?” Carol asked.\n\n“We’re fine,” Ben said. “Just blind.”\n\n“Do you have a flashlight?” Hana asked. “My phone light is small.”\n\n“Do I have a flashlight?” Mike said happily. “Hana, I have a whole box. Follow me.”\n\nMike opened a big plastic box in the closet. Inside: three flashlights, candles, batteries, and a little radio.\n\n“Wow,” Hana said. “A storm store.”\n\n“A DIY dad is always ready,” Mike said proudly.\n\nCarol put candles on the kitchen table. The little lights made the room soft and gold.\n\nBen found the little radio. A calm voice said, “Power is out in some parts of the city. Repair teams are working.”\n\n“Pretty,” Hana said. “Like a birthday without the cake.”\n\nThen Carol looked at the window. “Mrs. Chen is alone. Someone should check on her.”\n\n“I’ll go,” Hana said at once. “She’s my friend.”\n\n“I’ll come too,” Mike said. “Take the big umbrella.”\n\nThey ran through the loud rain to the house next door. Hana knocked hard.\n\nThe door opened slowly. Mrs. Chen stood there with a candle.\n\n“Mrs. Chen! Are you all right?” Hana asked.\n\n“I’m fine, dear,” the old lady smiled. “I have candles, tea, and seventy-two years of storms.”\n\n“Do you need anything? Water? Light?” Mike asked.\n\n“No, thank you. But Mochi is not happy,” she said. “He hates thunder. He’s under the bed, flat like a pancake.”\n\n“Poor Mochi,” Hana said. “Call us if you need help, okay?”\n\n“I will. Thank you for checking, dears,” Mrs. Chen said. “Now run home before you swim home.”\n\nBack in the kitchen, Carol had a serious face and an open freezer.\n\n“Bad news,” she said. “No power means the freezer is getting warm. The ice cream will die.”\n\n“No!” Ben said.\n\n“There is only one answer,” Mike said slowly. “We must eat it. All of it. Tonight.”\n\n“I love this emergency,” Ben said.\n\nSo they ate ice cream by candlelight and listened to the rain.\n\n“Chocolate for me,” Ben said. “Strawberry for Hana. Dad gets the mystery flavor from last year.”\n\n“It’s still good!” Mike said. Nobody believed him.\n\nThen Carol brought a box to the table. “Let’s play a game. Family storm tradition.”\n\nIt was a word game. Players make English words with small letter tiles.\n\n“Uh-oh,” Hana said. “A word game against a science teacher?”\n\n“Don’t worry.” Carol patted her arm. “Mike only knows science words. Watch.”\n\nMike proudly made the word GRAVITY. Ben made DUNK. Carol made QUILT.\n\nHana looked at her letters for a long time. D, R, E, M, A, T, S.\n\nSlowly, she put down five letters: D-R-E-A-M.\n\n“DREAM. Double points!” Ben said. “Nice one, Hana!”\n\nHana smiled. Four months ago, English words ran away from me, she thought. Now they sit in my hand.\n\nOutside, the thunder walked away slowly. Mike taught them a trick.\n\n“When you see lightning, count the seconds,” he said. “One, two, three… Then the thunder comes. Big numbers mean the storm is far.”\n\nThey counted together in the dark. “One, two, three, four, five—” BOOM.\n\n“Five seconds. It’s leaving,” Mike said. “Storms always say a long goodbye.”\n\nThey played three more games. Carol won two. Nobody was surprised.\n\nLate at night, the lights suddenly came back on. The refrigerator hummed. Everyone said “Ohhh” — and then, strangely, nobody moved.\n\n“Turn them off again?” Ben asked quietly.\n\nEveryone laughed, but they understood him.\n\n“That was fun.” Hana looked at the quiet candles. “The dark made the house feel small and warm.”\n\n“Storm nights are family nights,” Carol said. “It’s an old rule.”\n\nThey blew out the candles one by one. Daisy finally relaxed.\n\nIn bed, Hana listened to the last soft rain and smiled about DREAM, double points.\n\nBut the next morning, there was a knock at the door — and Mrs. Chen stood there with worried eyes.\n\n“Have you seen Mochi?” she asked. “The door blew open in the storm. He’s gone.”","glossary":[{"w":"sticky","ja":"蒸し暑い"},{"w":"thunder","ja":"雷"},{"w":"blinked","ja":"点滅した"},{"w":"power","ja":"電気・電力"},{"w":"flashlight","ja":"懐中電灯"},{"w":"batteries","ja":"電池"},{"w":"candles","ja":"ろうそく"},{"w":"repair","ja":"修理"},{"w":"freezer","ja":"冷凍庫"},{"w":"emergency","ja":"緊急事態"},{"w":"gravity","ja":"重力"},{"w":"lightning","ja":"稲妻"},{"w":"hummed","ja":"ブンと鳴った"},{"w":"worried","ja":"心配した"}],"phrases":[{"en":"The power is out.","ja":"停電してる。"},{"en":"Do you have a flashlight?","ja":"懐中電灯ある？"},{"en":"Are you all right?","ja":"大丈夫ですか？"},{"en":"Don’t worry.","ja":"心配しないで。"},{"en":"That was fun.","ja":"楽しかったね。"}],"quiz":[{"q":"What does the family eat by candlelight?","c":["Ice cream","Pizza","Pancakes","Popcorn"],"a":0},{"q":"Where is Mochi during the storm?","c":["In the kitchen","In Daisy’s bed","In a tree","Under Mrs. Chen’s bed"],"a":3},{"q":"When the lights come back, why does nobody move at first?","c":["They are asleep","They are afraid of the light","The dark night together was warm and fun","They want more ice cream"],"a":2}],"words":768},{"id":47,"level":2,"emoji":"🐈","theme":"いなくなった猫モチの捜索","titleEn":"Looking for Mochi","titleJa":"モチをさがして","teaser":"嵐の夜、ミセス・チェンの白猫モチが消えた！ポスター作りに聞き込み。最後に助けてくれた意外な名探偵は？","story":"The morning after the storm, Mochi the cat was missing.\n\nMrs. Chen stood at the Millers’ door. Her hands held an old photo of a white cat.\n\n“The wind opened my door last night,” she said. “Mochi ran into the dark. He’s never out all night.”\n\n“We’ll find him,” Hana said. “I promise. Let me help you.”\n\n“Me too,” Ben said. “Summer break. I have time and fast legs.”\n\nCarol brought Mrs. Chen tea. “Sit first. Cats are smart. He’s probably hiding somewhere dry.”\n\nThey made a plan at the kitchen table.\n\n“Ben and I will walk and ask people,” Hana said. “Can you make a poster, Ben?”\n\n“On it,” Ben said. He typed fast. LOST CAT. WHITE. GREEN EYES. NAME: MOCHI. CALL MRS. CHEN.\n\nHe added the photo. Mochi looked like a small snow cloud with a serious face.\n\nFirst, they searched Mrs. Chen’s yard. Under the porch. Behind the flower pots. In the garden shed.\n\n“Mochi!” Hana called softly. “Breakfast!”\n\nNo cat. Only a wet garden and one angry bird.\n\nThen they walked down the street with the posters. Hana knocked on doors.\n\n“Good morning. Have you seen a white cat?” she asked again and again.\n\n“A white cat? No, sorry,” said the man with the roses.\n\n“I saw a black one,” said the lady at the blue house. “He owns this street.”\n\nAt the cafe, Rosa put a poster in the window at once.\n\n“Poor Mrs. Chen,” Rosa said. “Everyone, look for a white cat, okay? Coffee is free for good news.”\n\n“Free coffee?” Leo said. “I’ll find ten cats.”\n\nEmma sent the poster photo to her art friends. “Many eyes now,” she said.\n\nOn a pole near the park, Ben taped the last poster. Next to it was a bright paper: STREET FAIR — SATURDAY!\n\n“That’s this weekend,” Ben said. “But first, the cat.”\n\nThey searched the park. Under benches. Behind the big trees. Near the quiet pond.\n\n“Mochi!” they called. “Mochi!”\n\nAn old man with a newspaper smiled. “Good luck. Cats hear everything and answer nothing.”\n\nBy four o’clock, Hana’s feet hurt. The sky was getting gray again.\n\n“Maybe he’s far away now,” Ben said quietly.\n\n“Don’t give up.” Hana shook her head. “Mochi is old, like Daisy. Old cats don’t go far. They go somewhere warm and safe.”\n\nThen Hana stopped walking. Warm and safe.\n\n“Ben,” she said slowly. “Where did Daisy sleep when she was young? Outside, right?”\n\nBen’s eyes opened wide. “The old doghouse. Behind our garage!”\n\nThey ran home through the first small drops of rain.\n\nBehind the garage stood Daisy’s old doghouse, small and gray, full of dry leaves.\n\nDaisy was already there. She stood by the little door, moving her tail.\n\n“Daisy?” Hana said. “Did you find something?”\n\nHana looked inside slowly. Two green eyes looked back from the dark.\n\n“There you are!” Hana said. “Mochi!”\n\nThe white cat sat on the old leaves like a king on a soft bed. He said, “Meow,” very slowly.\n\n“He’s saying, what took you so long?” Ben laughed.\n\nHana lifted Mochi carefully. He was dry, warm, and a little heavy.\n\n“You slept in a DOG house,” she told him. “Your secret is safe with us.”\n\nDaisy pushed her nose to Mochi. Mochi touched her nose back.\n\n“Look,” Ben said quietly. “Old friends.”\n\nThey carried Mochi to Mrs. Chen’s house. She opened the door — and her hands flew to her mouth.\n\n“Mochi! Oh, my Mochi!”\n\nThe cat jumped into her arms and pushed his head under her chin.\n\n“Thank you, thank you,” Mrs. Chen said. Her eyes were wet. “Where was he?”\n\n“In Daisy’s old doghouse,” Hana said. “Warm and dry. Daisy showed us.”\n\n“A dog saved my cat,” Mrs. Chen laughed and cried at the same time. “What a world.”\n\n“I’m so glad.” Hana smiled. “The neighborhood was worried too. Rosa, Emma, Leo — everyone helped.”\n\nMrs. Chen made tea, and they ate her famous lemon cookies. Mochi slept on Hana’s legs, loud like a small engine.\n\n“He’s making engine sounds,” Hana said.\n\n“That’s a purr,” Mrs. Chen smiled. “It means thank you in cat language.”\n\nThat evening, Ben and Hana walked around and took the posters down.\n\n“Good news work,” Ben said. “My favorite kind.”\n\nAt the last pole, Hana looked at the bright fair poster again. STREET FAIR — SATURDAY. MUSIC. ART. FOOD.\n\nShe took a photo and sent it to Emma and Leo. “Saturday?” she wrote.\n\nTwo answers came back in ten seconds. “YES.” “Obviously.”\n\nHana smiled. First a lost cat, then a found weekend.\n\nShe didn’t know it yet, but the fair had a perfect gift for Yui waiting at one small table.","glossary":[{"w":"missing","ja":"行方不明の"},{"w":"promise","ja":"約束する"},{"w":"poster","ja":"ポスター"},{"w":"searched","ja":"さがした"},{"w":"porch","ja":"玄関先"},{"w":"shed","ja":"物置"},{"w":"pole","ja":"電柱"},{"w":"pond","ja":"池"},{"w":"doghouse","ja":"犬小屋"},{"w":"garage","ja":"車庫"},{"w":"lifted","ja":"持ち上げた"},{"w":"chin","ja":"あご"},{"w":"engine","ja":"エンジン"},{"w":"purr","ja":"ゴロゴロ音"},{"w":"Obviously.","ja":"当然でしょ。"}],"phrases":[{"en":"Let me help you.","ja":"手伝わせて。"},{"en":"Have you seen a white cat?","ja":"白い猫を見ませんでしたか？"},{"en":"Don’t give up.","ja":"あきらめないで。"},{"en":"There you are!","ja":"こんなところにいた！"},{"en":"I’m so glad.","ja":"本当によかった。"}],"quiz":[{"q":"Where was Mochi?","c":["Under Mrs. Chen’s bed","In a tree at the park","In Daisy’s old doghouse","At the cafe"],"a":2},{"q":"Who shows Hana and Ben the place?","c":["Daisy","Rosa","An old man","Emma"],"a":0},{"q":"Why does Mrs. Chen laugh and cry at the same time?","c":["She does not like cats","She is happy and surprised that a dog helped her cat","The tea is too hot","The posters were expensive"],"a":1}],"words":776},{"id":48,"level":2,"emoji":"🎨","theme":"ストリートフェア","titleEn":"Ten Dollars and a Little Blue Bird","titleJa":"青い小鳥と、はじめての値切り","teaser":"通りがまるごとお祭りに！妹への贈り物に見つけた青いガラスの小鳥。ドキドキの初値切り交渉、成功なるか？","story":"On Saturday, the neighborhood street turned into a festival.\n\nNo cars today. Instead: music, white tents, and the smell of sweet fried dough.\n\nHana met Emma and Leo by the big stage. A band played happy banjo music.\n\n“Welcome to the street fair,” Emma said. “Art, food, music — my three favorite words.”\n\n“Four words,” Leo said. “You forgot free samples.”\n\nThey walked slowly past the tents. Paintings, cups, hats, candles, silver rings.\n\nAt every table, sellers smiled and said hello. Hana didn’t know the polite answer.\n\n“Emma, help,” she said quietly. “I want to look, but I don’t want to buy everything.”\n\n“Easy,” Emma said. “Smile and say: Just looking, thanks. It’s friendly and honest.”\n\nAt the next table, a man showed her wooden spoons.\n\n“Just looking, thanks,” Hana said with a smile.\n\n“No problem! Enjoy the fair,” the man said, and it was easy like that.\n\n“See?” Emma said. “Magic words.”\n\nLeo bought a tiny hat for his coffee cup. “For the cafe,” he said. “The espresso machine needs fashion.”\n\nThen Hana stopped at a small table with a blue cloth.\n\nOn the cloth sat little birds — earrings, small and bright blue, made of glass.\n\n“Oh,” Hana said. “Bluebirds.”\n\n“Like our cafe!” Leo said. “Little Bluebird earrings.”\n\nAn older woman sat behind the table. “I make them myself,” she said. “Glass birds are my little dream.”\n\nHana thought of Yui at once. Yui loved blue. Yui collected small pretty things.\n\n“How much is this?” Hana asked, and she held up one pair.\n\n“Twelve dollars,” the woman said.\n\nHana counted her money in her head. Twelve was possible, but her fair budget was small.\n\nLeo leaned close. “Fair rule,” he said quietly. “At handmade tables, you can ask nicely for a little discount. It’s part of the game.”\n\n“Really? It’s not rude?” Hana asked.\n\n“Not if you smile,” Emma said. “And you always accept a no.”\n\nHana took a breath. Her heart made a small drum.\n\n“Excuse me,” she said. “They’re beautiful. Could you do ten dollars?”\n\nThe woman looked at Hana for a moment.\n\n“Hmm. Who are they for?” she asked.\n\n“My little sister in Japan,” Hana said. “She’ll visit me in November. Blue is her favorite color.”\n\n“A sister across the sea,” the woman smiled. “Okay. Ten dollars — and I’ll add a little gift box. For November.”\n\n“Really? Thank you! I’ll take it.” Hana’s heart did a happy jump.\n\n“It’s a deal.” The woman shook Hana’s hand like an old friend.\n\nShe put the glass birds in a tiny box with soft paper.\n\n“Your first American bargain,” Leo said proudly. “I taught her everything.”\n\n“You said one sentence,” Emma laughed.\n\nNext, food. They shared an elephant ear — a huge flat sweet bread with cinnamon and sugar.\n\n“It’s called an elephant ear?” Hana asked. “Poor elephant.”\n\n“No elephants in it,” Leo promised. “Only sugar and happiness.”\n\nThey drank cold lemonade and watched the band. People danced in the street — kids, grandpas, one very serious baby.\n\nEmma stopped at an art student’s table and talked about paint for ten minutes.\n\n“Sorry,” she said after. “Art people can’t stop talking.”\n\n“I know,” Hana said. “Bread people are the same.”\n\nNear the end of the street, Hana saw a quiet table with books.\n\nThe sign said: NEIGHBORHOOD LIBRARY — SUMMER BOOK CLUB, TUESDAY NIGHTS. NEW READERS WELCOME.\n\nA woman with kind eyes and a book cart smiled at her. “Hello! Do you like reading?”\n\n“I’m learning English,” Hana said. “I read easy books. Slowly.”\n\n“Then you’re perfect,” the librarian said. “Our club reads short, easy books. We talk, we drink tea, nobody hurries.”\n\n“Real book talk… in English?” Hana said. “I’m interested. But I’m a little afraid.”\n\n“Everyone was afraid on their first night,” the librarian said. “Come Tuesday. Just listen if you want. Here — this month’s book.”\n\nShe gave Hana a thin book called The Long Way Home. A dog looked up from the cover.\n\n“A dog story,” Hana smiled. “Okay. Maybe Tuesday.”\n\n“Not maybe,” Emma said. “Definitely. You read every night, Hana. Now go talk about it.”\n\nOn the walk home, the evening sun made the tents gold. Hana held her little bag carefully.\n\nGlass birds for Yui. A book for Tuesday. A hat for an espresso machine.\n\n“A good fair,” Leo said. “Nobody needs the hat. That’s why it’s beautiful.”\n\nAt home, Hana put the gift box in her drawer, next to Yui’s photo.\n\n“November,” she told the photo. “Wait a little more.”\n\nThen she opened The Long Way Home and read the first page — Tuesday was coming, and she wanted to be ready.","glossary":[{"w":"festival","ja":"祭り"},{"w":"banjo","ja":"バンジョー"},{"w":"sellers","ja":"売り手"},{"w":"earrings","ja":"イヤリング"},{"w":"glass","ja":"ガラス"},{"w":"budget","ja":"予算"},{"w":"discount","ja":"値引き"},{"w":"rude","ja":"失礼な"},{"w":"accept","ja":"受け入れる"},{"w":"bargain","ja":"値切り"},{"w":"elephant ear","ja":"平たい揚げ菓子"},{"w":"cinnamon","ja":"シナモン"},{"w":"librarian","ja":"図書館員"},{"w":"definitely","ja":"絶対に"},{"w":"drawer","ja":"引き出し"}],"phrases":[{"en":"Just looking, thanks.","ja":"見てるだけです、ありがとう。"},{"en":"How much is this?","ja":"これ、いくらですか？"},{"en":"Could you do ten dollars?","ja":"10ドルになりませんか？"},{"en":"I’ll take it.","ja":"これください。"},{"en":"It’s a deal.","ja":"商談成立！"}],"quiz":[{"q":"What does Hana buy for Yui?","c":["A hat","A book","Wooden spoons","Glass bird earrings"],"a":3},{"q":"What was the first price of the earrings?","c":["Ten dollars","Twelve dollars","Twenty dollars","Five dollars"],"a":1},{"q":"Why does the seller say yes to ten dollars?","c":["She does not like the earrings","The birds are broken","Hana’s story about her sister touches her heart","Leo pays the rest"],"a":2}],"words":772},{"id":49,"level":2,"emoji":"📖","theme":"読書クラブに初参加","titleEn":"A Map in the Heart","titleJa":"心の中の地図","teaser":"図書館の読書クラブに初参加。輪になった8つの椅子、ドキドキの発言タイム。犬の物語がハナにくれた言葉とは？","story":"On Tuesday evening, Hana stood in front of the library with the thin dog book.\n\nHer stomach was full of butterflies. Emma taught her that phrase. It means very nervous.\n\n“Just listen if you want,” Hana said to herself. “The librarian said so.”\n\nInside, a warm little room waited behind the children’s corner. Eight chairs stood in a circle.\n\n“Welcome back!” It was the librarian from the fair. “I’m Ms. Lopez. You came!”\n\n“I came,” Hana smiled. “And I finished the book. Twice.”\n\n“Twice! Wonderful. Sit anywhere,” Ms. Lopez said.\n\nThen a soft voice said, “Hana? Is that you?”\n\nHana turned. Mrs. Chen sat by the window with tea.\n\n“Mrs. Chen! You’re in the book club?”\n\n“Thirty years,” Mrs. Chen laughed. “Retired teachers never stop doing homework.”\n\nHana sat next to her, and the butterflies became smaller.\n\nThe other members arrived. A tall old man with big glasses said hello to everyone.\n\n“That’s Frank,” Mrs. Chen said quietly. “He cries at every book. Don’t worry. It’s normal.”\n\nMs. Lopez held up the book. “Okay, readers. The Long Way Home. A dog crosses two hundred miles to find his family. Let’s talk.”\n\n“How did you all like it?” she asked. “Who wants to start?”\n\nFrank raised his hand at once. “I loved it. I cried three times.”\n\n“We know, Frank,” everyone said together, and the room laughed warmly.\n\nA young woman named Priya spoke next. “My favorite part was the rainstorm. The dog was afraid, but he walked on.”\n\nPeople talked one by one. Hana listened hard. Some words flew too fast, but the feelings were clear.\n\nThen came the part Hana loved and feared. Ms. Lopez looked at her kindly.\n\n“Hana, you’re new. No pressure at all. But we’d love to hear you.”\n\nThe room became quiet. Seven friendly faces waited.\n\nHana’s heart drummed. She held the book with both hands.\n\n“Can I say something?” she asked. “Maybe… slowly?”\n\n“Slow is welcome here,” Ms. Lopez said.\n\n“My favorite part was the ending.” Hana spoke slowly. “The family moved to a new house. But the dog still found them.”\n\n“I didn’t expect that.” She looked around the circle. “I thought, how? He never saw the new house. Then I understood. He didn’t follow a map. He followed love.”\n\nNobody spoke for a moment.\n\nThen Frank took off his glasses. “Three times,” he said, “and now four.”\n\n“Beautiful thought,” Ms. Lopez said. “A map in the heart.”\n\nMrs. Chen touched Hana’s arm. “I agree with you. Home is not a place on paper.”\n\n“When I came to America fifty years ago,” Mrs. Chen said, “I was like that dog. I walked and walked. Then one day, this neighborhood smelled like home.”\n\nHana looked at her old friend. Some sentences are gifts, she thought.\n\nThe talk continued. People agreed and disagreed in a warm, polite way.\n\n“The bird part was strange,” Priya said.\n\n“The bird part was my favorite,” Frank said.\n\n“Both okay!” Ms. Lopez laughed. “Books are mirrors. Everyone sees a different face.”\n\nAt the break, there was mint tea and lemon cookies. Hana knew the cookies at once.\n\n“Mrs. Chen! These are yours!”\n\n“I never come with empty hands,” Mrs. Chen smiled.\n\nFrank came to Hana with his teacup. “Your English is clear, young lady. Slow words from the heart beat fast words from nowhere.”\n\n“Thank you,” Hana said. “I was very nervous.”\n\n“Everyone is,” Frank said. “I joined this club ten years ago. On my first night, I said nothing. Now nobody can stop me.”\n\nMs. Lopez rang a tiny bell. “Next month’s book, friends!” She gave everyone a thin blue book about a lighthouse.\n\n“A lighthouse story,” Hana said. “I’ll read it twice again.”\n\n“Then you’ll teach us,” Ms. Lopez said. “See you next Tuesday, everyone. Summer schedule — we meet every week.”\n\nOutside, the summer sky was still light purple. Mrs. Chen and Hana walked home together.\n\n“Thank you for tonight,” Hana said. “When you spoke, my fear went away.”\n\n“That’s a teacher’s job,” Mrs. Chen said. “And a neighbor’s job. And a friend’s.”\n\nAt her gate, Mrs. Chen stopped. “Hana. Tonight, in that room, nobody thought about your mistakes. We only heard your heart. Remember that feeling.”\n\n“I will,” Hana said softly. “See you next Tuesday.”\n\nAt the Millers’ house, the porch light was on. Carol sat outside with two glasses of cold tea.\n\n“There’s our reader,” Carol smiled. “How was the club?”\n\n“I talked,” Hana said. “And people listened.”\n\n“Then sit,” Carol said. “Because I have a question tonight. Do you know what day it is?”\n\nHana sat down and started to count — and the counting made her quiet in a soft, surprised way.","glossary":[{"w":"butterflies","ja":"緊張のドキドキ"},{"w":"circle","ja":"輪"},{"w":"retired","ja":"退職した"},{"w":"members","ja":"会員"},{"w":"glasses","ja":"メガネ"},{"w":"rainstorm","ja":"大雨"},{"w":"pressure","ja":"プレッシャー"},{"w":"drummed","ja":"ドキドキした"},{"w":"expect","ja":"予想する"},{"w":"mirrors","ja":"鏡"},{"w":"mint","ja":"ミント"},{"w":"lighthouse","ja":"灯台"},{"w":"schedule","ja":"予定"},{"w":"gate","ja":"門"}],"phrases":[{"en":"Can I say something?","ja":"ちょっと言ってもいい？"},{"en":"My favorite part was the ending.","ja":"いちばん好きなのは結末でした。"},{"en":"I didn’t expect that.","ja":"それは予想してなかった。"},{"en":"I agree with you.","ja":"私もそう思う。"},{"en":"See you next Tuesday.","ja":"また来週の火曜日にね。"}],"quiz":[{"q":"What is the club’s book about?","c":["A dog who crosses two hundred miles to find his family","A cat who lives in a lighthouse","A baker in France","A basketball team"],"a":0},{"q":"Who is also a member of the book club?","c":["Rosa","Leo","Mrs. Chen","Ben"],"a":2},{"q":"Why does Hana’s fear go away when she speaks?","c":["The room is empty","She reads from paper","Frank leaves the room","The circle listens to her heart, not her mistakes"],"a":3}],"words":779},{"id":50,"level":2,"emoji":"🌗","theme":"折り返しの夜","titleEn":"The Middle of the Bridge","titleJa":"折り返しの夜に","teaser":"4月のノートを開いたら、あのころの自分がいた。半月の夜、キャロルとポーチで語る「これまで」と「これから」。","story":"That warm July night, Carol waited on the porch with cold tea and a question.\n\n“Do you know what day it is?” she asked again.\n\n“Tuesday?” Hana said.\n\n“Yes. But also — come here.” Carol opened the family calendar on her phone. “You arrived on April fifth. Count with me.”\n\nHana counted the months on her fingers. April. May. June. July.\n\n“Three and a half months,” she said slowly. “Almost half of my time in America.”\n\n“The middle of the bridge,” Carol said. “A good place to stop and look.”\n\nAbove the garden, a half moon hung in the warm sky.\n\n“Even the moon knows,” Hana laughed. “Half light, half dark.”\n\nDaisy came out and lay between their chairs with a happy old-dog sound.\n\n“Wait here,” Hana said suddenly. “I want to show you something.”\n\nShe ran to her room and came back with a small notebook. The cover was old and soft.\n\n“My first notebook,” she said. “From April. Ready to laugh?”\n\nShe opened page one and read aloud: “My name is Hana. I am from Japan. I am very nervous. Where is my room, please?”\n\nCarol laughed warmly. “I remember that girl. She bowed to the refrigerator on her first morning.”\n\n“I was sleepy!” Hana laughed. “The refrigerator was tall like a person.”\n\nThey turned the pages together. Little sentences. Little drawings. A coffee cup. A bus. A dog.\n\n“April Hana wrote three words and stopped,” Hana said. “She was afraid of long sentences.”\n\n“And July Hana?” Carol asked.\n\n“July Hana talked in a book club tonight. Slow words, but her own words. And people listened.”\n\n“Time flies,” Carol said softly. “That’s our phrase for nights like this. Time flies.”\n\n“Time flies,” Hana repeated. “In Japanese, we say it like an arrow. Time flies like an arrow.”\n\n“Then in every country, time is fast,” Carol said. “That’s why tonight is important.”\n\nCarol counted on her fingers, like Hana in April.\n\n“First order at the Bluebird. First shift. First bus alone. The wallet adventure. The dorayaki thank-you day. DREAM, double points. And tonight, a book club.”\n\n“When you say it like that,” Hana said, “it sounds like a movie.”\n\n“It is,” Carol said. “And we watch it from the front row.”\n\nThen Carol took Hana’s hand.\n\n“Hana, listen. You came with two suitcases and careful eyes. Now this house is warmer because you are in it. I’m proud of you.”\n\nHana’s eyes became hot. “Thank you,” she said. “It means a lot. Really.”\n\n“In English, we also say this,” Carol added. “You’ve come a long way.”\n\n“I’ve come a long way.” Hana said the new phrase slowly, tasting it. “I like it. The way was long. And I walked it.”\n\n“With help,” she added. “Thanks to you. And Mike, and Ben, and Daisy. And the whole street.”\n\nThe porch door opened. Mike came out with a plate and a proud face.\n\n“I heard important talking,” he said. “Important talking needs cookies.”\n\nOn the plate were half moon cookies — round cookies cut in half, one side chocolate.\n\n“Half moon cookies,” Mike said, “for a half moon night. I’m a poet and I don’t know it.”\n\n“Dad heard everything from the kitchen,” Ben said from the door. “He practiced that joke twice.”\n\nThey ate cookies under the half moon. Daisy got a tiny piece. Nobody told the vet.\n\n“To Hana’s first half,” Mike said, and they touched their tea glasses like wine glasses.\n\n“And to the second half,” Ben said. “May it have more cookies.”\n\n“So,” Carol said. “Half of your American year is behind you. What does the second half need?”\n\nHana looked at the moon and thought.\n\n“More talking,” she said. “New tries at the cafe. More book clubs. And in November — I want to show Yui my Portland. My streets. My people.”\n\n“Good list,” Mike said. “Simple and true. Like a good cookie.”\n\nLater, in her room, Hana opened her new notebook to a clean page.\n\nShe wrote the date. Then, in her best letters: “Halfway. Time flies like an arrow. But I am not an arrow. I am a bird. I can stop, look, and fly again.”\n\nShe read her Day One page a last time. “I am very nervous.”\n\n“Dear April Hana,” she said quietly to the page. “Don’t worry. Good people are waiting for you.”\n\nShe closed the old notebook softly, like a door of a warm room.\n\nThen her phone buzzed. A message from Rosa: “Big news at the cafe tomorrow! Come ten minutes early. Bring your smile.”\n\nHana looked at the half moon one more time.\n\n“Second half,” she said. “Let’s go.”","glossary":[{"w":"calendar","ja":"カレンダー"},{"w":"arrived","ja":"到着した"},{"w":"bridge","ja":"橋"},{"w":"half moon","ja":"半月"},{"w":"aloud","ja":"声に出して"},{"w":"bowed","ja":"おじぎした"},{"w":"phrase","ja":"言い回し"},{"w":"arrow","ja":"矢"},{"w":"suitcases","ja":"スーツケース"},{"w":"proud","ja":"誇りに思う"},{"w":"poet","ja":"詩人"},{"w":"practiced","ja":"練習した"},{"w":"vet","ja":"獣医"},{"w":"buzzed","ja":"振動した"}],"phrases":[{"en":"Time flies.","ja":"時間がたつのは早いね。"},{"en":"I’m proud of you.","ja":"あなたを誇りに思うよ。"},{"en":"It means a lot.","ja":"すごくうれしい。"},{"en":"I’ve come a long way.","ja":"ずいぶん成長したなあ。"},{"en":"Thanks to you.","ja":"あなたのおかげだよ。"}],"quiz":[{"q":"When did Hana arrive in America?","c":["In July","In April","In January","In May"],"a":1},{"q":"What does Mike bring to the porch?","c":["Pizza","Lemonade","A guitar","Half moon cookies"],"a":3},{"q":"Why does Hana write that she is a bird, not an arrow?","c":["A bird can stop, look around, and fly again","Arrows are too fast for her","She wants to see more birds","Carol told her to write it"],"a":0}],"words":771},{"id":51,"level":3,"emoji":"☕","theme":"カフェのレジ担当デビュー","titleEn":"Queen of the Register","titleJa":"レジの女王、誕生？","teaser":"ロサから任された新しい仕事はレジ担当！怒涛の朝ラッシュと難読ネーム、ハナは乗り切れる？","story":"Monday morning in late July was bright, and Hana arrived at the Bluebird Cafe early.\n\nRosa was waiting by the counter with a big smile.\n\n“Hana, you’ve worked here for three months now,” she said. “You’ve learned so much. So today, I’m giving you a new job.”\n\n“A new job?” Hana asked.\n\n“The register!” Rosa laughed her big laugh. “You’ll take orders and handle the money. Emma will show you everything.”\n\nHana’s heart jumped. The register was the busiest place in the cafe. Every customer started there.\n\n“Do you think I’m ready?” she asked.\n\n“I wouldn’t ask if you weren’t,” Rosa said. “You’ve got this.”\n\nEmma stood next to her behind the counter. “Okay, it’s easy. You smile and say, ‘What can I get started for you?’ Then you press the buttons. Small, medium, large. That’s it!”\n\n“What if I make a mistake?” Hana asked.\n\n“Then you fix it,” Emma said. “Everyone makes mistakes. Leo once charged a man for twelve muffins instead of one.”\n\n“In my defense, he looked hungry,” Leo called from the espresso machine.\n\nThe first customer was a tall man in a suit.\n\n“What can I get started for you?” Hana asked. Her voice was a little shaky.\n\n“Large black coffee, please.”\n\n“For here or to go?”\n\n“To go, thanks.”\n\n“Anything else?”\n\n“No, that’s all.”\n\n“That’ll be three twenty-five,” Hana said. She pressed the buttons carefully, took his card, and handed him the receipt. “Have a great day!”\n\nThe man smiled. “You too.”\n\nHana let out a long breath. One order done. Only the whole day left.\n\n“Perfect!” Emma whispered. “See? You’re a natural.”\n\nThen the morning rush began.\n\nThe line grew longer and longer. Office workers, dog walkers, two mothers with strollers. Hana took a deep breath and kept going.\n\nEmma made drinks beside her. Leo worked the espresso machine like a drummer in a band. The cafe was loud and warm and full of morning energy.\n\n“What can I get started for you?”\n\n“A medium iced latte with oat milk, please.”\n\n“An iced latte with oat milk. Anything else?”\n\n“Can you add whipped cream?”\n\n“Of course! One iced latte with extra whipped cream, coming right up,” Hana said, and the customer smiled at the word ‘extra’.\n\nA boy ordered a strawberry smoothie. An old man asked, “What’s good here?”\n\n“The blueberry muffins are amazing,” Hana said. “Rosa baked them this morning.” He bought two.\n\nBetween orders, Emma taught her small tricks. “If you forget the price, the screen shows it. If the card machine stops, turn it off and on. And if you get nervous, look for a friendly face in the line.”\n\n“There are many friendly faces today,” Hana said.\n\nSome orders were harder. One woman ordered a half-sweet, extra-hot, decaf caramel something. Hana asked her to repeat it slowly, and the woman kindly did.\n\n“Can I get your name for the cup?” Hana asked.\n\n“It’s Siobhan.”\n\nHana froze. “Could you spell that for me?”\n\nThe woman laughed and spelled it. Leo peeked at the cup later and whistled. “Nice spelling. Better than mine.”\n\nAround nine thirty, trouble came. Hana pressed the wrong button and charged a man for two sandwiches instead of one.\n\n“Oh no. I’m so sorry,” she said. “Let me fix that right away.”\n\nShe canceled the charge and did it again, just like Emma taught her. The man waited patiently.\n\n“No problem,” he said. “It happens.”\n\n“Thank you for waiting,” Hana said, and she meant it with her whole heart.\n\nThe next customer, an old lady, patted her hand. “You’re doing fine, dear.”\n\nAt ten, Ben walked in with two friends from basketball camp. “Whoa,” he said. “They let you drive the register now?”\n\n“I’ve been promoted,” Hana said proudly. “What can I get started for you?”\n\n“Three lemonades. And, uh, don’t tell Mom about the cookies.”\n\n“Anything else?” Hana asked, already smiling.\n\n“You sound like a real cafe worker,” Ben said. “It’s kind of weird.”\n\nBy eleven, the rush was over. Hana looked at the quiet cafe and couldn’t believe it. She had taken more than fifty orders.\n\nRosa came over with a glass of iced tea. “So? How was your first morning on the register?”\n\n“My hands were shaking at first,” Hana said. “But then I got used to it. It was actually fun. A year ago, I couldn’t imagine talking to so many people.”\n\n“Your English has gotten so much faster,” Emma said. “You didn’t even panic at Siobhan.”\n\n“I panicked a little inside,” Hana laughed.\n\nLeo brought her a chocolate croissant. “For the new register queen. You’ve earned it.”\n\n“Register queen?” Hana said. “I like that.”\n\nMrs. Chen came in for her afternoon tea and heard the news. “The register already? My, my. You’ve come a long way since your first day.”\n\n“Thank you, Mrs. Chen. I still remember my first order here. I practiced one sentence for ten minutes outside the door.”\n\n“And now you’re the one taking the orders,” Mrs. Chen smiled. “Life is funny that way.”\n\n“Come again tomorrow,” Hana said. “I’ll practice your tea order until it’s perfect.”\n\n“It’s already perfect, dear. You remembered it last week.”\n\nThat evening at dinner, Hana told the Millers everything — Siobhan, the fifty orders, the register queen.\n\n“Fifty orders!” Carol said. “That’s wonderful, honey.”\n\n“Were you scared?” Ben asked. “You looked pretty calm.”\n\n“My face was calm. My hands were not,” Hana said.\n\n“You know what they say,” Mike said, raising his fork. “The cash register is where the money... registers.”\n\nBen groaned. “Dad. No.”\n\nDaisy barked once, and everyone laughed.\n\nThat night, Hana wrote in her notebook: “Day 51. Today I became the register queen. The register is not about buttons or money. It is about saying hello to fifty different people, one at a time.”\n\nBut she didn’t know yet that tomorrow would bring her most difficult customer.","glossary":[{"w":"counter","ja":"カウンター"},{"w":"register","ja":"レジ"},{"w":"handle","ja":"扱う"},{"w":"customer","ja":"お客"},{"w":"charged","ja":"請求した"},{"w":"shaky","ja":"震えて"},{"w":"receipt","ja":"レシート"},{"w":"rush","ja":"混雑時間"},{"w":"stroller","ja":"ベビーカー"},{"w":"whipped cream","ja":"ホイップ"},{"w":"decaf","ja":"カフェイン抜き"},{"w":"patiently","ja":"辛抱強く"},{"w":"promoted","ja":"昇進した"},{"w":"proudly","ja":"誇らしげに"}],"phrases":[{"en":"What can I get started for you?","ja":"ご注文は何になさいますか？"},{"en":"Anything else?","ja":"他にご注文はありますか？"},{"en":"For here or to go?","ja":"店内で？お持ち帰りで？"},{"en":"You’ve got this.","ja":"きみなら大丈夫。"},{"en":"Have a great day!","ja":"よい一日を！"}],"quiz":[{"q":"What is Hana’s new job at the cafe?","c":["Making the espresso","Taking orders at the register","Baking the muffins","Washing the dishes"],"a":1},{"q":"Why did Hana ask Siobhan to spell her name?","c":["The cafe was too loud","Her pen didn’t work","Siobhan spoke too fast","The name was hard for her"],"a":3},{"q":"How did Hana feel at the end of the day?","c":["Proud and happy","Angry at Leo","Bored with the job","Afraid of tomorrow"],"a":0}],"words":976},{"id":52,"level":3,"emoji":"😤","theme":"困ったお客さまへの対応","titleEn":"A Storm in a Coffee Cup","titleJa":"コーヒーカップの中の嵐","teaser":"大混雑の火曜日、怒れるお客さまが登場。ハナの落ち着いた対応が、意外な午後を呼ぶ。","story":"Tuesday morning at the Bluebird Cafe was the busiest Hana had ever seen.\n\nThe line went almost to the door. Summer tourists mixed with the regular office crowd.\n\n“Stay calm and smile,” Emma said. “Tuesdays are like this.”\n\n“I’m ready,” Hana said. And for the first hour, she was.\n\nThen a man in a gray suit pushed to the counter. He was talking on his phone and looking at his watch at the same time.\n\n“Medium americano,” he said quickly, still on the phone.\n\n“For here or to go?” Hana asked.\n\n“To go. Obviously.”\n\nHana passed the cup to Leo. The espresso machine was loud, the milk steamer was louder, and somewhere a blender was running.\n\nThree minutes later, the man grabbed his drink, took a sip, and stopped.\n\n“This is iced,” he said loudly. “I ordered a hot americano. Hot. Is that so hard?”\n\nThe cafe went quiet. An old woman near the window shook her head. Emma froze with a milk jug in her hand.\n\nHana felt her face turn red. Part of her wanted to hide in the kitchen.\n\nInstead, she remembered Rosa’s words from her first week: a problem is just a chance to be kind.\n\n“I apologize for the mix-up. Let me make it right.” Hana looked at him. “One hot americano, coming up right away.”\n\n“I’m late for a meeting,” the man grumbled.\n\n“I understand,” Hana said. “It will take one minute. Leo, can you make it first?”\n\n“On it,” Leo said. No jokes this time.\n\nThe other customers slowly went back to their coffee. Kindness, Hana noticed, could change the weather of a whole room.\n\nWhile the machine hissed, Hana picked out a chocolate chip cookie and put it in a small bag.\n\n“Thank you for waiting,” she said, giving him the new cup and the bag. “The cookie is a gift. It’s on the house.”\n\nThe man blinked. “On the... what?”\n\n“On the house. It means it’s free,” Hana said.\n\nFor half a second, the corner of his mouth moved. It was almost a smile.\n\n“Fine,” he said. He took the drink and left without another word.\n\nHana let out a long breath. Her hands were shaking a little.\n\n“You okay?” Emma whispered.\n\n“I think so,” Hana said. “My heart is still running a marathon.”\n\nRosa had watched everything from the kitchen door. She walked over and put a hand on Hana’s shoulder.\n\n“Twenty years ago, a customer like that made me cry in the back room,” she said. “You handled him better than I did. I’m proud of you.”\n\n“I was scared,” Hana said.\n\n“Being scared and being calm at the same time — that’s courage,” Rosa said.\n\nEmma brought Hana a glass of water. “Drink. Hero work makes you thirsty.”\n\n“Was I really okay? My English gets slower when I’m nervous.”\n\n“Slower is fine,” Emma said. “You were clear, polite, and you fixed the problem. That’s all a customer needs.”\n\nAt lunch, Mrs. Chen heard the story from Leo, who acted out the whole scene twice.\n\n“In thirty years of teaching, I met many angry people,” Mrs. Chen said. “The loud ones usually carry the heaviest bags.”\n\n“The heaviest bags?” Hana asked.\n\n“Worries, dear. Invisible ones.”\n\nAround three o’clock, the door opened, and Hana looked up. It was the man in the gray suit.\n\nHe walked slowly to the counter. He wasn’t on his phone.\n\n“Hi,” he said. “I was here this morning. The iced americano guy.”\n\n“I remember,” Hana said carefully.\n\n“I came to say sorry. My car broke down at seven. I missed my train, and I was late for the biggest meeting of my year. But that wasn’t your fault, and I was rude to you.”\n\nHana didn’t know what to say for a moment.\n\n“Thank you for coming back,” she said finally. “That took courage, too.”\n\n“The cookie was great, by the way. My meeting went badly, so I ate it in the elevator. It helped.”\n\nHana laughed. “Would you like a hot americano? I’ll get it right this time.”\n\n“Actually, the mistake was probably mine. I talk too fast when I’m stressed.”\n\n“Then let’s try again,” Hana said. “Slowly. Is there anything else I can do for you?”\n\n“One hot americano,” he said, word by word, and this time they both smiled.\n\nHis name was Frank. He worked at the bank down the street, and he promised to come back on a better day.\n\n“Same time tomorrow?” Rosa called from the kitchen, and Frank actually laughed.\n\nAfter he left, Leo leaned on the counter. “You know what’s funny? You apologized for MY mistake. I made the iced americano.”\n\n“We’re a team,” Hana said. “Your mistakes are my mistakes.”\n\n“Best team on the street,” Rosa agreed from the kitchen door.\n\n“In that case, I’ll make more,” Leo said, and Emma threw a towel at him.\n\nThat evening, Rosa closed the register and turned to Hana. “Angry customers are like summer storms. Loud, sudden, and usually about something else.”\n\n“Frank’s storm was a broken car,” Hana said.\n\n“Exactly. Remember that, and this job will never break your heart.”\n\nAt dinner, Hana told the Millers about Frank.\n\n“You gave him a cookie?” Ben said. “I get angry every day. Where’s my cookie?”\n\n“Nice try,” Carol laughed. “But seriously, nurses meet angry patients all the time. You did the right thing — you didn’t take it personally.”\n\n“I learned something today,” Hana said. “Angry people are not always angry at you. Sometimes you just stand where the storm is.”\n\n“Very wise,” Mike said. “Also, ‘on the house’ — great expression. In my house, nothing is free.”\n\nBen groaned, Daisy sighed, and Hana smiled into her tea.\n\nOn the walk home, Hana practiced saying “really rude customer” out loud — and frowned. Her R’s still sounded like L’s. Maybe it was time to ask Leo for help.","glossary":[{"w":"tourists","ja":"観光客"},{"w":"obviously","ja":"当然でしょ"},{"w":"blender","ja":"ミキサー"},{"w":"sip","ja":"ひと口"},{"w":"froze","ja":"固まった"},{"w":"grumbled","ja":"ぶつぶつ言った"},{"w":"hissed","ja":"シューと鳴った"},{"w":"courage","ja":"勇気"},{"w":"invisible","ja":"見えない"},{"w":"broke down","ja":"故障した"},{"w":"rude","ja":"失礼な"},{"w":"elevator","ja":"エレベーター"},{"w":"stressed","ja":"焦っている"},{"w":"storm","ja":"嵐"},{"w":"wise","ja":"賢い"}],"phrases":[{"en":"I apologize for the mix-up.","ja":"手違いをお詫びします。"},{"en":"Let me make it right.","ja":"すぐにやり直しますね。"},{"en":"It’s on the house.","ja":"お店のおごりです。"},{"en":"Is there anything else I can do for you?","ja":"他に何かできることはありますか？"},{"en":"I came to say sorry.","ja":"謝りに来ました。"}],"quiz":[{"q":"What was wrong with the man’s drink?","c":["It was too small","It was too sweet","It was iced, not hot","It was tea, not coffee"],"a":2},{"q":"Why was Frank really so angry in the morning?","c":["He was having a terrible day","He hated the cafe’s coffee","Hana was too slow","The cookie was old"],"a":0},{"q":"How did Rosa feel about Hana after the mix-up?","c":["Angry about the mistake","Worried about the cafe","Sad for Frank","Proud of her"],"a":3}],"words":977},{"id":53,"level":3,"emoji":"🗣","theme":"発音レッスン","titleEn":"Leo’s Pronunciation Bootcamp","titleJa":"レオ先生の発音道場","teaser":"RとLとthに悪戦苦闘のハナに、レオ先生の発音特訓が開講！早口言葉と意外な金言の一日。","story":"Wednesday afternoon was slow at the cafe, and the summer rain kept most customers away.\n\nHana wiped the counter and practiced quietly. “Rude. Lude. Rude?”\n\nLeo looked up from the espresso machine. “Are you talking to the counter?”\n\n“My R’s are broken,” Hana sighed. “Yesterday I said ‘I’ll bling your coffee light away.’ The customer was very kind, but I wanted to disappear.”\n\nLeo clapped his hands. “Perfect timing. Welcome to Leo’s Pronunciation Bootcamp. Today: the R, the L, and the terrible th.”\n\n“Bootcamp?” Emma laughed. “He did this to me too. There will be tongue twisters.”\n\n“First, the good news,” Leo said. “I’m from Brazil. Ten years ago, my English sounded like a soccer commentary in a washing machine. If I learned these sounds, you can learn them.”\n\n“Okay, coach,” Hana said. “Teach me.”\n\n“Rule one. Watch my mouth.” Leo pointed at his lips. “For L, your tongue touches behind your top teeth. La, la, la.”\n\n“La, la, la,” Hana repeated. “That one is easy.”\n\n“For R, the tongue pulls back. It touches nothing. Rrrr. Like a small angry dog.”\n\nHana tried. “Rrr... rude. Rude!”\n\n“There it is!” Leo shouted. Rosa peeked out from the kitchen to see who was winning.\n\n“Now the th,” Leo said. “Put your tongue between your teeth and blow. Think. Three. Thank you.”\n\n“Sank you,” Hana said. Then she stopped. “Wait. Th... thank you.”\n\n“Better! Say it slowly. Your mouth needs time to learn.”\n\nThey played a counting game: think, three, thirty-three, three hundred thirty-three. Hana’s tongue got stuck, and everyone laughed, Hana loudest of all.\n\nThey practiced between customers. When someone came in, Hana took the order. When the cafe was empty, the bootcamp continued.\n\nEmma wrote tongue twisters on the specials board: Red lorry, yellow lorry. Three free trees. Larry’s really rural railroad.\n\n“Who is Larry?” Hana asked. “And why is his railroad so difficult?”\n\n“Nobody knows,” Leo said. “Larry exists only to hurt language learners.”\n\nTwo regulars, coffee in hand, tried the twisters too. One of them, a firefighter named Sam, failed three times in a row.\n\n“See?” Leo said. “Even native speakers crash into Larry’s railroad.”\n\n“That makes me feel much better,” Hana laughed.\n\nShe tried the first one. “Red lolly, yellow lolly.”\n\n“Lorry! Rrr!”\n\n“Don’t give up. Larry believes in you.”\n\n“Red lorry, yellow... lorry!” Hana said, and threw her arms up like a champion.\n\n“In Japanese, R and L live in the same house,” she explained. “They’re like twins. So my mouth thinks they’re the same person.”\n\n“That’s a great way to say it,” Emma said. “Your English isn’t broken, Hana. Your mouth just grew up in a different neighborhood.”\n\nHana liked that so much that she wrote it down.\n\nMrs. Chen came in for tea, shaking her umbrella. She listened for a minute and smiled.\n\n“I taught school for thirty years,” she said. “May I add one thing?”\n\n“Please,” Hana said.\n\n“Perfect sounds are nice, but they’re not the goal. Speaking slowly and clearly — that’s the goal. My students understood tired teachers, quiet teachers, teachers with colds. Clear and slow always wins.”\n\n“But when customers speak fast, I feel I should speak fast too,” Hana said.\n\n“That’s a trap, dear. Slow speakers sound calm. Calm sounds confident.”\n\n“Did your students laugh at learners?” Hana asked.\n\n“Never twice,” Mrs. Chen said, with a teacher’s smile that could stop a clock.\n\nLeo nodded. “She’s right. Also, my R’s are still fifty percent Brazilian. Nobody minds.”\n\n“Could you say that again?” Hana asked Mrs. Chen. “I want to write it down.”\n\n“Slow speakers sound calm. Calm sounds confident.” Hana wrote it in her notebook with a star.\n\nThe rain stopped, and a few customers came in. A woman ordered a raspberry lemonade.\n\n“One raspberry lemonade,” Hana said slowly. “Really refreshing on a rainy day.”\n\nThe R’s came out round and clear. The woman didn’t notice anything. That was the best part — it just sounded normal.\n\nLeo raised both hands silently, like a goal had been scored.\n\n“That,” he said, “was the sound of months of hard work. How do you feel?”\n\n“Like my tongue finally got its driver’s license,” Hana said.\n\nBefore Hana left, Leo gave her homework. “At dinner, ask for a really large glass of milk. Report tomorrow.”\n\n“That’s a strange sentence.”\n\n“It has three R’s and two L’s. It’s a workout.”\n\nAt dinner, Hana looked at Carol and took a breath. “Could I have a really large glass of milk, please?”\n\nPerfect. Every sound in its place. The table went quiet.\n\n“Wow,” Ben said. “That sounded super American.”\n\n“Leo’s bootcamp,” Hana explained. “Today I fought the R, the L, and the th.”\n\n“Who won?” Mike asked.\n\n“The th, mostly. But I’m getting better. Practice makes perfect.”\n\n“And practice tastes better with milk,” Carol said, pouring a really large glass.\n\n“You know what’s funny about ‘th’?” Mike said. “Without it, ‘three things’ would just be ‘free tings’. Sounds like a phone company.”\n\n“That’s not even a pun, Dad,” Ben said.\n\n“Thank you, Then,” Mike said. “I mean, Ben.”\n\nEveryone groaned, and Daisy rolled over.\n\n“When I started nursing, I couldn’t say ‘stethoscope’,” Carol said. “I called it ‘the listening thing’ for a month.”\n\n“What happened?” Hana asked.\n\n“A patient taught me, one sound at a time. People love to help, if you let them.”\n\n“Also,” Ben added, “if you can say ‘squirrel’, you win English forever.”\n\n“Squirrel,” Hana tried. “Sk... skwill. Squi-rrel. Squirrel!”\n\n“Whoa. It took me eight years to say that,” Ben said, and Hana felt ten feet tall.\n\nThat night, Hana practiced in front of the mirror. “Rude customer. Really rude customer. Larry’s really rural railroad.”\n\nIn her notebook, under Mrs. Chen’s words, she wrote one more line: “My accent is my story. I only want to be clear, not perfect.”\n\nJust before bed, her phone buzzed. It was Leo: “Emergency meeting tomorrow before work. Not about pronunciation. It’s about Emma. Top secret.”","glossary":[{"w":"pronunciation","ja":"発音"},{"w":"bootcamp","ja":"特訓合宿"},{"w":"tongue twister","ja":"早口言葉"},{"w":"commentary","ja":"実況"},{"w":"tongue","ja":"舌"},{"w":"lorry","ja":"大型トラック"},{"w":"rural","ja":"いなかの"},{"w":"railroad","ja":"鉄道"},{"w":"trap","ja":"わな"},{"w":"confident","ja":"自信がある"},{"w":"refreshing","ja":"さわやか"},{"w":"workout","ja":"筋トレ"},{"w":"stethoscope","ja":"聴診器"},{"w":"squirrel","ja":"リス"},{"w":"accent","ja":"なまり"}],"phrases":[{"en":"Watch my mouth.","ja":"口元を見ていて。"},{"en":"Say it slowly.","ja":"ゆっくり言ってみて。"},{"en":"Don’t give up.","ja":"あきらめないで。"},{"en":"Could you say that again?","ja":"もう一度言ってもらえますか？"},{"en":"Practice makes perfect.","ja":"習うより慣れろ。"}],"quiz":[{"q":"Which sounds are hard for Hana?","c":["R, L, and th","P and B","S and Z","K and G"],"a":0},{"q":"Why is Leo a good pronunciation teacher?","c":["He studied at a university","He is the oldest worker","He also learned English sounds himself","He speaks very slowly"],"a":2},{"q":"What does Mrs. Chen think is most important?","c":["Perfect R sounds","Speaking slowly and clearly","A loud voice","An American accent"],"a":1}],"words":989},{"id":54,"level":3,"emoji":"🎁","theme":"サプライズの計画","titleEn":"Operation Blue Birthday","titleJa":"作戦名ブルーバースデー","teaser":"エマの誕生日にサプライズパーティー計画が始動！ケーキ係はハナ。でも秘密を守るのは大変で…","story":"On Thursday, Hana arrived at the cafe thirty minutes early for Leo’s mysterious meeting.\n\nLeo and Rosa were waiting in the kitchen with the lights half on. It felt like a spy movie.\n\n“Thank you for coming,” Leo said in a serious voice. “Agent Hana, we have a situation.”\n\n“Is something wrong?” Hana asked.\n\n“Emma’s birthday is this Saturday,” Rosa said. “She’ll be twenty-four. And she thinks everyone forgot.”\n\n“Forgot? How is that possible?”\n\n“Because we told her nothing,” Leo grinned. “That’s the plan. Saturday night, after closing, we throw a surprise party right here. Balloons, music, food, the works.”\n\nHana’s eyes went wide. “A surprise party! I’ve seen them in movies, but I’ve never planned one.”\n\n“First rule,” Leo said. “Keep it a secret. Emma is smart. If you smile too much, she’ll know.”\n\n“Can you keep a secret?” Rosa asked.\n\n“I think so,” Hana said. Then, honestly: “Actually, I don’t know. I’ve never tested it.”\n\n“Perfect answer,” Leo said. “We’ll train you.”\n\n“Rosa handles food and drinks,” Leo said. “I do decorations and music. And you, Agent Hana...”\n\n“Me?”\n\n“The cake,” Rosa said. “You worked at a bakery. Emma always says your dorayaki changed her life. Make her birthday cake.”\n\nHana’s heart lifted like a balloon. “Really? I’d love to. She loves lemon and blueberries. I already have an idea.”\n\n“I’m counting on you. All of us are,” Rosa said.\n\n“No pressure,” Leo added. “But the whole party stands on your cake.”\n\n“That is pressure,” Hana said.\n\n“Good pressure,” Rosa said. “Like baking. The oven is hot, and that’s exactly why the cake rises.”\n\nThe meeting ended two minutes before Emma walked in.\n\n“Morning!” Emma called. “Why are the kitchen lights half on? It looks like a spy movie in here.”\n\nEveryone spoke at the same time. “Cleaning!” “Coffee!” “Inventory!”\n\nEmma blinked. “Okay, weirdos,” she said, and went to hang up her bag.\n\nLeo whispered, “That was terrible. We need to act natural.”\n\nActing natural was harder than it sounded. Luckily, the morning rush saved them — nobody can be suspicious during the espresso hour.\n\nAt lunch, Hana and Leo slipped out to the art shop down the street.\n\n“Emma has wanted these watercolor pencils for months,” Leo said. “She looks at them every time we pass. Then she checks the price and walks away.”\n\n“Then it’s decided,” Hana said. “From both of us. She’ll never expect it.”\n\nThe shop owner wrapped the box in yellow paper. “Birthday?” she asked.\n\n“Surprise party,” Hana said proudly — and then covered her mouth. “Please forget I said that.”\n\nThe owner laughed. “Your secret is safe with me.”\n\nIn the afternoon, Emma almost saw the party shopping list. Hana slid it under a tray of muffins just in time.\n\n“What was that paper?” Emma asked.\n\n“A recipe,” Hana said. It was almost true.\n\nAfter work, Hana visited Mrs. Chen to invite her.\n\n“A surprise party! I haven’t been to one in twenty years,” Mrs. Chen said. Mochi opened one eye, decided it wasn’t about food, and went back to sleep.\n\n“Could you bring some flowers from your garden? Emma loves your roses.”\n\n“I’ll bring the best ones. And don’t worry — teachers are excellent secret keepers.”\n\nOn Friday morning, Ben came by with a huge bag of balloons and party hats. Hana pushed him back out the door.\n\n“Wrong day!” she whispered. “Saturday! And use the back door!”\n\n“You’re scary today,” Ben said, but he smiled, saluted like a soldier, and marched away with his mountain of balloons.\n\nThe hardest moment came Friday afternoon.\n\nEmma was quiet while they cleaned the espresso machine. Then she said, “Can I ask you something? You and Leo keep whispering. Rosa hides papers when I come in. Did I... do something wrong?”\n\nHana’s heart squeezed. Emma looked really worried.\n\nFor one second, Hana almost told her everything. Instead, she took a breath.\n\n“You did nothing wrong,” she said carefully. “It’s a long story. But I promise it’s a good story, not a bad one. Can you trust me until Saturday?”\n\nEmma studied her face. “Hmm. You’re a terrible liar, Hana.”\n\n“I know,” Hana said. “That’s why I’m not lying. I’m just... not telling. There’s a difference.”\n\nEmma laughed at last. “Fine. Until Saturday. But this better be good.”\n\nAt closing, Emma found a paper star behind the coffee machine. “What’s this?”\n\n“Mine!” Leo said, snatching it. “I’m... making paper stars. It’s my new hobby. Doctors recommend hobbies.”\n\nEmma stared at him for a long time. “You are all so strange this week,” she said.\n\nThat evening, Hana baked a test cake in Carol’s kitchen. Lemon cake, blueberry jam between the layers, white cream like a summer cloud.\n\nDaisy sat by the oven the whole time, nose up, tail slowly sweeping the floor.\n\n“Sorry, Daisy, cake is not for dogs,” Hana said. “But I saved you a dog cookie.”\n\nThe Millers were the taste testers.\n\n“Ten out of ten,” Mike said. “No pun. Some cakes are beyond jokes.”\n\n“It needs a little more lemon,” Carol said. “But honey, Emma is going to cry.”\n\n“Good crying or bad crying?” Ben asked.\n\n“The best crying,” Carol said.\n\nHana wrote the final recipe carefully in her notebook. “Emma’s cake. More lemon. With love.”\n\nLater, Leo texted the team: “Status report. Decorations: hidden in my closet. Music: ready. Guests: eighteen people.”\n\nRosa: “Food ready by six. Mrs. Chen brings flowers.”\n\nHana: “Cake tested. The Millers approve. She has no idea.”\n\nLeo: “Then Operation Blue Birthday is a go.”\n\nBefore bed, Hana practiced her poker face in the mirror. It still looked like a smile wearing a hat.\n\nKeeping a secret from your best friend was hard — but only because the secret was made of love.\n\nOne more sleep, she thought. Tomorrow night, when Emma opens that door, everything has to be perfect.","glossary":[{"w":"mysterious","ja":"なぞめいた"},{"w":"situation","ja":"事態"},{"w":"the works","ja":"全部盛り"},{"w":"handles","ja":"担当する"},{"w":"inventory","ja":"在庫調べ"},{"w":"weirdos","ja":"変な人たち"},{"w":"act natural","ja":"自然にふるまう"},{"w":"suspicious","ja":"あやしむ"},{"w":"watercolor","ja":"水彩"},{"w":"wrapped","ja":"包んだ"},{"w":"slid","ja":"すべらせた"},{"w":"squeezed","ja":"締めつけられた"},{"w":"liar","ja":"うそつき"},{"w":"layers","ja":"層"},{"w":"poker face","ja":"すまし顔"}],"phrases":[{"en":"Keep it a secret.","ja":"内緒にしてね。"},{"en":"Can you keep a secret?","ja":"秘密を守れる？"},{"en":"I’m counting on you.","ja":"頼りにしてるよ。"},{"en":"It’s a long story.","ja":"話せば長くなるの。"},{"en":"She has no idea.","ja":"彼女は全く気づいてないよ。"}],"quiz":[{"q":"When is Emma’s surprise party?","c":["Thursday night","Friday morning","Sunday afternoon","Saturday night"],"a":3},{"q":"What will Hana make for the party?","c":["The decorations","The birthday cake","A photo album","The music list"],"a":1},{"q":"Why did Emma feel worried on Friday?","c":["Her paintings didn’t sell","She broke a cup","Her friends seemed to have secrets","She missed her family"],"a":2}],"words":973},{"id":55,"level":3,"emoji":"🎊","theme":"サプライズパーティー本番","titleEn":"Twenty-Four Candles","titleJa":"24本のろうそく","teaser":"ついに作戦決行の夜。真っ暗なカフェ、開くドア、そして響く「サプライズ！」エマの涙の理由は？","story":"Saturday finally came, and the Bluebird Cafe smelled like coffee and secrets.\n\nAll day, the team acted normal. It was the hardest acting of Hana’s life.\n\nAround noon, Emma said quietly, “So... today’s my birthday.”\n\n“Oh, nice,” Leo said, cleaning the machine. “Happy birthday.”\n\nThat was all. Emma waited a second, then walked away with small shoulders.\n\nHana’s heart hurt. Six more hours, she thought. Please forgive us until then.\n\nCustomers came and went. Twice, Hana almost said something about the evening, and twice she bit her tongue.\n\n“She looks so sad,” Hana whispered to Rosa in the kitchen.\n\n“I know,” Rosa whispered back. “That’s how good the surprise will be.”\n\nAt five, Carol arrived at the back door with the cake box, like a spy passing a package.\n\nAcross the street, the guests gathered in the park and tried to look casual. The Millers, Mrs. Chen with an armful of roses, Sam the firefighter, even Frank from the bank.\n\nAt six, Rosa flipped the sign to CLOSED. “Emma, before you go — can you help me check the inventory? It won’t take long.”\n\n“Sure,” Emma sighed. “It’s not like I have big plans.”\n\n“No big plans?” Rosa asked innocently. “On your birthday?”\n\n“You remembered!” Emma said. “Well, nobody else did. It’s fine. Twenty-four isn’t a big number anyway.”\n\nBehind the kitchen door, Hana pressed both hands over her mouth.\n\nWhile Rosa kept Emma in the storage room counting coffee bags, everything moved fast.\n\nLeo hung paper streamers. Ben tied balloons to every chair. Carol set out food, Mike carried in drinks, and Hana placed the cake in the center with twenty-four candles.\n\nMrs. Chen put roses in three vases. The guests slipped inside. Then Leo turned off the lights and texted Rosa one word: Ready.\n\nIn the dark, Hana could hear her own heart. Footsteps. The storage door opened.\n\n“Rosa, the coffee bags are fine, but why is it so dark in—”\n\nThe lights blazed on.\n\n“Surprise!” everyone shouted.\n\nEmma froze in the doorway, both hands over her mouth. Her clipboard slid to the floor.\n\nAbove the counter hung a banner: HAPPY BIRTHDAY, EMMA! Hana had painted it herself, with a little help from Ben.\n\n“Is this... for me?” Emma asked in a tiny voice.\n\n“No, it’s for Mochi,” Leo said. “Of course it’s for you!”\n\nEmma laughed — and then the happy tears came.\n\nHana carried the cake out, candles glowing. Everyone sang. Emma closed her eyes for a long moment and blew out all twenty-four candles in one breath.\n\n“What did you wish for?” Ben asked.\n\n“If I tell you, it won’t come true,” Emma said, wiping her eyes. “But it’s already half true. Just look around.”\n\nRosa raised her glass of lemonade. “Emma came to me three years ago, a nervous art student who broke two cups in her first week. Now she’s the heart of this cafe. You mean so much to us. Happy birthday, Emma!”\n\n“Cheers!” everyone shouted, and glasses of lemonade and iced tea clinked all around.\n\n“Best lemonade toast of my life,” Ben said. “We should do this every week.”\n\nThen came the cake. Frank took one bite and stopped. “Okay. Who made this?”\n\n“Hana did!” said six people at once.\n\n“There are blueberries inside,” Hana told Emma, “because you always draw little blueberries on the specials board.”\n\n“You noticed that?” Emma said. “Great. Now I’m crying and eating at the same time.”\n\nMrs. Chen presented her roses. “From my garden. Cut this morning, kept secret all day. Not easy with a curious cat watching.”\n\nAt last, Leo brought out the yellow box. The room went quiet.\n\nEmma unwrapped it slowly. When she saw the watercolor pencils, she didn’t say anything at all.\n\n“How did you know?” she finally whispered. “I never told anyone.”\n\n“You told the shop window,” Leo said. “Every Tuesday.”\n\nEmma hugged him, then hugged Hana so hard that Hana squeaked like a dog toy.\n\n“From both of us,” Hana said. “Paint something amazing.”\n\nCarol and Mike gave Emma a set of brushes, and Ben gave her a drawing he had made himself — a stick-figure Emma holding a giant coffee cup. She promised to frame it.\n\nLeo started his playlist, and the little cafe became a dance floor. Mike’s dance moves made Ben hide behind the counter. Daisy walked from guest to guest in a party hat, collecting love.\n\nEven Mrs. Chen danced one slow song, holding her glass of tea like a queen.\n\n“Let’s take a picture!” Emma called. “Everyone squeeze in! Daisy in the front!”\n\nTwenty people squeezed between the counter and the window, laughing.\n\nLater, Emma stood on a chair. “Speech! Okay. When Hana walked in on her first day, she was so nervous she whispered her own name. I thought, that girl needs a friend. Now I can’t imagine my life without her — without all of you. This is the best day ever.”\n\n“To Emma!” Rosa called, and the room called it back.\n\nWhen the guests had gone home, Emma and Hana sat on the bench outside with the last two slices of cake.\n\n“Was it hard, keeping the secret?” Emma asked.\n\n“The hardest thing I’ve ever done in English,” Hana said. “Not telling needs very good grammar.”\n\nEmma laughed loudly. “Hana. You planned a surprise party in your second language. Do you understand how amazing that is?”\n\nHana looked at the dark cafe, the balloons still floating inside. She hadn’t thought about it that way.\n\n“Six months ago, I couldn’t order a coffee,” she said. “Tonight I made a toast.”\n\n“And next?” Emma asked.\n\nAs they locked up, they saw Rosa’s new note taped by the register: STAFF MEETING MONDAY. FALL MENU IDEAS WANTED.\n\n“New menu, huh?” Emma said. Hana was quiet — because somewhere in her heart, a small idea, green as summer leaves, was waking up.","glossary":[{"w":"acting","ja":"演技"},{"w":"bit her tongue","ja":"ぐっと我慢した"},{"w":"armful","ja":"抱えるほど"},{"w":"flipped","ja":"裏返した"},{"w":"innocently","ja":"何気なく"},{"w":"storage room","ja":"倉庫"},{"w":"streamers","ja":"紙テープ"},{"w":"blazed","ja":"ぱっとついた"},{"w":"clipboard","ja":"バインダー"},{"w":"banner","ja":"横断幕"},{"w":"blew out","ja":"吹き消した"},{"w":"clinked","ja":"カチンと鳴った"},{"w":"unwrapped","ja":"包みを開けた"},{"w":"squeaked","ja":"キュッと鳴いた"},{"w":"frame","ja":"額に入れる"}],"phrases":[{"en":"Surprise!","ja":"サプライズ！"},{"en":"You mean so much to us.","ja":"あなたは私たちの大切な人。"},{"en":"Cheers!","ja":"乾杯！"},{"en":"Let’s take a picture!","ja":"写真を撮ろう！"},{"en":"This is the best day ever.","ja":"今日は人生最高の日。"}],"quiz":[{"q":"How did the team keep Emma at the cafe after closing?","c":["They planned a movie night","They asked her to help with inventory","They said the door was broken","They hid her bag"],"a":1},{"q":"What was the gift from Hana and Leo?","c":["Watercolor pencils","A blue apron","Concert tickets","A photo album"],"a":0},{"q":"Why did Emma cry at the party?","c":["The cake was too sweet","She was tired from work","Her family called her","She felt loved by everyone"],"a":3}],"words":976},{"id":56,"level":3,"emoji":"🧾","theme":"秋の新メニュー会議","titleEn":"Hana Raises Her Hand","titleJa":"会議で手を挙げて","teaser":"秋メニューを決めるスタッフ会議。胸に温めてきたあのアイデアを、ハナは言い出せるのか？","story":"On Monday evening, the Bluebird Cafe closed early for its first staff meeting of the fall.\n\nRosa pushed two tables together. Emma brought her sketchbook. Leo brought a bag of chips “for thinking”.\n\nDaisy was there too, asleep under a chair. She was not officially staff, but nobody had the heart to tell her.\n\n“Welcome to the future of the Bluebird,” Rosa said, tapping a whiteboard. “Agenda: the fall menu. Summer is ending, and iced drink sales always drop in September.”\n\n“Sad but true,” Leo said. “Nobody wants an iced lemonade in the rain.”\n\n“Numbers don’t lie,” Rosa said, showing a graph she had drawn by hand. “Iced drinks in July: two hundred a week. Iced drinks in late September: fifty, if we’re lucky.”\n\n“That’s a sad graph,” Emma said.\n\n“It’s September,” Rosa shrugged. “Sweater weather needs sweater drinks. So — we need two or three new drinks and one new sweet. Ideas. Go.”\n\nLeo raised his hand first. “Pumpkin spice everything. Latte, muffin, cookie. It’s not autumn without it.”\n\n“Every cafe in Portland does pumpkin spice,” Emma said. “We need something different.”\n\n“Hey, classics are classics,” Leo said. “That’s like saying no to Christmas.”\n\n“Both fair,” Rosa said. “Emma, your idea?”\n\n“Fall leaf cookies,” Emma said, opening her sketchbook. “Maple cookies shaped like leaves. I’ll paint them with icing — red, orange, gold. People will buy them just to look at them.”\n\n“And then they’ll eat the art,” Leo said. “Cruel, but delicious.”\n\n“Beautiful,” Rosa said. “And drinks?”\n\nThe room went quiet. All eyes moved around the table.\n\nHana had an idea. She had carried it for weeks.\n\nMatcha latte. Warm, green, a little sweet. At the bakery in Matsuyama, the workers drank matcha on cold mornings, and it felt like a small fire in winter.\n\nBut a small fear held her arm. What if it was too Japanese? What if everyone smiled politely, said “interesting”, and never spoke of it again? Her heart beat faster and faster.\n\n“Hana, you’re making your thinking face,” Emma said.\n\n“It’s nothing,” Hana said. It was not nothing.\n\n“What do you think, Hana?” Rosa asked.\n\nHana took a deep breath. “In my opinion, we should try something new. Something no other cafe on this street has.”\n\n“Go on,” Rosa said.\n\n“Let me explain.” Hana stood up, surprising even herself. “Matcha. It’s a Japanese green tea, made from fine powder. You whisk it with hot milk, and it becomes a matcha latte. Warm, a little sweet, and the color is a beautiful deep green.”\n\n“At my old bakery, we drank it on cold mornings,” she went on. “One warm cup, and the whole team stopped being tired. I want to bring that feeling here.”\n\nThere was a short silence. Hana’s face got hot. “Maybe it’s too Japanese,” she added quickly.\n\n“Too Japanese?” Rosa said. “Hana, our menu has Italian espresso, French croissants, and Leo’s Brazilian cheese bread on Fridays. This cafe is a passport.”\n\n“That’s a great point.” Emma tapped her sketchbook. “Also, matcha green next to my red leaf cookies? The colors are perfect. The photos will be amazing.”\n\n“I tried matcha at a big chain once,” Leo said. “Too bitter. Can you make it better?”\n\nHana nodded. “The secret is good matcha and honest milk. Not too much sugar. If the matcha is cheap, the drink tastes like grass.”\n\n“Like grass!” Leo laughed. “Okay, now I’m interested.”\n\n“Matcha,” he practiced. “Mat-cha. Not to be confused with ‘matches’. That would be a very different drink.”\n\n“How do you say the color?” Emma asked, pencil ready.\n\n“Deep green,” Hana said. “Like a forest after rain.”\n\n“Perfect. That goes on the menu board.”\n\n“How much does matcha cost?” Rosa asked, turning to the money page of her notebook.\n\n“There’s a Japanese market downtown,” Hana said. “A small jar is enough for forty cups. I checked the price last month.”\n\n“Last month?” Rosa smiled. “So this idea has been growing for a while.”\n\n“Since July,” Hana admitted. “I was waiting for courage.”\n\n“Why don’t we vote?” Leo said. “All ideas on the board.”\n\nLeo wrote everything on the whiteboard: Pumpkin spice latte. Fall leaf cookies. Matcha latte. And his second idea — a spicy chili mocha.\n\nEveryone voted with raised hands. Pumpkin spice passed. Leaf cookies passed. The chili mocha got one vote, and it was Leo’s.\n\n“One vote is still a vote,” he said with dignity.\n\n“And the matcha latte?” Emma asked.\n\n“Great ideas get a test day,” Rosa said. “Friday morning, before we open. Hana, bring us your best matcha latte. If the team loves it, it goes on the menu.”\n\nHana felt pressure and joy hold hands inside her chest. “I won’t let you down.”\n\n“You never have,” Rosa said.\n\nShe closed the meeting the way she closed every day, with her big laugh. “Best meeting in years. Everyone spoke, nobody cried, and the chips are gone.”\n\nEmma and Hana walked home under the warm evening sky.\n\n“Three months ago, you whispered your own name,” Emma said. “Tonight you stood up and gave a little presentation. Do you see it? Because I see it.”\n\n“My heart was very loud in there,” Hana said. “Could you hear it?”\n\n“Only a little. Like a drum in another room.”\n\n“Speaking in a meeting is different from the register,” Hana said. “At the register, people wait for their coffee. In a meeting, people wait for your thoughts.”\n\n“And yours were worth waiting for,” Emma said.\n\nBefore bed, Hana texted Yui: “I shared my opinion in a staff meeting today. In English. Please tell Mom.”\n\nYui answered in ten seconds: “WHO ARE YOU AND WHERE IS MY REAL SISTER? (So proud of you.)”\n\nHana smiled and opened her notebook to a new page: Operation Matcha. First step — find the best matcha powder in Portland by Friday.","glossary":[{"w":"staff meeting","ja":"スタッフ会議"},{"w":"sketchbook","ja":"スケッチ帳"},{"w":"whiteboard","ja":"ホワイトボード"},{"w":"agenda","ja":"議題"},{"w":"sales","ja":"売り上げ"},{"w":"drop","ja":"減る"},{"w":"graph","ja":"グラフ"},{"w":"icing","ja":"アイシング"},{"w":"opinion","ja":"意見"},{"w":"whisk","ja":"泡立てる"
