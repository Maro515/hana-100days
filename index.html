oo. Is that strange?”\n\n“Not strange at all,” Carol said. “Happy and scared often hold hands.”\n\nShe gave Hana the warm milk.\n\n“Listen. You are kind. You work hard. You’ll do great.”\n\n“You’ll do great,” Hana repeated slowly. “Thank you, Carol.”\n\n“And remember,” Carol said. “Everyone makes mistakes on the first day. Everyone.”\n\n“Even you?” Hana asked.\n\n“Oh, yes. On my first day as a nurse, I dropped a full tray. Soup everywhere!” Carol laughed. “And look at me now.”\n\nHana smiled. The scared feeling got smaller.\n\nShe went back to bed. Daisy followed her and slept by the door.\n\n“Good night, Daisy,” Hana said. “Monday, I am a cafe worker.”\n\nShe closed her eyes. This time, sleep came fast.\n\nAnd Monday morning was waiting — with a small surprise on her first shift.","glossary":[{"w":"pocket","ja":"ポケット"},{"w":"A watched pot never boils","ja":"待つ身は長い"},{"w":"planted","ja":"植えた"},{"w":"dirt","ja":"土"},{"w":"rang","ja":"鳴った"},{"w":"froze","ja":"固まった"},{"w":"Breathe","ja":"深呼吸して"},{"w":"comfortable","ja":"楽な"},{"w":"shook","ja":"ふるえた"},{"w":"shouted","ja":"さけんだ"},{"w":"barked","ja":"ほえた"},{"w":"roast chicken","ja":"ローストチキン"},{"w":"got mugged","ja":"強盗にあった"},{"w":"ceiling","ja":"天井"},{"w":"scared","ja":"こわい"}],"phrases":[{"en":"Good news.","ja":"いい知らせだよ。"},{"en":"I got the job!","ja":"採用されたよ！"},{"en":"See you Monday!","ja":"また月曜日にね！"},{"en":"Can’t sleep?","ja":"眠れないの？"},{"en":"You’ll do great.","ja":"きっとうまくいくよ。"}],"quiz":[{"q":"Who called Hana at eleven o’clock?","c":["Emma","Rosa","Mrs. Chen","Yui"],"a":1},{"q":"When does Hana start her new job?","c":["Friday at two","Sunday at nine","Monday at seven","Tuesday at ten"],"a":2},{"q":"Why can’t Hana sleep at night?","c":["The house is loud","Daisy barks all night","She drank too much coffee","She is happy but scared"],"a":3}],"words":557},{"id":14,"level":1,"emoji":"👩‍🍳","theme":"初シフトと小さな失敗","titleEn":"First Shift, Small Mistakes","titleJa":"はじめてのシフト","teaser":"青いエプロンで初出勤！ところが朝のラッシュで注文が大混乱。ハナはどうする？","story":"On Monday, Hana stood at the cafe door before seven.\n\nShe wore comfortable shoes and a clean white shirt.\n\nRosa opened the door. “Good morning, Hana! Ready?”\n\n“Good morning! Yes… I think so,” Hana said.\n\nEmma gave her a blue apron. “This is yours now. Welcome to the team!”\n\nHana held the apron. It felt important.\n\nFirst, Emma showed her the cafe. “Cups here. Milk there. Napkins here.”\n\n“Cups, milk, napkins,” Hana repeated.\n\n“You learn fast,” Emma said. “Today, you carry food and clean tables. Easy start.”\n\nThe first hour was quiet. Hana carried muffins and coffee. She cleaned tables and smiled.\n\n“This is fun,” she thought.\n\nThen nine o’clock came. The door opened again and again.\n\nSuddenly the cafe was full. It was very loud.\n\n“Hana!” Rosa called. “Table five, one muffin! Table six, two coffees!”\n\n“Yes!” Hana said. Her feet moved fast. Her head moved faster.\n\nShe took the muffin to table six. She took the coffees to table five.\n\nA tall man looked at the muffin. “Sorry, I asked for two coffees.”\n\nA woman at table five smiled. “And this coffee is not mine, I think.”\n\nHana’s face went red. Her hands felt cold.\n\n“Oh no. I’m so sorry,” she said.\n\nShe picked up the plates. Her hands shook. The coffee almost fell.\n\nEmma came fast and held the tray. “Breathe. Small mistake. It happens.”\n\nHana took a breath. Then she spoke to the man.\n\n“I’m so sorry, sir. Let me fix that. One moment, please.”\n\nShe brought the right muffin and the right coffees. She said sorry again with a small bow.\n\nThe tall man smiled. “No problem. It’s busy today. You’re doing fine.”\n\nThe woman smiled too. “The coffee is still hot. Don’t worry, dear.”\n\nHana felt warm inside. Customers here were kind.\n\nBut ten minutes later, it happened again. Wrong table, wrong cake.\n\n“I’m so sorry. Let me fix that,” Hana said again.\n\nThis time she moved slowly. She checked the table number two times.\n\n“Table three. Chocolate cake. Table three,” she said quietly.\n\nIt was right. The customer said, “Thank you, dear.”\n\nAt one o’clock, the cafe got quiet. Hana’s legs hurt. Her apron had coffee spots.\n\nRosa called her to the counter. Hana’s heart dropped.\n\n“Rosa, I’m sorry about the mistakes,” Hana said. “I took food to the wrong tables.”\n\nRosa laughed her big laugh. “Hana. Do you know my first day here?”\n\n“Your first day?” Hana asked.\n\n“I broke ten cups. Ten! And I gave a man salt, not sugar.”\n\n“Salt?” Hana laughed. “In his coffee?”\n\n“In his coffee!” Rosa said. “He drank it. He came back the next day too.”\n\nEmma smiled. “You said sorry. You fixed it fast. That’s the real job.”\n\n“Say sorry, fix it fast,” Hana repeated. “I can remember that.”\n\nRosa gave her a warm muffin. “Here. First-day pay. The real pay comes later.”\n\nHana walked home slowly. Her legs were tired. Her heart was full.\n\nAt home, Daisy ran to her. Ben looked up from his phone.\n\n“How was work?” he asked.\n\n“Hard. Busy. A little sad. Then good,” Hana said.\n\n“That’s every job,” Ben said, and went back to his phone.\n\nThat night, Hana wrote in her notebook: “Say sorry. Fix it fast. Check two times.”\n\nShe smiled and closed the notebook. Tomorrow was day two.\n\nAnd tomorrow, a special customer waited at her favorite table.","glossary":[{"w":"comfortable","ja":"楽な"},{"w":"apron","ja":"エプロン"},{"w":"napkins","ja":"紙ナプキン"},{"w":"repeated","ja":"くり返した"},{"w":"carried","ja":"運んだ"},{"w":"Suddenly","ja":"急に"},{"w":"mistake","ja":"まちがい"},{"w":"tray","ja":"トレー"},{"w":"sir","ja":"男性への敬称"},{"w":"fix","ja":"直す"},{"w":"quietly","ja":"静かに"},{"w":"spots","ja":"しみ"},{"w":"heart dropped","ja":"ヒヤッとした"},{"w":"broke","ja":"こわした"},{"w":"special","ja":"特別な"}],"phrases":[{"en":"Welcome to the team!","ja":"チームへようこそ！"},{"en":"I’m so sorry.","ja":"本当にすみません。"},{"en":"Let me fix that.","ja":"すぐに直しますね。"},{"en":"One moment, please.","ja":"少々お待ちください。"},{"en":"It happens.","ja":"よくあることだよ。"}],"quiz":[{"q":"What color is Hana’s new apron?","c":["Blue","Red","White","Green"],"a":0},{"q":"What did Rosa give a man on her first day?","c":["Two muffins","Cold coffee","A wrong cake","Salt, not sugar"],"a":3},{"q":"What does Hana learn on her first day?","c":["Run fast and say nothing","Say sorry and fix it fast","Never carry two cups","Hide from busy tables"],"a":1}],"words":562},{"id":15,"level":1,"emoji":"🍵","theme":"常連さんとの会話","titleEn":"The Regular by the Window","titleJa":"窓ぎわの常連さん","teaser":"毎朝10時に来るおばあさん。緑茶とスコーンの常連さんは、なんと意外な人だった！","story":"Tuesday was Hana’s second day at Bluebird Cafe.\n\nThe morning rush ended. The cafe was calm again.\n\nAn old woman sat at the small table by the window.\n\nShe had white hair and a soft green sweater. She drank tea, not coffee.\n\n“That’s Mrs. Chen,” Emma said quietly. “She comes every day at ten. Green tea, one scone.”\n\n“A regular?” Hana asked.\n\n“Our best regular,” Emma smiled. “Go say hello. She loves new people.”\n\nHana walked to the table with warm water for the teapot.\n\n“Hello. More hot water?” she asked.\n\n“Yes, please. Thank you, dear,” the woman said. She spoke slowly and kindly.\n\n“You are new here. What’s your name?”\n\n“I’m Hana. This is my second day,” Hana said.\n\n“Welcome, Hana. I’m Mrs. Chen,” she said. “Lovely weather today, isn’t it?”\n\nHana looked outside. The sky was blue. The trees danced a little.\n\n“Yes! Very lovely,” she said. “But yesterday — so much rain!”\n\nMrs. Chen laughed softly. “That’s Portland, dear. Rain, sun, rain, sun. Do you like rain?”\n\n“A little,” Hana said. “In Japan, June is the rain month. I like the sound.”\n\n“Japan!” Mrs. Chen’s eyes got bright. “Where in Japan?”\n\n“Matsuyama. It’s a small city. It has a famous castle and hot springs.”\n\n“How wonderful,” Mrs. Chen said. “I was a teacher for forty years. I taught geography. I love maps.”\n\nThey talked for a few minutes. Mrs. Chen never spoke fast. Her words were clear.\n\nThen Mrs. Chen asked, “Where do you live, Hana?”\n\n“On Maple Street. With the Miller family,” Hana said.\n\nMrs. Chen put down her cup. “Maple Street? The Millers? With the old golden dog?”\n\n“Yes! Daisy!” Hana said.\n\n“My dear!” Mrs. Chen laughed. “I live next door! The blue house with the white cat in the window.”\n\nHana’s mouth opened. “The white cat! I see her every morning!”\n\n“Her name is Mochi,” Mrs. Chen said.\n\n“Mochi?” Hana laughed. “Like the Japanese rice cake?”\n\n“Exactly, dear. She is white, round, and soft. The name was easy,” Mrs. Chen said.\n\nThey laughed together. A neighbor! Here, at her cafe!\n\n“We are neighbors for three weeks,” Hana said. “And we meet here!”\n\n“Life is funny,” Mrs. Chen said. “The world is big. But a neighborhood is small.”\n\nRosa came by with the teapot. “Ah, you found each other! Mrs. Chen was my first customer, twelve years ago.”\n\n“And I come back every day,” Mrs. Chen said. “The tea is good. The people are better.”\n\nAt eleven, Mrs. Chen stood up slowly.\n\n“Time to go home. Mochi waits for lunch,” she said.\n\n“Say hi to Mochi.” Hana smiled and waved.\n\n“I will, dear. Come see her one day. Come for tea,” Mrs. Chen said.\n\n“Really? Yes! I want to meet her,” Hana said.\n\n“Good. Neighbors need tea and talk,” Mrs. Chen said. “See you tomorrow, Hana.”\n\n“See you tomorrow!” Hana said. It felt warm and easy.\n\nThat evening, Hana walked past the blue house. Mochi sat in the window, white and round.\n\nHana waved. “Hi, Mochi. I’m the new neighbor.”\n\nThe cat looked at her. Then it closed its eyes slowly. Maybe that was “hello” in cat language.\n\nAt dinner, Hana told everyone the story.\n\n“Mrs. Chen is wonderful,” Carol said. “Her cookies are famous on this street.”\n\n“She was my teacher!” Mike said. “Forty years ago. She gave me a C.”\n\nEveryone laughed. Portland felt smaller tonight — and warmer too.\n\n“Tomorrow, more tea for Mrs. Chen,” Hana thought. “And soon — Saturday with Emma at the market.”","glossary":[{"w":"morning rush","ja":"朝の混雑"},{"w":"calm","ja":"おだやか"},{"w":"sweater","ja":"セーター"},{"w":"scone","ja":"スコーン"},{"w":"regular","ja":"常連さん"},{"w":"teapot","ja":"ティーポット"},{"w":"lovely","ja":"すてきな"},{"w":"castle","ja":"城"},{"w":"hot springs","ja":"温泉"},{"w":"geography","ja":"地理"},{"w":"next door","ja":"となり"},{"w":"Exactly","ja":"その通り"},{"w":"neighbors","ja":"ご近所さん"},{"w":"neighborhood","ja":"近所・地域"},{"w":"waved","ja":"手をふった"}],"phrases":[{"en":"What’s your name?","ja":"お名前は？"},{"en":"Lovely weather today, isn’t it?","ja":"今日はいい天気ですね。"},{"en":"Time to go home.","ja":"そろそろ帰る時間。"},{"en":"Say hi to Mochi.","ja":"モチによろしくね。"},{"en":"See you tomorrow!","ja":"また明日！"}],"quiz":[{"q":"What does Mrs. Chen drink every day?","c":["Coffee","Milk","Green tea","Juice"],"a":2},{"q":"Where does Mrs. Chen live?","c":["Next door to the Millers","Far from the cafe","Above the cafe","In Japan"],"a":0},{"q":"Why is the name Mochi funny to Hana?","c":["Mochi is a dog name","Mochi is Mrs. Chen’s name","Mochi means green tea","The cat is white, round, and soft like mochi"],"a":3}],"words":584},{"id":16,"level":1,"emoji":"🥬","theme":"ファーマーズマーケット","titleEn":"Saturday at the Farmers Market","titleJa":"土曜日のマーケットで","teaser":"エマと週末の市場へ。いちごの試食、地元のはちみつ、黄色い花。買い物英語の練習日和！","story":"On Saturday morning, Emma took Hana to the farmers market.\n\nThe market was by the river. White tents stood in long lines.\n\n“Wow,” Hana said. “It’s so big!”\n\n“Best market in Portland,” Emma said. “Vegetables, fruit, bread, flowers. And free samples!”\n\n“Samples?” Hana asked.\n\n“Small free tastes,” Emma said. “Watch me.”\n\nEmma walked to a fruit stand. Strawberries sat in small green boxes.\n\n“Good morning! Can I try one?” Emma asked.\n\n“Of course!” the farmer said. He was a big man with a straw hat.\n\nEmma ate a strawberry. “Mmm! Hana, try one.”\n\n“Can I try one?” Hana asked.\n\n“Go ahead,” the farmer smiled.\n\nThe strawberry was small and very red. It tasted like spring.\n\n“So sweet!” Hana said. “How much are these?”\n\n“Four dollars a box. Two boxes for seven,” the farmer said.\n\nHana thought. Two boxes. One for the Millers, one for Mrs. Chen.\n\n“Two boxes, please,” she said. She counted the dollars slowly. Seven.\n\n“Perfect. Have a good one!” the farmer said.\n\n“Have a good one?” Hana asked Emma. “A good what?”\n\n“A good day,” Emma laughed. “People say it fast. Have a good one!”\n\nThey walked on. Hana carried her bag with two hands.\n\nAt a vegetable stand, Emma picked up a strange white thing.\n\n“What’s this?” Hana asked. “A big white carrot?”\n\n“It’s a parsnip,” Emma said. “Good in soup.”\n\n“Par-snip,” Hana said slowly. “English has many vegetables.”\n\nA woman at the next stand called, “Fresh eggs! Local honey!”\n\n“Local?” Hana asked Emma.\n\n“From near here,” Emma said. “Local food is fresh food.”\n\nHana bought six eggs and a small jar of honey.\n\n“How much is the honey?” she asked first.\n\n“Six fifty,” the woman said. “It’s from my own bees.”\n\n“Your bees?” Hana said. “Thank you, bees.” The woman laughed.\n\nThen Hana saw flowers. Yellow, pink, purple. She stopped.\n\n“Carol loves flowers,” she said. “How much are these?”\n\n“Five dollars a bunch,” the flower man said.\n\n“A bunch?” Hana asked.\n\nEmma showed her. “This is one bunch. One group of flowers.”\n\nHana chose yellow ones. “These, please.”\n\nAt noon, they sat on the grass by the river. They shared fresh bread and honey.\n\n“I love this market,” Hana said. “In Japan, I went shopping with my mother. This feels like that.”\n\n“Markets feel like family,” Emma said. “Oh! One more stand. My favorite one.”\n\nIt was a bread stand. The smell was warm and deep.\n\nHana’s eyes went wide. “This smell… like my old bakery.”\n\nThe baker was an old woman with flour on her arms.\n\n“Try this,” she said. “Walnut bread. Today’s special.”\n\nHana tried a piece. It was perfect.\n\n“I worked at a bakery in Japan,” Hana said. “This bread is wonderful. How do you make it?”\n\nThe old woman smiled big. “Come early one morning. I can show you.”\n\n“Really?” Hana said. “I want that very much!”\n\nEmma bumped her arm. “Look at you! Making friends everywhere.”\n\nThey walked home with full bags. Strawberries, eggs, honey, flowers, bread.\n\n“My arms hurt,” Hana laughed. “But my heart is happy.”\n\nAt home, Carol loved the yellow flowers. Mrs. Chen loved the strawberries. Mochi loved the empty box.\n\n“Next Saturday, we go again?” Hana asked Emma on the phone.\n\n“Every Saturday!” Emma said.\n\nThat night, Hana put the honey jar by her notebook. Sweet days, she thought.\n\nBut first — next week, she had a special job: a package for Japan.","glossary":[{"w":"farmers market","ja":"青空市場"},{"w":"tents","ja":"テント"},{"w":"samples","ja":"試食"},{"w":"stand","ja":"屋台・売り場"},{"w":"strawberries","ja":"いちご"},{"w":"farmer","ja":"農家の人"},{"w":"straw hat","ja":"麦わら帽子"},{"w":"counted","ja":"数えた"},{"w":"Have a good one","ja":"良い一日を"},{"w":"parsnip","ja":"パースニップ"},{"w":"Local","ja":"地元の"},{"w":"jar","ja":"びん"},{"w":"bees","ja":"ミツバチ"},{"w":"bunch","ja":"一束"},{"w":"Walnut","ja":"クルミ"}],"phrases":[{"en":"Can I try one?","ja":"ひとつ試してもいいですか？"},{"en":"Of course!","ja":"もちろん！"},{"en":"How much are these?","ja":"これはいくらですか？"},{"en":"Have a good one!","ja":"良い一日を！"},{"en":"These, please.","ja":"これをください。"}],"quiz":[{"q":"Where was the farmers market?","c":["At the school","By the river","At the airport","In the library"],"a":1},{"q":"How much were two boxes of strawberries?","c":["Four dollars","Ten dollars","Six fifty","Seven dollars"],"a":3},{"q":"Why does Hana love the bread stand?","c":["The smell is like her old bakery","The bread is free","Emma works there","It is the biggest stand"],"a":0}],"words":567},{"id":17,"level":1,"emoji":"✉️","theme":"郵便局から小包を送る","titleEn":"A Box Full of Portland","titleJa":"ポートランドを箱につめて","teaser":"家族へのおみやげを日本へ発送！郵便局で初めての手続き。緑の用紙に書くものは？","story":"On her day off, Hana packed a box for her family in Japan.\n\nInside the box: Portland honey, tea, chocolate, and a small book of park photos.\n\nThere were letters too. One for her mother, one for her father, one for Yui.\n\n“Yui loves chocolate,” Hana said to Daisy. “And Mom loves tea.”\n\nDaisy smelled the box and wagged her tail.\n\n“No, Daisy. This is not for you,” Hana laughed.\n\nThe post office was on Oak Street. Hana walked there with the box in her arms.\n\nInside, there was a line. Hana waited and practiced quietly.\n\n“I’d like to send this to Japan. I’d like to send this to Japan.”\n\nA man in line smiled. “First time?” he asked.\n\n“Yes. Is it hard?” Hana asked.\n\n“No. The people here are nice,” he said. “Just fill out a form.”\n\n“Next, please!” called the clerk. It was Hana’s turn.\n\nThe clerk had round glasses and a kind face. “Hi there! What can I do for you?”\n\n“Hello. I’d like to send this to Japan,” Hana said.\n\n“Sure thing.” The clerk put the box on the scale. “Four pounds. Airmail?”\n\n“Airmail… by plane?” Hana asked.\n\n“That’s right. Plane is fast. Ship is slow,” he said.\n\n“How long does it take?” Hana asked.\n\n“Airmail? About one week. By ship? Two months,” the clerk said.\n\n“Two months!” Hana said. “The chocolate can’t wait. Airmail, please.”\n\nThe clerk laughed. “Good choice. Chocolate is important.”\n\nHe gave her a green form. “Fill out this customs form, please. Write what is in the box.”\n\nHana took a pen. Name, address, and… “What is ‘contents’?” she asked.\n\n“The things inside the box,” the clerk said.\n\n“Ah! Honey, tea, chocolate, photos, letters,” Hana said. She wrote each word slowly.\n\n“And the value? The price of the things?” the clerk asked.\n\n“About thirty dollars,” Hana said.\n\n“Perfect. And here — a gift box? Check yes,” he said.\n\nHana checked yes. A gift. Yes, it was a gift full of Portland.\n\nThe clerk turned the form. “Sign here, please.”\n\nHana signed her name. The clerk put stamps on the box.\n\n“Twenty-eight dollars, please,” he said.\n\nHana paid. Then the box went into a big cart behind him.\n\n“Bye, box,” Hana said quietly. “Fly to Matsuyama.”\n\nThe clerk smiled. “First package home?”\n\n“Yes. For my family,” Hana said. “I’m here for nine months.”\n\n“They can taste Portland now,” the clerk said. “That’s a happy box. Have a good one!”\n\n“Have a good one!” Hana said. The market phrase! She used it!\n\nOutside, the sun was out. Hana felt light without the box. But her heart was a little heavy.\n\nShe called home that night. “A box is coming!” she said in English, then in Japanese.\n\n“A box?” Yui said. “What’s inside? Tell me!”\n\n“It’s a surprise,” Hana said. “Wait one week.”\n\n“One week!” Yui said. “That’s so long!”\n\nHana laughed. “A watched pot never boils, Yui.”\n\n“A pot? What pot?” Yui asked.\n\n“An English lesson,” Hana said. “From Carol. I can teach you next time.”\n\nThat week, Hana thought about the box every day. Over the ocean. Over the clouds.\n\nSeven days later, her phone rang at breakfast. It was a video call from Japan.\n\nYui’s face filled the screen. She held the honey jar high. “It came! It came!”\n\nBehind her, Mom waved with the tea. Everyone talked at the same time.\n\nHana smiled and smiled. Four thousand miles away, her family tasted her new city.\n\nAt dinner, Ben whispered, “Hana, secret meeting after dinner. Dad’s birthday is coming.”","glossary":[{"w":"day off","ja":"休みの日"},{"w":"packed","ja":"箱につめた"},{"w":"wagged","ja":"(尾を)ふった"},{"w":"post office","ja":"郵便局"},{"w":"line","ja":"列"},{"w":"fill out a form","ja":"用紙に記入"},{"w":"clerk","ja":"局員・店員"},{"w":"scale","ja":"はかり"},{"w":"pounds","ja":"ポンド(重さ)"},{"w":"Airmail","ja":"航空便"},{"w":"customs form","ja":"税関の用紙"},{"w":"contents","ja":"中身"},{"w":"value","ja":"価格"},{"w":"stamps","ja":"切手"},{"w":"package","ja":"小包"}],"phrases":[{"en":"What can I do for you?","ja":"ご用件は何ですか？"},{"en":"I’d like to send this to Japan.","ja":"これを日本に送りたいのですが。"},{"en":"How long does it take?","ja":"どのくらいかかりますか？"},{"en":"Sign here, please.","ja":"ここにサインをお願いします。"},{"en":"Next, please!","ja":"次の方、どうぞ！"}],"quiz":[{"q":"What is NOT in Hana’s box?","c":["Honey","Tea","Letters","A muffin"],"a":3},{"q":"How long does airmail take to Japan?","c":["Two months","One day","About one week","Three weeks"],"a":2},{"q":"Why is Hana’s heart a little heavy after the post office?","c":["The box cost too much","She misses her family","She lost her letters","The clerk was not kind"],"a":1}],"words":587},{"id":18,"level":1,"emoji":"🎂","theme":"マイクの誕生日プレゼント選び","titleEn":"The Secret Mission","titleJa":"ひみつのプレゼント作戦","teaser":"ベンとひみつの買い物へ。予算40ドルでマイクの誕生日プレゼントを探せ！2人が選んだのは？","story":"After dinner on Tuesday, Ben knocked on Hana’s door.\n\n“Secret meeting,” he whispered. “Mom is in the kitchen. Dad is in the garage.”\n\n“A secret meeting?” Hana whispered too. “About what?”\n\n“Dad’s birthday. It’s on Saturday,” Ben said. “I need help with a present.”\n\n“I love presents!” Hana said.\n\n“Cool. Are you in?” Ben asked.\n\n“In? In where?” Hana asked.\n\n“It means: do you want to join?” Ben said.\n\n“Then yes. I’m in!” Hana said.\n\nOn Thursday, they took the bus to the shopping street.\n\n“What does Mike like?” Hana asked.\n\n“Tools. Science stuff. Bad jokes,” Ben said. “And coffee.”\n\n“Bad jokes are free,” Hana said. Ben laughed. “Good one, Hana.”\n\nFirst, they went to the tool shop. Ben picked up a big yellow drill.\n\n“What about this one?” he asked.\n\nHana looked at the price. Ninety dollars.\n\n“Too much,” she said. “How much money do we have?”\n\n“Twenty from me,” Ben said.\n\n“Twenty from me too. Forty dollars,” Hana said.\n\n“Okay. No drill,” Ben said.\n\nThey looked at hammers. They looked at work gloves. Nothing felt special.\n\n“Gloves say: I don’t know you,” Ben said. “Dad needs something… him.”\n\nNext, the bookstore. Hana found a book: “One Thousand Science Jokes.”\n\n“What about this one?” she asked.\n\nBen read one joke. He made a face. “Oh no. These are so bad.”\n\n“Bad is good, right?” Hana said. “For Mike.”\n\n“Bad is perfect,” Ben said. “But a book is only eight dollars. We have more.”\n\nThey walked and thought. Then Hana stopped at a small shop window.\n\nInside were mugs. One big blue mug had white words: “Trust me. I’m a science teacher.”\n\nHana and Ben looked at each other.\n\n“That’s Dad,” Ben said.\n\n“That’s Mike,” Hana said at the same time. They laughed.\n\nThe mug was twelve dollars. The joke book was eight.\n\n“Twenty dollars. We have twenty more,” Ben said. “Coffee for the mug?”\n\n“Yes! Good coffee beans,” Hana said. “I know a place.”\n\nThey walked to Bluebird Cafe. Rosa sold them a bag of her best beans.\n\n“For Mike’s birthday?” Rosa said. “Then a little more in the bag. Happy birthday from Bluebird!”\n\n“Rosa, you are the best,” Hana said.\n\n“Thank you, Rosa!” they said together.\n\nOn the bus home, Ben held the bag. He was quiet for a minute.\n\n“Hey, Hana. Thanks,” he said. “Shopping alone is boring. This was fun.”\n\n“For me too,” Hana said. “You’re a good son, Ben.”\n\n“Don’t tell Dad,” Ben said, but he smiled at his phone.\n\nAt home, they hid the presents under Ben’s bed.\n\nCarol saw them in the hall. “You two look funny. What’s going on?”\n\n“Nothing!” they said at the same time.\n\nCarol raised one eyebrow. Then she smiled. “Okay. I know nothing too.”\n\nIn her room, Hana wrapped the mug in yellow paper. Slowly, carefully, Japanese style.\n\nBen watched. “Whoa. That’s like art. Teach me?”\n\nThey wrapped the book together. It was not perfect. It was a little like a small mountain.\n\n“He’ll love it,” Ben said. “Mountains and all.”\n\n“He’ll love it,” Hana repeated. It was a good phrase for a gift.\n\nThat night, Hana wrote in her notebook: “I’m in! What about this one? He’ll love it.”\n\nSaturday was near. The secret was safe.\n\nBut one question stayed: can Ben and Hana keep a secret for two more days?","glossary":[{"w":"knocked","ja":"ノックした"},{"w":"whispered","ja":"ささやいた"},{"w":"garage","ja":"ガレージ"},{"w":"present","ja":"プレゼント"},{"w":"I’m in","ja":"参加するよ"},{"w":"Tools","ja":"工具"},{"w":"drill","ja":"ドリル"},{"w":"price","ja":"値段"},{"w":"hammers","ja":"ハンマー"},{"w":"work gloves","ja":"作業手袋"},{"w":"mug","ja":"マグカップ"},{"w":"coffee beans","ja":"コーヒー豆"},{"w":"hid","ja":"かくした"},{"w":"raised one eyebrow","ja":"片眉を上げた"},{"w":"wrapped","ja":"包んだ"}],"phrases":[{"en":"Are you in?","ja":"一緒にやる？"},{"en":"I’m in!","ja":"参加する！／やるよ！"},{"en":"What about this one?","ja":"これはどう？"},{"en":"He’ll love it.","ja":"彼、きっと気に入るよ。"},{"en":"What’s going on?","ja":"何かあったの？"}],"quiz":[{"q":"Whose birthday is on Saturday?","c":["Mike’s","Ben’s","Carol’s","Rosa’s"],"a":0},{"q":"Why did they NOT buy the drill?","c":["Mike has one","It cost too much","It was too heavy","The shop was closed"],"a":1},{"q":"How does Ben feel about shopping with Hana?","c":["Bored","Angry","It was fun","Sleepy"],"a":2}],"words":554},{"id":19,"level":1,"emoji":"🎈","theme":"誕生日パーティー","titleEn":"Make a Wish","titleJa":"ろうそくの願いごと","teaser":"マイクの誕生日パーティー当日。手作りケーキにプレゼント、そして乾杯。ハナの目に涙？","story":"Saturday came at last: Mike’s birthday.\n\nAll day, the house had secrets in every corner.\n\nCarol cooked Mike’s favorite dinner. Ben hid the presents in the closet.\n\nAnd Hana baked a cake. A chocolate cake with strawberries from the market.\n\n“It smells amazing,” Ben said. “Can I taste it?”\n\n“At the party,” Hana said. “Hands away, please.”\n\nAt five, Mike came home from the hardware store.\n\n“I’m home!” he called from the door.\n\n“Happy birthday!” everyone shouted. Daisy barked twice.\n\nMike smiled big. “For me? You remembered!”\n\n“Dad. It’s your birthday,” Ben said. “Everyone remembered.”\n\nDinner was Mike’s favorite: meatloaf and mashed potatoes.\n\n“Carol, this is perfect,” Mike said. “Best dinner of the year.”\n\n“Wait for the cake,” Carol said. “Hana made it.”\n\n“You made a cake?” Mike asked. “A real Hana cake?”\n\n“A birthday cake,” Hana said. “Japanese style. Light and soft.”\n\nAfter dinner, presents. Mike opened the mug first.\n\nHe read the words. He laughed for a long time.\n\n“Trust me. I’m a science teacher!” he read. “This is my new favorite thing.”\n\nThen the joke book. Mike opened it and read one joke.\n\n“Why can’t you trust atoms? They make up everything!”\n\n“Dad, no,” Ben said. “Dad, yes,” Mike said.\n\nThen the coffee beans from Bluebird. Mike smelled the bag. “Ahh. The good stuff.”\n\n“From Ben and Hana together,” Carol said. “They shopped in secret.”\n\n“Best team,” Mike said. He gave Ben a hug. He gave Hana a high five.\n\nThen the lights went off. Carol came in with the cake.\n\nSmall candles danced on the chocolate. Everyone sang “Happy Birthday.”\n\nHana sang too. She knew this song. It was the same song in Japan.\n\n“Dad! Make a wish!” Ben said.\n\n“Make a wish?” Hana asked quietly.\n\n“You wish for something good,” Carol said. “Then you blow out the candles. But the wish is secret.”\n\n“In Japan too!” Hana said. “Same, same.”\n\nMike closed his eyes. He thought. Then he blew out all the candles.\n\nEveryone clapped. Daisy barked at the dark.\n\n“Good wish?” Carol asked. Mike smiled and said nothing.\n\nThe cake was soft and light. It went fast.\n\n“Hana, this cake,” Mike said slowly. “This is bakery-level cake.”\n\n“It was my job,” Hana smiled. “Cakes and bread, every day.”\n\n“Rosa is lucky,” Carol said. “And we are lucky too.”\n\nThen Mike stood up with his juice glass.\n\n“A toast!” he said. “To family. To good neighbors. And to Hana — our new family from Japan.”\n\n“To Hana!” everyone said. Glasses touched.\n\nHana’s eyes got warm and wet. Happy tears, small ones.\n\n“Thank you,” she said. “In April, I was a guest. Now… I’m home here.”\n\n“You are,” Carol said softly.\n\nLater, they played cards. Mike lost three times and said his cards were broken.\n\n“The cards are fine, Dad,” Ben said. “You are broken.” Everyone laughed.\n\nAt the end of the night, Mike drank tea from his new mug.\n\n“Best birthday,” he said. “The mug, the jokes, the cake, this family.”\n\n“What was your wish?” Ben asked.\n\n“Secret,” Mike said. He looked at Hana and smiled a little.\n\nIn bed, Hana wrote in her notebook: “Make a wish. A toast. To family!”\n\nOne month in Portland, and her English notebook was almost half full.\n\n“Tomorrow, I call Matsuyama,” she thought. “Mom, Dad, Yui. I have so much to say — in two languages.”","glossary":[{"w":"corner","ja":"すみ・角"},{"w":"closet","ja":"クローゼット"},{"w":"baked","ja":"焼いた"},{"w":"hardware store","ja":"工具店"},{"w":"meatloaf","ja":"ミートローフ"},{"w":"mashed potatoes","ja":"マッシュポテト"},{"w":"atoms","ja":"原子"},{"w":"make up everything","ja":"すべてを作る"},{"w":"candles","ja":"ろうそく"},{"w":"wish","ja":"願いごと"},{"w":"blow out","ja":"吹き消す"},{"w":"clapped","ja":"拍手した"},{"w":"toast","ja":"乾杯"},{"w":"guest","ja":"お客さん"},{"w":"languages","ja":"言語"}],"phrases":[{"en":"Can I taste it?","ja":"味見してもいい？"},{"en":"I’m home!","ja":"ただいま！"},{"en":"Happy birthday!","ja":"誕生日おめでとう！"},{"en":"Make a wish!","ja":"願いごとをして！"},{"en":"A toast!","ja":"乾杯しよう！"}],"quiz":[{"q":"What did Hana make for the party?","c":["Meatloaf","Cookies","Onigiri","A chocolate cake"],"a":3},{"q":"What did Mike open first?","c":["The mug","The joke book","The coffee beans","A card"],"a":0},{"q":"Why do Hana’s eyes get wet at the toast?","c":["The candles hurt her eyes","She feels like family now","She misses the cake","The juice is sour"],"a":1}],"words":558},{"id":20,"level":1,"emoji":"📞","theme":"松山の家族に電話","titleEn":"Sunday Call to Matsuyama","titleJa":"松山への日曜電話","teaser":"初めての長電話は英語の練習つき！妹ユイと「英語オンリー」ルールで1か月の報告会。","story":"On Sunday evening, Hana sat on her bed with her phone.\n\nIn Japan, it was Monday morning. Time for the big call home.\n\nHer mother answered first. Her father waved from behind. Then Yui jumped into the screen.\n\nThey spoke in Japanese first. Fast, warm, easy.\n\nThen Yui said, “Stop! English time! Hana, talk to me in English!”\n\n“You want to practice?” Hana asked in English.\n\n“Yes! I study English at university,” Yui said slowly. “But I have no one to talk to.”\n\n“Okay, little sister. English only,” Hana said. “Ready? Guess what?”\n\n“Guess what? What is that?” Yui asked.\n\n“It means: I have news! You say, ‘What?’” Hana said.\n\n“Okay, okay. What?” Yui laughed.\n\n“I work at a cafe now. A real job, with a blue apron,” Hana said.\n\n“No way!” Yui said. “I know this phrase from a movie!”\n\n“Good phrase!” Hana said. “At the cafe, I carry coffee. I clean tables. I talk to customers.”\n\n“In English? All in English?” Yui asked.\n\n“All in English,” Hana said. “I make mistakes. But people are kind.”\n\nMom put her face near the screen. “Hana! Do you eat well?”\n\n“Yes, Mom. Carol cooks very well,” Hana said. “And I bake. Yesterday, a birthday cake for Mike.”\n\n“A cake!” Mom said. “Send a photo!”\n\nDad’s voice came from behind. “Hana! How is the weather?”\n\n“Rain, sun, rain, sun,” Hana said. “Like a game. But spring here is beautiful.”\n\nThen Hana told them everything. One month of stories.\n\nThe lost streets and the kind stranger. The bus in the rain. The market by the river.\n\nMrs. Chen and Mochi the cat. Daisy and her warm nose. Rosa’s big laugh.\n\n“Your English is fast now,” Yui said. “In April, you were so slow!”\n\n“Thank you, little sister,” Hana laughed.\n\nThen Yui was quiet for a moment.\n\n“Hana. Are you happy there?” she asked.\n\nHana thought about it. The cafe. The Millers. The little blue house next door.\n\n“Yes,” she said. “I’m happy. But I miss you. I miss you all.”\n\n“We miss you too.” Yui’s voice was small now.\n\nMom’s eyes were shiny. Dad looked at the window.\n\n“Eight more months,” Hana said gently. “They go fast. Look — one month is gone!”\n\n“Too fast,” Mom said. “Eat well. Sleep well. Wear warm clothes.”\n\n“Yes, Mom,” Hana said. “You say that every time.”\n\n“Moms say it every time in every country,” Dad said. Everyone laughed.\n\nThen Yui had an idea. “Hana! Every Sunday, English call. You and me. Deal?”\n\n“Deal!” Hana said. “Sunday is our English day.”\n\n“And one day… maybe I can visit you,” Yui said.\n\n“Come in fall!” Hana said. “Portland is famous for fall colors.”\n\nThey talked for one more hour. Two languages, one family.\n\nAt the end, everyone waved at the screen.\n\n“Good night, Hana!” “Good morning, Japan!” It was a funny goodbye between two days.\n\nHana put down the phone. The room was quiet.\n\nShe missed them. But the feeling was warm now, not heavy.\n\nShe opened her notebook and turned the pages. One month of new words, page after page.\n\n“Guess what?” she said to the quiet room. “I can do this.”\n\nOutside, the rain started again, soft on the window.\n\nDaisy pushed the door open and slept by her bed.\n\nNext week was near — and Emma had a fun plan for Friday night: a movie!","glossary":[{"w":"screen","ja":"画面"},{"w":"university","ja":"大学"},{"w":"Guess what?","ja":"聞いて！"},{"w":"news","ja":"知らせ"},{"w":"No way!","ja":"うそでしょ！"},{"w":"phrase","ja":"言い回し"},{"w":"mistakes","ja":"まちがい"},{"w":"weather","ja":"天気"},{"w":"stranger","ja":"知らない人"},{"w":"gently","ja":"やさしく"},{"w":"clothes","ja":"服"},{"w":"Deal?","ja":"約束ね？"},{"w":"fall colors","ja":"紅葉"},{"w":"heavy","ja":"重い"},{"w":"page after page","ja":"何ページも"}],"phrases":[{"en":"Guess what?","ja":"ねえ、聞いて！"},{"en":"No way!","ja":"うそでしょ！／まさか！"},{"en":"I miss you.","ja":"会いたいよ。"},{"en":"We miss you too.","ja":"私たちも会いたいよ。"},{"en":"Deal!","ja":"約束ね！／決まり！"}],"quiz":[{"q":"Who wants to practice English with Hana?","c":["Mom","Dad","Yui","Mike"],"a":2},{"q":"What do Hana and Yui plan?","c":["A trip to Tokyo","A new cake shop","English class at university","An English call every Sunday"],"a":3},{"q":"How does Hana feel after the call?","c":["She misses them, but feels warm","She is angry","She wants to go home now","She is scared of English"],"a":0}],"words":560},{"id":21,"level":1,"emoji":"🎬","theme":"映画に誘われる","titleEn":"Are You Free on Friday?","titleJa":"金曜日、あいてる？","teaser":"エマから初めてのお誘い。時間は？場所は？待ち合わせの英語にドキドキのハナ。","story":"Tuesday afternoon was quiet at Bluebird Cafe.\n\nHana cleaned the tables. Emma made a coffee for the last customer. The sun was warm through the window.\n\n“Hana, come here,” Emma said. “I want to ask you something.”\n\n“Okay. What is it?” Hana asked.\n\n“Are you free on Friday?” Emma smiled. “There is a movie night at the old theater. They show old movies for five dollars.”\n\n“A movie night?” Hana said. “I never went to a movie here.”\n\n“Really? Then you must come! It’s a funny movie about a dog. You love dogs.”\n\nHana laughed. “Yes, I do. What time does it start?”\n\n“At seven. The theater is on Oak Street. It’s near the library.”\n\nHana thought for a moment. She worked on Friday, but only until five. “I finish work at five. So, yes! Sounds fun!”\n\n“Yes!” Emma clapped her hands. “Movie night with Hana!”\n\nLeo looked over from the coffee machine. “A movie? What movie?”\n\n“A funny dog movie,” Emma said. “Do you want to come?”\n\n“I can’t. I play soccer on Friday,” Leo said. “But eat some popcorn for me.”\n\n“Popcorn?” Hana asked. “How do you say… the white corn food at the movies?”\n\n“That’s it! Popcorn,” Leo laughed. “It’s the best part of the movies.”\n\nThat evening, Hana told the Millers at dinner.\n\n“Emma asked me to a movie on Friday,” she said. “My first movie in America!”\n\n“That’s wonderful,” Carol said. “Which theater?”\n\n“The old one on Oak Street.”\n\n“Oh, I love that place,” Mike said. “It’s very old. Like me!”\n\nBen looked up from his phone. “Get the big popcorn. It’s almost the same price as the small one.”\n\n“Thank you, Ben,” Hana laughed.\n\nOn Thursday, Hana and Emma talked at work.\n\n“Where should we meet?” Hana asked.\n\n“Let’s meet in front of the theater,” Emma said. “At six thirty. We can get good seats.”\n\n“Six thirty. In front of the theater,” Hana repeated. She wrote it in her small notebook.\n\nEmma looked at the notebook. “You write everything down. That’s so cute.”\n\n“It helps me,” Hana said. “New words, new places. My notebook is my friend.”\n\n“Hey! I thought I was your friend,” Emma said with a big smile.\n\n“You are my friend too,” Hana said. “My best friend here.”\n\nEmma’s face went a little pink. “Okay, now I’m happy all day. See you then!”\n\nFriday came. Work was busy, but Hana was fast now. At five, Rosa waved her hand.\n\n“Go, go! Enjoy the movie,” Rosa said with her big laugh. “And tell me about it tomorrow.”\n\n“I will. Thank you, Rosa!”\n\nHana went home first. She changed her clothes. She looked in the mirror. Blue shirt or white shirt? She chose the blue one.\n\nDaisy watched her from the door.\n\n“Sorry, Daisy. No dogs at the movies,” Hana said. “But the movie has a dog in it. I can tell you the story later.”\n\nDaisy’s tail went thump, thump.\n\nAt six fifteen, Hana walked to Oak Street. The evening was warm and bright. She saw the theater. It had many small lights and a big sign. It looked like a movie itself.\n\nEmma waved from the door. “Hana! Over here!”\n\n“Hi, Emma!” Hana waved back. Her heart felt light. A movie night, with a friend, in English. Six weeks ago, this was only a dream.\n\n“Ready?” Emma asked.\n\n“Ready!” Hana said.\n\nBut inside, there was a long line for tickets — and the movie started in twenty minutes.","glossary":[{"w":"customer","ja":"お客さん"},{"w":"free","ja":"ひまな"},{"w":"theater","ja":"映画館"},{"w":"clapped","ja":"手をたたいた"},{"w":"popcorn","ja":"ポップコーン"},{"w":"seats","ja":"席"},{"w":"repeated","ja":"くり返した"},{"w":"cute","ja":"かわいい"},{"w":"waved","ja":"手をふった"},{"w":"mirror","ja":"鏡"},{"w":"chose","ja":"選んだ"},{"w":"sign","ja":"看板"},{"w":"line","ja":"行列"}],"phrases":[{"en":"Are you free on Friday?","ja":"金曜日、あいてる？"},{"en":"What time does it start?","ja":"何時に始まるの？"},{"en":"Sounds fun!","ja":"楽しそう！"},{"en":"Where should we meet?","ja":"どこで待ち合わせる？"},{"en":"See you then!","ja":"じゃあそのときにね！"}],"quiz":[{"q":"What is the movie about?","c":["A cat","A school","A dog","Soccer"],"a":2},{"q":"Why can Leo not come?","c":["He plays soccer on Friday","He works late","He does not like movies","He is sick"],"a":0},{"q":"How does Hana feel before the movie?","c":["Sad and tired","Happy and light","Angry","Sleepy"],"a":1}],"words":577},{"id":22,"level":1,"emoji":"🍿","theme":"映画館にて","titleEn":"Two Tickets, Please","titleJa":"チケット2枚ください","teaser":"初めてのアメリカの映画館。チケットにポップコーン、注文の英語は間に合う？","story":"It was Friday night, and Hana stood in the movie theater with Emma.\n\nThe line was long. The movie started in twenty minutes.\n\n“Don’t worry,” Emma said. “The line moves fast.”\n\nEmma was right. Soon they were at the window. A young man smiled at them.\n\nHana smiled and said, “Two tickets, please.”\n\n“For the dog movie?” the man asked.\n\n“Yes, please.”\n\n“That’s ten dollars.”\n\nHana paid. The man gave her two small tickets. “Enjoy the show!”\n\n“Thank you!” Hana said. She looked at the tickets. Her first movie tickets in America. She wanted to keep them forever.\n\nNext, the popcorn. The smell was warm and sweet.\n\n“One large popcorn, please,” Emma said. “And two waters.”\n\nThe popcorn man said, “Here you go.” The popcorn was very big. It was like a mountain.\n\n“Ben was right,” Hana laughed. “The big one is best.”\n\nInside, the theater was dark and cool. The seats were red and soft.\n\nEmma said, “Let’s sit here. In the middle. The best seats.”\n\nThe movie began. It was about a small white dog. The dog was lost in a big city. He looked for his family.\n\nHana understood some words. She did not understand every word. But she understood the story. The dog was sad. Then the dog was brave. The pictures helped her.\n\n“Oh no,” Hana said in a small voice. “The rain. Poor dog.”\n\n“He’s okay, he’s okay,” Emma said in a small voice too.\n\nA woman behind them laughed at a funny part. Everyone laughed together. Hana laughed too. Laughing together felt good. It needed no words.\n\nNear the end, the dog found his family. The music was big and warm. Hana’s eyes were wet.\n\nEmma looked at her. “Are you crying?”\n\n“A little,” Hana said. “The dog is like me. Far from home. But he found his people.”\n\nEmma’s eyes were wet too. “Okay, now I’m crying.”\n\nThey walked out into the night. The street lights were bright. The air was cool and fresh.\n\n“So,” Emma asked. “What did you think?”\n\nHana said, “I loved it. The dog was so brave. And the popcorn was so big.”\n\nEmma laughed. “We didn’t finish it. Look.”\n\nShe held up the popcorn. It was still half full.\n\n“Breakfast?” Hana said.\n\n“Hana!” Emma laughed loudly. “You’re funny in English now. That’s new.”\n\nHana smiled. It was true. Little jokes came out now. Small ones. But they came out in English.\n\nThey walked to the corner and talked about the movie. The best part. The sad part. The funny cat in the window.\n\n“Movies are good for my English,” Hana said. “I want to watch more.”\n\n“Then let’s do this every month,” Emma said. “Movie friends.”\n\n“Movie friends,” Hana repeated. She liked those words.\n\nAt home, the house was quiet. Daisy waited at the door.\n\n“Daisy,” Hana said softly. “The movie had a dog. He was lost. But at the end, he was home. It was a happy end.”\n\nDaisy put her head on Hana’s knee.\n\nHana put the two tickets in her notebook. Next to them, she wrote: “My first movie in America. I cried. I laughed. I understood.”\n\nThen her phone made a small sound. It was a message from Emma. It said: “omg that dog!! 🐶 lol”\n\nHana read it three times. Omg? Lol? What did those little words mean?","glossary":[{"w":"line","ja":"行列"},{"w":"tickets","ja":"チケット"},{"w":"paid","ja":"払った"},{"w":"forever","ja":"ずっと"},{"w":"smell","ja":"におい"},{"w":"dark","ja":"暗い"},{"w":"lost","ja":"迷子の"},{"w":"brave","ja":"勇かんな"},{"w":"wet","ja":"ぬれた"},{"w":"fresh","ja":"さわやかな"},{"w":"half full","ja":"半分残った"},{"w":"softly","ja":"小さな声で"},{"w":"understood","ja":"わかった"}],"phrases":[{"en":"Two tickets, please.","ja":"チケット2枚ください。"},{"en":"Here you go.","ja":"はい、どうぞ。"},{"en":"Let’s sit here.","ja":"ここに座ろう。"},{"en":"What did you think?","ja":"どうだった？"},{"en":"I loved it.","ja":"すごくよかった。"}],"quiz":[{"q":"How much were the two tickets?","c":["Five dollars","Ten dollars","Twenty dollars","Two dollars"],"a":1},{"q":"What was the movie about?","c":["A big city cat","A funny family","A brave man","A lost dog"],"a":3},{"q":"Why did Hana cry at the movie?","c":["The dog was like her, far from home","The popcorn was gone","She was tired","The theater was dark"],"a":0}],"words":556},{"id":23,"level":1,"emoji":"💬","theme":"英語のメッセージ入門","titleEn":"What Does “lol” Mean?","titleJa":"「lol」ってどういう意味？","teaser":"エマからの謎のメッセージ「omg」「lol」。レオ先生のメッセージ英語講座が開講！","story":"It was Saturday morning, and Hana had a question in her pocket.\n\nAt the cafe, she showed her phone to Leo and Emma. “Look. Emma’s message. What does that mean? This ‘omg’. This ‘lol’.”\n\nLeo laughed his big laugh. “Class is open! Sit down, Hana. Today I teach message English.”\n\n“Message English?” Hana asked.\n\n“Yes. Phone words. Fast and short,” Leo said. “First: omg. It means ‘oh my god’. You are surprised. You write omg.”\n\n“O-m-g,” Hana said slowly. “Oh my god. Got it.”\n\n“Next: lol. It means ‘laughing out loud’. Something is funny. You write lol.”\n\n“So Emma laughed at the dog?” Hana asked.\n\n“Yes!” Emma said. “The dog was funny and cute. So: omg, lol.”\n\nHana wrote the words in her notebook. Leo looked at the notebook and smiled.\n\n“More class,” he said. “‘See u’ means ‘see you’. The letter u! And ‘thx’ means ‘thanks’.”\n\n“English has short English inside it,” Hana said. “Two languages!”\n\n“And this one is important,” Emma said. “‘np’ or ‘no worries’. Someone says thank you or sorry. You answer: No worries. It means ‘it’s okay, no problem’.”\n\n“No worries,” Hana repeated. “I like it. It sounds kind.”\n\nRosa came from the kitchen with muffins. “What is this school in my cafe?”\n\n“Message English, Rosa!” Leo said. “Do you want to learn?”\n\n“Ha! I write full words, like a queen,” Rosa laughed. “But muffins for the students.”\n\nThe muffins were warm, and the students ate them fast.\n\nAt lunch time, Emma made a group on Hana’s phone. “Look. You, me, and Leo. A group chat. Cafe friends.”\n\nHana’s phone made a sound. The first message was from Leo: “hi hana! welcome 🎉”\n\nHana thought hard. Then she wrote her first group message: “hi! thx 😊”\n\n“Omg,” Emma said. “Perfect message English. lol.”\n\nAll day, Hana’s phone made little sounds. It was fun. Leo sent a funny cat picture. Emma sent a photo of a muffin. Hana sent a photo of Daisy.\n\nLeo wrote: “omg cute dog!!”\n\nHana wrote back: “she is old but sweet lol”\n\nAt dinner, Hana showed the group chat to Ben. “Ben, look. I text in English now.”\n\nBen read the messages. He nodded slowly. “Not bad. But too many periods. Young people don’t use them.”\n\n“No periods?” Hana asked. “Why?”\n\n“Periods look… serious,” Ben said. “Like you’re angry.”\n\n“English is difficult in new ways,” Hana laughed.\n\nCarol shook her head. “I use periods. I am a period person.”\n\n“Mom, you text like a teacher,” Ben said.\n\n“Thank you,” Carol said, and everyone laughed.\n\nBefore bed, Hana sent a message to Yui in Japan. She wrote it in English, for practice: “hi yui! i went to a movie. i have a group chat now. omg my life is busy lol”\n\nYui wrote back fast: “omg!! who is this cool person?? lol. good night, big sister.”\n\nHana smiled at her phone. Then one more message came. It was from Emma, in the group chat.\n\n“Work together tomorrow! See you tomorrow. 🌞”\n\nHana wrote: “see u tomorrow! good night ⭐”\n\nLeo wrote: “np students sleep well lol”\n\nHana put down the phone and smiled at the dark room. Little words, little sounds, little friends in her pocket. Her world here was getting bigger, one small word at a time.\n\nShe looked at the quiet house and said, “Good night.”\n\nBut tomorrow was not a quiet day. Tomorrow was Ben’s big basketball game.","glossary":[{"w":"message","ja":"メッセージ"},{"w":"surprised","ja":"おどろいた"},{"w":"laughing out loud","ja":"大笑い"},{"w":"languages","ja":"言語"},{"w":"important","ja":"大切な"},{"w":"group chat","ja":"グループチャット"},{"w":"sent","ja":"送った"},{"w":"text","ja":"メッセージを送る"},{"w":"nodded","ja":"うなずいた"},{"w":"periods","ja":"ピリオド"},{"w":"serious","ja":"まじめな"},{"w":"practice","ja":"練習"},{"w":"pocket","ja":"ポケット"}],"phrases":[{"en":"What does that mean?","ja":"それどういう意味？"},{"en":"Got it.","ja":"わかった。"},{"en":"No worries.","ja":"気にしないで。"},{"en":"See you tomorrow.","ja":"また明日ね。"},{"en":"Good night.","ja":"おやすみなさい。"}],"quiz":[{"q":"What does “lol” mean?","c":["Laughing out loud","A little dog","See you","Thank you"],"a":0},{"q":"Who made the group chat?","c":["Leo","Rosa","Emma","Ben"],"a":2},{"q":"Why does Ben say “no periods”?","c":["Periods are slow","Periods are new","Periods are cute","Periods look serious or angry"],"a":3}],"words":569},{"id":24,"level":1,"emoji":"🏀","theme":"ベンの試合を応援","titleEn":"Go, Ben, Go!","titleJa":"がんばれ、ベン！","teaser":"初めてのバスケ観戦。ルールはわからなくても、応援の英語なら任せて！","story":"It was Sunday, and the Miller house was loud and fast.\n\n“Ben! Your shoes!” Carol called.\n\n“Got them!” Ben ran down the stairs. Today was his big basketball game.\n\nHana never watched a basketball game before. “Mike, I don’t know the rules,” she said in the car.\n\n“No problem,” Mike said. “Rule one: the ball goes in the basket. Rule two: we shout a lot. That’s it.”\n\n“I can do rule two,” Hana laughed.\n\nThe school gym was big and bright. Many families sat together. The sound was like the ocean.\n\nThe game started. Ben’s team wore blue. The other team wore red. The ball went fast. Up, down, up, down.\n\nBen got the ball. He jumped. The ball flew — and went in!\n\n“Nice shot!” Mike shouted.\n\n“Nice shot!” Hana shouted too. Her voice was big. It surprised her.\n\nCarol laughed. “Hana, you’re a natural.”\n\nThe red team was good too. Soon it was 20 to 20. Then 30 to 28. The game was close.\n\n“Go, Ben!” Hana called. “Go, blue team!”\n\nA woman next to Hana smiled. “Which one is yours?”\n\n“Number seven,” Hana said. “Ben. I live with his family. I’m from Japan.”\n\n“Welcome! Number ten is mine,” the woman said. “I’m Kate. This game is so exciting, right?”\n\n“Yes! My heart is running too,” Hana said, and Kate laughed warmly.\n\nIn the second half, something bad happened. Ben fell down. The gym went quiet. Carol stood up fast. She was a nurse, always.\n\nBut Ben got up slowly. He smiled and waved to his mom.\n\n“Are you okay?” Carol called.\n\nBen put his thumb up. The gym clapped.\n\n“He’s okay. He’s strong,” Mike said. But his hands were tight.\n\nThe last minutes came. The red team was up, 48 to 46. One minute on the clock. Hana could not sit.\n\n“Don’t give up!” she shouted.\n\nBen ran fast. A friend passed the ball to him. Three seconds. Two. Ben jumped and — swish!\n\n48 to 48! And then a blue player took the ball, ran, and scored again. The buzzer rang. 50 to 48. Blue team won!\n\nThe gym exploded. Mike jumped. Carol jumped. Hana jumped and shouted words — some English, some Japanese, all happy.\n\nAfter the game, Ben came over. His face was red and wet and smiling.\n\nHana held up her hand for a high five. “Good game. Number seven was the star.”\n\n“Thanks,” Ben smiled. “I heard you, you know. ‘Don’t give up!’ Loud and clear.”\n\n“Really? I was loud?”\n\n“The whole gym heard you,” Ben laughed. “It helped.”\n\nThey ate pizza on the way home. Ben told the story of the last shot three times. Each time, the shot got bigger.\n\n“In the last story, you fly,” Mike said. “Like a bird.”\n\n“Dad, I did fly,” Ben said, and everyone laughed.\n\nAt home, Hana wrote in her notebook: “Nice shot. Good game. Don’t give up.” Then she wrote one more line: “Today I shouted in English. I didn’t think. I just shouted. Maybe English lives in me a little now.”\n\nDaisy slept by her feet, tired from nothing.\n\nHana felt happy but also a little quiet inside. The gym was full of families today. And her family was far away. She missed them.\n\nSome nights are like that — and the next evening, that quiet feeling grew bigger.","glossary":[{"w":"rules","ja":"ルール"},{"w":"basket","ja":"ゴール"},{"w":"shout","ja":"さけぶ"},{"w":"gym","ja":"体育館"},{"w":"flew","ja":"飛んだ"},{"w":"natural","ja":"天性の人"},{"w":"close","ja":"接戦の"},{"w":"exciting","ja":"ワクワクする"},{"w":"fell down","ja":"転んだ"},{"w":"thumb","ja":"親指"},{"w":"scored","ja":"得点した"},{"w":"buzzer","ja":"ブザー"},{"w":"won","ja":"勝った"},{"w":"missed","ja":"恋しかった"}],"phrases":[{"en":"Nice shot!","ja":"ナイスシュート！"},{"en":"Go, Ben!","ja":"がんばれ、ベン！"},{"en":"Are you okay?","ja":"だいじょうぶ？"},{"en":"Don’t give up!","ja":"あきらめないで！"},{"en":"Good game.","ja":"いい試合だったね。"}],"quiz":[{"q":"What color did Ben's team wear?","c":["Red","Green","White","Blue"],"a":3},{"q":"What was the final score?","c":["48 to 46","50 to 48","20 to 20","30 to 28"],"a":1},{"q":"Why does Hana feel a little quiet at the end?","c":["The game was boring","Ben was angry","She misses her family","She was sleepy"],"a":2}],"words":557},{"id":25,"level":1,"emoji":"😢","theme":"ホームシックの夜","titleEn":"A Little Rain Inside","titleJa":"心に降る小さな雨","teaser":"楽しい毎日のはずなのに、今夜は涙が止まらない。キャロルの温かいお茶と言葉。","story":"It was a rainy Monday evening, almost two months after Hana came to Portland.\n\nDinner was good. The family talked and laughed. But Hana was quiet. Her smile was small and tired.\n\nAfter dinner, she helped with the dishes. Then she went to her room early.\n\n“Good night,” she said softly.\n\nIn her room, she looked at her phone. There was a photo from her mother. It was Sunday dinner in Matsuyama. Her mother, her father, Yui, and grandmother. Curry rice and smiles. Everyone was there. Everyone but Hana.\n\nSomething warm came up in her chest. Then tears came. Many tears.\n\nThere was a soft sound at the door. It was Carol, with two cups of tea.\n\n“Hana? I made too much tea,” Carol said gently. “Do you want to talk?”\n\nHana wiped her eyes fast. “I’m okay. Sorry.”\n\n“You don’t look okay, sweetheart. And that’s all right.” Carol sat on the chair by the desk. She waited. She did not push.\n\nHana looked at the photo again. Then the words came out, small and slow.\n\n“I miss my family. I miss my mother’s food. I miss my sister’s loud voice. I miss my small town. Tonight, I miss everything.”\n\n“Of course you do,” Carol said. “You are far from home. Missing them means you love them.”\n\n“But every day here is good,” Hana said. “The cafe, the movies, this house. So why am I sad? I don’t understand my heart.”\n\nCarol smiled softly. “A heart can hold two things. Happy here. Sad for home. Both are true. Both are okay.”\n\nHana’s tears came again. “I feel a little broken.”\n\n“You’re not broken. You’re brave,” Carol said. “It’s okay to cry. Tears are like rain. After rain, things grow.”\n\nHana drank the warm tea. It was sweet, with honey. They sat together and listened to the real rain outside.\n\n“Carol, were you homesick one time?” Hana asked.\n\n“Oh yes. I was a young nurse in a new city. I cried in the hospital bathroom,” Carol laughed a little. “Then an older nurse gave me a cookie. She said, ‘Eat first. Cry after. Cookies first, always.’”\n\nHana laughed through her tears. “Cookies first. That is good medicine.”\n\n“The best medicine,” Carol said. “Wait here.”\n\nShe came back with two cookies and Daisy. Daisy put her big head on Hana’s knee. Her eyes said, I am here.\n\nHana ate a cookie. She drank her tea. She cried a little more, and that was okay too.\n\n“Call your mother,” Carol said. “Not tomorrow. Now. Hear her voice.”\n\nHana called. Her mother answered fast. “Hana-chan!” Her voice was warm like tea. They talked for a long time. Hana laughed. Her mother laughed. It was morning in Japan, and her mother was cooking rice.\n\nAfter the call, Hana came down. Carol was reading on the sofa.\n\nHana said, “I feel better now. Thank you for listening.”\n\n“Any time. That’s what family does,” Carol said. “And Hana — you are family here too.”\n\nHana hugged her. It was her first big hug in America. It felt like home. A second home.\n\nThat night, Hana wrote in her notebook: “Sad is okay. Crying is okay. I have two homes now. My heart is big enough.”\n\nShe slept deeply. And the next day at the cafe, Leo looked at her and said, “Hana! You need my special class. Today I teach you fun English!”","glossary":[{"w":"dishes","ja":"食器"},{"w":"grandmother","ja":"祖母"},{"w":"chest","ja":"胸"},{"w":"tears","ja":"涙"},{"w":"gently","ja":"やさしく"},{"w":"wiped","ja":"ふいた"},{"w":"sweetheart","ja":"あなた(愛称)"},{"w":"push","ja":"無理強いする"},{"w":"broken","ja":"こわれた"},{"w":"honey","ja":"はちみつ"},{"w":"homesick","ja":"ホームシック"},{"w":"medicine","ja":"薬"},{"w":"hugged","ja":"抱きしめた"},{"w":"deeply","ja":"ぐっすり"}],"phrases":[{"en":"Do you want to talk?","ja":"話したいことある？"},{"en":"I miss my family.","ja":"家族が恋しい。"},{"en":"It’s okay to cry.","ja":"泣いてもいいんだよ。"},{"en":"I feel better now.","ja":"もう大丈夫、楽になった。"},{"en":"Thank you for listening.","ja":"聞いてくれてありがとう。"}],"quiz":[{"q":"What made Hana cry?","c":["A sad movie","A photo of her family's dinner","A hard day at work","The rain outside"],"a":1},{"q":"What did Carol bring first?","c":["Two cups of tea","Cookies","Daisy","A blanket"],"a":0},{"q":"What does Carol mean by “tears are like rain”?","c":["Tears are cold","Tears come in the evening","Crying is bad for you","After crying, we can grow"],"a":3}],"words":566},{"id":26,"level":2,"emoji":"🎧","theme":"レオのスラング講座","titleEn":"Leo's Cool English Class","titleJa":"レオ先生のクールな英語教室","teaser":"教科書には載っていない英語がある！レオ先生の楽しいカジュアル英語講座、開講。","story":"Tuesday was slow at Bluebird Cafe, and Leo had a plan.\n\nThe morning rush was over. Rosa was in the kitchen, and only two customers sat by the window.\n\n“Hana,” Leo said. “Yesterday I promised you a special class. Are you ready?”\n\n“Ready for what?” Hana asked.\n\n“Cool English! Real English!” Leo stood tall like a teacher. “Your English is good. But it’s a little… polite. Like a textbook that walks and talks.”\n\nEmma laughed from the counter. “He’s right. You say, ‘Hello, how are you today?’ Nobody under thirty says that.”\n\n“What do you say then?” Hana asked.\n\n“Lesson one!” Leo said. “We say, ‘What’s up?’ It means hello, how are you, what is new — all in two words.”\n\n“What’s up?” Hana repeated carefully.\n\n“Good! And the answer is easy. You say, ‘Not much.’ Because usually, nothing big is happening.”\n\n“What’s up?” Emma asked her.\n\n“Not much,” Hana answered, and it felt like a secret code.\n\n“Lesson two,” Leo said. “When something surprises you, say, ‘No way!’ It means ‘I can’t believe it!’ Watch. Emma, tell me something surprising.”\n\nEmma thought. “Rosa was a rock singer when she was young.”\n\n“No way!” Leo shouted.\n\n“Way,” Rosa called from the kitchen. “I had purple hair, too.”\n\n“No way!” Hana said — and everyone laughed, because she said it perfectly.\n\n“Lesson three is my favorite,” Leo said. “‘Hang out.’ It means to spend easy time with friends. No plan. Just time together.”\n\n“Like the movie night with Emma?” Hana asked.\n\n“A movie is a plan, so that’s close,” Leo said. “But when you sit in the park and talk about nothing? That’s hanging out.”\n\n“In Japan, we also love time about nothing,” Hana smiled. “Do you want to hang out?”\n\n“Perfect sentence!” Leo clapped. “Yes, I do. Saturday. The park. All of us.”\n\nA customer came in — a tall man in a bike helmet. Leo winked at Hana. “Practice time.”\n\nHana took a small breath. “Hi! What’s up?”\n\n“Not much,” the man smiled. “Just riding around. Could I get a large iced coffee?”\n\nHana made the coffee and gave it to him. “Here you go. Have a good ride!”\n\nThe man smiled back at her. “Thanks! Take it easy.” Then he walked out with his coffee.\n\nHana turned around slowly. “Take it easy? Does he want me to rest? Am I working too hard?”\n\nLeo fell on the counter laughing. “No, no! ‘Take it easy’ is just a friendly goodbye. It means relax, have a nice day.”\n\n“English is full of hidden doors,” Hana said, shaking her head. She wrote everything in her notebook: what’s up, not much, no way, hang out, take it easy. The new words looked happy on the page, like little fish in a pond.\n\nEmma looked at the list. “Add this one: ‘awesome.’ When something is very good, we say, ‘That’s awesome!’”\n\n“Awesome,” Hana repeated. “The sound is strong. Aw-some. I like it.”\n\nAll afternoon, they practiced. When Rosa made a beautiful sandwich, Hana said, “That’s awesome!” When Emma dropped a spoon and caught it, Leo shouted, “Awesome catch!” When the sun came out, everything was awesome.\n\nRosa brought out four small lemonades. “Class break,” she said. “When I came to this country, I learned polite English first, too. Cool English came later, when I found my people. You’re finding your people, Hana.”\n\nHana looked at Rosa, Emma, and Leo. Her chest felt warm. “I think you’re right,” she said quietly.\n\nThat evening at dinner, Hana tried her new English on Ben.\n\n“Ben. What’s up?”\n\nBen’s head came up from his phone. His eyes were wide. “Whoa. Who taught you that?”\n\n“Leo. Today I learned cool English. No way, hang out, take it easy.”\n\n“That’s awesome,” Ben said, and he really smiled. “Okay, one more. When you agree with someone, say, ‘Same.’ Just one word.”\n\n“Same?” Hana asked.\n\n“Like this. I’m tired today,” Ben said.\n\n“Same,” Hana answered.\n\n“You’re a fast learner,” Ben laughed. “My friends will love you.”\n\nMike looked at Carol. “When did our dinner table become a classroom?”\n\n“It was always a classroom, dear,” Carol said. “You teach bad puns every night.”\n\n“And nobody graduates,” Ben said, and even Mike laughed.\n\nBefore bed, Hana looked at her notebook. It was getting full. Textbook English on the left pages, cool English on the right. Two Englishes, one notebook.\n\nOn Saturday, she was going to hang out at the park with her friends. But first, tomorrow she had a different plan with Emma — a small mountain of laundry and a place called a laundromat.","glossary":[{"w":"rush","ja":"混雑時間"},{"w":"promised","ja":"約束した"},{"w":"polite","ja":"ていねいな"},{"w":"textbook","ja":"教科書"},{"w":"secret code","ja":"秘密の暗号"},{"w":"surprising","ja":"おどろきの"},{"w":"hang out","ja":"気楽に過ごす"},{"w":"winked","ja":"ウインクした"},{"w":"hidden","ja":"かくれた"},{"w":"awesome","ja":"最高の"},{"w":"practiced","ja":"練習した"},{"w":"agree","ja":"同意する"},{"w":"graduates","ja":"卒業する"},{"w":"laundromat","ja":"コインランドリー"}],"phrases":[{"en":"What’s up?","ja":"よう、元気？／最近どう？"},{"en":"No way!","ja":"うそでしょ！／信じられない！"},{"en":"Do you want to hang out?","ja":"一緒に遊ばない？"},{"en":"Take it easy.","ja":"じゃあね、気楽にね。"},{"en":"That’s awesome!","ja":"それ最高だね！"}],"quiz":[{"q":"What is the easy answer to “What's up?”","c":["No way","Take it easy","Not much","Same"],"a":2},{"q":"What was Rosa when she was young?","c":["A nurse","A teacher","A baker","A rock singer"],"a":3},{"q":"Why did Hana think “Take it easy” was strange?","c":["She thought the man told her to rest","The man said it angrily","It was very long","It was in Portuguese"],"a":0}],"words":762},{"id":27,"level":2,"emoji":"🧺","theme":"コインランドリー入門","titleEn":"Forty Minutes of Bubbles","titleJa":"泡と40分間","teaser":"巨大な洗濯機にコインを入れて…動かない！？待ち時間のおしゃべりが心に残る回。","story":"It was Wednesday afternoon, and Hana was carrying a big blue bag of laundry.\n\nThe Millers’ washing machine was broken. Mike looked at it for one hour with his tools. Then he said, “I will fix you,” to the machine, like it was a person.\n\n“Until Dad wins that fight, we use the laundromat,” Ben said.\n\nSo Emma took Hana to Sunny Suds, the laundromat near the cafe. It was warm inside and smelled like clean clothes. Big machines stood in lines. Some machines turned round and round with a soft sound.\n\n“Welcome to laundry school,” Emma said. “First, we need coins. The machines only eat quarters.”\n\n“Quarters?” Hana asked.\n\n“Twenty-five cent coins. Look, there’s a change machine. Put in a dollar bill, and you get four quarters back.”\n\nHana fed a five-dollar bill into the machine. It made a happy sound, and twenty quarters fell out like a small waterfall.\n\n“I feel rich,” Hana laughed, holding the heavy coins.\n\nThey found an empty washer. It was huge — bigger than the machines in Japan.\n\n“How does this work?” Hana asked.\n\n“Easy. Clothes in. Soap in this little box. Close the door. Coins in. Then push start,” Emma said. “The washer does the thinking.”\n\nHana put in her clothes and the soap. She put in six quarters, one by one. Then she pushed the big green button.\n\nNothing happened.\n\nShe pushed it again. Nothing.\n\n“Oh no. Is it broken? Or did I break it?” Hana said.\n\nAn older man at the next machine looked over. “That one is a little sleepy,” he said. “Close the door hard. It likes a strong hello.”\n\nHana closed the door hard. The machine woke up with a loud hum. Water started to run.\n\n“Thank you!” Hana said.\n\n“No worries. We all fight that machine,” the man smiled. “You won on day one. It took me a month.”\n\nHana laughed. Every place had its small secrets, and people shared them.\n\n“Now what?” she asked Emma.\n\n“Now, the best part of the laundromat. It takes forty minutes. So we sit, we snack, and we talk about everything.”\n\nThey sat on plastic chairs by the window. Emma bought two juices from the old machine in the corner. The washers hummed. The afternoon sun came through the glass.\n\n“In Japan, I did laundry alone at home,” Hana said. “This is different. It’s like a small town square, but with bubbles.”\n\n“That’s exactly it,” Emma said. “I come here when I want to think. Or when I don’t want to think.”\n\nEmma pointed at her sketchbook. “I drew half of my art school project here. Watching the machines helps my brain.”\n\nShe opened the sketchbook. There were drawings of the laundromat: the old man, the coin waterfall, a child sleeping on a laundry bag.\n\n“Emma, these are awesome,” Hana said slowly. “You see small things that people don’t see.”\n\nEmma looked shy for one second — a rare thing. “Thanks. Sometimes I worry that art school was a crazy choice. My parents wanted me to study business.”\n\n“Why did you choose art?” Hana asked.\n\n“Because when I draw, I feel like me,” Emma said. “Does that make sense?”\n\nHana nodded. “It makes perfect sense. When I bake bread, I feel like me. Flour on my hands, warm smell in the air. That’s my drawing.”\n\nEmma smiled. “Then we’re the same kind of person. Different tools.”\n\nThe washer sang a little song. Their forty minutes were done. They moved the wet clothes into a dryer, and Hana fed it more quarters.\n\n“The dryer takes forty minutes too,” Emma said. “More talking time.”\n\nSo they talked about everything and nothing. Matsuyama and Portland. Best breads and worst colors. Emma laughed loudly at Hana’s story about Mike and the broken washer. “He talks to machines! That’s so Mike.”\n\nWhen the dryer opened, the clothes were warm like fresh toast. Hana held a warm towel to her face.\n\n“Why is this so nice?” she said. “Forty minutes of waiting, but I didn’t wait at all.”\n\n“That’s laundromat magic,” Emma said. “Time moves differently when you’re with a friend.”\n\nThey folded the clothes together, fast and neat. The older man waved goodbye. “See you next week, machine fighter!”\n\nOn the walk home, the blue bag felt lighter. Maybe clean clothes were lighter. Maybe it was something else.\n\nAt dinner, Mike stood proudly by the washing machine. “I fixed it! We don’t need the laundromat anymore.”\n\nHana was happy about the machine. But a small part of her was a little sad, because she liked Sunny Suds.\n\n“We can still go sometimes,” Emma texted her that night. “Talking time. No machines needed.”\n\nHana smiled and started planning her Thursday. She wanted to visit the library — because she was finally ready for her first English book.","glossary":[{"w":"laundry","ja":"洗濯物"},{"w":"broken","ja":"こわれた"},{"w":"laundromat","ja":"コインランドリー"},{"w":"quarters","ja":"25セント硬貨"},{"w":"change machine","ja":"両替機"},{"w":"bill","ja":"紙幣"},{"w":"washer","ja":"洗濯機"},{"w":"soap","ja":"洗剤"},{"w":"hum","ja":"うなり音"},{"w":"town square","ja":"町の広場"},{"w":"sketchbook","ja":"スケッチ帳"},{"w":"rare","ja":"めずらしい"},{"w":"dryer","ja":"乾燥機"},{"w":"folded","ja":"たたんだ"}],"phrases":[{"en":"How does this work?","ja":"これ、どう使うの？"},{"en":"It takes forty minutes.","ja":"40分かかるよ。"},{"en":"Now what?","ja":"次はどうする？"},{"en":"Does that make sense?","ja":"意味わかるかな？／伝わってる？"},{"en":"It makes perfect sense.","ja":"すごくよくわかるよ。"}],"quiz":[{"q":"What coins do the machines take?","c":["Quarters","Pennies","Dollar bills","Ten-cent coins"],"a":0},{"q":"How did Hana start the sleepy washer?","c":["She hit the button ten times","She closed the door hard","She called Mike","She used more coins"],"a":1},{"q":"Why did Emma choose art school?","c":["Her parents chose it","It was near her house","When she draws, she feels like herself","Business school was full"],"a":2}],"words":801},{"id":28,"level":2,"emoji":"📚","theme":"図書館カードを作る","titleEn":"A Card to a Thousand Worlds","titleJa":"千の世界へのカード","teaser":"図書館カードを作りに、いざカウンターへ。人生初の「英語の本」選びも始まる！","story":"It was Thursday morning, Hana’s day off, and the sky over Portland was soft gray.\n\nHana stood in front of the public library. It was a beautiful old building with wide stone steps. She remembered her first bus ride here in April. That day, she was too nervous to go inside. Today was different.\n\nInside, the library was quiet and warm. The ceiling was high. Sunlight fell on long wooden tables. People read everywhere — old people, students, a mother with a sleeping baby.\n\nHana walked to the front desk. A woman with round glasses smiled at her. Her name tag said “Ruth.”\n\n“Good morning! How can I help you?” Ruth asked in a soft library voice.\n\nHana answered in a soft voice too. “Good morning. I’d like to make a card.”\n\n“Wonderful! A library card is free. Do you live in Portland?”\n\n“Yes. I live with a host family. I’m from Japan, and I’m here for nine months.”\n\n“Then you can get a card, no problem,” Ruth said. “I just need your name, your address, and something that shows the address. A letter is fine.”\n\nHana was ready. Carol helped her prepare last night. She showed a letter from her English program with the Millers’ address on it.\n\nRuth typed for a minute. Then she gave Hana a green card with a picture of a bridge on it.\n\n“Welcome to the library, Hana. You can borrow ten books at one time, for three weeks.”\n\n“Ten books!” Hana said, a little loudly. Two readers looked up. “Sorry,” she said in a tiny voice, and Ruth laughed quietly.\n\n“Everyone does that on day one,” Ruth said. “Now, are you looking for something today?”\n\n“Yes. I want to read my first book in English. But real books look… heavy. Is there an easy way to start?”\n\nRuth smiled. “Follow me. I have a secret corner that I show only to my favorite people.”\n\nThey walked past tall shelves to a bright corner with a sign: “Easy Readers — Adults.”\n\n“These books use simple English, but the stories are for adults,” Ruth explained. “Short chapters. Many people start here when English is their second language.”\n\nHana touched the books slowly. Mystery stories. Travel stories. A love story in Paris. A story about a chef.\n\n“How do I choose?” she asked.\n\n“Open a book and read the first page,” Ruth said. “If you understand most of it, and you want page two — that’s your book.”\n\nHana tried one book about space. Too hard. She tried a mystery. The first page was okay, but her heart said no. Then she found a small blue book: “The Bread Thief.” It was about a baker in a small town. Someone was stealing bread every morning.\n\nShe read the first page and smiled. She understood it. And she really wanted page two.\n\n“This one,” she said. “It’s about a baker. I was a baker in Japan!”\n\n“Then that book was waiting for you,” Ruth said.\n\nHana also chose a picture book about dogs for fun. She carried the two books to the desk like small treasures.\n\n“Can I borrow this?” she asked, showing her new card.\n\n“You can borrow both,” Ruth smiled. She scanned the books. “Due June eighteenth. If you need more time, you can renew online.”\n\nHana held the card with two hands. “Thank you so much.”\n\n“One more thing,” Ruth said. “We have a book club that reads easy books together. It meets in July. Think about it — you’ll make friends.”\n\nA book club sounded scary and interesting at the same time. Hana put the paper in her bag.\n\nShe did not go home. She found a seat by the tall window, opened “The Bread Thief,” and began to read. Slowly at first. Then something happened: she forgot that she was reading English. She was just… reading. A baker, a small town, missing bread. Who was the thief?\n\nWhen she looked up, one hour was gone. Her phone showed three messages from the group chat, but the library was still quiet and golden.\n\nThat evening, she read more at home, with Daisy’s head on her feet. She used her notebook for new words: thief, flour sack, footprint.\n\n“Good book?” Mike asked.\n\n“I can’t stop,” Hana said. “Someone is stealing the bread, and I have three ideas about who.”\n\n“A mystery reader is born,” Carol said. “Welcome to the club. I read one every week.”\n\n“When you finish, tell me the answer,” Ben said. “Books are long.”\n\n“No spoilers in this house!” Mike said.\n\nHana laughed and turned the page. Her first English book, and it felt like a door — a door to a thousand worlds.\n\nBut this weekend, a different door was waiting: a bike shop, a helmet, and a river path with Emma and Leo.","glossary":[{"w":"public library","ja":"公立図書館"},{"w":"stone steps","ja":"石段"},{"w":"ceiling","ja":"天井"},{"w":"name tag","ja":"名札"},{"w":"address","ja":"住所"},{"w":"borrow","ja":"借りる"},{"w":"shelves","ja":"本棚"},{"w":"chapters","ja":"章"},{"w":"mystery","ja":"ミステリー"},{"w":"stealing","ja":"盗んでいる"},{"w":"treasures","ja":"宝物"},{"w":"due","ja":"返却期限"},{"w":"renew","ja":"延長する"},{"w":"thief","ja":"どろぼう"},{"w":"spoilers","ja":"ネタバレ"}],"phrases":[{"en":"How can I help you?","ja":"ご用件は？／いらっしゃいませ。"},{"en":"I’d like to make a card.","ja":"カードを作りたいのですが。"},{"en":"Can I borrow this?","ja":"これ、借りられますか？"},{"en":"Follow me.","ja":"ついて来て。"},{"en":"Thank you so much.","ja":"本当にありがとうございます。"}],"quiz":[{"q":"How many books can Hana borrow at one time?","c":["Two","Three","Five","Ten"],"a":3},{"q":"What is “The Bread Thief” about?","c":["A baker and missing bread","A dog in space","A chef in Paris","A bridge in Portland"],"a":0},{"q":"Why did Hana choose that book?","c":["It was the shortest book","She was a baker, and she wanted page two","Ruth chose it for her","It had many pictures"],"a":1}],"words":804},{"id":29,"level":2,"emoji":"🚲","theme":"自転車を借りる","titleEn":"Wind by the River","titleJa":"川ぞいの風","teaser":"週末は自転車で川へ！レンタルの英語、安全ルール、そして小さな冒険が待っている。","story":"Saturday morning was bright and perfect for a small adventure.\n\nHana, Emma, and Leo met in front of Pedal Power, a bike shop near the river. The shop was full of bikes — red, green, silver, and one very yellow.\n\n“I haven’t ridden a bike since Japan,” Hana said. “In Matsuyama, I rode to the bakery every day.”\n\n“Then your legs will remember,” Leo said. “Legs never forget.”\n\nInside, a young woman with strong arms and a friendly face waved. Her shirt said “Maya.”\n\n“Morning! What can I do for you?”\n\n“I’d like to rent a bike. Just for today,” Hana said.\n\n“Sure thing. A day rental is fifteen dollars, helmet included,” Maya said. “What’s your height?”\n\n“About one hundred sixty centimeters,” Hana said. Then she stopped. “Sorry — I don’t know it in feet.”\n\n“No problem, I speak centimeters,” Maya laughed. “You’ll take a medium. Try this blue one.”\n\nHana sat on the blue bike. It felt right, like a good pair of shoes.\n\nMaya gave her a white helmet. “Helmet rules: always on, and the strap should be snug. Two fingers under the strap, no more.”\n\nShe checked Hana’s helmet. “Perfect. Now, where are you riding today?”\n\n“Along the river,” Emma said. “The Springwater path.”\n\n“Good choice. Stay on the right side, and when you pass a walker, say ‘On your left!’ so they know you’re coming.”\n\n“On your left,” Hana repeated. “But I pass them on… their left. And I say left. Okay. English tests me every day.”\n\nMaya laughed. “You’ve got it. One more thing — the river path has no cars, so it’s relaxed.”\n\n“Is it safe to ride here?” Hana asked, pointing at the busy street outside.\n\n“That street? It’s okay, but use the bike lane, the green painted part,” Maya said. “When you turn, put your arm out. Like this.” She showed her, arm straight to the side.\n\nHana practiced the arm signal. Leo saluted her like a soldier. “Officer Hana, ready for the road!”\n\nThey rode slowly to the river path. Hana’s legs did remember. After one wobbly minute, her body found the old rhythm, and the bike became part of her.\n\nThe path ran beside the water. The morning sun made the river silver. Runners passed. Dogs trotted. A man played guitar on a bench.\n\n“On your left!” Hana called, passing two walkers. They waved kindly. It worked! Words were like arm signals — small, clear, and they kept everyone safe.\n\nThey rode for an hour. The city got quiet behind them. Green trees leaned over the path, and the air smelled like water and grass.\n\nAt a small beach, they stopped to rest. Leo bought cold lemonades from a cart. They sat on big stones and watched a family of ducks.\n\n“In Brazil, I rode my bike to the ocean,” Leo said. “Every Sunday, with my brothers. When I ride, I’m ten years old again.”\n\n“In Matsuyama, I rode past orange trees,” Hana said. “Mikan oranges. In autumn, the whole road smelled sweet.”\n\n“Portland, Brazil, Japan,” Emma said. “Different roads, same feeling. That’s why I love bikes.”\n\nOn the way back, there was a small drama. A duck family decided to cross the path — mother duck first, then seven little ducks in a line.\n\n“Duck traffic!” Leo shouted. Everyone stopped. Bikes, runners, everyone waited in a happy line while the ducks marched slowly across, like seven small kings.\n\n“Only in Portland,” Emma laughed. “Duck traffic jam.”\n\nHana took a photo for the group chat. She wrote: “omg duck family!! lol.” Ben answered in one minute: “awesome.”\n\nBack at Pedal Power, Hana returned the blue bike. Her legs were tired, the good kind of tired.\n\n“How was the ride?” Maya asked.\n\n“Wonderful. The river, the ducks, everything,” Hana said. “I want to do this every weekend.”\n\n“Then here’s a tip: we have a monthly pass. Cheaper if you ride a lot,” Maya said. “Think about it.”\n\n“I will. Thank you, Maya!”\n\nWalking home, Hana felt strong and light at the same time. Her first American bike ride. One more small door opened, and behind it — a silver river, duck kings, and wind.\n\nAt dinner, she told the whole story. Mike loved the ducks. “Nature’s traffic school,” he said. “Everyone stops for the small ones.”\n\n“That’s beautiful, dear,” Carol said. “Are you going to write that down?”\n\n“I already did,” Mike said proudly, holding up a napkin.\n\nHana laughed and thought: this house is my favorite book.\n\nTomorrow had one more plan in it — a food truck street with Emma and Leo, and a spicy question waiting for her there.","glossary":[{"w":"adventure","ja":"冒険"},{"w":"rent","ja":"借りる(有料)"},{"w":"rental","ja":"レンタル"},{"w":"helmet included","ja":"ヘルメット込み"},{"w":"height","ja":"身長"},{"w":"strap","ja":"あごひも"},{"w":"snug","ja":"ぴったりの"},{"w":"path","ja":"小道"},{"w":"bike lane","ja":"自転車レーン"},{"w":"arm signal","ja":"手信号"},{"w":"wobbly","ja":"ふらふらの"},{"w":"rhythm","ja":"リズム"},{"w":"traffic jam","ja":"渋滞"},{"w":"monthly pass","ja":"月間パス"}],"phrases":[{"en":"I’d like to rent a bike.","ja":"自転車を借りたいのですが。"},{"en":"Is it safe to ride here?","ja":"ここ、走っても安全ですか？"},{"en":"What can I do for you?","ja":"何かお手伝いしましょうか？"},{"en":"On your left!","ja":"左通ります！"},{"en":"How was the ride?","ja":"走ってみてどうだった？"}],"quiz":[{"q":"How much was the day rental?","c":["Five dollars","Fifteen dollars","Fifty dollars","Ten dollars"],"a":1},{"q":"What do you say when you pass a walker?","c":["Take it easy!","No worries!","On your left!","Watch out!"],"a":2},{"q":"Why did everyone stop on the path?","c":["The path was broken","It started to rain","A runner fell","A duck family was crossing"],"a":3}],"words":771},{"id":30,"level":2,"emoji":"🌮","theme":"フードトラック巡り","titleEn":"The Spicy Challenge","titleJa":"激辛チャレンジ","teaser":"ポートランド名物フードトラック街へ！おすすめの聞き方と、運命の辛さレベル選び。","story":"It was Sunday at noon, and Hana’s nose led the way.\n\nEmma and Leo took her to a famous corner downtown where twelve food trucks stood in a friendly circle. Each truck had a different smell and a different flag. Tacos, Thai noodles, falafel, pizza, ice cream — a little world of lunch.\n\n“Welcome to Portland’s real restaurant,” Leo said, opening his arms wide. “The sky is the ceiling.”\n\n“How do I choose?” Hana asked. “Everything smells amazing.”\n\n“Rule one of food trucks,” Emma said. “Walk the full circle first. Look at everything. Then listen to your stomach.”\n\nThey walked the circle slowly, and Hana read the menus like an explorer reading maps. Every truck had its own music and its own little crowd. At a bright green truck called Thai Smile, a woman tossed noodles in a big pan, and fire jumped up.\n\nAt a yellow truck, Casa Sol, a man sang while he cooked. The smell of grilled meat and lime made Hana’s stomach speak clearly.\n\n“My stomach chose the singing truck,” she announced.\n\n“Good stomach. Casa Sol has the best tacos in town,” Leo said.\n\nThere was a small line. When their turn came, the singing man smiled down at them. His name tag said “Miguel.”\n\n“Welcome, welcome! First time?” he asked Hana.\n\n“Yes, first time. What do you recommend?”\n\n“Ah, good question! The chicken tacos are famous. The fish taco is my mother’s recipe,” Miguel said. “And for brave people, we have the Fire Taco.”\n\nHana looked at the picture of the Fire Taco. It had a small drawing of a dragon next to it.\n\n“Is it spicy?” she asked.\n\n“Is it spicy!” Miguel laughed like thunder. “Little friend, we have five levels. Level one is a warm hello. Level five is a phone call to the fire station.”\n\nLeo’s eyes shone. “I’ll take level four.”\n\n“Level two for me,” Emma said. “I’m an artist, not a hero.”\n\nEveryone looked at Hana. In Japan, she never ate very spicy food. But this was a year of new doors.\n\n“Level three, please,” she said. “The middle door.”\n\n“Brave choice!”
