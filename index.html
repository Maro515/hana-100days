},{"w":"passport","ja":"パスポート"},{"w":"bitter","ja":"苦い"},{"w":"vote","ja":"投票する"},{"w":"dignity","ja":"威厳"},{"w":"presentation","ja":"発表"}],"phrases":[{"en":"What do you think, Hana?","ja":"ハナはどう思う？"},{"en":"In my opinion, we should try something new.","ja":"私の意見では、新しいことを試すべきです。"},{"en":"Let me explain.","ja":"説明させてください。"},{"en":"That’s a great point.","ja":"それはいい指摘だね。"},{"en":"Why don’t we vote?","ja":"投票で決めない？"}],"quiz":[{"q":"What was the staff meeting about?","c":["Summer vacations","A new coffee machine","The fall menu","Cleaning schedules"],"a":2},{"q":"Why was Hana afraid to share her idea at first?","c":["She hated meetings","Leo laughed at her","She had no ideas","She thought it was too Japanese"],"a":3},{"q":"How did Hana feel walking home after the meeting?","c":["Brave and excited","Angry at Rosa","Sleepy and bored","Sad about summer"],"a":0}],"words":969},{"id":57,"level":3,"emoji":"🍵","theme":"抹茶ラテをメニューに","titleEn":"The Matcha Latte Debut","titleJa":"抹茶ラテ、デビューの日","teaser":"ダウンタウンで見つけた小さな緑の缶。試作、審査、そして発売日。緑色の新星は売れるのか？","story":"Operation Matcha began on Tuesday, with a bus ride downtown.\n\nThe Japanese market was small, warm, and full of familiar smells. Hana stopped inside the door and just breathed.\n\n“Rice crackers, miso, green tea,” she said softly. “It smells like home.”\n\nThe owner, a kind old man named Mr. Tanaka, walked her along the tea shelf.\n\n“For drinking with milk, this one,” he said, holding a small green tin. “Strong enough to say hello through the milk.”\n\n“That’s a beautiful way to say it,” Hana said.\n\n“Are you from Japan?” he asked, and they talked for ten happy minutes — Matsuyama, Portland, bread, tea.\n\nWhen he heard her plan, he added a small extra bag to her basket. “The jar is business,” he said with a little bow. “This bag is good luck.”\n\nThat evening, the Millers’ kitchen became a matcha laboratory.\n\nThe first cup was too bitter. Mike drank it all anyway, “for science”, and made a face like a lemon.\n\nThe second was too sweet. “It tastes like green candy,” Ben said. “Which is... actually fine?”\n\nThe third cup had warm milk, less sugar, and light foam on top. Carol tasted it and closed her eyes. “That. That’s the one.”\n\nDaisy watched every cup with hope and was disappointed every time.\n\n“What if nobody orders it?” Hana asked, washing the whisk.\n\n“Then more for us,” Mike said. “That’s not a problem. That’s a plan B.”\n\nHana wrote the recipe like a scientist. Water not too hot. Whisk fifty times. Honest milk, and only a little honey.\n\nFriday morning, before opening, the team stood around the counter. “I want to love it,” Leo said. “But my mouth remembers the grass.”\n\n“It’s worth a try. Hana, when you’re ready,” Rosa said.\n\nHana’s hands were calm. She warmed the milk, whisked the matcha, and poured slowly. Four cups, deep green under white foam.\n\nLeo sipped. Silence. He sipped again. “No grass,” he said finally. “This is really, really good. I’m a little angry about how good it is.”\n\nEmma held her cup with both hands. “It tastes like a quiet morning,” she said. “Can I write that on the board?”\n\nRosa drank hers slowly and smiled. “Smooth, warm, and different. It’s the Bluebird in a cup — a little Japanese, a little Portland. It goes on the menu. Today.”\n\nHana stood very still. Her idea — her small, scary idea from July — was now real.\n\nEmma chalked the specials board: MATCHA LATTE. Deep green, like a forest after rain. NEW!\n\nSaturday was launch day. Hana stood by the register with a tray of tiny cups.\n\n“Would you like to try a sample?” she asked every curious face.\n\n“Match-what?” asked the first customer, a man with a bike helmet.\n\n“Matcha,” Hana smiled. “It’s a Japanese green tea. We make it into a warm latte. Sweet, but only a little.”\n\nHe tried the sample. His eyebrows went up. “Could I get one of those?”\n\n“Of course! For here or to go?”\n\nAt nine, the first tray of samples was gone. At ten, Rosa printed the word “NEW” in red and taped it higher.\n\nAll morning, Hana explained matcha in small, clear sentences.\n\nA little girl asked, “Why is it green? Is it grass?”\n\n“Good question! It’s made from tea leaves,” Hana said. “The leaves become a fine powder. No grass, I promise.” Behind the machine, Leo laughed into his elbow.\n\nA runner asked about caffeine. “Less than coffee,” Hana said. “Gentle energy. No crash.”\n\nBetween orders, customers asked her other questions. “Do you miss home?” “Will you make matcha cookies next?” “How do you say ‘delicious’ in Japanese?”\n\nHana answered every one, and the line didn’t mind waiting.\n\nMrs. Chen ordered a matcha latte and held the warm cup with both hands. “I’ve read about matcha for thirty years,” she said. “Today I finally don’t need a plane to try it.”\n\nShe took a slow, careful taste. “Wonderful. Green and honest.”\n\n“I’m glad you like it.” Hana said it simply, and her chest felt warm and full.\n\nFrank came in at noon. “One hot americano,” he said slowly and clearly. Then: “And one matcha latte. If it has your name on it, I trust it.”\n\nSam arrived with two other firefighters, and all three ordered matcha lattes. “Station two drinks green now,” Sam announced.\n\nAt two o’clock, Rosa rang the little bell by the register. “Attention, everyone! The matcha latte is SOLD OUT on day one!”\n\nThe whole cafe clapped. Hana bowed a little, because her heart didn’t know what else to do.\n\n“We should call it the Hana Special,” Leo said.\n\n“Please, no,” Hana laughed. “Matcha already has a beautiful name.”\n\nEmma took a photo of Hana holding the last cup and sent it to Yui. The answer came fast: “MY SISTER IS FAMOUS. Save me a cup in December!”\n\nThat evening, Hana and Rosa cleaned the machine together.\n\n“You know what I saw today?” Rosa said. “People didn’t just buy a drink. They bought the story of a girl who explained her home with shining eyes.”\n\n“I only said it was green tea,” Hana said.\n\n“You said it with love. Customers can taste love.” Rosa hung up her towel. “By the way — the regulars are starting to ask for you by name.”\n\n“By name?”\n\n“‘Is Hana here today?’ I heard it three times this week.” Rosa smiled. “Tomorrow, try learning their names too. That’s when a cafe becomes a home.”\n\nHana walked home in the warm evening, holding the empty green tin like a small trophy.\n\nLearning their names, she thought. Fifty faces passed through her mind — the bike man, the runner, the little grass girl. Tomorrow, the faces would start becoming friends.","glossary":[{"w":"familiar","ja":"なつかしい"},{"w":"tin","ja":"缶"},{"w":"bow","ja":"おじぎ"},{"w":"laboratory","ja":"実験室"},{"w":"foam","ja":"泡"},{"w":"scientist","ja":"科学者"},{"w":"smooth","ja":"なめらか"},{"w":"chalked","ja":"チョークで書いた"},{"w":"launch","ja":"発売開始"},{"w":"sample","ja":"試飲"},{"w":"curious","ja":"興味津々"},{"w":"caffeine","ja":"カフェイン"},{"w":"gentle","ja":"おだやか"},{"w":"sold out","ja":"売り切れ"},{"w":"trophy","ja":"トロフィー"}],"phrases":[{"en":"It’s worth a try.","ja":"試してみる価値はあるよ。"},{"en":"Would you like to try a sample?","ja":"試飲はいかがですか？"},{"en":"It’s a Japanese green tea.","ja":"日本の緑茶なんです。"},{"en":"Could I get one of those?","ja":"それを一つもらえますか？"},{"en":"I’m glad you like it.","ja":"気に入ってもらえて嬉しいです。"}],"quiz":[{"q":"Where did Hana buy the matcha powder?","c":["At a Japanese market downtown","At the supermarket","Online from Japan","From Mrs. Chen"],"a":0},{"q":"What did Leo think after tasting Hana’s matcha latte?","c":["It tasted like grass","It was really good","It was too sweet","It was too hot"],"a":1},{"q":"Why was Saturday so special for Hana?","c":["She got a day off","She met Mr. Tanaka","Her own idea became a real menu item","She learned fifty names"],"a":2}],"words":955},{"id":58,"level":3,"emoji":"📰","theme":"常連さんとの何気ない日々","titleEn":"Small Doors, Big Rooms","titleJa":"小さなドアの向こうに","teaser":"常連さんの名前と「いつもの」を覚えたハナ。何気ないおしゃべりが、街を家に変えていく。","story":"By the middle of August, Hana knew the Bluebird’s mornings by heart.\n\nThe espresso machine warmed up at six thirty. The chairs came down at six forty-five. And at seven, Rosa unlocked the door for the same beautiful parade.\n\nAt seven forty-five, the door opened, and Hana didn’t need to look up.\n\n“Good morning, Frank. The usual?”\n\n“You know it,” Frank said. “Hot americano. And how is the matcha world?”\n\n“Growing every day,” Hana said, and they both laughed at their little joke.\n\nFrank came every day now. On hard days, he ordered two shots. On good days, he talked about his daughter in college. Hana knew which day it was before he spoke.\n\nAt eight, a calm voice said, “The usual, please.” It was Dr. Park from the clinic. One black tea, no sugar, seven days a week.\n\n“Doctors drink tea?” Leo asked once.\n\n“This doctor does,” Dr. Park said. “Coffee is for patients’ families. They need it more.”\n\nAfter Rosa’s advice, Hana had started a secret page in her notebook: THE REGULARS.\n\nPete — bike helmet, matcha latte, builds bridges. Nadia — runs marathons, small coffee, black. Mr. Alvarez — crossword every morning, endless refills, retired mailman.\n\nShe wrote the details not to sell more drinks, but to remember their stories. People shine when you remember their stories.\n\nNadia’s knee was better. Pete’s bridge would be finished in October. Mr. Alvarez’s grandson had just started walking. None of it was on any test — and all of it mattered.\n\nSmall talk had once been a mountain. Now it was a morning walk.\n\nWeather talk, Hana had learned, was never really about weather. “Nice morning” meant hello. “This heat!” meant please talk with me a little longer.\n\n“Look at those clouds. It looks like rain.” She said it to Pete on Tuesday, and Pete told her about building bridges in the rain for twenty years.\n\n“What do you call this soft rain?” she asked him one gray morning.\n\n“Drizzle.”\n\n“Drizzle,” Hana repeated, loving the sound. “It sounds like a small dessert.”\n\n“Hot enough for you?” Mr. Alvarez asked on Wednesday, fanning himself with the crossword.\n\n“In Matsuyama, summer is like soup,” Hana said. “Portland summer is easy mode.”\n\n“Easy mode!” He laughed so hard that he taught the joke to the whole cafe.\n\n“What’s ‘easy mode’?” Mrs. Chen asked.\n\n“A video game word,” Ben explained proudly from the corner. “Hana is basically fluent in three languages now. Japanese, English, and Ben.”\n\nOn Friday, the questions changed, like clockwork.\n\n“Any plans for the weekend?” Hana asked Nadia.\n\n“Long run on Saturday. Twenty miles. My marathon is in October.”\n\n“Twenty miles! I get tired carrying twenty muffins.”\n\nOn Monday, it was the other question. “How was your weekend?” Hana asked, and every answer was a small window: a fishing trip, a wedding, a grandson’s first tooth.\n\nCompliments were another small door. “Nice bike, Pete.” “Your crossword pen is very serious, Mr. Alvarez.” “New running shoes, Nadia? Fast color.”\n\n“Fast color!” Nadia laughed. “I’m using that forever.”\n\n“That color looks great on you.” Hana pointed at Mrs. Chen’s new autumn scarf.\n\n“Flatterer,” Mrs. Chen said, very pleased. “It’s from my sister in Taipei.”\n\nThen she added, “Your small talk has become excellent. Do you know why it matters? Small talk is a small door to a big room. Every friendship I have walked through that little door.”\n\nHana added it to her notebook, under Mrs. Chen’s growing collection of wisdom.\n\nThat afternoon, something new happened. Mr. Alvarez looked up from his crossword and asked, “And you, Hana? How was YOUR weekend?”\n\nFor a second, she was surprised. For months, she had asked the questions. Now the questions came back to her.\n\n“I hiked with my host family,” she said. “I saw three waterfalls and one very brave squirrel.”\n\n“Brave squirrel?” Three regulars leaned in. Suddenly she was the one telling the story, and the cafe was listening.\n\nShe told them about the trail, the cold spray of the waterfalls, and how Daisy barked at the river for ten minutes. Her sentences came out easily, one after another, like beads on a string.\n\nNobody corrected her. Nobody needed to. They just wanted to know what the squirrel did next.\n\n“Look at that,” Leo whispered to Emma. “Six months ago she practiced ‘for here or to go’. Now she has an audience.”\n\nThe regulars had a nickname for her these days. The matcha girl. Pete said half the neighborhood used it.\n\n“Is that okay?” Pete asked. “Nicknames mean people like you.”\n\n“I love it,” Hana said. “In April, I was ‘the new girl who points at the menu’. The matcha girl is a big promotion.”\n\nThat week, Mr. Alvarez got stuck on his crossword. “Japanese tea, six letters.”\n\nThe whole cafe answered at the same time: “MATCHA!”\n\nOn Saturday, the cafe was full of weekend faces. Hana moved between tables like a friendly weather system — a compliment here, a question there, a laugh everywhere.\n\nAt closing, Rosa counted the register and smiled. “You know what you built this summer? Fifty small friendships. A cafe can’t buy that.”\n\nThat night, Hana looked at her notebook. THE REGULARS had grown to two full pages. Names, stories, favorite drinks — a little map of her neighborhood, drawn in English.\n\nOn Sunday evening, while wiping the community board, she noticed a new flyer.\n\nENGLISH CONVERSATION EVENINGS. Community college. Tuesdays and Thursdays. All levels welcome. Real talk, new friends.\n\nCafe talk was wonderful — but lately she wanted more. Longer conversations. Bigger rooms behind the small doors.\n\n“You should go,” Emma said, reading over her shoulder. “You’ve outgrown the register, my friend. Your English wants new adventures.”\n\n“Maybe I have,” Hana said slowly. She took a photo of the flyer — and her heart quietly said: go.","glossary":[{"w":"parade","ja":"パレード"},{"w":"shots","ja":"ショット"},{"w":"regulars","ja":"常連さん"},{"w":"marathon","ja":"マラソン"},{"w":"crossword","ja":"クロスワード"},{"w":"refill","ja":"おかわり"},{"w":"retired","ja":"引退した"},{"w":"details","ja":"細かいこと"},{"w":"drizzle","ja":"霧雨"},{"w":"compliment","ja":"ほめ言葉"},{"w":"beads","ja":"ビーズ"},{"w":"audience","ja":"聞き手"},{"w":"nickname","ja":"あだ名"},{"w":"outgrown","ja":"卒業した"},{"w":"flyer","ja":"チラシ"}],"phrases":[{"en":"The usual, please.","ja":"いつもので、お願いします。"},{"en":"It looks like rain.","ja":"雨になりそうだね。"},{"en":"Any plans for the weekend?","ja":"週末は何か予定ある？"},{"en":"How was your weekend?","ja":"週末はどうだった？"},{"en":"That color looks great on you.","ja":"その色、すごく似合ってるね。"}],"quiz":[{"q":"What does ‘the usual’ mean at a cafe?","c":["The cheapest drink","The biggest size","A new menu item","A customer’s regular order"],"a":3},{"q":"Why does Hana write notes about the regulars?","c":["Rosa told her to","To sell more drinks","To remember their stories","For her English homework"],"a":2},{"q":"How does small talk feel for Hana now?","c":["Still impossible","Much easier than before","More boring than before","More frightening than before"],"a":1}],"words":969},{"id":59,"level":3,"emoji":"🎓","theme":"夜の英会話クラス","titleEn":"The Same Boat","titleJa":"同じボートの仲間たち","teaser":"勇気を出して申し込んだ夜の英会話クラス。世界中から来た仲間たちとの合言葉は「同じボート」。","story":"On the last Tuesday of August, Hana stood in front of the community college with the flyer photo on her phone.\n\nThe campus was bigger than she expected. Students crossed the square in the golden evening light. Somewhere a choir was practicing, and the air carried the song across the square.\n\nRoom 214, the flyer said. Her feet found the building, but her heart tried to walk home twice.\n\nShe texted Emma: “I’m here. My legs want to leave.” Emma answered: “Tell your legs the matcha girl fears nothing.”\n\nAt the classroom door, she took the famous deep breath. The register, the meetings, the surprise party — she had survived them all. This was just one more door.\n\nInside, a dozen adults sat in a circle of chairs. There were nametags, paper cups, and a WELCOME sign in ten languages. A tall woman with silver earrings smiled at her.\n\n“Welcome! I’m Ms. Rivera. Grab a nametag and a seat — we don’t bite. Well, Diego bites sandwiches.”\n\n“Only sandwiches,” agreed a round, cheerful man.\n\n“Rule one in this class,” Ms. Rivera said. “Mistakes are welcome here. A mistake means you tried something new. Rule two: we talk a LOT.”\n\n“First activity! Find a partner and interview them. Then introduce your partner to the class. Start with the classic: Where are you from?”\n\nHana turned to the woman next to her, who looked as nervous as she felt.\n\n“Hello. Where are you from?” Hana asked.\n\n“Vietnam,” the woman said. “My name is Anh. I’m sorry — my English is slow.”\n\n“Mine was slower in April,” Hana said. “Take your time. I’m from Japan.”\n\n“April? Only April?” Anh asked. “But you speak so well.”\n\n“I work at a cafe. I talk all day,” Hana said. “Talking is the best textbook.”\n\nAnh had a six-month-old daughter. She wanted English for the doctor, for the school, for the future. “I study when the baby sleeps,” she said. “So... I study a little.”\n\nThey laughed, and the nervousness between them got up and left.\n\nWhen her turn came, Hana stood. “This is Anh from Vietnam. She has a six-month-old daughter, she loves cooking, and she is braver than she thinks.”\n\nAnh stood next, holding her paper tightly. “This is Hana from Japan. She works at a cafe. She... made matcha famous in Portland.”\n\n“That’s me,” Hana laughed. “The matcha girl.” Then she looked around the circle. “Hello, everyone. Nice to meet you all.”\n\nOne by one, the class opened like a map of the world.\n\nDiego, a chef from Mexico, wanted English for his food truck dream. Marek, a carpenter from Poland, built stairs all day and studied verbs all night. Fatima, a pharmacist from Egypt, was studying for her American license.\n\nThere was also a quiet man from Brazil who smiled when Hana said her coworker Leo was Brazilian too. “Small world,” he said. “Big boat,” Diego corrected.\n\n“Why is English spelling so crazy?” Marek asked. “‘Through’. ‘Tough’. ‘Though’. Who designed this?”\n\n“Nobody knows,” Ms. Rivera said. “We just live here.”\n\nFatima sighed. “Some days I feel my English is too slow. Everyone at the pharmacy speaks so fast.”\n\n“Same at my construction site,” Marek said. “Same in my kitchen,” Diego said. “Same with my baby’s doctor,” Anh said quietly.\n\nMs. Rivera smiled. “Do you know the expression? We’re in the same boat. Different countries, different jobs — one boat.”\n\n“Then let’s row together,” Diego said grandly, and the whole class cheered.\n\nSomething warm settled in Hana’s chest. At the cafe, she was the girl whose English had grown. Here, she was one of twelve people rowing — and that felt just as good.\n\nNobody here asked if she wanted whipped cream. Nobody needed her to be fast. They needed her to be honest, curious, and a little brave — and those she had.\n\nNext came question cards. ‘What food from home do you miss?’ ‘What English word do you love?’ ‘What will you do in five years?’\n\nDiego missed his grandmother’s tamales. Anh loved the word ‘breeze’. Marek said in five years he’d build his own house — “with perfect English and perfect stairs”.\n\nHana said she missed her mother’s miso soup, and that her favorite word was ‘drizzle’. “It sounds like a small dessert,” she explained, and the class agreed forever.\n\n“What English word do you hate?” was the bonus card. The class answered together, like a choir: “SCHEDULE!” “COLONEL!” “SQUIRREL!”\n\n“I can say squirrel now,” Hana said proudly, and told them about Leo’s pronunciation bootcamp.\n\nSometimes Anh spoke too softly. “Could you speak up a little?” Ms. Rivera asked kindly. “Your ideas are too good to be quiet.”\n\nAnh repeated her answer, louder. The class clapped, and her ears turned pink with pride.\n\n“In this room, quiet voices grow,” Ms. Rivera said. “That’s the whole business plan.”\n\nNear the end, she wrote on the board: ONE-MINUTE SPEECH. THURSDAY. TOPIC: MY FAVORITE PLACE.\n\n“One minute!” Marek said. “In front of everyone?” Fatima asked. “You’ll be great,” Ms. Rivera said. “You’re all in the same—” “BOAT!” shouted the class.\n\nBefore leaving, Diego collected phone numbers and made a group chat. He named it The Same Boat. The first message was a little boat picture from Anh.\n\n“See you on Thursday!” everyone called in the hallway, in twelve different accents, and every accent sounded like a friend.\n\nOn the bus home, Hana watched the campus lights slide past. Her notebook already had a new page: My Favorite Place in Matsuyama.\n\nOne minute. Sixty seconds. In front of twelve new friends.\n\nHer stomach flipped a little — but for the first time, it felt like excitement, not fear.\n\nShe clicked her pen and wrote the first line: “My favorite place is a small castle town by the sea.”","glossary":[{"w":"campus","ja":"キャンパス"},{"w":"choir","ja":"合唱団"},{"w":"nametag","ja":"名札"},{"w":"interview","ja":"インタビュー"},{"w":"introduce","ja":"紹介する"},{"w":"textbook","ja":"教科書"},{"w":"carpenter","ja":"大工"},{"w":"pharmacist","ja":"薬剤師"},{"w":"license","ja":"免許"},{"w":"construction site","ja":"工事現場"},{"w":"expression","ja":"言い回し"},{"w":"row","ja":"舟をこぐ"},{"w":"breeze","ja":"そよ風"},{"w":"topic","ja":"テーマ"},{"w":"flipped","ja":"ドキッとした"}],"phrases":[{"en":"Where are you from?","ja":"出身はどちらですか？"},{"en":"Take your time.","ja":"ゆっくりでいいですよ。"},{"en":"Nice to meet you all.","ja":"皆さん、はじめまして。"},{"en":"We’re in the same boat.","ja":"私たちは同じ境遇だね。"},{"en":"See you on Thursday!","ja":"木曜日にまたね！"}],"quiz":[{"q":"Where does the evening class meet?","c":["At the Bluebird Cafe","At a community college","At the library","At the Millers’ house"],"a":1},{"q":"What does ‘We’re in the same boat’ mean?","c":["We travel by boat","We like the sea","We work together","We share the same situation"],"a":3},{"q":"How did Hana feel on the bus home?","c":["Excited about the speech","Sorry she joined the class","Jealous of Diego","Too tired to go back"],"a":0}],"words":963},{"id":60,"level":3,"emoji":"🎤","theme":"クラスで1分間スピーチ","titleEn":"One Minute, One Hill","titleJa":"1分間の、私の丘","teaser":"ついに迎えた1分間スピーチ本番。テーマは松山でいちばん好きな場所。緊張のハナに拍手は届く？","story":"The night before her first English speech, the whole Bluebird Cafe became Hana’s practice room.\n\n“One minute,” Leo said, holding his phone like a stopwatch. “Topic: my favorite place. Go!”\n\nHana stood by the counter and began. “My favorite place is... um... it’s a hill. There is a castle. Also the sea is...” She stopped. “I forgot everything. Again.”\n\n“That’s normal,” Emma said. “Your brain is just rearranging the furniture.”\n\n“Rule one,” Leo said. “Slow is strong. Silence is not your enemy. A pause sounds like confidence.”\n\n“Rule two,” Emma said. “Don’t memorize every word. Memorize the road: hill, castle, sunset, bakery. The sentences will follow the road.”\n\n“Rule three,” Rosa called from the kitchen. “Talk about what you love. Love never forgets its lines.”\n\nMrs. Chen, at her usual table, added rule four. “Find one friendly face and speak to it. The rest of the room will listen in.”\n\n“Did YOU ever get nervous, Mrs. Chen? In thirty years?”\n\n“Every single September,” Mrs. Chen said. “The day a teacher stops being nervous is the day she stops caring.”\n\nHana tried again. Hill, castle, sunset, bakery. This time the words came out in the right order, and the cafe clapped — including two customers who had no idea what was happening.\n\nAll day Wednesday, the speech followed her. She practiced while steaming milk. She practiced while wiping tables. One regular heard the word ‘castle’ five times and finally asked if Portland was getting one.\n\n“No castle here,” Hana said. “You’ll have to visit mine.”\n\nAt dinner, she gave the speech to the Millers. Mike timed her with his watch: fifty-eight seconds.\n\n“Perfect landing,” he said. “Like a good birdhouse. Measure twice, speak once.”\n\n“That’s not how the saying goes, Dad,” Ben said.\n\n“It is now,” Mike said.\n\nDaisy listened to the speech three more times before bed. She was an excellent audience — she never looked away.\n\nOn Thursday evening, the whole cafe walked her to the door like a team walking a player onto the field.\n\n“Break a leg!” Leo called.\n\nHana froze. “Break a... what? Why my leg?”\n\n“It’s theater talk. It means good luck!” Emma laughed. “Nobody breaks anything. Probably.”\n\nRoom 214 was full and buzzing. Ms. Rivera had drawn a small stage area on the floor with tape.\n\n“Remember,” she told the class. “One minute. If you get lost, breathe. We’re not judges — we’re your boat.”\n\nWhile others spoke, Hana’s paper grew soft from her hands. Her turn came closer, speech by speech, like a slow drumroll.\n\nDiego went first. His favorite place was his grandmother’s kitchen in Mexico, where every problem could be fixed with soup. “My grandmother says: sad? Soup. Tired? Soup. In love? More soup.”\n\nAnh spoke about a quiet lake in Hanoi at six in the morning. Her voice started small and grew like the sunrise she described.\n\nMarek showed a photo of his workshop. “Wood is honest,” he said. “If you respect it, it becomes a home.” Fatima described her balcony over the Nile, where her family drank tea every evening — “our river never hurries, and neither do we.”\n\nThen Ms. Rivera looked at her list. “Hana, you’re up.”\n\nHana walked to the tape square. Twelve faces looked at her. Her heart tried its old trick — running a marathon in her chest.\n\n“Take your time,” Ms. Rivera said calmly.\n\n“I’m a little nervous.” Hana said it honestly, and the class nodded so warmly that the nervousness became part of the speech.\n\nShe found Anh’s friendly face. She took a slow breath, and began.\n\nThe first sentence wobbled. The second stood up straight. By the third, she wasn’t reading a speech — she was walking up her hill, and everyone came with her.\n\n“My favorite place is a hill in my hometown, Matsuyama. On top of the hill, there is a castle, four hundred years old. After work at my bakery, I climbed the slope with bread in my bag. From the top, you can see the whole town, the harbor, and the sea. The sky turns orange, the ships come home, and the town lights turn on, one by one — like the town is saying good night. When I feel small here in Portland, I close my eyes and stand on my hill. Someday, I want to show it to you. All of you.”\n\n“Thank you for listening.”\n\nFor one second, the room was quiet. Then came the applause — real, loud, and long. Diego whistled. Anh wiped her eyes.\n\n“Sixty-one seconds,” Ms. Rivera said, showing her timer. “And one extra second of pure Matsuyama. Clear voice, warm gestures, and now we all want a plane ticket.”\n\n“The town lights, one by one,” Fatima repeated. “I could see them.” Marek nodded. “Four hundred years old. Good, honest wood in that castle, probably.”\n\n“You did a great job.” Anh whispered it when Hana sat down. “Number one boat member.”\n\n“I want to visit this castle,” Diego announced. “Is there soup in Matsuyama?”\n\n“So much soup,” Hana promised.\n\nAfter class, the group chat filled with photos of the taped stage and twelve happy faces.\n\nHana ran back to the Bluebird just before closing. The team looked up.\n\n“Sixty-one seconds. Applause. Zero broken legs. It went really well.”\n\n“That’s my student!” Leo shouted, and Rosa brought out four matcha lattes to celebrate.\n\n“To speech day!” Emma said. “To the hill!” said Leo. “To sixty days,” Hana said quietly, and the cups touched with a small happy sound.\n\nThat night, Hana added a new line to her notebook: “Day 60. Today, twelve people saw my hill.”\n\nSixty days of stories, she thought. In April, one minute of English was a mountain. Tonight, one minute was almost too short.\n\nAugust was ending. Cooler mornings were coming — and September would bring a lesson that no classroom could teach.","glossary":[{"w":"stopwatch","ja":"ストップウォッチ"},{"w":"rearranging","ja":"模様替え"},{"w":"pause","ja":"間を取ること"},{"w":"confidence","ja":"自信"},{"w":"memorize","ja":"暗記する"},{"w":"lines","ja":"せりふ"},{"w":"timed","ja":"時間を計った"},{"w":"theater","ja":"劇場"},{"w":"buzzing","ja":"ざわざわして"},{"w":"drumroll","ja":"ドラムロール"},{"w":"wobbled","ja":"ぐらついた"},{"w":"slope","ja":"坂道"},{"w":"harbor","ja":"港"},{"w":"applause","ja":"拍手"},{"w":"gestures","ja":"身ぶり"}],"phrases":[{"en":"Break a leg!","ja":"がんばって！（成功を祈る）"},{"en":"I’m a little nervous.","ja":"少し緊張しています。"},{"en":"Thank you for listening.","ja":"ご清聴ありがとうございました。"},{"en":"You did a great job.","ja":"本当によくやったね。"},{"en":"It went really well.","ja":"すごくうまくいったよ。"}],"quiz":[{"q":"What was Hana’s speech about?","c":["Her host family","The Bluebird Cafe","A castle hill in Matsuyama","Her favorite food"],"a":2},{"q":"What does ‘Break a leg!’ mean?","c":["Good luck!","Be careful!","Run fast!","Take a rest!"],"a":0},{"q":"Why did Hana look at Anh during the speech?","c":["Anh was holding her paper","Anh asked a question","The teacher told her to","A friendly face gave her courage"],"a":3}],"words":976},{"id":61,"level":3,"emoji":"😟","theme":"エマとのすれ違い","titleEn":"A Text That Sounded Cold","titleJa":"冷たく見えたメッセージ","teaser":"楽しみにしていたピクニックが突然キャンセルに。エマの短すぎる返事に、ハナの胸はざわつく。","story":"September had arrived in Portland, and the maple trees were starting to turn red.\n\nOn Friday night, Hana was excited. She and Emma had a plan for Saturday: a picnic by the river and a visit to Emma’s favorite art shop. They had talked about it all week.\n\nThen her phone buzzed. It was a text from Emma. “Sorry. I can’t come tomorrow. Never mind about the picnic.”\n\nThat was all. No funny faces, no little hearts, no “next time!” Emma’s texts usually looked like a small party. This one looked like a closed door.\n\nHana read it three times. Then she wrote back, “No problem! Is everything okay?”\n\nEmma answered an hour later. “It’s fine. It’s not a big deal.”\n\nHana put down her phone and looked at Daisy. “That doesn’t sound like Emma,” she said. Daisy wagged her tail slowly, like she agreed.\n\nOn Saturday morning, the cafe was busy and warm, full of the smell of cinnamon. Hana worked the early shift, and Emma came in ten minutes late, which never happened.\n\n“Morning,” Emma said. She didn’t smile. She put on her apron and walked straight to the espresso machine.\n\n“Good morning! Are you okay?” Hana asked.\n\n“I’m just tired,” Emma answered. She didn’t look up.\n\nAll morning, Emma was quiet. She made every drink perfectly, but her face was somewhere else.\n\nWhen Hana told a small joke about Leo’s new hat, Emma only said, “Ha. Funny.” Then she carried some cups to the back.\n\n“Is Emma sick?” a regular customer asked Hana. “She usually laughs louder than the coffee machine.”\n\n“Maybe she’s just tired,” Hana said. But her worry grew bigger, like a small stone becoming a mountain.\n\nMrs. Chen came in at ten for her usual tea. She watched Emma for a moment.\n\n“Your friend looks like a rainy day,” Mrs. Chen said quietly. “Has something happened between you two?”\n\n“I don’t know,” Hana said. “Yesterday she canceled our picnic. Her text was so short.”\n\n“Hmm. Short words can hide long stories,” Mrs. Chen said. She patted Hana’s hand. “Be patient, dear.”\n\nAt lunch, Emma took her break alone outside. Through the window, Hana watched her stare at her phone and push her salad around.\n\nHana felt something heavy in her chest. Had she said something bad? Had she forgotten something important? She checked her memory again and again.\n\nFinally she walked to the sink, where Leo was drying cups. “Leo. Do you have a minute?” she asked quietly.\n\n“For you? Always,” Leo said. “You look like you’ve lost your wallet again.”\n\n“Worse,” Hana said. “I think I’ve lost Emma. She canceled our plan, and today she hasn’t smiled once. Did I do something wrong?”\n\nLeo put down the cup and thought. “Hana, texts always sound colder than real voices. Maybe it’s not about you at all.”\n\n“But she said it’s not a big deal,” Hana said. “Sometimes those words mean the opposite.”\n\n“True in every country,” Leo said. “My mom says ‘I’m fine’ when the kitchen is on fire. Talk to Emma. Ask her directly.”\n\nIn the afternoon, Hana finally caught Emma by the counter. “Emma. Can we talk after work?”\n\n“I can’t today,” Emma said. “I have to run. Sorry.” She grabbed her bag and hurried out the door.\n\nThe little bell above the door rang. Rosa watched her go and shook her head slowly.\n\n“That girl has a storm inside,” Rosa said. “I’ve seen it all week.”\n\n“A storm?” Hana asked.\n\n“Something is worrying her. But she hasn’t told me anything,” Rosa said. “Maybe she’ll tell you. You’re closer to her than anyone.”\n\n“Me?” Hana said. Rosa smiled. “Friendship is like bread. Sometimes it needs a warm hand.”\n\nThat evening, Hana sat at the kitchen table and told Carol everything. Her tea got cold while she talked.\n\n“Emma is my best friend here,” Hana said. “If she’s angry with me, I want to know. If she’s sad, I want to help.”\n\nCarol nodded. “When I was your age, I lost a friend because we both stayed quiet. Don’t wait too long.”\n\n“What should I say?” Hana asked.\n\n“Say what you just said to me. It was perfect,” Carol said.\n\nBen walked by with a basketball under his arm. “Girls are complicated,” he said.\n\n“People are complicated,” Carol said. “Even you, mister.” Ben grinned and stole a cookie from the plate.\n\nMike looked up from his newspaper. “I’m simple,” he said. “Coffee, tools, and bad jokes. That’s the whole recipe.”\n\nHana laughed a little for the first time that day. Then she went upstairs with Daisy behind her.\n\nBefore bed, she came back down and mixed dough in the kitchen. If she was going to hear something hard tomorrow, sweet bread would help.\n\nCarol watched her shape each piece. “You bake when you’re nervous,” she said. “I clean the fridge. Everyone has something.”\n\nIn her room, Hana read Emma’s message one more time. “It’s not a big deal.”\n\n“It’s not a big deal — or is it?” Hana said to the quiet room. Daisy put her head on Hana’s knee.\n\nOutside, the rain started. Portland rain, soft and endless.\n\nHana thought about her first weeks in the city. Emma had helped her since her first day at the cafe. She had taught her the menu, the jokes, the bus lines, everything.\n\n“Friends don’t give up,” Hana said. “A hard talk is better than a long silence.”\n\nShe typed slowly: “Emma, I miss my friend. Can we meet at the park tomorrow at ten? I’ll bring melon bread.”\n\nOne minute passed. Two. Three. Hana watched the little dots appear and disappear. Then her phone lit up.\n\n“Okay. Ten o’clock,” Emma wrote. “I have something to tell you. I’m sorry about today.”\n\nHana held the phone to her chest and smiled at Daisy. “Tomorrow,” she said, “I’m going to get my friend back.”\n\nBut that night, she lay awake and wondered — what was Emma’s secret?","glossary":[{"w":"maple","ja":"カエデ"},{"w":"buzzed","ja":"振動した"},{"w":"wagged her tail","ja":"尻尾を振った"},{"w":"somewhere else","ja":"うわの空"},{"w":"regular","ja":"常連客"},{"w":"stare at","ja":"じっと見る"},{"w":"chest","ja":"胸"},{"w":"the opposite","ja":"正反対"},{"w":"directly","ja":"率直に"},{"w":"hurried","ja":"急いだ"},{"w":"storm","ja":"嵐"},{"w":"complicated","ja":"複雑な"},{"w":"dough","ja":"パン生地"},{"w":"lit up","ja":"光った"}],"phrases":[{"en":"Is everything okay?","ja":"大丈夫？何かあった？"},{"en":"It’s not a big deal.","ja":"大したことないよ。"},{"en":"Do you have a minute?","ja":"ちょっといい？"},{"en":"Did I do something wrong?","ja":"私、何か悪いことした？"},{"en":"Can we talk after work?","ja":"仕事のあと、話せる？"}],"quiz":[{"q":"What did Emma cancel?","c":["A movie night","The picnic","A cooking class","A birthday party"],"a":1},{"q":"Who tells Hana to ask Emma directly?","c":["Ben","Mrs. Chen","Rosa","Leo"],"a":3},{"q":"Why does Hana bake bread at night?","c":["She is nervous, and baking helps her","She is very hungry","Rosa needs bread for the cafe","It is Carol’s birthday"],"a":0}],"words":991},{"id":62,"level":3,"emoji":"🕊","theme":"ほんとうの仲直り","titleEn":"The Talk in the Park","titleJa":"公園で、ほんとうの話を","teaser":"メロンパンを持って公園へ。エマがずっと隠していた「秘密」とは？ 素直な言葉が二人を変える。","story":"Sunday morning was cool and gray, but the rain had finally stopped.\n\nHana arrived at the park at nine fifty. She sat on a bench under a big oak tree and held a warm bag of melon bread on her knees.\n\nHer heart was beating fast. She had practiced some words in her head all morning. Now they all felt too small.\n\nAt ten exactly, Emma walked up the path. She had her sketchbook under her arm, and her eyes looked tired.\n\n“Hi,” Emma said.\n\n“Hi,” Hana said. “I saved you a seat. And bread.”\n\nEmma sat down. For a moment, neither of them spoke. Two ducks argued loudly on the pond.\n\nThen Emma took a deep breath. “Hana, I owe you an apology. My text on Friday sounded cold. I didn’t mean it that way.”\n\n“It’s okay,” Hana said softly. “Take your time.”\n\nEmma looked at her hands. “On Friday, I got an email. You know the Fall Student Art Show? I sent my best painting. They didn’t choose it. It was rejected.”\n\n“Oh, Emma.”\n\n“I’ve worked on that painting for two months. When I read the email, I couldn’t talk to anyone. Not even you. Maybe especially you.”\n\nHana was surprised. “Why especially me?”\n\n“Because you’ve grown so fast this year,” Emma said. “Your speech got applause. Your matcha latte is on the menu. And me? I felt stuck. I felt like a failure, and I was ashamed.”\n\nThe word hung in the air between them.\n\n“So I hid,” Emma said. “Hiding was easier than talking. I’m sorry. You didn’t do anything wrong. It was never about you.”\n\nHana looked at the pond for a moment. Then she spoke slowly and clearly.\n\n“Emma, can I tell you something? In my first week at the cafe, I mixed up three orders in one hour. A man got a pink strawberry drink instead of black coffee.”\n\nEmma laughed a little. “I remember. He drank it anyway.”\n\n“And in May, I cried in the kitchen because I missed my family. Carol made me tea. I felt small and silly that night.”\n\n“You never told me that.”\n\n“Because I was ashamed too,” Hana said. “Everyone hides their hard days. But you helped me so many times. Now it’s my turn. I’m here for you.”\n\nEmma’s eyes filled with tears. “That means a lot. Really.”\n\n“One rejected painting doesn’t make you a failure,” Hana said. “It makes you an artist who tried. Trying is braver than hiding.”\n\n“When did your English get so wise?” Emma asked, wiping her eyes.\n\n“I have a good teacher,” Hana said. “She talks a lot. She’s eating my melon bread right now.”\n\nEmma laughed for real this time, loud enough to scare the ducks. “Okay, honest question. Do you want to see it? The painting they didn’t want?”\n\n“Yes. Show me.”\n\nEmma opened her sketchbook. Inside was a photo of the painting: the cafe window on a rainy evening, warm and gold.\n\nHana looked at it for a long time. “Emma, I love it. The window looks like it’s breathing.”\n\n“One judge wrote that it was ‘safe,’” Emma said. “Pretty, but safe. And you know what? Maybe he was right. I always paint windows and cups. I’ve been afraid to paint people.”\n\n“So paint people,” Hana said.\n\n“I want to.” Emma turned to her, suddenly serious. “Actually, I’ve decided something. My next painting will be a portrait. Of you.”\n\n“Me?” Hana almost dropped her bread.\n\n“Yes. You, in the morning light at the cafe, with flour on your hands. I even have a title: ‘The Baker.’ If it goes well, I’ll send it to the winter show.”\n\n“But my face is just… a normal face.”\n\n“Your face is the face of someone becoming herself,” Emma said. “That’s the bravest thing I know.”\n\nHana felt her cheeks turn warm. “Then I have one condition. While you paint, you teach me art words. Brush, shadow, everything.”\n\n“Deal.” Emma shook her hand like a businesswoman, and they both laughed.\n\nThey walked along the river and shared the last piece of melon bread. The clouds were breaking, and thin sunlight touched the water.\n\n“When is the next art show?” Hana asked.\n\n“In December. The winter one is bigger,” Emma said. “I’ve already started planning. If I finish the portrait in time, I’ll send it.”\n\n“Next Sunday, let’s have the real picnic,” Emma said. “Same river, better weather. I’ll bring lemonade and my worst jokes.”\n\n“Leo has already taken all the worst jokes,” Hana said.\n\n“Then I’ll bring the second worst.”\n\nAt the park gate, Emma stopped. “Hana. Thank you for the text last night. It was hard to answer. But I’m glad we talked.”\n\n“I’m glad we talked too,” Hana said. “Next time, if something is wrong, tell me first. Even with three words.”\n\n“Promise,” Emma said. “And if YOUR day is dark, you text me. Even from the next room.”\n\n“Promise.”\n\nThey did a small pinky promise, like children, and laughed at themselves. Then Emma squeezed Hana’s hand.\n\n“See you tomorrow, best friend,” Emma said. “I’ve never said that word to anyone here. It’s yours now.”\n\nHana walked home through the wet, shining streets. Her chest felt light, lighter than it had felt in three days.\n\nAt dinner, she told the Millers everything. Carol smiled and said, “A friendship that has survived one storm is stronger than before.”\n\n“Like a fence after I fix it,” Mike said. “Well. Usually stronger.”\n\n“Usually?” Carol asked. Mike suddenly became very interested in his newspaper.\n\nThat night, Hana wrote one line in her notebook: “Real friends talk about the hard things, not only the easy things.”\n\nThe next morning at the cafe, Mrs. Chen was waiting at her table with a small notebook and an unusual, shy smile — she had a big favor to ask.","glossary":[{"w":"deep breath","ja":"深呼吸"},{"w":"owe you an apology","ja":"謝らなきゃ"},{"w":"Art Show","ja":"美術展"},{"w":"rejected","ja":"落選した"},{"w":"stuck","ja":"伸び悩んで"},{"w":"failure","ja":"失敗者"},{"w":"ashamed","ja":"恥じて"},{"w":"hid","ja":"隠れた"},{"w":"silly","ja":"ばかみたい"},{"w":"braver","ja":"より勇敢"},{"w":"judge","ja":"審査員"},{"w":"portrait","ja":"肖像画"},{"w":"condition","ja":"条件"},{"w":"squeezed","ja":"ぎゅっと握った"}],"phrases":[{"en":"I didn’t mean it that way.","ja":"そういうつもりじゃなかったの。"},{"en":"Take your time.","ja":"ゆっくりでいいよ。"},{"en":"I’m here for you.","ja":"私がついてるよ。"},{"en":"That means a lot.","ja":"すごくうれしい。"},{"en":"I’m glad we talked.","ja":"話せてよかった。"}],"quiz":[{"q":"Why was Emma sad and quiet?","c":["She was sick in bed","She had a fight with Rosa","Her painting was not chosen for the art show","She lost her sketchbook"],"a":2},{"q":"What does Emma want to paint next?","c":["A portrait of Hana","A picture of Daisy","The cafe window again","The river in the park"],"a":0},{"q":"How do the two friends feel at the end?","c":["Angry at each other","Tired of talking","Worried about the show","Closer than before"],"a":3}],"words":971},{"id":63,"level":3,"emoji":"🏠","theme":"ミセス・チェンの留守番","titleEn":"Three Pages of Instructions","titleJa":"指示書は3ページ","teaser":"ミセス・チェンから重大ミッション：週末の留守番！ 植物、郵便、そして気まぐれな猫のモチ。","story":"It was the last week of September, and Mrs. Chen had a surprising question.\n\nShe waited at her usual table at the cafe, holding a small notebook. When Hana brought her tea, she smiled a shy smile.\n\n“Hana, dear. Could you do me a favor? A rather big one.”\n\n“Of course,” Hana said. “What is it?”\n\n“This weekend, I’m going to Seattle. My son David lives there, and I haven’t visited him since spring. Could you look after my house? The plants, the mail… and Mochi.”\n\n“Me?” Hana asked. “You trust me with Mochi?”\n\n“Mochi has liked you since April,” Mrs. Chen said. “He doesn’t like many people, you know. You should feel proud.”\n\nHana stood a little taller. “I’ll take care of everything. Don’t worry about a thing.”\n\n“Wonderful. Come over on Friday. I’ve written some instructions.” Mrs. Chen patted the notebook. “Just a few small notes.”\n\nOn Friday evening, Hana learned that “a few small notes” meant three full pages.\n\nMrs. Chen walked her through the little house, pointing at everything. It smelled like tea and old books.\n\n“Page one: plants,” she said. “The tomatoes on the porch drink a lot. The orchid inside drinks a little. If you give the orchid too much water, it will get sad.”\n\n“Tomatoes, a lot. Orchid, a little,” Hana repeated. “Got it.”\n\n“Page two: the mail. Put it on this table. If a box comes, sign your name. Don’t worry, I’m only expecting books.”\n\n“And page three?” Hana asked.\n\nMrs. Chen’s face became serious, like a general before a battle. “Page three is Mochi.”\n\nMochi sat on the sofa, washing his white face, pretending not to listen.\n\n“Breakfast at seven. One spoonful of wet food, then dry food. Brush him for five minutes in the evening — he’ll tell you when to stop. He sleeps on the red blanket. He hates loud noises. And Hana, this is important.”\n\n“Yes?”\n\n“If you can’t find him, don’t panic. Check the closet, second shelf. He has a secret hiding spot on my old green sweater. He thinks I don’t know.”\n\nHana wrote everything down. “What should I do if he won’t eat?”\n\n“Warm the food a little. He’s fancier than a French chef.” Mrs. Chen handed her the key. “Call me anytime. Anytime, dear.”\n\n“Have a safe trip!” Hana said. “Say hello to David for me.”\n\nOn Saturday morning, Hana let herself into the quiet house at seven exactly. It felt strange to use a key that wasn’t hers.\n\n“Good morning, Mochi. It’s me, your weekend chef.”\n\nMochi looked at her, looked at his bowl, and gave one royal cry. Breakfast was served, and he ate everything. First job: success.\n\nShe watered the tomatoes, gave the orchid its tiny drink, and stacked two letters on the table. Then she sat for a while in the sunny living room.\n\nThe shelves were full of old textbooks and photos of students — years and years of them. Mrs. Chen had been a teacher for a long time. Somehow, the quiet house felt full of voices.\n\nAfter her shift, Hana returned at six for brushing time. She opened the door and called, “Mochi! I’m back!”\n\nSilence. No white cat on the sofa. No white cat on the red blanket.\n\n“Mochi?” She checked the kitchen. The bedroom. Under the bed. Behind the curtains. Nothing.\n\nHer heart began to race. She had promised to take care of everything, and now the most important thing was missing.\n\n“Okay, don’t panic,” she said out loud. “Page three. Page three!”\n\nShe opened the notebook with shaking hands. “If you can’t find him… check the closet, second shelf.”\n\nHana opened the closet door slowly. There, on a folded green sweater, lay Mochi. He opened one eye, annoyed, as if to say, “You’re early.”\n\n“You scared me!” Hana laughed, and her legs felt weak. She was more relieved than she could say.\n\nThat evening, Mochi allowed exactly seven minutes of brushing, two minutes more than usual. Then he climbed onto her lap and purred like a small engine.\n\nThe phone rang. It was Mrs. Chen. “How’s it going?”\n\n“Everything is fine now,” Hana said. “But one hour ago, I lost your cat.”\n\n“The closet?”\n\n“The closet.”\n\nMrs. Chen laughed her soft laugh. “He did the same thing to me last winter. I looked for him for two hours. You found him faster than I did.”\n\n“Your notebook found him,” Hana said. “How is Seattle?”\n\n“Rainy and wonderful. David cooked dinner, and only a little of it burned. Thank you, Hana. Tonight I’ll sleep well, because Mochi is in good hands.”\n\nOn Sunday, the sun came out. Hana watered the plants, sorted the mail, and read her book with a warm cat on her lap. It was the quietest, most peaceful afternoon she had had in months.\n\n“You know, Mochi,” she said, “six months ago, I couldn’t even order coffee. Now I have a key to a house and a cat who trusts me.”\n\nMochi purred, which probably meant, “Correct.”\n\nShe took a photo of him for Emma, who wrote back, “He’s a better model than you. He sits still.”\n\nOn Sunday evening, Mrs. Chen came home with a small box of jasmine tea for Hana and photos of David’s family.\n\nMochi ran to the door — then, to everyone’s surprise, he rubbed his head against Hana’s leg first.\n\n“Well!” Mrs. Chen said, pretending to be shocked. “Five days ago I had a cat. Now he has a second person.”\n\n“We’re friends now,” Hana said. “He showed me his secret spot.”\n\n“Then it’s official.” Mrs. Chen took her hands. “Thank you, dear. You did a wonderful job.”\n\nWalking home under the first stars, Hana felt ten feet tall.\n\nTo celebrate a job well done, she decided to bake chocolate cookies on Tuesday — a small plan that would soon make a very loud noise.","glossary":[{"w":"do me a favor","ja":"お願いを聞く"},{"w":"look after","ja":"世話をする"},{"w":"instructions","ja":"指示書"},{"w":"orchid","ja":"ラン（花）"},{"w":"spoonful","ja":"スプーン1杯"},{"w":"brush","ja":"ブラシをかける"},{"w":"hiding spot","ja":"隠れ場所"},{"w":"fancier","ja":"より気取った"},{"w":"stacked","ja":"積み重ねた"},{"w":"race","ja":"速く打つ"},{"w":"annoyed","ja":"不機嫌な"},{"w":"relieved","ja":"ほっとした"},{"w":"purred","ja":"喉を鳴らした"},{"w":"sorted","ja":"仕分けした"}],"phrases":[{"en":"Could you do me a favor?","ja":"お願いがあるんだけど。"},{"en":"I’ll take care of everything.","ja":"全部任せてください。"},{"en":"Don’t worry about a thing.","ja":"何も心配しないで。"},{"en":"Have a safe trip!","ja":"気をつけて行ってきてね！"},{"en":"How’s it going?","ja":"調子はどう？"}],"quiz":[{"q":"Where did Mrs. Chen go for the weekend?","c":["Seattle","San Francisco","Japan","New York"],"a":0},{"q":"Where was Mochi hiding?","c":["Under the bed","Behind the curtains","On a sweater in the closet","In the garden"],"a":2},{"q":"Why did Mrs. Chen write three pages of notes?","c":["She loves writing long letters","Her plants and Mochi are very important to her","Hana asked many questions","Her doctor told her to write more"],"a":1}],"words":979},{"id":64,"level":3,"emoji":"🔥","theme":"キッチンの小さな事故","titleEn":"The Loudest Cookie Alarm","titleJa":"クッキーと大音量アラーム","teaser":"お祝いのクッキー作りが一転、キッチンは煙と大音量！ ハナ、初めての「小さな緊急事態」。","story":"Tuesday evening at the Millers’ house began quietly — a little too quietly.\n\nCarol was working the late shift at the hospital. Mike was upstairs, checking a mountain of science tests. Ben was in the living room with his phone, as usual.\n\nHana stood in the kitchen with flour on her hands and a happy plan in her head: chocolate cookies for everyone.\n\n“This is easy,” she said to Daisy, who was watching from her spot by the door. “I’ve made these a hundred times in Japan.”\n\nShe doubled the recipe, because one tray is never enough in a house with Ben. Soon the first tray was in the oven, and the kitchen smelled wonderful.\n\nThen her phone rang. It was a video call from Yui.\n\n“Show me your kitchen!” Yui said. “Mom wants to see it too!”\n\nHana walked around with the phone. “Here is the big fridge. Here is Daisy. Say hello, Daisy.”\n\nDaisy wagged her tail at the screen. In Matsuyama, her mother laughed and waved back.\n\nThey talked about the bakery, about Yui’s classes, about everything. Yui had so much news. Hana sat down at the table, and the minutes flew by.\n\nToo many minutes.\n\n“Wait,” Hana said suddenly. “Do you smell something?”\n\n“Hana, I’m in Japan,” Yui said. “I can’t smell your house.”\n\nGray smoke was sliding out of the oven like a lazy ghost. At that exact moment, the smoke alarm went off.\n\nBEEP! BEEP! BEEP!\n\nIt was the loudest sound Hana had ever heard indoors. Daisy barked. Yui shouted, “What’s happening?!” The phone dropped on the sofa, and the call ended.\n\nBen ran in first. “Something’s burning!”\n\n“The cookies!” Hana turned off the oven and grabbed the door.\n\n“Wait for the smoke to—” Ben started, but Hana had already pulled out the tray. The cookies were small black stones. The edge of the tray kissed her wrist for half a second.\n\n“Ouch!”\n\nMike arrived, taking the stairs three at a time. He saw the smoke, the black cookies, and the red-faced Hana.\n\n“Open the windows!” he called. “Ben, the back door too!”\n\nBen threw open the windows. Mike grabbed a towel and waved it under the alarm like a man saying goodbye to a train. After a long moment, the beeping stopped.\n\nThe kitchen became quiet. Cold evening air rolled in. Daisy sniffed a black cookie and walked away, offended.\n\n“Hana. Are you hurt?” Mike asked.\n\n“Just here. It’s small.” She showed her wrist. A thin red line, like a bracelet.\n\nRight then, the front door opened. Carol stood in the doorway in her nurse’s jacket, looking at the smoke, the towel, and the open windows.\n\n“I was gone for six hours,” she said slowly.\n\n“Welcome home!” Mike said brightly. “The cookies are very, very well done.”\n\nCarol didn’t laugh yet. She came straight to Hana. “Let me see. Okay, that’s a small burn. Come here.”\n\nShe led Hana to the sink and held her wrist under cool running water.\n\n“We keep it here for ten minutes,” Carol said. “Cool water is the best medicine for a small burn.”\n\n“My grandmother always said butter,” Hana said.\n\n“Grandmothers are wonderful and wrong,” Carol said. “No butter, no ice. Just cool water. Does it hurt a lot?”\n\n“It stung at first. Now it’s better.”\n\nCarol checked it again under the light. “Good. It’s not serious. You were lucky. Next time, use the oven mitts, even when you’re in a hurry — especially when you’re in a hurry.”\n\n“I’m so sorry,” Hana said quietly. “I was talking to Yui, and I forgot the timer, and your kitchen—”\n\n“Hana.” Carol smiled and turned off the water. “It happens to everyone. Ask Mike about the Great Pizza Fire of 2019.”\n\n“We agreed to never speak of that,” Mike said.\n\n“The fire truck came,” Ben whispered to Hana. “Two trucks.”\n\n“One truck,” Mike said. “And the pizza was fine in the middle.”\n\nHana laughed, and something tight in her chest became loose. Her phone was buzzing on the sofa — Yui had called back four times. Hana sent a photo of the black cookies and wrote, “Small accident. Everyone is safe. Even the alarm is fine.”\n\nYui answered with a hundred exclamation marks.\n\n“Okay, team,” Carol said, opening the fridge. “We still have dough. Round two. Hana bakes, I watch the burn, and Ben—”\n\n“I’m the timer man,” Ben said, holding up his phone. “Nothing gets past me.”\n\n“Let me help you with the tray. I have the arms of a scientist,” Mike said.\n\n“You have the arms of a science teacher,” Ben said.\n\nThe second batch went into the oven. This time, nobody left the kitchen. They played cards at the table while the sweet smell slowly returned.\n\nWhen the timer rang, Ben shouted, “NOW!” like a rocket engineer, and Hana — wearing two oven mitts — pulled out a tray of perfect golden cookies.\n\nEveryone clapped. Daisy barked once, politely.\n\nThey ate cookies with cold milk at nine at night, and the kitchen smelled like a bakery again. The burned tray sat in the sink, already a family story.\n\n“You know,” Mike said, reaching for his third cookie, “these taste better than the first batch.”\n\n“The first batch was charcoal, Dad,” Ben said.\n\n“Exactly. The bar was low.”\n\nBefore bed, Carol checked Hana’s wrist one more time and put a light bandage on it. “Perfect. You’ll forget it by the weekend.”\n\n“Thank you for fixing me,” Hana said. “And for not being angry.”\n\n“A kitchen without accidents is a kitchen nobody uses,” Carol said. “I’m glad ours gets used.”\n\nAs Hana turned to go upstairs, Mike appeared in the doorway with a measuring tape and a hopeful face.\n\n“So,” he said, “since we’re such a good emergency team… Saturday, the fence and I need you.”","glossary":[{"w":"doubled","ja":"2倍にした"},{"w":"smoke alarm","ja":"火災警報器"},{"w":"went off","ja":"鳴り出した"},{"w":"barked","ja":"ほえた"},{"w":"turned off","ja":"消した"},{"w":"wrist","ja":"手首"},{"w":"waved","ja":"あおいだ"},{"w":"offended","ja":"心外そうに"},{"w":"burn","ja":"やけど"},{"w":"running water","ja":"流水"},{"w":"stung","ja":"ひりひりした"},{"w":"serious","ja":"深刻な"},{"w":"oven mitts","ja":"ミトン"},{"w":"batch","ja":"ひと焼き分"}],"phrases":[{"en":"Something’s burning!","ja":"何か焦げてる！"},{"en":"Open the windows!","ja":"窓を開けて！"},{"en":"Are you hurt?","ja":"けがしてない？"},{"en":"It happens to everyone.","ja":"誰にでもあることだよ。"},{"en":"Let me help you with the tray.","ja":"トレーは手伝うよ。"}],"quiz":[{"q":"What was Hana baking?","c":["Melon bread","A birthday cake","Banana muffins","Chocolate cookies"],"a":3},{"q":"What did Carol do for the small burn?","c":["She put butter on it","She held it under cool water","She put ice on it","She covered it with a hot towel"],"a":1},{"q":"Why did Hana feel better at the end of the night?","c":["The cookies were all gone","Yui stopped calling her","The family laughed with her, not at her","The alarm was broken"],"a":2}],"words":968},{"id":65,"level":3,"emoji":"🔧","theme":"マイクとDIY修理","titleEn":"Measure Twice, Cut Once","titleJa":"測るのは二回、切るのは一回","teaser":"工具だらけのガレージでDIYデビュー！ フェンス修理と巣箱作り、そしてマイクの親父ギャグが炸裂。","story":"Saturday arrived with cool October sunshine, perfect for working outside.\n\nAfter breakfast, Mike stood in the backyard with his hands on his hips, looking at the fence like a doctor looking at a patient.\n\n“See these three boards?” he said. “Loose. Last week’s windstorm knocked them silly. And the birdhouse fell down completely.”\n\nHana picked up the little house from the grass. Its roof was hanging sadly. “Oh no. Where did the birds go?”\n\n“They’ve moved to a hotel,” Mike said. “Just kidding. They’ll come back if we fix it. Ready to learn some tools?”\n\n“Ready,” Hana said. “In Japan, my father fixed everything with tape.”\n\n“A man of style,” Mike nodded. “Today, we go deeper.”\n\nThe garage was Mike’s kingdom. Tools hung on the wall in perfect rows, each with its own painted shadow.\n\n“Lesson one,” Mike said, pointing. “Hammer. Nails. Screwdriver. Screws. Tape measure. Saw. Sandpaper. Repeat after me.”\n\nHana repeated the names twice. The words felt heavy and useful, like the tools themselves.\n\n“Question,” she said. “What’s the difference between a nail and a screw?”\n\n“A nail goes in fast and holds on tight. A screw takes time but holds on tighter. Like friendships.” Mike smiled, proud of himself. “Write that down.”\n\nThey carried everything to the fence. Mike showed her the first loose board.\n\n“We need a new piece for this one. Here’s the tape measure. How long is the gap?”\n\nHana measured carefully. “Sixty-two centimeters. Ah, wait. You use inches here. It says… about twenty-four and a half.”\n\n“Check it again,” Mike said.\n\n“But I just measured it.”\n\n“Family rule,” Mike said, holding up a finger. “Measure twice, cut once. If you measure wrong and cut wrong, the wood is gone forever. Wood doesn’t grow back.”\n\n“It literally grows back,” Ben called from the porch. “It’s a tree.”\n\n“Not by Saturday!” Mike called back.\n\nHana measured again. “Twenty-four and a half. Same answer.”\n\n“Then we cut.” Mike put on his glasses. “I saw it with my own eyes. And now I’ll saw it with my own saw. Get it? Saw? Saw?”\n\n“I get it,” Hana said. “Do I have to laugh?”\n\n“It’s in the contract,” Mike said sadly.\n\nHe cut the board, and Hana smoothed the rough edge with sandpaper. The smell of fresh wood filled the yard.\n\n“Okay, hold it against the fence. Perfect. Hand me the hammer.”\n\nHana handed it over. Mike tapped the first nail in with three easy hits. It looked simple.\n\n“Your turn,” he said. “Small taps first. Watch your fingers.”\n\nHana held the nail, took a breath, and tapped. The nail leaned left like a tired man. Her second try leaned right.\n\n“I’m making a nail family,” she said. “They all have different personalities.”\n\n“Everyone starts like this. Keep your eyes on the head of the nail, not on your hand.”\n\nShe tried again. Tap, tap, tap — and the third nail went in straight and proud.\n\n“I did it!” Hana shouted.\n\n“You nailed it,” Mike said. “Literally. Ben! Your friend here is a natural!”\n\nThey worked down the fence together. Hana measured, Mike cut, and they took turns with the hammer. By eleven, all three boards stood straight and strong.\n\nMike pushed the fence with both hands. It didn’t move. “This fence has stood here for twenty years. If we treat it right, it’ll stand for twenty more.”\n\nDaisy walked by, quietly picked up one of Mike’s work gloves, and carried it away like a prize.\n\n“Daisy. Daisy! That’s my glove!” Mike chased her in a slow circle while Hana laughed until her stomach hurt.\n\nAfter lunch came the birdhouse. Its roof needed two screws and a little love.\n\n“Could you hold this for me?” Hana asked, and Ben — who had appeared when the sandwiches appeared — held the roof in place.\n\nHana turned the screwdriver slowly. The screw pulled the roof down tight. She turned the little house over. It felt sturdy, like a real home.\n\n“Now the fun part.” Mike brought out three small cans of paint. “Color?”\n\nHana didn’t even think. “Blue. Like the Bluebird Cafe. Then the birds will know a baker lives here.”\n\n“Blue it is.”\n\nThe three of them painted in the afternoon sun. Ben painted the roof, Hana painted the walls, and Mike painted his own thumb by accident.\n\nCarol brought out apple cider and looked at their work. “Beautiful. Which one of you painted Mike?”\n\n“He’s self-painted,” Ben said.\n\nWhen the paint dried, Mike and Hana hung the birdhouse on the maple tree, higher than before, safe from the wind.\n\nMike shook Hana’s hand with pretend seriousness. “Miss Sato. We make a good team. You measure better than Ben, and you laugh at thirty percent of my jokes. That’s a record.”\n\n“Thirty percent?” Carol said. “She’s being kind.”\n\nHana looked at the fence, the birdhouse, and the small bandage still on her wrist from Tuesday. One week, one burn, three boards, one blue house.\n\n“In April,” she said, “I didn’t know the word ‘screwdriver.’ Now I have used one. Slowly, my hands are learning English too.”\n\n“That’s the best sentence anyone has ever said in this yard,” Mike said.\n\nJust before dinner, a small gray bird with a black cap landed on the fence. It looked at the blue birdhouse, hopped closer, and peeked inside.\n\n“A chickadee,” Mike whispered. “First guest.”\n\n“Welcome!” Hana whispered. “For here or to go?”\n\nThe bird stayed. Everyone agreed this meant the house was excellent.\n\nAs they carried the tools back, Carol pointed down the street. Two porches already had fat orange pumpkins sitting by their doors.\n\n“Look at that,” she said. “Pumpkin season. Next weekend, we’re carving our own — and you two need to start thinking about costumes.”","glossary":[{"w":"fence","ja":"フェンス・柵"},{"w":"loose","ja":"ぐらぐらの"},{"w":"windstorm","ja":"暴風"},{"w":"hammer","ja":"金づち"},{"w":"nails","ja":"くぎ"},{"w":"screws","ja":"ねじ"},{"w":"tape measure","ja":"メジャー"},{"w":"saw","ja":"のこぎり"},{"w":"sandpaper","ja":"紙やすり"},{"w":"gap","ja":"すき間"},{"w":"glove","ja":"手袋"},{"w":"screwdriver","ja":"ドライバー"},{"w":"sturdy","ja":"頑丈な"},{"w":"chickadee","ja":"コガラ（小鳥）"}],"phrases":[{"en":"Hand me the hammer.","ja":"金づちを取って。"},{"en":"Measure twice, cut once.","ja":"測るのは二回、切るのは一回。"},{"en":"Watch your fingers.","ja":"指に気をつけて。"},{"en":"Could you hold this for me?","ja":"これ持っててくれる？"},{"en":"We make a good team.","ja":"私たち、いいチームだね。"}],"quiz":[{"q":"What made the fence boards loose?","c":["Daisy pushed them","A windstorm","Ben’s basketball","A falling tree"],"a":1},{"q":"What does “Measure twice, cut once” mean?","c":["Check carefully before you act","Cut the wood two times","Buy two tape measures","Work as fast as you can"],"a":0},{"q":"Why did Hana choose blue for the birdhouse?","c":["Blue paint was the cheapest","Blue is Mike’s favorite color","It reminded her of the Bluebird Cafe","Birds can only see blue"],"a":2}],"words":956},{"id":66,"level":3,"emoji":"🎃","theme":"ハロウィンの準備","titleEn":"Pumpkins and Big Decisions","titleJa":"かぼちゃと大きな決断","teaser":"初めてのかぼちゃ彫りに仮装選び！ 妹ユイに「トリック・オア・トリート」を英語で説明できる？","story":"One week before Halloween, fat orange pumpkins sat on almost every porch on the street.\n\nEvery porch except the Millers’. Mike found this unacceptable.\n\n“Team meeting,” he said at breakfast. “Today we drive to the pumpkin patch. It’s tradition. Hana, have you ever carved a pumpkin?”\n\n“Never,” Hana said. “I’ve seen them in movies. The faces always look angry.”\n\n“Ours look confused,” Ben said. “Dad can’t cut straight.”\n\n“That’s my style,” Mike said. “Confused pumpkins scare people more.”\n\nThe pumpkin patch was outside the city, a huge field of orange under a gray sky. Families walked between the rows with wheelbarrows.\n\nHana walked slowly, amazed. “There are hundreds. How do you choose?”\n\n“You don’t choose the pumpkin,” Mike said seriously. “The pumpkin chooses you.”\n\nCarol picked a tall one. Ben found a perfectly round one. Hana finally stopped in front of a small, slightly crooked pumpkin that leaned to one side.\n\n“This one,” she said. “It’s bigger than my head, and it looks a little shy. Like me in April.”\n\n“Perfect,” Carol laughed. “A shy pumpkin for our brave baker.”\n\nBack home, Carol covered the kitchen table with newspaper. “Okay, everyone. Let’s carve pumpkins.”\n\nMike drew a face on his pumpkin with a marker. Then he cut a circle around the top and lifted it like a little hat.\n\n“Now the fun part,” Ben said, rolling up his sleeves. “You have to scoop out the inside. We call it pumpkin guts.”\n\nHana put her hand in and made a face. “It’s so sticky! And cold! It feels like… like wet spaghetti.”\n\n“Best description ever,” Ben said. “Keep scooping.”\n\nThey saved the seeds in a big bowl. Carol washed them and put them in the oven with salt and oil. “Roast them for twenty minutes, and they become the best snack in October.”\n\nHana drew her design carefully: two round eyes, a small nose, and a smiling mouth with one tooth. Then, next to the face, she drew whiskers and pointed ears.\n\n“Wait,” Ben said. “Is that a cat?”\n\n“It’s Mochi,” Hana said. “A jack-o’-lantern Mochi. Mrs. Chen will love it.”\n\nMike helped her with the knife for the hard parts. Her hand was slow but careful — baker’s hands. When they finished, Mike carved his own: triangle eyes and a very confused mouth.\n\nThat evening they put candles inside. The pumpkins glowed warm and orange on the porch steps. The cat pumpkin seemed to smile.\n\n“Beautiful,” Carol said. “Now we decorate.”\n\nThey hung fake spider webs on the bushes and taped paper ghosts to the windows. Ben climbed a ladder and hung little orange lights around the door.\n\n“If it rains, the paper ghosts will get wet,” Hana said. “Sad, wet ghosts.”\n\n“Then they’ll be scarier,” Mike said. “Nothing is scarier than laundry.”\n\nWhile they worked, Hana’s phone buzzed. It was the cafe group chat. Emma had written, “HALLOWEEN PLAN: everyone wears a costume to work on Friday!!! No boring exceptions!!!”\n\nThen a message came from Leo: “I have three cowboy hats. I will be three percent more cowboy than last year.”\n\nEmma: “I’m going to be a sunflower. Rosa says she’ll be a pirate queen. Hana!!! What are you going to be?”\n\nHana stared at her phone. She typed, “I don’t know yet. I can’t decide.”\n\n“You have one week,” Emma wrote. “Choose something that is very YOU.”\n\nAt dinner, the family discussed it like a serious business meeting.\n\n“Zombie,” Ben said. “Easy. You just walk slowly and hate mornings. I do it every day.”\n\n“A ghost is classic,” Mike said. “One old sheet, two holes. Done. Budget: zero dollars.”\n\n“Something that is very me…” Hana said slowly. “In Japan, I was a baker. Here, I’m becoming a baker again. So…”\n\nShe sat up. “What about a witch? But not a scary witch. A kitchen witch. Black hat, my work apron, and a wooden spoon instead of a magic wand.”\n\nCarol clapped her hands. “That’s a great idea! I have a black dress you can borrow, and we’ll find a hat this week.”\n\n“A witch who bakes magic cookies,” Ben said. “Honestly? Better than zombie.”\n\nLater that night, Hana texted Yui in Japan. “Next Friday is Halloween! I’m going to be a kitchen witch.”\n\nYui wrote back fast. “I saw Halloween photos from America. Kids in costumes at people’s doors. They say trick or treat. What does that mean?”\n\nHana smiled and typed her answer like a small teacher. “Kids knock on your door and say ‘Trick or treat!’ It means: give me candy, or I’ll play a little trick on you. So everyone gives candy, and nobody gets tricked.”\n\n“Wait,” Yui wrote. “Strangers just GIVE you free candy? All night?”\n\n“All night. We already bought a huge bag. Ben says we need two, because Ben eats one.”\n\n“That’s it,” Yui wrote. “I’m moving to America. Save a costume for me.”\n\n“Come in November and I’ll show you everything,” Hana typed, laughing. “No candy in November. But I’ll bake you something better.”\n\nBefore bed, Hana looked out the window. The two pumpkins glowed on the steps, one confused, one gently smiling with whiskers. Paper ghosts danced in the wind. Little orange lights blinked around the door.\n\nSix months ago, she thought, I didn’t know this holiday at all. Now I have a costume plan, a pumpkin cat, and a spoon that will become a magic wand.\n\nShe took a photo of the porch and sent it to Emma and Leo. Emma answered with fifteen pumpkin emojis. Leo answered, “The cat pumpkin is the new boss of the street.”\n\nHalloween was still seven days away — and for the first time in her life, Hana couldn’t wait to open the door to strangers.","glossary":[{"w":"pumpkin patch","ja":"かぼちゃ畑"},{"w":"carved","ja":"彫った"},{"w":"wheelbarrows","ja":"手押し車"},{"w":"crooked","ja":"ゆがんだ"},{"w":"scoop out","ja":"かき出す"},{"w":"sticky","ja":"べたべたの"},{"w":"seeds","ja":"種"},{"w":"Roast","ja":"オーブンで焼く"},{"w":"whiskers","ja":"ひげ"},{"w":"jack-o’-lantern","ja":"カボチャ提灯"},{"w":"triangle","ja":"三角の"},{"w":"glowed","ja":"光った"},{"w":"spider webs","ja":"クモの巣"},{"w":"costume","ja":"仮装・衣装"},{"w":"knock","ja":"ノックする"}],"phrases":[{"en":"Let’s carve pumpkins.","ja":"かぼちゃを彫ろう。"},{"en":"What are you going to be?","ja":"何に仮装するの？"},{"en":"I can’t decide.","ja":"決められないよ。"},{"en":"That’s a great idea!","ja":"それ、すごくいいね！"},{"en":"What does that mean?","ja":"それ、どういう意味？"}],"quiz":[{"q":"Where did the family get their pumpkins?","c":["At the supermarket","From Mrs. Chen’s garden","At a pumpkin patch","From the Bluebird Cafe"],"a":2},{"q":"What is Hana going to be for Halloween?","c":["A ghost","A sunflower","A zombie","A kitchen witch"],"a":3},{"q":"Why does Yui joke, “I’m moving to America”?","c":["Because kids get free candy on Halloween","Because she misses Hana","Because she loves pumpkins","Because she wants to meet Daisy"],"a":0}],"words":953},{"id":67,"level":3,"emoji":"👻","theme":"ハロウィン当日","titleEn":"Trick or Treat!","titleJa":"トリック・オア・トリート！","teaser":"キッチン魔女ハナ、ハロウィン本番へ。仮装だらけのカフェと、夜の玄関に来る小さなお客さま。","story":"Halloween morning arrived at last, and the Miller house woke up in costume.\n\nHana came downstairs first: black dress, black pointed hat, her white work apron, and a wooden spoon in her belt. The kitchen witch was ready.\n\nBen shuffled in next with gray face paint and torn clothes. “Morning,” he groaned. “I’m a zombie.”\n\n“You look like that every morning,” Mike said. He was wearing his white lab coat, safety glasses, and hair that pointed in six directions. “Behold! The mad scientist!”\n\n“Dad, you look like that every morning too,” Ben said.\n\nCarol came in last, in her regular sweater, with one tiny pumpkin pin. “I’m a nurse on her day off,” she said. “The scariest costume of all. Ask any hospital.”\n\n“Happy Halloween!” Hana said, and everyone said it back, even the zombie.\n\nAt the cafe, the door opened into another world. Orange lights hung over the counter. Paper bats flew across the windows. And behind the register stood a pirate queen.\n\n“Welcome aboard!” Rosa boomed. She wore a long coat, a big hat with a feather, and a plastic sword. “Captain Rosa doesn’t steal gold. Only tips.”\n\nEmma spun around in a green dress with a huge yellow flower around her face. “I’m a sunflower! Water me with compliments!”\n\n“You look amazing!” Hana said.\n\n“I’m growing already,” Emma said happily.\n\nLeo arrived last, wearing three cowboy hats stacked one on top of the other, all the way up.\n\n“Why three?” Hana asked. She had to ask.\n\n“Last year, one hat. People said, ‘Nice hat.’ This year, they’ll say, ‘Nice hats.’ That’s growth,” Leo said. “In this cafe, only Emma is allowed to grow?”\n\nHana had brought her secret weapon: two big boxes of ghost-shaped cookies with little chocolate eyes. Rosa put them by the register with a sign: “MAGIC COOKIES — BAKED BY A REAL KITCHEN WITCH.”\n\nAll day, customers came in costume. A doctor who was really a teacher. A cat who was really a bank worker. Two dogs in tiny dinosaur jackets — real dogs.\n\nHana took orders from wizards and queens, and every third customer said some version of “You look amazing!” By noon she had learned to answer, “Thank you! The spoon is real. The magic is decaf.”\n\nMrs. Chen came in at ten, as always. Her costume was one small black headband with cat ears.\n\n“I’m Mochi today,” she said. “He doesn’t know. Don’t tell him.”\n\n“Your secret is safe,” Hana laughed, and gave her a ghost cookie with her tea. “Help yourself. Witch’s treat, no charge.”\n\nBy four o’clock, the cookie boxes were empty. Rosa looked at Hana over her pirate hat.\n\n“Next year, four boxes,” she said. “A pirate knows treasure when she sells it.”\n\nIn the evening, Hana hurried home for her second job: candy duty with Ben.\n\nThe porch was ready. The two pumpkins glowed on the steps — Mike’s confused face and Hana’s smiling pumpkin cat. Daisy sat by the door in a small orange bandana, calm and important.\n\n“Rules,” Ben said, holding a giant bowl of candy. “Two pieces per kid. Three if the costume is great. And we don’t eat the candy ourselves.”\n\n“You’ve already eaten some,” Hana said.\n\n“I’m a zombie. We have different rules.”\n\nAt six, the doorbell rang for the first time. Three superheroes stood on the steps, capes moving in the wind.\n\n“Trick or treat!”\n\n“Happy Halloween!” Hana said, dropping candy into their bags. “Fly safely!”\n\nAfter that, the waves never stopped. Princesses, robots, a walking taco, a whole family of skeletons. A tiny astronaut who said “thank you” through a helmet, very seriously.\n\nBetween visitors, Ben taught her the important skills: how to guess costumes fast, and how to say “Wow, so scary!” to very small monsters without laughing.\n\nAround seven thirty, a little green dinosaur climbed the steps alone. Maybe four years old. His mother waited on the sidewalk.\n\nThe dinosaur looked up at Hana. He opened his mouth. Nothing came out. His eyes started to shine with tears.\n\nHana knew that feeling — standing in front of a stranger, with words stuck inside. Six months ago, that was her at every counter in Portland.\n\nShe knelt down slowly and took off her witch hat. “Hi,” she said softly. “I like your costume. Don’t be shy. You can say it very quietly, and I’ll still hear it.”\n\nThe dinosaur took a big breath. “Trick… or treat,” he whispered.\n\n“PERFECT,” Hana whispered back. “That was the best one all night.” She put a whole handful of candy into his bag, and Ben added one more piece on top.\n\nThe little dinosaur ran back to his mother, roaring with joy. She waved thank you from the sidewalk.\n\n“Nice work, witch,” Ben said quietly.\n\n“I was that dinosaur,” Hana said. “In April, I was that dinosaur every single day.”\n\nBy nine, the street grew quiet. They turned off the porch light, the international sign for “no more candy,” and counted the leftover pieces. Eleven. Ben claimed all of them for zombie reasons.\n\nCarol made hot apple cider, and they sat in the kitchen, tired and happy. Hana’s phone buzzed — a photo from Yui: she had bought a tiny pumpkin in Matsuyama and drawn a face on it with a pen.\n\n“Next year, we do Halloween together,” Yui wrote.\n\nHana looked at her witch hat on the table, at the empty candy bowl, and at her own reflection in the dark window. Today she had talked with a hundred strangers, and she hadn’t felt scared once.\n\n“Best holiday ever?” Carol asked.\n\n“Best holiday ever,” Hana said.\n\nAs she fell asleep, she remembered Monday’s English class. The teacher had promised a friendly battle of opinions — and everyone would have to pick a side.","glossary":[{"w":"shuffled","ja":"足を引きずった"},{"w":"groaned","ja":"うめいた"},{"w":"lab coat","ja":"白衣"},{"w":"pirate queen","ja":"海賊の女王"},{"w":"feather","ja":"羽根"},{"w":"compliments","ja":"ほめ言葉"},{"w":"stacked","ja":"積み重ねた"},{"w":"ghost-shaped","ja":"おばけ形の"},{"w":"headband","ja":"カチューシャ"},{"w":"glowed","ja":"光った"},{"w":"astronaut","ja":"宇宙飛行士"},{"w":"knelt down","ja":"ひざをついた"},{"w":"whispered","ja":"ささやいた"},{"w":"handful","ja":"ひとつかみ"},{"w":"leftover","ja":"残りの"}],"phrases":[{"en":"Happy Halloween!","ja":"ハッピーハロウィン！"},{"en":"You look amazing!","ja":"その格好、最高だね！"},{"en":"Help yourself.","ja":"ご自由にどうぞ。"},{"en":"Trick or treat!","ja":"お菓子をくれなきゃいたずらしちゃうぞ！"},{"en":"Don’t be shy.","ja":"恥ずかしがらないで。"}],"quiz":[{"q":"What did Leo wear on Halloween?","c":["Three cowboy hats","A pirate coat","A sunflower costume","A lab coat"],"a":0},{"q":"Who could not say “Trick or treat” at first?","c":["A tiny astronaut","A small dinosaur","A superhero","Ben"],"a":1},{"q":"Why was this Halloween special for Hana?","c":["She got more candy than Ben","Her cookies won a prize","She wore the scariest costume","She talked to many strangers without fear"],"a":3}],"words":961},{"id":68,"level":3,"emoji":"📝","theme":"クラスでミニ討論","titleEn":"Cats or Dogs?","titleJa":"猫派？犬派？大討論","teaser":"英会話クラスで初のディベート！ お題は「猫か犬か」。犬好きハナ、まさかの猫チームに！？","story":"A few days after Halloween, the evening English class was full of leftover candy and big smiles.\n\nTheir teacher stood at the whiteboard with a mysterious look. On the board, she had written two big words: CATS and DOGS.\n\n“Tonight,” she said, “we’re having our first debate. The question is simple: cats or dogs — which one is the better friend?”\n\nThe classroom exploded with happy noise. Everyone had an opinion. Everyone started sharing it at the same time.\n\n“Wait, wait!” the teacher laughed. “That’s exactly why we practice. In a debate, we take turns. We listen. And we disagree politely. Tonight, these phrases are your best friends.”\n\nShe wrote them on the board: “I see your point.” “I agree with you.” “That’s exactly how I feel.” “In my opinion…”\n\n“Now, the teams. Everyone, come and draw a paper from the box.”\n\nHana walked up and drew her paper. She opened it, and her mouth fell open. CAT TEAM.\n\n“No,” she whispered. “I live with the best dog in Oregon.”\n\n“Ha!” said Omar, holding up his paper. He was an engineer from Egypt, and he had two dogs at home. “I got the dog team. Justice exists.”\n\nSofia, a nurse from Mexico, sat down next to Hana. “Cat team? Me too. But I must tell you a secret — I’m allergic to cats.”\n\n“Our team is perfect,” Hana said. “A dog lover and a sneezing woman, fighting for cats.”\n\nThe teams got ten minutes to prepare. Hana thought hard. Then she remembered September — the quiet weekend at Mrs. Chen’s house, the notebook, the closet, the small warm engine on her lap.\n\n“Actually,” she told Sofia, “I have real cat experience. Write this down.”\n\nThe debate began. Omar’s team went first.\n\n“Dogs are loyal,” Omar said grandly. “If you are sad, your dog knows first. My dogs wait at the door every evening. Has a cat ever waited for anyone?”\n\nThe dog side clapped. Hana’s hand almost clapped too. She caught it just in time.\n\nSofia stood up for the cats. “Dogs need walks at six in the morning. In the rain. In the snow. A cat is independent. A cat says: relax, human, I’ll take care of myself.”\n\n“I see your point,” Omar said politely. “But that’s not friendship. That’s a roommate who doesn’t pay rent.”\n\nEven the cat team laughed at that one.\n\nThen it was Hana’s turn. Her heart beat fast, but her voice came out clear.\n\n“Last month, I took care of a cat named Mochi for three days,” she said. “At first, he hid from me in a closet. But on the last day, he sat on my lap and purred. Do you know how that felt?”\n\nThe room was quiet, listening.\n\n“It felt like winning a prize. A dog gives his heart to everyone on day one. A cat watches you, and thinks about it, and then chooses you. When a cat chooses you, you feel chosen.”\n\n“Ooooh,” said the whole class.\n\nDavid, a quiet student from Korea, raised his hand for the dog team. “Good point. But when you cry, a dog comes immediately. My dog found my daughter every time she cri
