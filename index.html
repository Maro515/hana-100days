n the middle of the yard and looked up. Flakes landed on her eyelashes and melted on her cheeks. In Matsuyama, snow was rare and shy — a thin morning visitor, gone by noon. This snow meant it. It was writing winter across the whole sky.\n\n“It’s so quiet,” she said. “Snow has its own kind of quiet. Like the world is holding its breath.”\n\n“That’s very poetic,” said Ben’s voice behind her. “Anyway. Watch out!”\n\nA snowball exploded softly on her shoulder.\n\nHana turned around slowly, dramatically. “Ben Miller. That was a mistake.”\n\n“Prove it,” Ben grinned, already packing his next snowball.\n\nThe battle of the front yard lasted fifteen minutes. Hana discovered that her bakery hands could pack a fast, accurate snowball, and Ben discovered it too, mostly with his face. Mike joined and betrayed both sides equally. Daisy chased every snowball and caught none, which was somehow the best part.\n\nFinally they stood breathing hard, covered in white, while Carol laughed from the porch with her phone out.\n\n“That photo goes to Yui,” Hana called.\n\n“Already sent,” Carol said. “She answered with thirty exclamation marks.”\n\nAcross the fence, a small light came on. Mrs. Chen stood at her window, watching the snow with Mochi in her arms. Hana waved, and Mrs. Chen waved Mochi’s white paw back — a snow cat for a snow night.\n\n“Hot chocolate for all soldiers,” Carol announced. “Inside, before your ears fall off.”\n\nThe kitchen filled with steam and wet socks. Carol made her serious hot chocolate — real milk, real chocolate, and a marshmallow iceberg on top. They drank it at the window, watching the snow keep falling.\n\n“To the first snow,” Mike said, raising his mug. “And to whoever invented hot chocolate. A true hero of science.”\n\n“To warm socks,” Ben added.\n\n“To green coats from the thrift store,” Hana said, and they clinked their mugs like a tiny orchestra.\n\n“School will open two hours late tomorrow, I bet,” Ben said hopefully.\n\n“In this city? Three centimeters of snow, and everything stops,” Mike said. “Buses give up. Meetings disappear. Portland sees snow and forgets how to be a city. It’s our little tradition.”\n\n“In Japan, my town would call this ‘light weather,’” Hana laughed. “But I like the Portland way. Snow should be an event.”\n\nShe wrapped her hands around the warm cup, and a quiet thought floated down with the snow: this is my first real winter here — and my only one.\n\nThe thought wasn’t heavy, exactly. It just made everything shine a little brighter, like the streetlight making diamonds on the yard.\n\nThat night, before bed, Hana wrote in the sky-blue journal: “Day 79. Snow turns old dogs young and grown-ups into kids. My new coat is green. My hands still remember the snowball fight. I want to remember all of it.”\n\nShe was closing the journal when Carol knocked gently on her door, two mugs of tea in her hands.\n\n“Still awake? Good,” Carol said. “The snow made me want to talk. About winter — and about what comes after. Do you have a minute for the porch? Bundle up.”","glossary":[{"w":"cold snap","ja":"急な冷え込み"},{"w":"puddle","ja":"水たまり"},{"w":"thrift store","ja":"リサイクル店"},{"w":"secondhand","ja":"中古の"},{"w":"wool","ja":"ウール・羊毛"},{"w":"rack","ja":"洋服掛け"},{"w":"tag","ja":"値札"},{"w":"flake","ja":"ひとひらの雪"},{"w":"stick","ja":"（雪が）積もる"},{"w":"deploy","ja":"出動する"},{"w":"propeller","ja":"プロペラ"},{"w":"eyelash","ja":"まつげ"},{"w":"snowball","ja":"雪玉"},{"w":"betray","ja":"裏切る"},{"w":"marshmallow","ja":"マシュマロ"}],"phrases":[{"en":"It’s snowing!","ja":"雪が降ってる！"},{"en":"Bundle up.","ja":"厚着してね。"},{"en":"Try this on.","ja":"これ、着てみて。"},{"en":"It looks good on you.","ja":"似合ってるよ。"},{"en":"Watch out!","ja":"気をつけて！／危ない！"}],"quiz":[{"q":"Where did Hana buy her green winter coat?","c":["At the mall","At a thrift store","At the supermarket","At the airport"],"a":1},{"q":"Who noticed the snow first?","c":["Hana","Carol","Mike","Ben"],"a":3},{"q":"Why did Daisy run in circles in the snow?","c":["Snow makes her happy and playful","She was afraid of the cold","She was looking for food","She heard Mrs. Chen’s cat"],"a":0}],"words":1156},{"id":80,"level":4,"emoji":"💭","theme":"キャロルと将来の話（ポーチにて）","titleEn":"Two Mugs on a Snowy Porch","titleJa":"雪の夜、ポーチでの本音","teaser":"雪の降る夜、キャロルと二人きりのポーチ。「この一年が終わったら、どうするの？」初めて言葉にする、将来の夢と迷い。","story":"The snow was still falling when Hana and Carol stepped onto the porch with their tea.\n\nCarol had brought two thick blankets, and they wrapped themselves up on the porch swing like two caterpillars with mugs. The yard glowed white and blue in the streetlight, and the snowball battlefield had already smoothed over, as if the evening had never happened.\n\nFor a while, they just drank their tea and watched the flakes come down.\n\n“I love the porch in the snow,” Carol said finally. “The world gets quiet enough to hear yourself think. I do my best thinking out here. And my best asking.”\n\n“Your best asking?”\n\nCarol smiled into her mug. “Mm-hmm. Because I have a question, and it’s not a small one. Hana — December is coming. Your flight home is in four weeks. So I’ll just ask the big one. What are your plans? After this year, I mean. Sometimes I watch you thinking about it at dinner, and I wondered when we’d finally talk.”\n\nHana held her mug a little tighter. The steam rose and disappeared into the cold.\n\n“That’s a tough question.” She was quiet for a moment. “You saw me thinking? I thought I was hiding it well.”\n\n“Honey, I’m a nurse and a mother. Hiding things from me is a lost cause.”\n\nHana laughed, and then the laugh faded into something softer. “Honestly? I don’t know. And it’s starting to scare me a little. Everyone at home expects me to come back. The bakery in Matsuyama said the door is open. My mother counts the days. But…”\n\n“But,” Carol said gently. “That’s an important ‘but.’ Go on. I’m all ears.”\n\nThe words came out slowly, like footprints in fresh snow.\n\n“When I’m here, I miss Matsuyama. The sea, the castle on the hill, my family’s kitchen. But when I call home, I already miss Portland — the cafe, this porch, the rain, all of you. It’s like… I have two homes now, and one heart. It feels wrong to choose. Whichever I choose, I lose something.”\n\nCarol was quiet for a moment. The snow ticked softly against the porch roof.\n\n“Can I tell you a story?” she said. “When I was twenty-four — your exact age — I finished nursing school, and a hospital in Alaska offered me a job. Alaska, Hana. I was a girl from Oregon who had never even seen real winter. Everyone said, ‘Stay. It’s safer. Why so far?’ And part of me wanted to listen, because staying was easy and warm.”\n\n“What did you do?”\n\n“I cried for a week, and then I went. Two years in a small town, ice on the windows, northern lights over the parking lot. It was the hardest thing I ever did, and it made me the nurse I am. The person I am, honestly. When I came back, I was different — and because I was different, I was brave enough to talk to a certain funny science teacher at a friend’s barbecue.”\n\n“Mike?!”\n\n“Mike.” Carol grinned. “He opened with a terrible joke about ketchup. I laughed anyway, and thirty years later, we’re still passing the ketchup. So in a strange way, this whole family exists because a scared girl got on a plane. Here’s what I learned from all of it. Follow your heart. But — and this is the part people forget — your heart isn’t a compass with one needle. It grows. It learns new directions. Yours has been growing all year. I’ve watched it happen at my own kitchen table.”\n\nHana looked out at the snow, and the true thing she had never said out loud rose up in her.\n\n“Carol… can I tell you a dream? I’ve never told anyone. Not even Yui.”\n\n“Take your time.”\n\n“Someday — I don’t know when, I don’t know where — I want a small place of my own. A little cafe or bakery. Warm light, good bread, maybe six tables. A place where a nervous person can walk in, and someone learns their name, and slowly they stop being nervous.” She smiled at her hands. “A place like Bluebird. What Bluebird did for me — I want to be that for somebody.”\n\nCarol didn’t say anything at first. When Hana looked up, Carol’s eyes were shining.\n\n“Now that,” Carol said, “is a real dream. Not ‘stay or go.’ Bigger than that. A dream you can build in Matsuyama, or in Portland, or anywhere with an oven and a door.”\n\n“You think I could really do it?”\n\n“I think you already started. Who created the matcha latte? Who charms the whole Saturday crowd? Rosa says you have cafe bones. She said it to me at Thanksgiving, actually, over the pie. She had a look in her eye, that woman.”\n\nHana laughed. “What look?”\n\n“The Rosa look. The one she gets before she cooks up a plan.” Carol shook her head. “Anyway. You don’t have to decide tonight. December will ask its question soon enough. Just promise me two things.”\n\n“Anything.”\n\n“One: when you decide, decide from love, not from fear. Fear makes small choices. Love makes true ones.” Carol held up two fingers. “Two: whatever you choose, wherever you land — this room, this porch, this family? Yours. Forever. That part is already decided, and you get no vote.”\n\nHana’s throat went tight. She leaned her head on Carol’s shoulder, the way she had wanted to since April but had been too polite to do.\n\n“Okay,” she whispered. “Deal. But I have one extra rule. When I open my little place someday — wherever it is — the first two cups of coffee are for you and Mike. Forever free.”\n\n“Accepted,” Carol laughed. “We’ll be extremely loyal customers.”\n\nThey stayed like that while the snow kept falling, two mugs going cold, the porch swing creaking its slow song. Inside the house, they could hear Mike telling Ben a joke, and Ben groaning, and Daisy’s tail thumping against the sofa. Home noises. Hana closed her eyes and saved the sound like a photograph.\n\n“Your tea is ice,” Carol said at last. “In you go. Big thoughts need big sleep.”\n\nBut Hana lay awake a while longer that night, and it wasn’t worry keeping her up. It was something warmer, turning over and over in her chest.\n\nFour weeks left. She couldn’t control what came after December. But she could decide what to do with the time she still had — and she wanted to give something back. To the neighborhood that had learned her name. To the street that had made her brave.\n\nShe opened the sky-blue journal and wrote: “Day 80. Carol asked about my plans. I told her my secret dream, and it didn’t sound crazy in the snow. I don’t know yet where my life goes. But I know what I want my last month here to mean.”\n\nUnder that, she wrote three words and circled them twice: “Give something back.”\n\nBy morning, the three words had grown into an idea — and the idea was too good to keep to herself. Tomorrow, she would tell Rosa.","glossary":[{"w":"porch swing","ja":"ポーチのブランコ"},{"w":"caterpillar","ja":"いも虫"},{"w":"battlefield","ja":"戦場"},{"w":"smoothed over","ja":"ならされる"},{"w":"lost cause","ja":"無駄な努力"},{"w":"footprint","ja":"足あと"},{"w":"northern lights","ja":"オーロラ"},{"w":"compass","ja":"方位磁針"},{"w":"needle","ja":"針"},{"w":"charm","ja":"魅了する"},{"w":"cooks up a plan","ja":"計画を練る"},{"w":"creak","ja":"きしむ"},{"w":"groan","ja":"うめく"},{"w":"turning over","ja":"何度も考える"},{"w":"give something back","ja":"恩返しする"}],"phrases":[{"en":"What are your plans?","ja":"これからの予定はどうするの？"},{"en":"That’s a tough question.","ja":"それは難しい質問だね。"},{"en":"I’m all ears.","ja":"じっくり聞くよ。"},{"en":"Take your time.","ja":"ゆっくりでいいよ。"},{"en":"Follow your heart.","ja":"自分の心に従って。"}],"quiz":[{"q":"Where did Hana and Carol have their long talk?","c":["In the kitchen","At the Bluebird Cafe","On the porch","In the car"],"a":2},{"q":"What did Carol ask Hana about?","c":["Her plans after this year","Her favorite food","Ben’s homework","The price of her coat"],"a":0},{"q":"How did Hana feel after the talk?","c":["Angry at Carol","Sure she would stay in Portland forever","Afraid to ever go home","Warmer and lighter, with a new idea growing"],"a":3}],"words":1189},{"id":81,"level":4,"emoji":"💡","theme":"チャリティイベントの思いつき","titleEn":"A Sweet Idea","titleJa":"とびきり甘いアイデア","teaser":"フードバンクのチラシを見たハナの胸に、あるひらめきが。勇気を出してロサに「聞いてほしいの」——","story":"The first week of December wrapped Portland in cold, silver light.\n\nAt the Bluebird Cafe, the morning rush had just ended. Hana wiped the counter and watched the steam rise from her cup of tea.\n\nMrs. Chen sat at her usual table by the window, holding a paper flyer. She waved Hana over.\n\n“Look at this, dear,” she said. “The neighborhood food bank is asking for help. Winter is their hardest season.”\n\nHana read the flyer slowly. Families in the neighborhood needed food. Donations were down this year, and the holidays were coming.\n\n“I didn’t know,” Hana said quietly. “I walk past that building every week. I never thought about the people inside.”\n\n“Most of us don’t,” Mrs. Chen said. “Until somebody reminds us.”\n\n“Do you know the food bank well, Mrs. Chen?” Hana asked, sitting down across from her.\n\n“I volunteered there for years,” Mrs. Chen said. “They give out food boxes every week. Rice, bread, vegetables, canned soup. For some families, it’s the difference between a hard month and an impossible one.”\n\nHana nodded slowly. She had never needed a food box in her life. The thought sat heavy in her chest all through the lunch hour.\n\nShe steamed milk, rang up orders, and smiled at customers, but her mind was somewhere else.\n\nShe thought about her old bakery in Matsuyama. Every December, the owner baked extra bread and carried it to the children’s home near the station. Hana used to carry the warm boxes herself.\n\nDuring the afternoon break, Emma studied her face. “Okay, spill it,” she said. “You’ve been quiet all day. That’s not like you anymore.”\n\nHana laughed. “Am I that easy to read?”\n\n“Like an open book,” Emma said. “A very polite open book. Come on, what’s going on?”\n\nHana took a breath. “I have an idea. But I don’t know if it’s too big.”\n\n“Too big is my favorite size,” said Leo, sliding over with a tray. “Does it involve food? Please say it involves food.”\n\n“It does, actually.” Hana held up the flyer. “The food bank needs donations. What if the cafe held a special event? A charity bake day.”\n\nEmma’s eyes went wide. “Tell me more.”\n\n“We bake special things for one day. Cookies, cakes, maybe some Japanese sweets. All the money goes to the food bank. People get something delicious, and families get help.”\n\n“People here already love your baking,” Emma said. “Remember the dorayaki you made in June? Mike still talks about them.”\n\nLeo whistled. “A bake sale with Hana in the kitchen? The line would go around the block.”\n\n“There’s just one problem,” Emma said, glancing at the office door. “December is Rosa’s busiest month. She might say it’s too much.”\n\nHana felt her old shyness rise in her chest, the way it used to in April. Back then, she could barely order a coffee. Now she had to sell an idea.\n\n“Then I’ll ask her properly,” she said. “The worst she can say is no.”\n\nWhen Rosa came out of the office, Hana walked straight to her before her courage could leave.\n\n“Rosa, do you have a minute? I have an idea, and I’d like to tell you before I get too scared.”\n\nRosa laughed her big laugh. “That’s the best opening I’ve heard all year. Go ahead.”\n\n“I want us to hold a charity bake day. One Saturday, here at the cafe. We bake, we sell, and every dollar goes to the neighborhood food bank.”\n\nRosa crossed her arms. Her face turned serious, which was rare. “Hana, it’s December. We’re short on time, we’re short on hands—”\n\n“Hear me out. Please,” Hana said gently.\n\nRosa raised her eyebrows, then nodded. “All right. I’m listening.”\n\n“In Matsuyama, my old bakery gave bread to a children’s home every winter. I carried the boxes. I saw the kids’ faces. I’ve never forgotten it.”\n\n“This neighborhood has given me everything,” Hana went on. “A job, friends, a family away from home. I want to give something back before the year ends.”\n\nThe cafe went quiet. Even Leo, for once, said nothing.\n\n“And people want to help in December,” Hana added. “They just need an easy way to do it. We can be that way. Buy a cookie, help a neighbor. Simple.”\n\n“I’ll plan it carefully. I’ll do the extra baking early in the morning, and the regular work won’t suffer. I promise. What do you think?”\n\n“Whoa, am I in this plan?” Emma said. “Good. Because I was going to join anyway. Count me in.”\n\n“Me too,” Leo said. “I’ll charm the customers. It’s my one true talent.”\n\nRosa looked from one face to another. Then she looked at Hana for a long moment.\n\n“Eight months ago, you dropped a tray of muffins and apologized for ten minutes,” she said slowly. “Now you’re standing in my cafe, asking me to run a charity event.”\n\n“Is that a yes?” Hana asked, her heart pounding.\n\n“It’s a yes,” Rosa said, and her laugh came back like sunshine. “Let’s give it a shot. But we do it right — a real plan, a budget, and a job for everyone.”\n\nEmma cheered. Leo drummed on his tray. Mrs. Chen clapped from her table.\n\n“I heard everything,” she said happily. “I’m old, not deaf. Put me down for three dozen of whatever Hana bakes.”\n\nThat evening, Hana burst into the Millers’ kitchen, cheeks pink from the cold, and told them everything in one long breath.\n\n“A charity bake day!” Carol said. “Hana, that’s wonderful. I see it at the hospital all the time — good food matters more than people think.”\n\nMike grinned. “Need tables? I can build you a whole booth. It’ll be my greatest work since the birdhouse.”\n\n“The birdhouse leans left,” Ben said, without looking up from his phone. Then he did look up. “But this sounds really cool. I can post about it online. My friends will share it everywhere.”\n\n“Really? All of you?” Hana looked around the warm kitchen. “You don’t even work at the cafe.”\n\n“Family helps family,” Carol said simply. Mike said, “In.” Ben said, “In.” Daisy barked once, softly, which everyone agreed meant yes.\n\n“A bake sale for the food bank,” Mike said, rubbing his chin. “You could say it’s… a sweet idea.”\n\nEveryone groaned. Daisy hid her nose under her paw.\n\nLater, in her room, Hana opened her notebook and wrote at the top of a clean page: Bake Day Plan.\n\nUnder it she wrote: Ask everyone. Make a list. Don’t panic. Then she drew a small smiling face.\n\nDownstairs, she could still hear Mike and Ben arguing happily about the shape of the booth. Outside her window, the streetlights glowed on the frosty road.\n\nHer phone buzzed. It was Yui: “A charity event?? My sister is amazing. Matsuyama is proud of you!”\n\nHana smiled and turned off the light.\n\nTomorrow the real planning would begin — and Hana had never led a meeting in English in her life.","glossary":[{"w":"flyer","ja":"チラシ"},{"w":"food bank","ja":"フードバンク"},{"w":"donation","ja":"寄付"},{"w":"volunteered","ja":"奉仕活動した"},{"w":"canned","ja":"缶詰の"},{"w":"spill it","ja":"白状して"},{"w":"charity","ja":"慈善"},{"w":"go around the block","ja":"角まで並ぶ"},{"w":"courage","ja":"勇気"},{"w":"charm","ja":"魅了する"},{"w":"budget","ja":"予算"},{"w":"booth","ja":"屋台"},{"w":"groaned","ja":"うめいた"}],"phrases":[{"en":"I have an idea.","ja":"いい考えがあるの。"},{"en":"Hear me out.","ja":"最後まで聞いて。"},{"en":"What do you think?","ja":"どう思う？"},{"en":"Count me in.","ja":"私も入れて。"},{"en":"Let’s give it a shot.","ja":"やってみよう。"}],"quiz":[{"q":"Who showed Hana the food bank flyer?","c":["Rosa","Emma","Mrs. Chen","Leo"],"a":2},{"q":"Why was Rosa worried at first?","c":["December is a very busy month for the cafe","She does not like baking","The food bank was closed","Hana asked for more money"],"a":0},{"q":"Why does Hana want to hold the bake day?","c":["She wants to become famous","She needs money for a trip","Rosa told her to do it","She wants to give something back to the neighborhood"],"a":3}],"words":1163},{"id":82,"level":4,"emoji":"📋","theme":"ベイクデーの企画会議","titleEn":"The Person with the Notebook","titleJa":"ノートを持つ人がリーダー","teaser":"閉店後のカフェで作戦会議。テーブルの上座に座るのは、なんとハナ！？英語で初めての司会に挑む。","story":"On Monday evening, the Bluebird Cafe closed its doors early — but the lights stayed on.\n\nInside, the tables had been pushed together into one long island. Rosa set down a pot of coffee, and Carol brought a tin of cookies from home.\n\nAround the table sat the whole team: Emma, Leo, Mike, Ben, Carol, Mrs. Chen, and, at the head of the table, one nervous baker from Matsuyama.\n\n“Why am I sitting here?” Hana whispered to Rosa. “The head of the table is for the boss.”\n\n“Tonight the boss is the person with the notebook,” Rosa said, pointing at Hana’s notebook. “Lead the way, boss.”\n\nHana looked at the seven faces watching her. Her heart beat fast, but it was a good kind of fast.\n\n“Okay.” She opened her notebook and stood up. “Thank you for coming, everyone. Let’s get started.”\n\n“First, the date. Rosa and I checked the calendar, and we’re thinking the second Saturday of December. That gives us twelve days to get ready.”\n\n“Twelve days?” Emma said. “That’s fast.”\n\n“It is,” Hana said. “But any later, and everyone will be busy with Christmas. Any earlier, and we won’t be ready.”\n\nMike nodded. “Twelve days is enough. In twelve days I once built a whole tree house.”\n\n“It fell down,” Ben said.\n\n“It fell down beautifully,” Mike said.\n\nHana laughed and wrote the date in her notebook. “Next, the goal. I called the food bank this morning and asked what one thousand dollars could do.”\n\nShe looked up from her notes. “They said it could help feed thirty families for two weeks. So that’s our goal. One thousand dollars in one day.”\n\nThe table went quiet for a moment. The number felt big and real.\n\n“Thirty families,” Carol repeated softly. “That’s not just a number. That’s thirty kitchens with food in them.”\n\n“Then we’d better be organized,” Rosa said. “A day like this doesn’t run on sugar alone.”\n\n“Right,” Hana said. “There’s a lot to do. Let’s split the work. I made a list of jobs. When I read one, please raise your hand.”\n\nShe took a breath. This was the part she had practiced in the mirror.\n\n“Who wants to handle the flyers and posters?”\n\nEmma’s hand shot up so fast she almost knocked over her coffee. “Me! I’m already drawing a little bird with a chef’s hat. His name is Baker Blue.”\n\n“Approved,” Hana said, smiling. “Who wants to handle the drinks on the day?”\n\n“That’s me,” Leo said. “Coffee, cocoa, and my special Brazilian hot chocolate. Also, I will provide the music. Every great event needs a soundtrack.”\n\n“Quiet music,” Rosa said.\n\n“Quietly amazing music,” Leo said.\n\nHana checked her list. “Tables and the outdoor booth?”\n\n“Leave that to me,” Mike said, cracking his knuckles. “I’ll build a booth so strong that the rain will apologize to it.”\n\n“The internet is mine,” Ben said. “I already made a page for the event. Forty people said they’re interested, and I only posted it last night.”\n\n“Forty?” Hana said. “Ben, that’s wonderful.”\n\n“That’s the internet,” Ben shrugged, but his ears turned pink with pride.\n\nCarol raised her hand next. “I’ll help with the baking on Friday night, and I’ll bring my first-aid kit on the day. Nurses never rest.”\n\n“And I,” said Mrs. Chen grandly, “will stand by the door and greet every single customer. I welcomed children at school for thirty years. Everyone came in smiling.”\n\n“Then you’re our official greeter,” Hana said, writing it down. “The first face of Bake Day.”\n\nRosa leaned forward. “That leaves the money side. Ingredients aren’t free, and I won’t take a single dollar from the donations to pay for them.”\n\n“What if local shops helped?” Emma asked. “They could donate supplies, and we thank them on a big sign by the door.”\n\n“I like it,” Rosa said. “I’ll talk to my suppliers too. And the big order — flour, butter, sugar, eggs — I’ll take care of it. Double the usual amount.”\n\nHana wrote FLOUR in large letters and circled it twice. “The baking depends on that order. Without flour, there is no Bake Day.”\n\n“Relax,” Rosa said. “I’ve used the same supplier for fifteen years. That truck always arrives.”\n\n“Now, prices,” Hana said. “I want families to feel welcome. Two dollars for cookies, three for brownies, four for the special rolls. Does that sound fair?”\n\nBen nodded. “That works for me. Even my wallet agrees, and my wallet is usually empty.”\n\n“Speaking of money,” Mike said, with the face he always made before a pun. “A bake sale is hard work. You really have to… raise the dough.”\n\nThere was a long silence. “Dough means money,” Mike explained happily. “But it’s also bread dough. You see, it works two ways—”\n\n“We see it, Dad,” Ben said. “We just don’t want it.”\n\nEveryone laughed, even Mike, and Daisy — who had been sleeping under his chair — thumped her tail on the floor.\n\nHana looked down at her notebook. Every job had a name next to it. The plan was becoming real, page by page.\n\n“One more thing,” she said. “The menu. I want to bake something that mixes Japan and Portland. I’ll bring test recipes on Sunday — matcha rolls, and maybe anko brownies.”\n\n“Anko?” Ben asked.\n\n“Sweet red bean paste,” Hana said. “Trust me. Chocolate and anko are going to be good friends.”\n\n“My stomach volunteers for that meeting,” Leo said.\n\nRosa stood and refilled everyone’s cups. “All right. Jobs, date, goal, prices. Did we forget anything?”\n\n“A name,” Emma said. “Every event needs a name.”\n\nThey tried a few. Cookie Christmas. The Great Bluebird Bake. Sweet Day for a Good Cause.\n\nThen Mrs. Chen said, “Why not keep it simple? Bluebird Bake Day.”\n\nHana repeated it quietly. “Bluebird Bake Day.” It sounded warm, like the cafe itself. Everyone nodded at the same time.\n\n“Then that’s our name,” Hana said. “Any questions?”\n\n“Just one,” Leo said, raising his hand very seriously. “What happens to the cookies that break? Asking for a friend.”\n\n“The friend is his stomach,” Emma said.\n\nHana closed her notebook. “Then we’re done. Flyers start tomorrow. Emma and I will visit the shops and ask them to put up posters.”\n\n“I’ll print them tonight,” Emma said. “Baker Blue flies at dawn.”\n\nRosa raised her coffee cup. “To Bluebird Bake Day. And to Hana, who just ran her first meeting like she’s been doing it for years.”\n\n“To Hana!” everyone said, and cups clinked all around the long table.\n\nHana felt her cheeks go warm. In April, she had practiced saying “Could I get a small latte?” to a mirror. Tonight she had led a whole meeting in English, and nobody had noticed her shaking hands.\n\nWell — almost nobody. Under the table, Carol reached over and gave her hand a small, warm squeeze.\n\nThe next morning, Hana and Emma would set out into the cold with a bag full of flyers and one big question: would strangers say yes?","glossary":[{"w":"head of the table","ja":"上座"},{"w":"organized","ja":"手際がよい"},{"w":"knuckles","ja":"指の関節"},{"w":"shrugged","ja":"肩をすくめた"},{"w":"pride","ja":"誇り"},{"w":"first-aid kit","ja":"救急箱"},{"w":"greeter","ja":"案内係"},{"w":"donate","ja":"寄付する"},{"w":"supplier","ja":"仕入れ先"},{"w":"raise the dough","ja":"資金を稼ぐ"},{"w":"thumped","ja":"ドンと打った"},{"w":"red bean paste","ja":"あんこ"},{"w":"clinked","ja":"カチンと鳴る"},{"w":"squeeze","ja":"ぎゅっと握る"}],"phrases":[{"en":"Let’s get started.","ja":"さあ、始めよう。"},{"en":"Let’s split the work.","ja":"分担しよう。"},{"en":"I’ll take care of it.","ja":"私に任せて。"},{"en":"That works for me.","ja":"私はそれでいいよ。"},{"en":"Any questions?","ja":"何か質問は？"}],"quiz":[{"q":"How many days do they have until Bake Day?","c":["Seven","Twelve","Twenty","Thirty"],"a":1},{"q":"Who will make the flyers and posters?","c":["Ben","Rosa","Carol","Emma"],"a":3},{"q":"How did Hana feel after the meeting?","c":["Proud, because she led a meeting in English","Sad, because nobody helped her","Angry about Mike’s joke","Bored, because the meeting was long"],"a":0}],"words":1166},{"id":83,"level":4,"emoji":"🖨","theme":"チラシ作りと街での告知","titleEn":"Baker Blue Flies at Dawn","titleJa":"ベイカーブルー、街を飛ぶ","teaser":"エマ渾身のチラシを手に、二人は商店街へ。断られても笑顔で次へ！最後に訪ねたのは意外なお店で……","story":"Tuesday morning was bright and freezing — perfect weather, Emma said, for a mission.\n\nThey met at the cafe at nine. Emma pulled a thick roll of flyers from her bag, wrapped like a treasure.\n\n“Ready?” she said. “Say hello to Baker Blue.”\n\nThe flyer showed a round blue bird in a chef’s hat, holding a cookie above the words: BLUEBIRD BAKE DAY — Saturday, 10 a.m. Every dollar goes to the neighborhood food bank.\n\n“Emma, it’s perfect,” Hana said. “He looks kind and hungry at the same time.”\n\n“That’s my art style,” Emma said. “Kind and hungry.”\n\nRosa gave them advice at the door. “Keep it short, smile, and don’t be sad about a no. A no just means a longer walk to a yes.”\n\nLeo called from behind the counter, “And if they say no, tell them Leo will sing outside their shop every day until they change their minds. That always works.”\n\nTheir first stop was the little bookstore on Maple Street. Hana held the flyer, then paused with her hand on the door.\n\n“Nervous?” Emma asked.\n\n“A little. Asking for help is harder than giving it.”\n\n“Then we ask together,” Emma said, and pushed open the door.\n\nA bell rang. The owner, a tall man with round glasses, looked up from a pile of books.\n\n“Good morning! Do you have a minute?” Hana asked. “We’re from the Bluebird Cafe down the street.”\n\n“The place with the matcha latte,” the man said. “I have three minutes and a weakness for that latte. Go ahead.”\n\nHana explained the event in five sentences, the way she had practiced. Then she held out the flyer. “Would you mind putting this up in your window?”\n\n“It’s for a good cause. All the money goes to the food bank,” Emma added.\n\nThe man read the flyer slowly. Then he smiled and taped it right on the front door, facing the street.\n\n“Best spot in the shop,” he said. “Books and cookies belong together.”\n\n“Thanks so much. See you Saturday!” Hana said, bowing a little before she could stop herself.\n\nOutside, Emma raised her hand for a high five. “One down. That was smooth, Hana. Five sentences, big smile, boom.”\n\nThe barbershop was next. Gus, the barber, was cutting an old man’s hair while both of them argued about football.\n\nHe read the flyer without stopping his scissors. “Bake sale, huh? Will there be brownies?”\n\n“Anko brownies,” Hana said. “A Japanese-American recipe. Sweet red bean and chocolate.”\n\n“No idea what that is,” Gus said. “Save me six. Tape the flyer next to the mirror, where everyone stares.”\n\nThe man in the chair opened one eye. “Save me six too. I’m retired. I have time to eat brownies.”\n\nBy noon, they had visited eleven shops, and nine had said yes. The flower shop, the pet store, the tiny pizza place — window after window, Baker Blue spread down the street.\n\nAt the flower shop, the owner gave them two small roses “for luck.” At the pizza place, the cook promised to send his customers across the street for dessert.\n\nThen came the big supermarket on Fifth.\n\nThe manager was a young man in a stiff blue vest. He listened politely, hands behind his back.\n\n“I’m sorry,” he said at last. “It’s a nice event. But company rules say no outside posters. Head office decides what goes on our walls, not me.”\n\n“I understand,” Hana said. “Thank you for listening. Please come by on Saturday as a neighbor, if you like. We’d really appreciate it.”\n\n“Maybe I will,” he said, and for a second the manager disappeared and a person appeared. “Good luck.”\n\nOutside, Emma kicked a small stone. “Head office,” she grumbled. “Head office never ate a warm cookie in its life.”\n\n“He wasn’t mean,” Hana said. “He was just doing his job. In April, a no like that would have hurt me all day. Now it’s just… one no.”\n\n“When did you get so wise?” Emma asked.\n\n“Somewhere between April and December,” Hana said, and they both laughed.\n\nAs they turned to go, a voice called after them. A young cashier had followed them out, hugging her arms in the cold.\n\n“I heard everything,” she said quietly. “I can’t post the flyer, but I can come. My family used the food bank when I was small. Saturday, I’ll be there first in line.”\n\nHana didn’t know what to say, so she said the true thing. “Then I’ll save you something sweet.”\n\nThe last stop was the one Hana feared most: Rise and Shine Bakery, on the far side of the park.\n\n“A bakery asking a bakery for help,” she said. “Isn’t it strange? We’re almost rivals.”\n\n“Rivals is a strong word,” Emma said. “You sell matcha rolls. They sell giant cinnamon rolls. The city needs both.”\n\nInside, the air smelled of warm sugar. A woman in her fifties stood behind the counter, flour up to her elbows and a pencil behind her ear.\n\n“Bluebird Cafe,” she said before Hana could speak. “You’re the one behind the matcha latte. I sent a spy to try it. He never came back — he just keeps buying more.”\n\nHana laughed. “I’m Hana. And you’re…?”\n\n“Grace. Twenty-two years behind this counter.” She wiped her hand and shook Hana’s firmly. “What can I do for you?”\n\nHana explained — the food bank, the bake day, the goal of one thousand dollars. Grace listened with her arms crossed, nodding slowly.\n\n“Would you mind putting this up?” Hana asked, holding out a flyer. “I know we’re a little bit… competitors.”\n\nGrace snorted. “Competitors? Honey, bakers are a team the rest of the world just hasn’t noticed yet.”\n\nShe taped Baker Blue in the very center of her front window, moving her own poster aside to do it.\n\n“Advice from an old baker,” she said. “Bake more than you think you need. Then bake more than that. You’ll still run out.”\n\n“And one more thing.” She wrote a number on a paper bag and pressed it into Hana’s hand. “If anything goes wrong before Saturday — anything — you call me. Bakers stick together.”\n\nWalking back through the park, Hana held the paper bag like something precious.\n\n“Grace is amazing,” she said. “Twenty-two years. Imagine all the bread she has baked.”\n\n“Twenty-two shops today, too,” Emma counted. “Eighteen yeses, two nos, one maybe, and one barber who ordered six brownies twice.”\n\n“Twelve, actually,” Hana said. “He added six more when we left.”\n\nAt the cafe, Mrs. Chen was waiting with her coat already on. “Give me a stack,” she said. “The community center, the library, my knitting club. Nobody says no to me, dear. I was a teacher.”\n\nThat evening, Ben ran into the kitchen holding his phone like a trophy.\n\n“Two hundred people interested! And — wait for it — a message from Rose City Radio. They saw the event page. They want someone from the cafe on the morning show. Thursday. Live.”\n\nEveryone turned and looked at Hana at exactly the same time.\n\n“Live?” Hana said, in a very small voice. “On the radio? In English?”\n\nSomewhere under the table, Daisy thumped her tail — which, as everyone knew, meant yes.","glossary":[{"w":"mission","ja":"任務"},{"w":"treasure","ja":"宝物"},{"w":"taped","ja":"テープで貼った"},{"w":"high five","ja":"ハイタッチ"},{"w":"scissors","ja":"はさみ"},{"w":"retired","ja":"退職した"},{"w":"head office","ja":"本社"},{"w":"grumbled","ja":"ぼやいた"},{"w":"cashier","ja":"レジ係"},{"w":"rivals","ja":"ライバル"},{"w":"competitors","ja":"競争相手"},{"w":"snorted","ja":"鼻で笑った"},{"w":"precious","ja":"貴重な"},{"w":"stack","ja":"束"}],"phrases":[{"en":"Do you have a minute?","ja":"ちょっといいですか？"},{"en":"Would you mind putting this up?","ja":"これを貼ってもらえませんか？"},{"en":"We’d really appreciate it.","ja":"そうしてもらえると嬉しいです。"},{"en":"It’s for a good cause.","ja":"良いことのためなんです。"},{"en":"Thanks so much.","ja":"本当にありがとう。"}],"quiz":[{"q":"Who drew Baker Blue for the flyer?","c":["Emma","Hana","Ben","Rosa"],"a":0},{"q":"Why did the supermarket manager say no?","c":["He hated the cafe","He was too busy to listen","Company rules did not allow outside posters","He did not like cookies"],"a":2},{"q":"Why did Grace give Hana her phone number?","c":["She wanted to sell her bakery","She wanted to help if anything went wrong","She needed a job at Bluebird","She wanted free coffee"],"a":1}],"words":1202},{"id":84,"level":4,"emoji":"📻","theme":"ローカルラジオに生出演","titleEn":"On Air with Hana Sato","titleJa":"オンエアの赤いランプ","teaser":"ラジオ生出演が決定！数千人が聞いている!?緊張のスタジオで、松山のパン屋の思い出を語り始めると——","story":"Thursday morning arrived far too quickly, and it arrived in the dark.\n\nHana stood in the Millers’ kitchen at six a.m., dressed and terrified, holding a cup of tea she was too nervous to drink.\n\nThe night before, the family had held a practice interview. Mike had played the host, using a spatula as a microphone.\n\n“So, Ms. Sato,” he had said in a deep radio voice, “is it true that your cookies can bring world peace?”\n\n“Mike, ask real questions,” Carol had laughed. But the silly practice had helped. Hana had answered real questions too, twenty of them, until her sentences came out smooth.\n\nBen had recorded the whole thing “for history.” Daisy had slept through it, which Mike said was the highest praise.\n\nNow Rosa’s car pulled up outside, headlights cutting through the winter dark.\n\n“Ready, superstar?” Rosa asked as Hana climbed in.\n\n“No,” Hana said honestly. “But I have notes, and I practiced. In April I couldn’t order coffee. I suppose I can survive a radio.”\n\n“That’s the spirit,” Rosa said. “More or less.”\n\nRose City Radio lived on the second floor of an old brick building. Inside the studio, everything was soft carpet, warm lamps, and a red sign that said ON AIR.\n\nThe host, Marcus, had gray hair, bright sneakers, and the kindest voice Hana had ever heard at six forty in the morning.\n\n“Relax,” he said, shaking her hand. “This isn’t a test. It’s just two people talking, and a few thousand neighbors listening in.”\n\n“I’m a little nervous. A few thousand people?” Hana whispered.\n\n“Don’t count them,” Marcus smiled. “Talk to one. Imagine one kind person making breakfast.”\n\nHana thought of Mrs. Chen at her kitchen table, with Mochi and a cup of green tea. Her shoulders came down from her ears.\n\nA producer fitted big headphones over Hana’s ears. “Sound check. Say anything.”\n\n“Um… good morning?”\n\n“Perfect. You’re a natural.”\n\nThe red light blinked on. Music faded. Marcus leaned into his microphone.\n\n“Good morning, Portland! This is Marcus on Rose City Radio, and today we have a special guest — Hana Sato from the Bluebird Cafe. Welcome, Hana!”\n\n“Good morning. Thank you for having me.” Her voice came out thin, but it came out.\n\n“Now, Hana, you came here all the way from Japan. And this Saturday, you’re running something called Bluebird Bake Day. Tell us about it.”\n\n“Yes. It’s a charity event at our cafe. We bake cookies, cakes, and Japanese sweets, and every dollar goes to the neighborhood food bank.”\n\n“Every dollar! And whose idea was this?”\n\nHana paused. “Mine,” she said, and she heard the small wonder in her own voice. “It all started when I saw a flyer. The food bank needs help in winter, and this neighborhood… this neighborhood has carried me all year. I wanted to carry something back.”\n\nMarcus was quiet for a moment, in a way that radio hosts rarely are.\n\n“Tell me about Japan,” he said gently. “Was there a moment there, before all this?”\n\n“That’s a great question.” Hana took a breath, and the studio disappeared, and she was sixteen again, in Matsuyama.\n\n“I worked at a small bakery in my hometown. Every December, my boss baked extra bread for the children’s home near the station. I carried the boxes. The children always ran to the door before I could knock.”\n\n“They didn’t say thank you for the bread,” she said. “They said thank you for remembering us. I have never forgotten that. Bread is food, but remembering — remembering is warm.”\n\nThrough the glass, Hana saw Rosa in the hallway, pressing a tissue to her eyes and pretending it was allergies.\n\n“Folks, I have interviewed mayors with less heart,” Marcus said. “Now, the important part. What exactly can we eat on Saturday?”\n\nHana laughed, and the last of her fear melted. “Matcha rolls — soft rolls with Japanese green tea cream. Anko brownies — chocolate with sweet red bean. And Rosa’s famous apple cake.”\n\n“I’m canceling my breakfast right now,” Marcus said. “One more question. Eight months ago, could you have done this interview?”\n\nHana laughed again. “Eight months ago, I practiced ordering a latte in front of a mirror. Today I am on the radio. English is strange and wonderful.”\n\n“So is courage,” Marcus said. “Where and when, Hana?”\n\n“Bluebird Cafe, this Saturday, from ten in the morning. Come early, because a wise baker told me we will run out. We’d love to see you there.”\n\n“You heard her, Portland. Bluebird Bake Day, Saturday, ten a.m. Buy a cookie, feed a neighbor. Hana Sato, thank you for coming in.”\n\n“Thank you,” Hana said, and meant it with her whole heart.\n\nThe red light went dark. Marcus took off his headphones and grinned.\n\n“You told me you were nervous. Nobody in this city could tell. That story about the children — that’s why local radio exists.”\n\nIn the hallway, Rosa hugged her so hard that Hana’s notes flew everywhere.\n\n“The phones,” said the producer, poking her head out of another door. “The text line, actually. It hasn’t stopped. Listen to this one.”\n\nShe read from a screen: “My grandfather took me to a food bank when times were hard. Saturday I’m bringing my own grandkids to Bake Day. Tell that baker: some of us remember too.”\n\nHana had to look out the window for a while after that.\n\nOutside, the winter sun was finally up. Rosa bought two hot chocolates from a cart, and they leaned on the car and drank them like two people who had just landed a plane.\n\n“I’m proud of you,” Rosa said. “And I’m only your boss. Imagine your mother.”\n\nBack at the cafe, the morning was madness — the good kind.\n\nThe bookstore owner came in waving his radio like a flag. Gus the barber called to change his brownie order from twelve to twenty.\n\nEmma had already drawn a new sign: AS HEARD ON THE RADIO, with Baker Blue wearing headphones. Leo greeted every customer with, “You want the radio special? It doesn’t exist yet, but it sounds good, no?”\n\nMrs. Chen arrived with her entire knitting club, seven ladies who all wanted to meet “the radio star.”\n\n“I knew her before she was famous,” Mrs. Chen told them proudly. “She waters my plants.”\n\nThe ladies bought every scone in the cafe and promised to return with friends on Saturday.\n\nBen slid his phone across the counter that evening. “Event page: five hundred and twelve people interested. Five. Hundred. We might need a bigger cafe.”\n\n“We might need more flour,” Rosa said, half joking, and made a note to check on her big order in the morning.\n\nHana looked around the warm, loud cafe and felt something she had no English or Japanese word for. It was the feeling of a plan growing wings.\n\nFive hundred people, one small kitchen — and only three days until Sunday’s test kitchen, where the famous matcha rolls would have to be invented for real.","glossary":[{"w":"terrified","ja":"おびえた"},{"w":"spatula","ja":"フライ返し"},{"w":"on air","ja":"放送中"},{"w":"host","ja":"司会者"},{"w":"sound check","ja":"音声確認"},{"w":"a natural","ja":"天性の人"},{"w":"wonder","ja":"驚き"},{"w":"allergies","ja":"アレルギー"},{"w":"mayors","ja":"市長"},{"w":"producer","ja":"制作担当"},{"w":"grandkids","ja":"孫たち"},{"w":"madness","ja":"大騒ぎ"},{"w":"knitting","ja":"編み物"}],"phrases":[{"en":"Thank you for having me.","ja":"お招きありがとうございます。"},{"en":"I’m a little nervous.","ja":"少し緊張しています。"},{"en":"It all started when I saw a flyer.","ja":"きっかけは一枚のチラシでした。"},{"en":"That’s a great question.","ja":"いい質問ですね。"},{"en":"We’d love to see you there.","ja":"ぜひ来てくださいね。"}],"quiz":[{"q":"Where did Hana give her interview?","c":["At the Bluebird Cafe","At the library","At Ben’s school","At Rose City Radio"],"a":3},{"q":"What story did Hana tell on the radio?","c":["Her first day in Portland","Carrying bread to a children’s home in Japan","Losing her wallet in June","Her sister’s visit in November"],"a":1},{"q":"How did Hana feel by the end of the interview?","c":["Angry at Marcus","Ready to go back to Japan","Calm and even proud — her fear had melted","Bored with radio"],"a":2}],"words":1167},{"id":85,"level":4,"emoji":"🧁","theme":"和洋コラボの試作会","titleEn":"Best Friend Brownies","titleJa":"しんゆうブラウニー誕生","teaser":"本番前の試作会。抹茶ロールは苦すぎ!?あんことチョコの運命の出会い、そしてレオの危険な隠し玉とは。","story":"Sunday was invention day at the Bluebird Cafe.\n\nThe sign on the door said CLOSED, but behind it the kitchen was louder than a busy Monday.\n\nHana stood at the big table like a scientist, surrounded by bowls, whisks, and little mountains of flour and sugar.\n\nHer team wore aprons. Carol measured ingredients. Emma sat in the corner with her sketchbook, designing labels. Leo controlled the music and, he said, the “kitchen energy.”\n\nMike and Ben sat at the counter wearing paper hats that said OFFICIAL TASTE TESTER. Emma had made them. They took the job very seriously.\n\n“Rule one,” Hana said. “Honest opinions only. If something is bad, say it’s bad. On Saturday, five hundred people will taste these. Today, you save me.”\n\n“I was born honest,” Ben said. “Also hungry.”\n\n“Then we begin. Test number one: matcha rolls.”\n\nHana had been dreaming about these rolls for a week — soft white bread, rolled with sweet cream and bright green matcha. She slid the first tray from the oven.\n\nThey smelled like a spring field. They looked perfect. Everyone reached for one.\n\n“How does it taste?” Hana asked, holding her breath.\n\nBen chewed. His face did something complicated.\n\n“Honest?” he said. “It tastes like grass had a fight with my tongue. And the grass won.”\n\n“Too much matcha,” Carol said kindly, reaching for water. “It’s beautiful, but it’s very, very bitter.”\n\nHana wrote in her notebook: Version one. Too bitter. Ben’s tongue lost a fight.\n\n“In Japan, we love that bitterness,” she said. “But maybe I should meet Portland in the middle.”\n\nVersion two had more sugar and less matcha. Mike tried it and frowned a different frown.\n\n“Now it’s cake for babies,” he said. “Sweet, sweet, nothing else. I forgot the taste while I was still chewing.”\n\n“Less sugar, better matcha,” Hana said, rolling up her sleeves. “Version three. Carol, the good cream, please.”\n\nThe third tray came out golden. The cream made soft green spirals in every roll. Hana cut one into six pieces, and the kitchen went quiet.\n\n“Give it a try.” She stepped back and made herself wait.\n\nSix people chewed at the same time. Six pairs of eyebrows went up at the same time.\n\n“Oh,” said Emma.\n\n“Oh,” said Mike.\n\nCarol said it slowly. “It’s sweet but not too sweet. The matcha is soft, like a warm afternoon. Hana, this is it.”\n\nBen held up his empty hand, which a second ago had held a roll. “My review is that it’s gone.”\n\nHana let out a long breath and drew a big circle in her notebook. “Version three. Matcha rolls — done.”\n\nHalfway through, Mrs. Chen had appeared at the back door with a pot of proper green tea. “You cannot judge a matcha roll with coffee,” she said firmly, and poured a cup for everyone.\n\n“Next patient,” Leo announced. “The anko brownies!”\n\nThe first batch looked strange. The sweet red bean had sunk to the bottom, leaving a dark, heavy line under the chocolate.\n\n“It tastes right,” Carol said, “but the anko is hiding. It’s like a song where you can’t hear the singer.”\n\nHana thought about it, tapping her wooden spoon. In her head she saw her old boss in Matsuyama, folding cream into dough with three gentle turns, never more.\n\n“Don’t mix it in,” she said suddenly. “Swirl it. On top. Like a pattern.”\n\nThe second batch came out with beautiful red-brown waves across the chocolate. They waited for the brownies to cool. They did not wait very well.\n\n“What’s the word for this?” Hana asked, pressing the top gently. “Chewy? Gooey?”\n\n“Fudgy,” said Emma. “Gooey is wetter. Chewy is your matcha rolls. English has a word for every texture, and they all sound funny.”\n\nMike bit first. He closed his eyes and said nothing for a dangerously long time.\n\n“Mike?” Carol asked.\n\n“It melts in your mouth. The chocolate is deep, the anko is gentle, and I am having a moment,” he whispered. “Please respect my moment.”\n\nEveryone laughed and grabbed a piece, and then everyone had a moment.\n\n“Chocolate and anko,” Emma said, licking her thumb. “You told us they’d be good friends. They’re best friends. That’s the name — Best Friend Brownies.”\n\nHana clapped her hands. “Perfect. And in Japanese, tomodachi. I’ll write both on the sign.”\n\nThen it was Leo’s turn. He had begged all week for one wild card, and now he stepped up with a tray and dramatic music.\n\n“Friends, I present: the Brazilian Fire Cookie. Chocolate, cinnamon, and a tiny, tiny bit of chili.”\n\n“How tiny?” Rosa asked.\n\n“Tiny like my modesty,” Leo said, which should have been a warning.\n\nBen bit, went red, and drank milk straight from the carton while everyone shouted at him about cups.\n\n“Version one needs… editing,” Leo admitted.\n\nBut Hana tasted the smallest corner, fanned her mouth, and stopped. Under the fire there was something warm and interesting.\n\n“Leo, don’t throw it away. Less chili. Add caramel and a little salt. Trust me — sweet, salty, warm. My old boss made a miso caramel once. It sold out every day.”\n\nThe new cookie came out of the oven twenty minutes later, golden and quiet-looking, like it had never caused any trouble at all.\n\nRosa tried it, and her eyebrows told the story before her mouth did.\n\n“This one’s a keeper. We’ll call it the Fire and Snow Cookie,” she said. “Leo, you’re promoted from wild card to baker’s assistant.”\n\nLeo bowed deeply. “I accept. My mother in Brazil will cry with pride.”\n\n“She cries when Brazil wins at soccer,” Ben said.\n\n“She cries at everything,” Leo said proudly. “It’s where I get my heart.”\n\nBy late afternoon, the menu was set: matcha rolls, Best Friend Brownies, Fire and Snow Cookies, and Rosa’s apple cake — plus Leo’s hot chocolate and the matcha latte that had started it all.\n\nThen came the hard math. Hana opened her notebook to a clean page.\n\n“Grace told me: bake more than you think you need, then more than that. So — two hundred rolls, a hundred and fifty brownies, three hundred cookies, and six apple cakes.”\n\nCarol whistled. “That’s a lot of butter.”\n\n“That’s a lot of everything,” Rosa said. “Good thing my big order arrives on Thursday. Twenty bags of flour, mountains of butter and sugar.”\n\nWhile the others washed bowls, Carol and Hana stood at the sink, hands in the warm water.\n\n“Where did you learn to fix a recipe like that?” Carol asked. “The swirl, the caramel — that’s not from a book.”\n\n“From my old boss in Matsuyama,” Hana said. “He always said: the recipe is the map, but your hands are the driver.”\n\n“Your hands drove beautifully today,” Carol said, bumping her shoulder gently.\n\nHana looked around the messy, happy kitchen — flour in Emma’s hair, chocolate on Ben’s hat, Leo singing to the dishes.\n\nOutside the window, a light snow began to fall, soft as powdered sugar.\n\nFive days until Bake Day. The recipes were ready, the team was ready, and all they needed now was Thursday’s flour truck.\n\nAnd flour trucks, as Rosa liked to say, always arrive.","glossary":[{"w":"whisks","ja":"泡立て器"},{"w":"ingredients","ja":"材料"},{"w":"taste tester","ja":"試食係"},{"w":"bitter","ja":"苦い"},{"w":"version","ja":"試作版"},{"w":"frowned","ja":"顔をしかめた"},{"w":"spirals","ja":"うず巻き"},{"w":"swirl","ja":"渦を描く"},{"w":"chewy","ja":"もちもちの"},{"w":"gooey","ja":"とろとろの"},{"w":"fudgy","ja":"ねっとり濃厚"},{"w":"texture","ja":"食感"},{"w":"wild card","ja":"意外な切り札"},{"w":"carton","ja":"紙パック"},{"w":"promoted","ja":"昇格した"}],"phrases":[{"en":"How does it taste?","ja":"味はどう？"},{"en":"Give it a try.","ja":"ためしてみて。"},{"en":"It’s sweet but not too sweet.","ja":"甘いけど甘すぎないね。"},{"en":"It melts in your mouth.","ja":"口の中でとろけるよ。"},{"en":"This one’s a keeper.","ja":"これは決まりだね。"}],"quiz":[{"q":"What was wrong with the first matcha rolls?","c":["They were too bitter","They were too salty","They were too small","They had no cream"],"a":0},{"q":"Why did the second batch of brownies work?","c":["Ben mixed them for a long time","They used no anko at all","They baked them twice","Hana swirled the anko on top instead of mixing it in"],"a":3},{"q":"Why did Emma name them Best Friend Brownies?","c":["Because Emma made them with Ben","Because chocolate and anko became best friends","Because they were a gift for Rosa","Because brownies were her favorite food"],"a":1}],"words":1193},{"id":86,"level":4,"emoji":"😰","theme":"前日の危機","titleEn":"Charity Flour Has No Price","titleJa":"小麦粉ゼロの大ピンチ","teaser":"本番前日、まさかの知らせ。小麦粉が届かない！街じゅう探しても足りない。ハナが握りしめたのは——","story":"On Friday morning, the day before Bake Day, Hana woke up with a list in her head and a song in her chest.\n\nThe song stopped at 8:02, when she walked into the cafe and saw Rosa’s face.\n\nRosa was standing by the back door, phone pressed to her ear, saying “I understand” in a voice that clearly did not understand.\n\nShe hung up and looked at Hana. “We’re in trouble.”\n\n“The truck?” Hana asked.\n\n“The truck.” Rosa rubbed her eyes. “It broke down outside Seattle yesterday. The company moved our order to a new truck — which is now scheduled for Monday.”\n\n“Monday,” Hana repeated. The word fell like a stone.\n\n“Twenty bags of flour,” Rosa said. “Forty pounds of butter. All the sugar. Sitting in a warehouse three hours away, having a nice weekend.”\n\nEmma came out of the kitchen, took one look at them, and put down her tray. “Okay. What happened?”\n\n“No flour delivery until Monday,” Hana said. “And five hundred people coming tomorrow at ten.”\n\nLeo whistled low. “How much flour do we have right now?”\n\nRosa checked the shelf. “Two bags. Enough for a normal weekend. For Bake Day, we need ten times that.”\n\nFor a moment, nobody spoke. The clock above the door ticked very loudly.\n\nHana felt the old panic rising — the airport feeling, the lost-wallet feeling. Then she heard Carol’s voice in her memory: breathe first, decide second.\n\n“Okay,” she said. “Don’t panic. We have a whole day. Let me think.”\n\n“Step one,” Rosa said, grabbing her keys. “The stores. We buy every bag of flour in the neighborhood.”\n\nThey split up. Rosa took the supermarket on Fifth, Emma took the corner store, and Hana ran to the little grocery by the park.\n\nThe grocery had exactly three bags of flour. Hana bought all three and apologized to the empty shelf.\n\nBack at the cafe, they piled their treasure on the counter. Eleven small bags — some white, some wheat, and one, for some reason, coconut.\n\n“Eleven,” Emma counted. “That’s a third of what we need. Everyone in Portland is baking Christmas cookies this week.”\n\n“The holiday season,” Rosa said darkly. “Wonderful for business. Terrible for emergencies.”\n\nMrs. Chen, at her window table, quietly made a phone call of her own. Ten minutes later, her knitting club had checked seven more stores. The report came back: the city was out of flour.\n\nLeo drummed his fingers on the counter. “What about other cafes? Restaurants? Let me make a few calls.”\n\nHe called four friends from four kitchens. The first three answers were the same: sorry, we’re short too.\n\nThe fourth friend had flour — in a warehouse across the river, behind a manager who did not work on Fridays.\n\nHana stood very still in the middle of the cafe. Then she reached into her apron pocket, where a folded paper bag had lived all week like a lucky charm.\n\nGrace’s handwriting. Grace’s number. If anything goes wrong before Saturday — anything — you call me.\n\n“Rosa,” Hana said slowly. “Is it strange to ask another bakery to save our bake sale?”\n\n“Three days ago, I would have said yes,” Rosa said. “Today I say: call her. Right now.”\n\nHana dialed. Her heart knocked on her ribs. One ring. Two.\n\n“Rise and Shine, Grace speaking.”\n\n“Grace, this is Hana. From Bluebird.” She took a breath. “You said to call if something went wrong. Something went wrong.”\n\nShe explained — the truck, the Monday delivery, the eleven little bags. When she finished, there was a short silence.\n\nThen Grace said the five most beautiful words in the English language. “How much do you need?”\n\nHana told her. She heard a pen scratching, then Grace shouting to someone: “Tommy! Load the van!”\n\n“Give me an hour,” Grace said. “And put the coffee on. Tommy works for cookies, and I work for coffee.”\n\nFifty-eight minutes later, an old white van turned the corner with RISE AND SHINE painted on the side in faded letters.\n\nGrace climbed out in her flour-dusted apron. Behind her came Tommy, a huge, silent young baker who carried two bags of flour on each shoulder.\n\nBag after bag came through the door. Flour. Butter. Sugar. Even a box of good vanilla, “because you never know.”\n\n“But your own baking—” Hana started.\n\n“Honey, I’ve got more flour at home than sense,” Grace said. “And that’s saying something.”\n\nRosa met Grace in the middle of the cafe. The two owners looked at each other — twenty years of business on two sides of one park.\n\n“Grace,” Rosa said.\n\n“Rosa,” Grace said. Then she grinned. “Your matcha girl has good manners. She apologized twice on the phone before asking for anything.”\n\n“She’s our matcha girl,” Rosa said, and the two women shook hands like old friends who had simply forgotten to become friends until now.\n\nHana brought out her wallet. “Grace, please. Tell me the price.”\n\nGrace waved it away like a fly. “Charity flour has no price. That’s the rule. I didn’t make it up, but I follow it.”\n\n“Then I owe you one. A big one,” Hana said.\n\n“You do,” Grace agreed cheerfully. “So here’s my payment. Tomorrow morning, I’m bringing three trays of my cinnamon rolls to your event. They sell out, the money goes to your food bank, and my name goes on that big thank-you sign.”\n\n“Deal,” Rosa and Hana said at the same time.\n\n“You’re a lifesaver.” Emma handed Grace a fresh cup of coffee.\n\n“I’m a baker,” Grace said. “Same thing, more butter.”\n\nTommy said nothing, ate two cookies, and smiled a huge, quiet smile. “That’s Tommy for thank you,” Grace explained.\n\nThat evening, the kitchen became a small, warm factory.\n\nCarol arrived after her hospital shift and tied on an apron without being asked. Mike brought the finished booth in his truck. Ben taped a hand-drawn sign to the window: TOMORROW!\n\nHana stood at the center of it all, flour on her cheek, calling out steps like a captain.\n\n“Emma, roll the matcha dough. Leo, caramel — low heat, keep stirring. Carol, the anko is ready for you.”\n\n“Yes, chef!” they answered, laughing, and Hana laughed too, because chef was a big word for a girl who had arrived in April afraid of the word latte.\n\nBy ten o’clock, the counters were covered with labeled trays, sleeping under clean towels. Tomorrow they would become two hundred rolls and mountains of cookies.\n\n“Sleep,” Rosa ordered everyone. “That’s not advice. That’s your boss speaking.”\n\nShe turned off the kitchen lights last. “Whatever happens tomorrow, remember tonight. A broken truck couldn’t stop us. Nothing tomorrow will.”\n\nHana walked home under a cold, starry sky, too tired to feel her feet and too happy to care.\n\nAt the corner she looked back once. The dark cafe seemed to be resting, gathering strength for the morning.\n\nHer alarm was set for four thirty. In twelve hours, the doors would open — and half of Portland, it seemed, was planning to walk through them.","glossary":[{"w":"broke down","ja":"故障した"},{"w":"scheduled","ja":"予定された"},{"w":"warehouse","ja":"倉庫"},{"w":"delivery","ja":"配達"},{"w":"panic","ja":"パニック"},{"w":"emergencies","ja":"緊急事態"},{"w":"lucky charm","ja":"お守り"},{"w":"dialed","ja":"電話をかけた"},{"w":"ribs","ja":"あばら骨"},{"w":"load","ja":"積み込む"},{"w":"faded","ja":"色あせた"},{"w":"manners","ja":"礼儀"},{"w":"labeled","ja":"ラベル付きの"},{"w":"starry","ja":"星空の"}],"phrases":[{"en":"We’re in trouble.","ja":"まずいことになった。"},{"en":"Don’t panic.","ja":"あわてないで。"},{"en":"Let me make a few calls.","ja":"何本か電話してみるよ。"},{"en":"You’re a lifesaver.","ja":"本当に助かったよ。"},{"en":"I owe you one.","ja":"この借りは返すね。"}],"quiz":[{"q":"Why didn’t the flour arrive?","c":["Rosa forgot to order it","The store was closed","The delivery truck broke down","Grace bought all the flour"],"a":2},{"q":"Who brought flour and butter to the cafe?","c":["Mrs. Chen’s knitting club","Grace and Tommy","Dr. Park","The supermarket manager"],"a":1},{"q":"Why did Grace refuse to take any money?","c":["She was too busy to count it","Rosa had already paid her","She did not need money","She believes charity flour has no price"],"a":3}],"words":1173},{"id":87,"level":4,"emoji":"🎪","theme":"チャリティイベント当日","titleEn":"The Line Around the Block","titleJa":"行列は角の向こうまで","teaser":"ついに迎えた本番当日。開店前から大行列が！売り切れ続出、温度計ポスターはどこまで伸びる？","story":"Bake Day began in the dark, at four thirty in the morning, with the smell of butter and hope.\n\nBy six, the kitchen windows were golden and fogged. Hana pulled tray after tray from the oven while Carol filled the cafe with the smell of warm anko.\n\nBy eight, Mike’s booth stood outside like a small wooden castle, and Emma was painting a giant paper thermometer on the window: GOAL — ONE THOUSAND DOLLARS.\n\n“Why a thermometer?” Leo asked, carrying chairs.\n\n“It fills up red as the money comes in,” Emma said. “People love watching a picture grow. It’s art science.”\n\nBen set up his phone on a little stand to film. Rosa hung the big thank-you sign, with every shop’s name on it — and RISE AND SHINE painted right in the middle.\n\nAt nine, Grace’s van arrived with three trays of cinnamon rolls the size of Hana’s face, plus Tommy, who began quietly moving heavy things before anyone asked.\n\nAt nine thirty, Hana looked out the window and grabbed Emma’s arm.\n\nThe line started at the door, ran past the bookstore, turned at the barbershop, and disappeared around the corner.\n\n“That’s… a lot of people,” Hana whispered.\n\n“That’s YOUR line,” Emma said. “You made that line.”\n\nFirst in line, wrapped in a red scarf, stood the young cashier from the supermarket. She had been waiting since eight forty.\n\nHana ran out with something in wax paper. “I promised to save you something sweet. First matcha roll of the day.”\n\n“I get the FIRST one?” The cashier held it like a small bird. “Best Saturday of my year.”\n\nAt ten exactly, Mrs. Chen took her place at the door in her warmest coat, straightened her back, and became sunshine.\n\n“Good morning! Come on in. Welcome to Bluebird Bake Day!”\n\nAnd Portland came in.\n\nIt came in wearing winter hats and mittens. It came in with strollers and dogs and grandmothers. It came in until the little cafe was a warm, loud, happy sea.\n\nHana was everywhere at once — at the counter, at the sample tray, at the door.\n\n“Would you like a sample?” she asked, again and again. “Matcha roll — it’s sweet but not too sweet.”\n\n“Sweet but not too sweet!” a woman repeated to her friend. “That’s exactly what the radio said.”\n\nGus the barber arrived with six friends and left with twenty brownies in a hat box. “Don’t judge me,” he told the line. “Judge the brownies. Actually, you can’t. They’re perfect.”\n\nDr. Park bought a whole box of Fire and Snow Cookies for the clinic and called it “doctor’s orders.”\n\nThe supermarket manager came too, out of his blue vest, looking five years younger. “Head office isn’t here,” he said, “but I am. Two matcha rolls, please. As a neighbor.”\n\nMarcus from the radio arrived at eleven and bought an entire apple cake. “I canceled my breakfast for this two days ago,” he said. “A man keeps his promises.”\n\nThe grandfather from the text message came as well, holding two small grandkids by the hand. Hana knew him at once, without knowing how.\n\n“You’re the baker,” he said. “I’m the man who remembers. These two only remember cookies, but that’s a start.”\n\nHana knelt and gave each child a cookie, and could not speak for a moment after that.\n\nAll day, Emma climbed on a chair and painted the thermometer higher. Two hundred dollars. Four hundred. Six.\n\nLeo made hot chocolate like a machine and sang while he worked. Somebody filmed him. By afternoon he was, briefly, famous on the internet.\n\n“Finally,” he said. “The world understands me.”\n\nAt one o’clock, Grace’s cinnamon rolls sold out. Grace and Rosa stood shoulder to shoulder behind the counter, laughing like sisters.\n\n“Your matcha girl works like three people,” Grace said.\n\n“She dreams like ten,” Rosa said.\n\nAt two, the last apple cake went home with the bookstore owner, who promised to eat it while reading something happy.\n\nAt two thirty, Hana looked at the empty trays and understood that Grace’s advice had come true exactly on schedule.\n\nShe climbed onto a chair, and the busy cafe slowly went quiet.\n\n“Thank you all for coming. I have two things to say.” Her voice wobbled, then held.\n\n“First thing. We’re sold out. Completely. Every roll, every brownie, every cookie.”\n\nThe cafe did not groan. The cafe cheered. Strangers hugged. Somebody’s dog barked the happiest bark.\n\nIn the corner, the grandfather lifted both grandkids so they could see over the crowd.\n\n“The second thing…” Hana looked around — at Rosa, at Grace, at the Millers, at Mrs. Chen by the door.\n\n“Eight months ago, I couldn’t order a coffee in this language. Today you let me stand on a chair and thank a whole neighborhood. So — thank you for the line. Thank you for buying cookies for strangers. Thank you for being the reason I love this place.”\n\nThe cheer that followed shook the windows. Ben got it all on video, including the part where Mike cried and blamed the cold air.\n\nNear the door, a woman with short gray hair wrote fast in a small notebook. She caught Hana on the way past.\n\n“Dana Ruiz, Portland Ledger. That speech — did you practice it?”\n\n“No,” Hana said honestly. “I practiced a thousand smaller sentences all year. The big one came out by itself.”\n\nDana smiled and wrote that down too. “One more question. What does your hometown think of all this?”\n\n“Matsuyama?” Hana laughed. “My little sister will scream. She screams in two languages.”\n\nAt five, Mrs. Chen — who had greeted more than six hundred people — finally sat down and accepted a cup of tea. “My record was a school of four hundred,” she said. “I have improved.”\n\nAt six, when the chairs were up and the floor was swept, they gathered around the money box like a campfire.\n\nRosa counted. Emma checked. Ben re-checked with his phone calculator, for drama.\n\n“Two thousand, three hundred and forty-one dollars,” Rosa announced, “and one Japanese five-yen coin, which is lucky, so we keep it.”\n\nMore than double the goal. The room went up like fireworks.\n\nEmma painted the thermometer over the top of the window and drew Baker Blue flying above it.\n\nWhen the noise settled, Rosa raised a cup of cold coffee.\n\n“To this team. To Grace, who saved us. To Hana, who started it all. We couldn’t have done it without you. Any of you.”\n\n“To Bake Day!” everyone answered.\n\nHana walked home between Mike and Carol, with Ben ahead filming the streetlights and Daisy trotting behind — she had joined for the last hour and been paid in dropped crumbs.\n\n“Best day?” Carol asked quietly.\n\n“Top three,” Hana said. “The plane landed in April. Yui hugged me in November. And today.”\n\nShe fell asleep in one minute, flour still behind one ear.\n\nShe did not know that across town, Dana Ruiz was still awake — writing a story with a headline that had Hana’s name in it.","glossary":[{"w":"fogged","ja":"曇った"},{"w":"thermometer","ja":"温度計"},{"w":"mittens","ja":"ミトン手袋"},{"w":"strollers","ja":"ベビーカー"},{"w":"knelt","ja":"ひざまずいた"},{"w":"briefly","ja":"つかの間"},{"w":"on schedule","ja":"予定通り"},{"w":"wobbled","ja":"震えた"},{"w":"cheered","ja":"歓声を上げた"},{"w":"blamed","ja":"〜のせいにした"},{"w":"swept","ja":"掃いた"},{"w":"calculator","ja":"計算機"},{"w":"crumbs","ja":"パンくず"},{"w":"headline","ja":"見出し"}],"phrases":[{"en":"Come on in.","ja":"どうぞ入って。"},{"en":"Would you like a sample?","ja":"試食はいかがですか？"},{"en":"Thank you all for coming.","ja":"皆さん、来てくれてありがとう。"},{"en":"We’re sold out.","ja":"売り切れです。"},{"en":"We couldn’t have done it without you.","ja":"あなたたちなしでは無理だったよ。"}],"quiz":[{"q":"Who stood at the door and welcomed everyone?","c":["Rosa","Mrs. Chen","Ben","Grace"],"a":1},{"q":"What happened at two thirty?","c":["Everything was sold out","The event was canceled","It started to snow hard","The flour truck finally arrived"],"a":0},{"q":"Why did the crowd cheer when Hana said the food was gone?","c":["They wanted to go home early","They were angry about the line","They were happy the event was a big success","They wanted free samples"],"a":2}],"words":1173},{"id":88,"level":4,"emoji":"📰","theme":"新聞に載った！","titleEn":"The Baker from Matsuyama","titleJa":"松山から来たパン職人","teaser":"月曜の朝、マイクが大騒ぎ。新聞を開くとそこには大きな写真が！松山の実家にも知らせが届いて……","story":"On Monday morning, for the first time in nine months, Hana overslept.\n\nSunday had been a day of glorious nothing — sleep, tea, more sleep. Now it was seven thirty, and someone was knocking on her door like a woodpecker.\n\n“Hana! HANA!” It was Mike’s voice, on a school day, an hour before school. “You need to see this. Put on socks. This is sock-worthy news!”\n\nShe came downstairs and found the whole family standing around the kitchen table, staring at something flat.\n\nIt was the Portland Ledger, opened to the neighborhood section. And there, above a photo, in big letters: THE BAKER FROM MATSUYAMA.\n\nUnder that: How one visitor and one small cafe fed a neighborhood. By Dana Ruiz.\n\nThe photo showed Hana standing on a chair, one hand over her heart, in front of a laughing, crying crowd.\n\n“I can’t believe it.” Hana sat down slowly. “That’s… me. In a newspaper. In English.”\n\n“We made the paper!” Ben shouted, doing a lap around the table. “Well — you made the paper. I made the internet. Together we own the news.”\n\nDaisy, alarmed by all the joy, barked at the newspaper, then at the toaster, then at nothing. “She’s also proud,” Ben translated.\n\n“Read it out loud,” Carol said, pouring tea. “Slowly. I want to enjoy every word.”\n\nBen cleared his throat and read in his most dramatic voice.\n\n“On Saturday, a line formed outside the Bluebird Cafe before ten and did not end until everything was gone. Behind the counter stood Hana Sato, twenty-four, who arrived from Matsuyama, Japan, in April with two suitcases and very little English.”\n\n“Eight months later, she gave a speech standing on a chair — and raised two thousand, three hundred and forty-one dollars for the neighborhood food bank.”\n\n“The event nearly ended before it began,” Ben continued. “On Friday, the cafe’s flour delivery failed. Rescue came from an unexpected direction: Grace Kowalski, owner of Rise and Shine Bakery — Bluebird’s neighbor and, until last week, its politest rival.”\n\nHana hid her face in her hands. “This is so embarrassing. And so wonderful. Both. At the same time.”\n\n“Keep reading,” Carol said. “We’re not even at the good part.”\n\n“It’s ALL the good part,” Mike said.\n\nThe article had everyone in it. Rosa: “She asked for one Saturday. She gave us the best day of our year.”\n\nGrace: “Bakers stick together. Also, try her matcha rolls and weep.”\n\nMrs. Chen: “I have known many students. This one waters my plants.”\n\nAnd near the end, a quote from the food bank director, a Ms. Alvarez: “This donation arrives at the perfect time. Winter is our hungriest season. Tell that team they fed real tables.”\n\nThe last line of the article was Dana’s own. Ben read it more quietly.\n\n“Hana Sato came to Portland to learn a language. Somewhere along the way, she taught a neighborhood something better — that kindness needs no translation.”\n\n“Kindness needs no translation,” Carol repeated softly. “Dana Ruiz, you can write.”\n\nThe kitchen was silent for a moment. Carol put down the teapot and hugged Hana from the side.\n\n“I’m proud of you. So proud it’s ridiculous,” she said into her hair.\n\n“It’s a big deal. Front of the neighborhood section. People frame that,” Mike said.\n\n“We ARE framing it,” Carol said. “Two copies. One for the wall, one for Japan.”\n\nAt the cafe, the morning felt like a second, smaller Bake Day.\n\nRosa had taped the article to the front window before opening. Customers came in pointing at it, then at Hana, then back at the paper.\n\n“It’s her!” a stranger said. “The chair speech girl!”\n\nGus arrived with five copies under his arm. “One for the shop, one for my sister, three for reasons.”\n\nMrs. Chen brought hers protected in clear plastic, like a treasure from a museum. “I laminated it,” she announced. “History must be protected from coffee.”\n\nThe knitting club arrived at three to admire the window and take turns being photographed beside it.\n\nLeo studied the photo with deep respect. “Look at my elbow,” he said, pointing at the edge of the frame. “That is a famous elbow now.”\n\n“Was your elbow in many photos before?” Hana asked.\n\n“Never,” Leo said. “It waited its whole life for this.”\n\nEmma drew a tiny Baker Blue next to the article on the window, holding his own little newspaper.\n\nRosa watched Hana float around the cafe all morning, then pulled her aside with a serious face.\n\n“Congratulations,” she said. “Now. Don’t let it go to your head. Tomorrow the dishes still need washing, superstar.”\n\n“Understood,” Hana laughed. “My head is normal size.”\n\n“Good.” Rosa’s serious face broke into her big laugh. “Because I already read it four times, and MY head barely fits in the office.”\n\n“Also,” Rosa added, “Dana called. The story is getting letters. Real paper letters. People writing in about a bake sale.”\n\nDr. Park stopped by at lunch with the clinic’s copy and asked Hana to sign it.\n\n“Sign a newspaper?” Hana said. “Me?”\n\n“First signature free,” Leo advised from the espresso machine. “After today, charge cookies.”\n\nThat evening, Hana video-called Matsuyama.\n\nHer mother answered too close to the camera, as always — one giant eye, then a nose. “Hana? Hana! Papa, it’s Hana!”\n\nYui appeared over their shoulders, already screaming. “SIS. YOU’RE IN AN AMERICAN NEWSPAPER. I translated it for Mom five times. I cried five times.”\n\nHana held her copy up to the camera. Her mother touched the screen, as if she could touch the page.\n\nHer father said very little, which was normal. But he cleared his throat twice, which meant everything.\n\n“There’s more,” Yui said. “I took the article to your old bakery today. Printed it from the internet.”\n\n“You did what?”\n\n“Your old boss read the whole thing standing up. Then he taped it on the wall behind the register — next to the photo from your last day.”\n\nYui leaned closer. “He told every customer this afternoon: See this girl? Matsuyama bread is in America now.”\n\nHana pressed her sleeve to her eyes. Nine months, six thousand miles, and one wall in Matsuyama with her name on it.\n\n“Also, the aunts called,” Yui went on, counting on her fingers. “All four of them. Aunt Keiko says you must eat more. Aunt Sachi is telling her entire dance class.”\n\n“Come home someday,” her mother said gently. “But finish your adventure first. The bread can wait. We can wait.”\n\nThat night, Hana opened her notebook. She taped the lucky five-yen coin inside the cover and folded a copy of the article behind it.\n\nUnder them she wrote: Kindness needs no translation. Then, in smaller letters: But learn the language anyway. It helps.\n\nOn a fresh page she began a letter she would never send — to April-Hana, the girl at the airport with two heavy suitcases. It said: You will not believe what happens next.\n\nTomorrow there was one more delivery to make, the most important one of all.\n\nTwo thousand, three hundred and forty-one dollars, waiting in Rosa’s office to meet Ms. Alvarez.","glossary":[{"w":"overslept","ja":"寝坊した"},{"w":"glorious","ja":"最高の"},{"w":"woodpecker","ja":"キツツキ"},{"w":"section","ja":"〜欄"},{"w":"unexpected","ja":"予想外の"},{"w":"embarrassing","ja":"恥ずかしい"},{"w":"weep","ja":"泣く"},{"w":"translation","ja":"翻訳"},{"w":"ridiculous","ja":"ばかみたいな"},{"w":"frame","ja":"額に入れる"},{"w":"laminated","ja":"ラミネートした"},{"w":"respect","ja":"敬意"},{"w":"signature","ja":"サイン"},{"w":"register","ja":"レジ"},{"w":"adventure","ja":"冒険"}],"phrases":[{"en":"I can’t believe it.","ja":"信じられない。"},{"en":"We made the paper!","ja":"新聞に載ったよ！"},{"en":"I’m proud of you.","ja":"あなたを誇りに思うよ。"},{"en":"It’s a big deal.","ja":"これはすごいことだよ。"},{"en":"Don’t let it go to your head.","ja":"調子に乗らないでね。"}],"quiz":[{"q":"What was the newspaper headline?","c":["The Best Coffee in Portland","A New Supermarket Opens","Ben’s Basketball Team Wins","The Baker from Matsuyama"],"a":3},{"q":"What did Hana’s old boss in Matsuyama do?","c":["He got angry about the news","He never heard about it","He put the article on his bakery wall","He flew to Portland at once"],"a":2},{"q":"How did Hana feel about being in the paper?","c":["Shy and embarrassed, but deeply happy","Angry at Dana for writing it","Sad about the photo","Worried about the money"],"a":0}],"words":1184},{"id":89,"level":4,"emoji":"💌","theme":"寄付を届ける日","titleEn":"Seventy Families","titleJa":"70の家族へ、ひと箱ずつ","teaser":"募金を届けに、緑の扉のフードバンクへ。そこでハナが見たのは、お金の先にある本当の景色だった。","story":"On Tuesday morning, four people and one envelope walked three blocks through the frost.\n\nHana carried the envelope with both hands, like something warm from the oven. Inside was every dollar from Bake Day.\n\nThe morning was so cold that their breath made little clouds, and Emma kept trying to catch hers in her hands.\n\nRosa walked on Hana’s left, Emma on her right, and Mrs. Chen led the way — because Mrs. Chen, it turned out, knew the food bank better than anyone.\n\n“I volunteered here every Tuesday for eleven years,” she said. “Watch the third step. It has opinions.”\n\nThe neighborhood food bank lived in an old brick warehouse with a painted green door. A hand-drawn sign said: EVERYONE WELCOME.\n\nInside, the space was bigger than Hana expected — long shelves, towers of boxes, and a happy noise of rolling carts.\n\nIt smelled like cardboard and apples and, faintly, coffee. “Warehouse perfume,” said a volunteer, rolling past with a cart.\n\nA woman with silver-streaked hair and fast, warm eyes came toward them, arms already open.\n\n“The Bluebird team! And — Mrs. Chen, is that you? Eleven years of Tuesdays, and then you vanish into retirement!”\n\n“I un-vanished,” Mrs. Chen said, hugging her. “Everyone, this is Ms. Alvarez. She runs this place on coffee and willpower.”\n\n“Mostly willpower,” Ms. Alvarez said. “The coffee here is terrible. Come in, come in. You’re the famous bakers.”\n\nShe gave them the full tour, talking the whole time, walking backward without hitting anything.\n\n“Canned food here. Rice and pasta there. Fresh things in the cold room — those are the hardest to get and the first to go.”\n\nIn the middle of the warehouse, volunteers stood at a long table, packing boxes in a quiet rhythm. Beans, rice, soup, bread, apples. Box after box after box.\n\n“Each box feeds a family for about a week,” Ms. Alvarez said. “We pack two hundred every Friday. In December, we run out by Saturday afternoon.”\n\n“Two hundred?” Emma said. “Every week?”\n\n“Every week,” Ms. Alvarez said. “Hunger doesn’t take holidays. So neither do we — well, we take Christmas Day. Even willpower sleeps once a year.”\n\nHana watched the boxes slide down the table. Somewhere in the city, two hundred kitchens were waiting for them.\n\nEmma had stopped in front of a wall covered in paper. Children’s drawings — suns, dogs, stick families, hearts.\n\n“Thank-you notes,” Ms. Alvarez said. “From the kids. We keep every single one. On hard days, I stand here for five minutes and get un-tired.”\n\nThen it was time. Ms. Alvarez called the volunteers over, and Rosa nudged Hana forward.\n\nHana had practiced this sentence last night, in front of the mirror, like the old days. But her hands still s
